          },

          bad: { 50:'#FFF1F2',100:'#FFE4E6',400:'#FB7185',500:'#F43F5E',600:'#E11D48' },
          ink: {

            700:'#232833', 600:'#323847', 500:'#4B5262', 400:'#6B7383',

          'card': '0 1px 3px 0 rgba(15,17,21,0.06), 0 1px 2px -1px rgba(15,17,21,0.06)',
          'pop': '0 10px 30px -10px rgba(15,17,21,0.25)',
        },
        borderRadius: { 'xl2': '1.25rem' },
        keyframes: {
          fadeUp: { '0%': { opacity: 0, transform: 'translateY(6px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          scaleIn: { '0%': { opacity: 0, transform: 'scale(0.96)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
          shimmer: { '0%': { backgroundPosition: '-400px 0' }, '100%': { backgroundPosition: '400px 0' } },
          pulseSoft: { '0%,100%': { opacity: 1 }, '50%': { opacity: .55 } },

          fadeIn: 'fadeIn .25s ease-out both',
          scaleIn: 'scaleIn .2s cubic-bezier(.16,1,.3,1) both',
          shimmer: 'shimmer 1.4s infinite linear',

<style>
  :root{ color-scheme: light; }
  html.dark{ color-scheme: dark; }
  * { -webkit-tap-highlight-color: transparent; }
  body{
    font-family: 'Inter', sans-serif;
    background: #F5F6F8;
    color: #181C24;
    transition: background-color .25s ease, color .25s ease;
  }
  html.dark body{ background:#0B0D12; color:#DDE0E6; }
  .font-display{ font-family:'Manrope', sans-serif; font-variant-numeric: tabular-nums; }
  .tabnum{ font-variant-numeric: tabular-nums; }

  /* Thanh cuộn tinh gọn */
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(120,128,150,0.35); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(120,128,150,0.55); }

  /* Thẻ (card) nền kính mờ nhẹ */
  .card{
    background: #FFFFFF;
    border: 1px solid rgba(15,17,21,0.06);
  }
  html.dark .card{
    background: #13161C;
    border-color: rgba(255,255,255,0.06);
  }

  .surface-2{ background:#F5F6F8; }
  html.dark .surface-2{ background:#181C24; }

  /* Sidebar link active indicator */
  .nav-item{ position:relative; transition: background-color .15s ease, color .15s ease; }
  .nav-item.active{
    background: linear-gradient(90deg, rgba(99,102,241,0.12), rgba(99,102,241,0.02));
    color:#4F52DB;
  }
  html.dark .nav-item.active{
    background: linear-gradient(90deg, rgba(99,102,241,0.22), rgba(99,102,241,0.02));
    color:#A5ACFF;
  }
  .nav-item.active::before{
    content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
    background:#6366F1; border-radius:0 4px 4px 0;
  }

  /* Progress bar mượt */
  .progress-track{ background: rgba(120,128,150,0.16); border-radius:999px; overflow:hidden; }
  /* ★ Nút thao tác trên từng dòng (ghim, nhân bản, sửa, xoá).
     Trước đây dùng group-hover nên trên điện thoại — nơi KHÔNG có hover —
     các nút này không bao giờ xuất hiện, tức là mất hẳn chức năng.
     Nay: màn hẹp luôn hiện; màn rộng mới ẩn cho gọn và chỉ hiện khi rê chuột. */
  .row-actions{ display:flex; }
  @media (min-width:1024px){
    .row-actions{ display:none; }
    .group:hover .row-actions{ display:flex; }
    .row-actions.always-on{ display:flex; }
  }
  /* ★ Fix lỗi hiển thị trên điện thoại: tên giao dịch dài, ít khoảng trắng
     để ngắt tự nhiên, bị ngắt liên tục thành rất nhiều dòng ngắn xếp chồng
     lên nhau — nhìn như chữ vỡ lộn xộn từng chữ/dòng, đặc biệt khi cột tên
     bị 4 nút thao tác (ghim/nhân bản/sửa/xoá) luôn hiện trên mobile ép co
     lại chỉ còn rất hẹp.
     Sửa: giới hạn tối đa 2 dòng + "…", đủ đọc lướt mà không rối mắt; tên
     đầy đủ vẫn xem được qua title="" nếu cần (không đổi logic JS).
     ★ NGUYÊN NHÂN THẬT SỰ khiến bản vá này từng vô hiệu: class này trước
     đây tên là "break-words" — trùng tên với utility gốc của Tailwind.
     Tailwind Play CDN (cdn.tailwindcss.com) tự quét DOM và bơm CSS JIT của
     nó vào một <style> riêng được chèn SAU style tay này trong cây DOM
     thực tế, bất kể thứ tự trong mã nguồn. Hai rule cùng specificity
     (.break-words) nên rule đến sau (của Tailwind, chỉ có
     overflow-wrap:break-word, KHÔNG line-clamp) thắng và đè mất line-clamp
     — khiến chữ vỡ từng ký tự trên các thiết bị hẹp dù code "đã sửa".
     Đổi tên thành "tx-clamp2" (không trùng bất kỳ utility Tailwind nào)
     để không bao giờ bị JIT ghi đè, bất kể thứ tự inject của CDN. */
  .tx-clamp2{
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    overflow-wrap: break-word;
    word-break: normal;
    -webkit-hyphens: none; hyphens: none;
    min-width: 0;
  }
  .progress-fill{ height:100%; border-radius:999px; transition: width .5s cubic-bezier(.16,1,.3,1); }

  /* Skeleton loading */
  .skeleton{
    background: linear-gradient(90deg, rgba(120,128,150,0.12) 25%, rgba(120,128,150,0.22) 37%, rgba(120,128,150,0.12) 63%);
    background-size: 400px 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: 8px;
  }

  /* Modal overlay */
  .modal-overlay{ background: rgba(11,13,18,0.55); backdrop-filter: blur(3px); }

  /* Toast */
  .toast{ animation: slideInR .3s cubic-bezier(.16,1,.3,1) both; }

  /* Heatmap cell */
  .heat-cell{ border-radius:3px; transition: transform .12s ease; cursor:pointer; }
  .heat-cell:hover{ transform: scale(1.35); z-index:5; position:relative; }

  /* Focus visible rõ ràng cho accessibility */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{
    outline: 2px solid #6366F1; outline-offset: 2px; border-radius:6px;
  }

  input[type="range"]{ accent-color:#6366F1; }
  input[type="checkbox"], input[type="radio"]{ accent-color:#6366F1; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* Ẩn số mũi tên trên input number */
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{
    -webkit-appearance:none; margin:0;
  }
  input[type=number]{ -moz-appearance:textfield; }

  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none{ -ms-overflow-style:none; scrollbar-width:none; }

  /* Chip / badge */
  .chip{ display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }

  .sidebar-scroll{ scrollbar-gutter: stable; }

  /* Backdrop cho empty state icon container */
  .empty-icon-wrap{
    background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.14), transparent 70%);
  }
/* ======================================================================
   MOBILE FIXES
   ====================================================================== */

/* 1. Safe area — iPhone notch và thanh home không được che nội dung.
      viewport-fit=cover phải bật trong <meta name="viewport">. */
@supports (padding: env(safe-area-inset-top)) {
  header {
    padding-top: env(safe-area-inset-top);
    height: calc(4rem + env(safe-area-inset-top)) !important;
  }
  aside#sidebar {
    padding-top: env(safe-area-inset-top);
    height: calc(100vh + env(safe-area-inset-top));
  }
  #toastContainer { padding-bottom: env(safe-area-inset-bottom); }
  #modalRoot > div { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
}

/* 2. Bàn phím ảo che input trong modal. Khi viewport resize (bàn phím bật),
      modal phải co lại và cho phép input đang focus cuộn vào tầm nhìn. */
#modalOverlay { align-items: flex-start; padding-top: 1rem; }
#modalBox {
  max-height: calc(100vh - 2rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  max-height: calc(100dvh - 2rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
}
#modalBox input:focus,
#modalBox select:focus,
#modalBox textarea:focus {
  scroll-margin-bottom: 40vh;
}

/* 3. Touch target cho heatmap — 14px quá nhỏ để chạm chính xác.
      Bành ra 22px trên thiết bị cảm ứng, vẫn gọn trên desktop. */
@media (pointer: coarse) {
  .heat-cell { width: 22px !important; height: 22px !important; border-radius: 4px; }
  .heat-cell:hover { transform: none; } /* hover scale không có nghĩa trên touch */
}

/* 4. Chống overscroll — kéo quá đà làm cả trang bounce trên iOS,
      gây khó chịu khi scroll trong danh sách dài. */
html, body { overscroll-behavior-y: contain; }

/* 5. Font-size input ≥ 16px để iOS không tự zoom khi focus.
      Áp cho các input chính, không áp cho input số nhỏ trong bảng. */
@media (max-width: 640px) {
  input[type="text"]:not(.money-input),
  input[type="date"],
  input[type="time"],
  select, textarea { font-size: 16px !important; }
}

/* 6. Thanh cuộn ngang cho bảng dài trên mobile — không cắt cụt cột cuối. */
.overflow-x-auto { -webkit-overflow-scrolling: touch; }
</style>
</head>

<script>
/* ======================================================================
   DURABLE STORAGE — IndexedDB là nơi lưu chính, localStorage chỉ là cache
   ----------------------------------------------------------------------
   Vì sao đổi:
   • iOS Safari xoá localStorage sau 7 ngày không mở (ITP). IndexedDB trong
     PWA cài về màn hình chính không bị áp quy tắc đó.
   • IndexedDB có quota lớn hơn nhiều và không bị nghẽn khi JSON phình to.
   • Toàn bộ code còn lại không phải sửa: loadDB/saveDB vẫn là điểm vào duy
     nhất, chỉ khác là ghi vào 2 nơi thay vì 1.
   ====================================================================== */
const IDB_NAME = 'moneyflow_db_v1';
const IDB_STORE = 'kv';
let __idbPromise = null;

function idbOpen(){
  if(__idbPromise) return __idbPromise;
  __idbPromise = new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
    req.onblocked = () => reject(new Error('IndexedDB blocked'));
  });
  return __idbPromise;
}

async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function idbDel(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Ước lượng dung lượng còn trống để cảnh báo sớm (không phải API chuẩn,
// nhưng Chrome/Edge/Android có; iOS Safari trả undefined → bỏ qua)
async function estimateStorage(){
  if(!navigator.storage || !navigator.storage.estimate) return null;
  try {
    const e = await navigator.storage.estimate();
    return { usage: e.usage, quota: e.quota };
  } catch(e){ return null; }
}

async function loadDB(){
  let raw = null;
  let fromIDB = false;

  try {
    const v = await idbGet(STORAGE_KEY);
    if(v){ raw = (typeof v === 'string') ? v : JSON.stringify(v); fromIDB = true; }
  } catch(e){ console.warn('IndexedDB đọc lỗi, thử localStorage', e); }

  if(!raw){
    try {
      const legacy = localStorage.getItem(STORAGE_KEY);
      if(legacy){
        raw = legacy;
        // Đẩy lên IndexedDB để từ nay chỉ dùng IDB
        idbSet(STORAGE_KEY, legacy).catch(()=>{});
        console.info('[MoneyFlow] Đã di trú dữ liệu từ localStorage sang IndexedDB.');
      }
    } catch(e){ console.warn('localStorage đọc lỗi', e); }
  }

  if(raw){
    try { DB = JSON.parse(raw); return; }
    catch(e){ console.warn('Dữ liệu hỏng, khởi tạo mới.', e); }
  }

  saveDB();
}

/* Ghi: localStorage để an toàn cho session hiện tại, IDB để bền dài hạn.
   Trả về Promise của lần ghi IndexedDB — hầu hết chỗ gọi không cần quan
   tâm (fire-and-forget, để UI phản hồi ngay), NÊN VẪN gọi kiểu saveDB()
   bình thường như trước. Chỉ nơi nào gọi loadDB()/initApp() NGAY SAU khi
   vừa ghi đè toàn bộ DB (import file, reset data) mới cần await Promise
   này trước — nếu không, loadDB() có thể đọc phải bản IndexedDB CŨ do
   transaction ghi ở trên chưa kịp commit. Đây không phải giả định: đặc tả
   IndexedDB không đảm bảo một readonly transaction mở sau một readwrite
   transaction sẽ thấy được kết quả của readwrite đó (xem thảo luận chính
   thức tại https://github.com/w3c/IndexedDB/issues/253) — Chrome cụ thể
   được phép chạy readonly trước readwrite dù tạo sau, đúng tình huống ở
   đây (saveDB() mở transaction ghi, loadDB() mở transaction đọc ngay
   sau). */
function saveDB(){
  const raw = JSON.stringify(DB);

  // 1. Sync, nhanh — nếu tắt app đột ngột vẫn còn bản gần nhất
  try { localStorage.setItem(STORAGE_KEY, raw); } catch(e){ /* quota hoặc ITP chặn */ }

  // 2. Async, bền — đây mới là chỗ sống sót qua 7 ngày của iOS
  const idbWrite = idbSet(STORAGE_KEY, raw).catch(err => {
    console.warn('IndexedDB ghi lỗi', err);
    showToast('Bộ nhớ bền không ghi được — hãy export backup ngay', 'warn', 6000);
  });

  // 3. Cập nhật mốc thời gian để badge cảnh báo backup hoạt động
  DB.__lastSaveAt = Date.now();
  if(typeof updateBackupBadge === 'function') updateBackupBadge();

  return idbWrite; // dùng khi cần chắc chắn ghi IDB đã xong, xem saveDBAndReinit()
}

/* Dùng thay cho saveDB() + initApp() bất cứ khi nào vừa GHI ĐÈ toàn bộ DB
   trong bộ nhớ và cần khởi tạo lại app ngay sau đó (import file, reset
   data). await đủ 2 vế: ghi IndexedDB xong HẲN rồi mới cho loadDB() đọc
   lại — nếu không dữ liệu vừa ghi đè có thể "biến mất", bị loadDB() đọc
   phải bản IndexedDB cũ do race condition nêu trên. */
async function saveDBAndReinit(){
  await saveDB();
  await initApp();
}

function uid(prefix='id'){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
/* ======================================================================
   ANDROID: yêu cầu trình duyệt giữ IndexedDB vĩnh viễn
   ----------------------------------------------------------------------
   Gọi một lần sau khi loadDB thành công. Nếu user đã cài PWA hoặc
   đã tương tác đủ nhiều, Chrome Android sẽ tự động grant mà không hỏi.
   Nếu chưa grant được, vẫn còn backup làm lưới an toàn.
   ====================================================================== */
async function requestPersistentStorage(){
  if(!navigator.storage || !navigator.storage.persist) return;
  try {
    const already = await navigator.storage.persisted();
    if(already){
      console.info('[MoneyFlow] Storage đã ở trạng thái persistent.');
      return;
    }
    const granted = await navigator.storage.persist();
    console.info('[MoneyFlow] Persistent storage:', granted ? 'đã được cấp' : 'chưa được cấp');
    if(!granted){
      // Không phải lỗi — Chrome chỉ tự grant khi user đã cài PWA hoặc
      // đã tương tác đủ. Vẫn hoạt động bình thường, chỉ kém bền hơn.
    }
  } catch(e){
    console.warn('persist() lỗi', e);
  }
}

function formatVND(n){
  n = Math.round(Number(n) || 0);
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('vi-VN');
  return (neg ? '-' : '') + s + ' ₫';
}
function formatVNDShort(n){
  n = Number(n) || 0;
  const abs = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  if(abs >= 1000000000) return sign + (abs/1000000000).toFixed(1).replace(/\.0$/,'') + ' tỷ';
  if(abs >= 1000000) return sign + (abs/1000000).toFixed(1).replace(/\.0$/,'') + ' tr';
  if(abs >= 1000) return sign + (abs/1000).toFixed(0) + 'k';
  // Dưới 1.000đ vẫn phải kèm đơn vị, nếu không "1" trông như lỗi hiển thị
  return sign + abs.toString() + ' đ';
}
function formatDate(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function formatDateHuman(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
}
/* ★ LỖI MÚI GIỜ (sửa ở v14)
   Date.toISOString() luôn quy về UTC. Việt Nam là UTC+7 nên nửa đêm giờ
   địa phương đã là 17:00 hôm trước theo UTC → mọi ngày bị LÙI 1 NGÀY.
   Ví dụ đã gặp: ghi nhận lương 05/09 thì kỳ sau thành 04/10 thay vì 05/10.
   Từ nay MỌI phép đổi Date → chuỗi ISO đều đi qua hàm này, dựng chuỗi từ
   các thành phần ngày GIỜ ĐỊA PHƯƠNG, không đụng tới UTC. */
function toLocalISO(d){
  const dt = (d instanceof Date) ? d : new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
function todayISO(){ return toLocalISO(new Date()); }
function ymKey(d){ const dt=(d instanceof Date)?d:new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`; }
function isSameMonth(dateStr, refDate){
  const d = new Date(dateStr);
  return d.getFullYear() === refDate.getFullYear() && d.getMonth() === refDate.getMonth();
}
function catMeta(catKey){
  return CATEGORY_ICONS[catKey] || { label: catKey, icon:'📦', color:'#64748B' };
}
function daysInMonth(year, month){ return new Date(year, month+1, 0).getDate(); }
function clamp(v,min,max){ return Math.min(Math.max(v,min),max); }
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
function debounce(fn, wait=250){
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), wait); };
}

/* ---------------------- MONEY INPUT (dấu chấm phân cách nghìn khi gõ) ----------------------
   HTML input type="number" không cho phép hiển thị dấu phân cách, nên các ô nhập SỐ TIỀN
   dùng type="text" + inputmode="numeric", tự format "1.000.000" khi gõ, và parse lại thành
   số nguyên khi đọc giá trị.
   Cách dùng: thêm class "money-input" vào ô → openModal()/renderSettingsView() sẽ tự bind;
   đọc giá trị bằng parseMoneyInput(id) thay cho Number(el.value).
   Lưu ý: các ô là %/ngày/kỳ hạn (lãi suất, ngày trả nợ, số tháng) CỐ Ý giữ type="number"
   để không mất tác dụng validate min/max. */
function stripMoneyFormat(str){
  return String(str||'').replace(/[^\d]/g, ''); // chỉ giữ chữ số
}
function formatMoneyInputValue(digitsStr){
  if(!digitsStr) return '';
  return Number(digitsStr).toLocaleString('vi-VN'); // "1000000" -> "1.000.000"
}
function bindMoneyInput(inputId){
  const el = typeof inputId === 'string' ? document.getElementById(inputId) : inputId;
  if(!el || el.dataset.moneyBound === '1') return;   // chống bind trùng
  el.dataset.moneyBound = '1';
  if(el.value) el.value = formatMoneyInputValue(stripMoneyFormat(el.value)); // chế độ sửa
  el.addEventListener('input', ()=>{
    const cursorFromEnd = el.value.length - el.selectionStart;
    const digits = stripMoneyFormat(el.value);
    el.value = formatMoneyInputValue(digits);
    // Giữ vị trí con trỏ tương đối từ cuối chuỗi (đủ mượt khi gõ nối tiếp)
    const pos = Math.max(0, el.value.length - cursorFromEnd);
    el.setSelectionRange(pos, pos);
  });
}
function parseMoneyInput(inputId){
  const el = document.getElementById(inputId);
  if(!el) return 0;
  return Math.round(Number(stripMoneyFormat(el.value)) || 0);
}
/* Bind mọi ô .money-input bên trong một container. Được gọi tự động trong openModal()
   và sau khi render các view có ô nhập tiền → không cần rải lời gọi ở từng modal. */
function bindAllMoneyInputs(root = document){
  if(!root) return;
  root.querySelectorAll('.money-input').forEach(el => bindMoneyInput(el));
}
/* Biến thể dùng trực tiếp trong oninput="..." cho input lặp không có id cố định
   (VD: danh sách bữa ăn). Format tại chỗ và trả về số đã parse. */
function formatMoneyEventInput(el){
  const cursorFromEnd = el.value.length - el.selectionStart;
  const digits = stripMoneyFormat(el.value);
  el.value = formatMoneyInputValue(digits);
  const pos = Math.max(0, el.value.length - cursorFromEnd);
  el.setSelectionRange(pos, pos);
  return Math.round(Number(digits) || 0);
}

// Lấy toàn bộ giao dịch của tháng đang xem
function getMonthTransactions(refDate = currentViewMonth){
  return DB.transactions.filter(t => isSameMonth(t.date, refDate));
}

/* ★ LỌC P&L: loại các giao dịch chỉ là "tiền đổi chỗ" (ứng trước / được hoàn).
   Chúng vẫn làm thay đổi Số dư hiện tại, nhưng không phải thu nhập/chi tiêu thật
   nên không được tính vào tổng thu chi, ngân sách, heatmap, điểm sức khoẻ… */
function isPL(t){ return !t.excludeFromPL; }
function plTransactions(list){ return list.filter(isPL); }

function getMonthIncome(refDate = currentViewMonth){
  return getMonthTransactions(refDate).filter(t=>t.type==='income' && isPL(t)).reduce((s,t)=>s+t.amount,0);
}
function getMonthExpense(refDate = currentViewMonth){
  return getMonthTransactions(refDate).filter(t=>t.type==='expense' && isPL(t)).reduce((s,t)=>s+t.amount,0);
}
/* ======================================================================
   BACKUP — tuyến phòng thủ cuối cùng
   ----------------------------------------------------------------------
   Không có storage nào trên mobile là vĩnh viễn. IndexedDB bền hơn
   localStorage, nhưng vẫn có thể bị xoá khi:
     • Người dùng xoá dữ liệu website trong Cài đặt
     • iOS thu hồi dung lượng khi máy gần đầy
     • Gỡ PWA / đổi máy
   Nên: nhắc backup khi lâu chưa làm, và làm cho việc backup mất đúng 1 chạm.
   ====================================================================== */

const BACKUP_REMIND_DAYS = 3;

function daysSinceBackup(){
  const t = DB?.settings?.lastBackupAt || 0;
  if(!t) return Infinity;
  return Math.floor((Date.now() - t) / 86400000);
}

function ensureBackupBadge(){
  if(document.getElementById('backupBadge')) return;
  const header = document.querySelector('header');
  if(!header) return;
  const btn = document.createElement('button');
  btn.id = 'backupBadge';
  btn.className = 'hidden items-center gap-1.5 px-2.5 py-2 rounded-xl text-[11.5px] font-semibold transition shrink-0';
  btn.addEventListener('click', () => doBackupDownload());
  const anchor = document.getElementById('darkModeToggle');
 if(anchor) anchor.parentNode.insertBefore(btn, anchor);
  else header.appendChild(btn);
}

function updateBackupBadge(){
  const btn = document.getElementById('backupBadge');
  if(!btn) return;
  const d = daysSinceBackup();
  if(d < BACKUP_REMIND_DAYS){ btn.classList.add('hidden'); btn.classList.remove('flex'); return; }

  btn.classList.remove('hidden');
  btn.classList.add('flex');
  const label = d === Infinity ? 'Chưa backup' : `Chưa backup ${d} ngày`;
  btn.innerHTML = `<span>💾</span><span>${label}</span>`;
  btn.className = btn.className.replace(/bg-\S+|text-\S+/g, '');
  btn.classList.add(
    d >= 7 ? 'bg-bad-500' : 'bg-warn-500',
    'text-white',
    'hover:opacity-90',
    'flex', 'items-center', 'gap-1.5', 'px-2.5', 'py-2', 'rounded-xl',
    'text-[11.5px]', 'font-semibold', 'transition', 'shrink-0'
  );
  btn.title = 'Bấm để tải file backup về máy';
}

/* Tải JSON về máy — trên mobile sẽ vào Files/Downloads, từ đó đẩy lên
   iCloud Drive / Google Drive là xong. */
function doBackupDownload(){
  try {
    const stamp = todayISO();
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `moneyflow-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    DB.settings.lastBackupAt = Date.now();
    saveDB();
    updateBackupBadge();
    showToast('Đã tải backup · nhớ đẩy lên iCloud/Drive', 'ok', 5000);
  } catch(e){
    showToast('Không tạo được file backup', 'bad');
  }
}

/* Nhắc nhẹ khi mở app nếu lâu chưa backup — dùng toast, không chặn UI. */
function maybeRemindBackup(){
  const d = daysSinceBackup();
  if(d === Infinity){
    showToast('Chưa có backup nào. Bấm 💾 trên thanh trên để tải về.', 'warn', 6000);
  } else if(d >= 7){
    showToast(`Đã ${d} ngày chưa backup. Bấm 💾 trên thanh trên để tải về.`, 'warn', 6000);
  }
}

<script>
/* ---------------------- 5. TOAST SYSTEM ---------------------- */
function showToast(message, type='ok', duration=3200){
  const container = document.getElementById('toastContainer');
  const colors = {
    ok:   { bg:'bg-ok-500',  icon:'<path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' },
    bad:  { bg:'bg-bad-500', icon:'<path d="M18 6L6 18M6 6l12 12" stroke="white" stroke-width="2.4" stroke-linecap="round"/>' },
    warn: { bg:'bg-warn-500',icon:'<path d="M12 9v4M12 17h.01" stroke="white" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>' },
    info: { bg:'bg-brand-500',icon:'<path d="M12 8h.01M11 12h1v4h1" stroke="white" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>' },
  };
  const c = colors[type] || colors.ok;
  const el = document.createElement('div');
  el.className = 'toast card shadow-pop rounded-xl px-4 py-3 flex items-center gap-3 min-w-[240px] max-w-sm';
  el.innerHTML = `
    <div class="w-6 h-6 rounded-full ${c.bg} flex items-center justify-center shrink-0">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">${c.icon}</svg>
    </div>
    <p class="text-[13px] font-medium text-ink-700 dark:text-ink-200 leading-snug">${escapeHtml(message)}</p>
  `;
  container.appendChild(el);
  setTimeout(()=>{
    el.style.transition = 'opacity .25s ease, transform .25s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
    setTimeout(()=> el.remove(), 250);
  }, duration);
}

/* ---------------------- 5b. MODAL SYSTEM ---------------------- */
function openModal(innerHtml, opts={}){
  const root = document.getElementById('modalRoot');
  const width = opts.width || 'max-w-lg';
  root.innerHTML = `
    <div id="modalOverlay" class="fixed inset-0 z-[90] modal-overlay flex items-center justify-center p-4 animate-fadeIn">
      <div id="modalBox" class="card rounded-xl2 shadow-pop w-full ${width} max-h-[90vh] overflow-y-auto animate-scaleIn">
        ${innerHtml}
      </div>
    </div>
  `;
  const overlay = document.getElementById('modalOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', modalEscHandler);
  // ★ Một điểm bind duy nhất cho mọi ô nhập tiền trong modal (dấu chấm phân cách nghìn)
  bindAllMoneyInputs(root);
}
function modalEscHandler(e){ if(e.key === 'Escape') closeModal(); }
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
  document.removeEventListener('keydown', modalEscHandler);
}

function modalHeader(title, subtitle=''){
  return `
    <div class="flex items-start justify-between px-5 sm:px-6 pt-5 pb-4 border-b border-ink-100/60 dark:border-white/[0.06] sticky top-0 card z-10">
      <div>
        <h3 class="font-display font-800 text-[17px] text-ink-900 dark:text-white">${title}</h3>
        ${subtitle ? `<p class="text-[12.5px] text-ink-400 mt-0.5">${subtitle}</p>` : ''}
      </div>
      <button onclick="closeModal()" class="p-1.5 -mr-1.5 -mt-1 rounded-lg text-ink-400 hover:bg-ink-50 dark:hover:bg-white/5">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  `;
}

// Modal xác nhận xoá (dùng chung nhiều nơi)
function confirmDelete(message, onConfirm){
  openModal(`
    ${modalHeader('Xác nhận xoá')}
    <div class="px-5 sm:px-6 py-5">
      <p class="text-[13.5px] text-ink-600 dark:text-ink-300 leading-relaxed">${escapeHtml(message)}</p>
      <div class="flex items-center justify-end gap-2.5 mt-6">
        <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button id="confirmDeleteBtn" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold bg-bad-500 hover:bg-bad-600 text-white">Xoá</button>
      </div>
    </div>
  `, { width: 'max-w-sm' });
  document.getElementById('confirmDeleteBtn').addEventListener('click', ()=>{
    onConfirm();
    closeModal();
  });
}
</script>

<script>
/* ---------------------- 6. RENDER: DASHBOARD ---------------------- */
let chartExpensePie = null;
let chartCashflow = null;
let chartBudgetCompare = null;
let chartInterestCalc = null;
let chartIncomeTrend = null;

function computeFinancialHealthScore(){
  const income = getMonthIncome();
  const expense = getMonthExpense();
  const totalDebt = getTotalDebt();
  const totalAssets = getCashPosition() + getTotalSavings() + getTotalReceivables() + DB.assets.reduce((s,a)=>s+a.value,0);
  // Chỉ cộng current của mục tiêu CHƯA gắn gói tiết kiệm (goal đã gắn pot thì
  // số tiền của nó đã nằm trong getTotalSavings() rồi, cộng thêm sẽ bị đếm đôi).
  const totalGoalsSaved = DB.goals.reduce((s,g)=>s+(getGoalLinkedPots(g.id).length?0:(g.current||0)),0) + getTotalSavings();

  let score = 0;
  // 1) Tỷ lệ tiết kiệm (savings rate) - tối đa 40 điểm
  const savingsRate = income > 0 ? (income - expense) / income : 0;
  score += clamp(savingsRate, 0, 1) * 40;
  // 2) Tỷ lệ nợ/tài sản - tối đa 30 điểm (nợ càng thấp điểm càng cao)
  const debtRatio = totalAssets > 0 ? totalDebt / totalAssets : (totalDebt>0?1:0);
  score += clamp(1 - debtRatio, 0, 1) * 30;
  // 3) Có quỹ khẩn cấp / mục tiêu tiết kiệm - tối đa 15 điểm
  const emergencyPot = DB.savings.find(p => p.isEmergency && !p.closed);
  const emergencyGoal = emergencyPot || DB.goals.find(g => /khẩn cấp|khan cap/i.test(g.name));
  if(emergencyGoal){
    const have = emergencyPot ? emergencyPot.balance : emergencyGoal.current;
    const want = (emergencyPot ? (emergencyPot.target || DB.settings.emergencyThreshold) : emergencyGoal.target) || 1;
    score += clamp(have / want, 0, 1) * 15;
  } else if(totalGoalsSaved > 0){
    score += 7;
  }
  // 4) Kiểm soát ngân sách - tối đa 15 điểm
  const overBudgetCount = DB.budgets.filter(b=>{
    const spent = getMonthTransactions().filter(t=>t.type==='expense'&&isPL(t)&&t.category===b.category).reduce((s,t)=>s+t.amount,0);
    return spent > b.limit;
  }).length;
  const budgetScore = DB.budgets.length > 0 ? clamp(1 - overBudgetCount/DB.budgets.length, 0, 1) * 15 : 10;
  score += budgetScore;

  return Math.round(clamp(score, 0, 100));
}

function renderHealthScoreWidget(){
  const score = computeFinancialHealthScore();
  document.getElementById('healthScoreValue').textContent = score;
  document.getElementById('healthScoreBar').style.width = score + '%';
  let label = 'Cần cải thiện';
  if(score >= 80) label = 'Xuất sắc! Tài chính rất khoẻ mạnh';
  else if(score >= 60) label = 'Tốt, đang đi đúng hướng';
  else if(score >= 40) label = 'Ổn, còn nhiều điểm cần cải thiện';
  document.getElementById('healthScoreLabel').textContent = label;
}

/* Dashboard được định nghĩa lại trong "KHỐI LIÊN KẾT 7" ở cuối file
   (phiên bản liên kết: Cash Position → Free Cash → Cảnh báo → Dự báo). */

function renderDashboardEmptyState(){
  return `
    <div class="card rounded-xl2 p-10 shadow-card flex flex-col items-center text-center animate-fadeUp">
      <div class="empty-icon-wrap w-20 h-20 rounded-full flex items-center justify-center mb-4">
        <span class="text-4xl">📊</span>
      </div>
      <h3 class="font-display font-800 text-lg text-ink-900 dark:text-white">Chưa có giao dịch nào trong tháng này</h3>
      <p class="text-[13px] text-ink-400 mt-1.5 max-w-sm">Thêm giao dịch đầu tiên để xem biểu đồ, heatmap và dự báo dòng tiền của bạn.</p>
      <button onclick="openTransactionModal()" class="mt-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-5 py-2.5 rounded-xl transition">
        + Thêm giao dịch
      </button>
    </div>
  `;
}

function renderExpensePieChart(){
  const monthTx = getMonthTransactions().filter(t=>t.type==='expense' && isPL(t));
  const byCategory = {};
  monthTx.forEach(t=>{ byCategory[t.category] = (byCategory[t.category]||0) + t.amount; });
  const entries = Object.entries(byCategory).sort((a,b)=>b[1]-a[1]);
  const total = entries.reduce((s,[,v])=>s+v,0);

  const ctx = document.getElementById('chartExpensePie');
  if(!ctx) return;
  if(chartExpensePie) chartExpensePie.destroy();

  if(entries.length === 0){
    document.getElementById('pieLegend').innerHTML = `<p class="text-[12.5px] text-ink-400 text-center py-4">Chưa có chi tiêu</p>`;
    return;
  }

  const isDark = document.documentElement.classList.contains('dark');
  chartExpensePie = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: entries.map(([k])=>catMeta(k).label),
      datasets: [{
        data: entries.map(([,v])=>v),
        backgroundColor: entries.map(([k])=>catMeta(k).color),
        borderWidth: 2,
        borderColor: isDark ? '#13161C' : '#FFFFFF',
        hoverOffset: 6,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      cutout: '68%',
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label: (ctx) => ` ${ctx.label}: ${formatVND(ctx.parsed)}`
          }
        }
      }
    }
  });

  const legend = document.getElementById('pieLegend');
  legend.innerHTML = entries.map(([k,v])=>{
    const meta = catMeta(k);
    const pct = total>0 ? (v/total*100).toFixed(1) : 0;
    return `
      <div class="flex items-center gap-2 text-[12.5px]">
        <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${meta.color}"></span>
        <span class="text-ink-600 dark:text-ink-300 flex-1 min-w-0 tx-clamp2 overflow-hidden">${meta.icon} ${meta.label}</span>
        <span class="text-ink-400">${pct}%</span>
        <span class="font-semibold text-ink-700 dark:text-ink-200 tabnum w-24 text-right">${formatVNDShort(v)}</span>
      </div>
    `;
  }).join('');
}

function renderCashflowChart(){
  const ctx = document.getElementById('chartCashflow');
  if(!ctx) return;
  if(chartCashflow) chartCashflow.destroy();

  const y = currentViewMonth.getFullYear(), m = currentViewMonth.getMonth();
  const dim = daysInMonth(y,m);
  const dailyIncome = new Array(dim).fill(0);
  const dailyExpense = new Array(dim).fill(0);

  getMonthTransactions().forEach(t=>{
    const day = new Date(t.date).getDate() - 1;
    if(!isPL(t)) return;   // ứng trước / được hoàn không phải dòng thu-chi thật
    if(t.type==='income') dailyIncome[day]+=t.amount; else dailyExpense[day]+=t.amount;
  });

  let running = 0;
  const cumulative = dailyIncome.map((inc,i)=>{ running += inc - dailyExpense[i]; return running; });

  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,17,21,0.06)';
  const tickColor = isDark ? '#8D94A3' : '#6B7383';

  chartCashflow = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array.from({length:dim}, (_,i)=>i+1),
      datasets: [
        {
          label:'Dòng tiền tích luỹ', data: cumulative,
          borderColor:'#6366F1', backgroundColor:'rgba(99,102,241,0.1)',
          fill:true, tension:0.35, pointRadius:0, pointHoverRadius:4, borderWidth:2.5,
        },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false },
        tooltip:{ callbacks:{ label:(ctx)=>` Tích luỹ: ${formatVND(ctx.parsed.y)}`, title:(items)=>`Ngày ${items[0].label}` } }
      },
      scales:{
        x:{ grid:{ display:false }, ticks:{ color: tickColor, maxTicksLimit: 10, font:{size:11} } },
        y:{ grid:{ color: gridColor }, ticks:{ color: tickColor, font:{size:11}, callback:(v)=>formatVNDShort(v) } }
      }
    }
  });
}

function renderHeatmap(){
  const container = document.getElementById('heatmapContainer');
  const y = currentViewMonth.getFullYear(), m = currentViewMonth.getMonth();
  const dim = daysInMonth(y,m);

  const dailyTotals = {};
  getMonthTransactions().filter(t=>t.type==='expense' && isPL(t)).forEach(t=>{
    dailyTotals[t.date] = (dailyTotals[t.date]||0) + t.amount;
  });
  const maxVal = Math.max(1, ...Object.values(dailyTotals));

  function colorFor(val){
    if(!val) return document.documentElement.classList.contains('dark') ? '#232833' : '#EEF0FF';
    const ratio = val / maxVal;
    if(ratio < 0.25) return '#C6CBFF';
    if(ratio < 0.5) return '#8087FF';
    if(ratio < 0.75) return '#6366F1';
    return '#34368C';
  }

  const firstDay = new Date(y,m,1).getDay(); // 0=CN
  let cellsHtml = '';
  // Nhãn thứ
  let weekdayCol = `<div class="flex flex-col gap-1 mr-1.5 shrink-0 justify-around" style="height:112px">
    ${['','T2','','T4','','T6',''].map(l=>`<span class="text-[9.5px] text-ink-300 dark:text-ink-500 h-3.5 leading-3.5">${l}</span>`).join('')}
  </div>`;

  const weeks = [];
  let week = new Array(firstDay).fill(null);
  for(let d=1; d<=dim; d++){
    week.push(d);
    if(week.length===7){ weeks.push(week); week=[]; }
  }
  if(week.length){ while(week.length<7) week.push(null); weeks.push(week); }

  let gridHtml = '<div class="flex gap-1">';
  weeks.forEach(w=>{
    gridHtml += '<div class="flex flex-col gap-1">';
    w.forEach(d=>{
      if(d===null){ gridHtml += `<div class="w-3.5 h-3.5"></div>`; return; }
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const val = dailyTotals[dateStr] || 0;
      gridHtml += `<div class="heat-cell w-3.5 h-3.5" style="background:${colorFor(val)}" data-date="${dateStr}" title="${formatDate(dateStr)}: ${formatVND(val)}" onclick="openDayDetail('${dateStr}')"></div>`;
    });
    gridHtml += '</div>';
  });
  gridHtml += '</div>';

  container.innerHTML = `<div class="flex">${weekdayCol}${gridHtml}</div>`;
}

function openDayDetail(dateStr){
  const dayTx = DB.transactions.filter(t=>t.date===dateStr);
  const total = dayTx.filter(t=>t.type==='expense' && isPL(t)).reduce((s,t)=>s+t.amount,0);
  openModal(`
    ${modalHeader('Chi tiết ngày', formatDateHuman(dateStr))}
    <div class="px-5 sm:px-6 py-4">
      <p class="text-[13px] text-ink-500 mb-3">Tổng chi tiêu: <span class="font-semibold text-ink-800 dark:text-ink-100 tabnum">${formatVND(total)}</span></p>
      ${dayTx.length === 0 ? `<p class="text-[13px] text-ink-400 text-center py-6">Không có giao dịch nào</p>` : `
        <div class="space-y-2">
          ${dayTx.map(t=>renderTxRow(t)).join('')}
        </div>
      `}
    </div>
  `, { width:'max-w-md' });
}

/* TÍNH NĂNG MỚI 2 & 3: mỗi dòng giao dịch giờ có thêm nút Ghim (Pin) và Nhân bản (Duplicate).
   Giao dịch được ghim có viền trái màu vàng nổi bật + icon ghim luôn hiển thị (không cần hover). */
function renderTxRow(t){
  const meta = catMeta(t.category);
  const isIncome = t.type === 'income';
  const isPinned = !!t.pinned;
  return `
    <div class="flex items-center flex-wrap gap-x-3 gap-y-1 py-2.5 px-2 rounded-xl hover:bg-ink-50 dark:hover:bg-white/[0.04] group ${isPinned ? 'bg-warn-50/60 dark:bg-warn-500/[0.06] border-l-[3px] border-warn-400 -ml-[3px] pl-[calc(0.5rem+3px)]' : ''}">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-[16px] shrink-0 relative" style="background:${meta.color}1A">
        ${meta.icon}
        ${isPinned ? `<span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-warn-500 flex items-center justify-center text-[8px] leading-none" title="Đã ghim">📌</span>` : ''}
      </div>
      <div class="min-w-[120px] flex-1 overflow-hidden">
        <p class="text-[13px] font-medium text-ink-800 dark:text-ink-100 tx-clamp2" title="${escapeHtml(t.note || meta.label)}">${escapeHtml(t.note || meta.label)}</p>
        <p class="text-[11.5px] text-ink-400">${meta.label} · ${formatDate(t.date)}${(()=>{
          const acc = DB.accounts && DB.accounts.find(a=>a.id===t.accountId);
          return acc ? ' · ' + acc.icon + ' ' + escapeHtml(acc.name) : '';
        })()}${t.source && t.source.kind !== 'manual' && t.source.kind !== 'receivable' ? ' · ⚡ tự động' : ''}${t.excludeFromPL ? ' · 🧾 không tính vào chi tiêu' : ''}${t.noCash ? ' · không đổi số dư' : ''}</p>
      </div>
      <div class="flex items-center gap-2 shrink-0 ml-auto">
        <p class="text-[13.5px] font-semibold tabnum ${isIncome ? 'text-ok-600' : 'text-ink-800 dark:text-ink-100'} whitespace-nowrap">${isIncome?'+':'-'}${formatVND(t.amount).replace('-','')}</p>
        <div class="row-actions ${isPinned ? 'always-on' : ''} items-center gap-0.5 shrink-0">
        <button onclick="toggleTransactionPin('${t.id}')" class="p-1.5 rounded-lg ${isPinned ? 'text-warn-500 hover:bg-warn-100 dark:hover:bg-warn-500/10' : 'text-ink-400 hover:bg-ink-100 dark:hover:bg-white/10'}" title="${isPinned ? 'Bỏ ghim' : 'Ghim giao dịch'}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="${isPinned ? 'currentColor' : 'none'}"><path d="M12 2l1.5 5.5L19 9l-4.5 3.5L16 18l-4-3-4 3 1.5-5.5L5 9l5.5-1.5L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button onclick="duplicateTransaction('${t.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-ink-100 dark:hover:bg-white/10" title="Nhân bản">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>

          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button onclick="deleteTransaction('${t.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-bad-50 hover:text-bad-500 dark:hover:bg-bad-500/10" title="Xoá">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
      </div>
    </div>
  `;
}

/* Ghim/bỏ ghim một giao dịch. Tối đa 5 giao dịch được ghim cùng lúc. */
function toggleTransactionPin(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t) return;
  if(!t.pinned){
    const pinnedCount = DB.transactions.filter(x=>x.pinned).length;
    if(pinnedCount >= 5){
      showToast('Chỉ có thể ghim tối đa 5 giao dịch. Bỏ ghim bớt để ghim giao dịch mới.', 'warn');
      return;
    }
    t.pinned = true;
    t.pinnedAt = Date.now();
    showToast('Đã ghim giao dịch', 'ok');
  } else {
    t.pinned = false;
    delete t.pinnedAt;
    showToast('Đã bỏ ghim giao dịch', 'info');
  }
  saveDB();
  refreshCurrentView();
}

/* Nhân bản một giao dịch: giữ nguyên số tiền/danh mục/ghi chú/tags, ngày = hôm nay,
   không giữ trạng thái ghim của bản gốc. Sau khi tạo, mở form sửa nhanh để người dùng
   điều chỉnh nếu cần (hoặc lưu luôn nếu không đổi gì). */
function duplicateTransaction(id){
  const original = DB.transactions.find(x=>x.id===id);
  if(!original) return;
  // ★ Liên kết: bản sao cũng trừ/cộng vào Số dư hiện tại như giao dịch thật
  const clone = postTransaction({
    type: original.type,
    category: original.category,
    amount: original.amount,
    date: todayISO(),
    note: original.note,
    tags: [...(original.tags||[])],
    accountId: original.accountId,
    source: { kind:'manual', id:null },
  });
  saveDB();
  refreshCurrentView();
  showToast('Đã nhân bản giao dịch', 'ok');
  // Mở form chỉnh sửa nhanh cho bản sao vừa tạo để người dùng có thể sửa ngay nếu cần
  openTransactionModal(clone.id);
}

function renderRecentTransactions(){

  const recent = [...getMonthTransactions()].sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id.localeCompare(a.id)).slice(0,6);
  if(recent.length === 0){
    list.innerHTML = `<p class="text-[13px] text-ink-400 text-center py-6">Chưa có giao dịch</p>`;
    return;
  }
  list.innerHTML = recent.map(t=>renderTxRow(t)).join('');
}

<script>
/* ---------------------- 6b. RENDER: TRANSACTIONS ---------------------- */
let txFilters = { search:'', type:'all', category:'all', tag:'all', dateFrom:'', dateTo:'' };

function getSmartCategorySuggestion(noteText){
  if(!noteText || noteText.trim().length < 2) return null;
  const lower = noteText.toLowerCase();
  // Tìm giao dịch trước đây có note tương tự (chứa từ khoá chung)
  const words = lower.split(/\s+/).filter(w=>w.length>2);
  if(words.length===0) return null;
  const matches = DB.transactions.filter(t=>{
    const tLower = (t.note||'').toLowerCase();
    return words.some(w => tLower.includes(w));
  });
  if(matches.length===0) return null;
  const freq = {};
  matches.forEach(t=> freq[t.category] = (freq[t.category]||0)+1 );
  return Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
}

function renderTransactionsView(){

          </div>

      <!-- Giao dịch định kỳ -->
      ${DB.recurring.length > 0 ? `
      <div class="card rounded-xl2 p-4 shadow-card">
        <div class="flex items-center justify-between mb-2.5">
          <p class="font-display font-700 text-[13.5px] text-ink-800 dark:text-ink-100 flex items-center gap-1.5">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M17.65 6.35A8 8 0 106.35 17.65" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round"/><path d="M17 3v4h-4M7 21v-4h4" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Giao dịch định kỳ
          </p>
          <button onclick="switchView('recurring')" class="text-[12px] font-semibold text-brand-600 hover:text-brand-700">Quản lý &rarr;</button>
        </div>
        <div class="flex flex-wrap gap-2">
          ${DB.recurring.map(r=>{
            const meta = catMeta(r.category);
            // Bấm vào chip để nhảy thẳng sang màn hình Thu/chi cố định (thể hiện liên kết giữa các module)

              ${meta.icon} ${escapeHtml(r.note)} · ${FREQ_LABELS[r.freq]||'Hàng tháng'} · ${formatDate(r.nextDate)} · <span class="tabnum">${r.type==='income'?'+':'−'}${formatVNDShort(r.amount)}</span>
            </button>`;
          }).join('')}
        </div>
      </div>` : ''}

      <!-- Danh sách giao dịch -->
      <div class="card rounded-xl2 shadow-card overflow-hidden">
        <div id="txListContainer" class="divide-y divide-ink-100/60 dark:divide-white/[0.06]"></div>
      </div>
    </div>

  document.getElementById('txSearchInput').addEventListener('input', debounce((e)=>{ txFilters.search = e.target.value; renderTxList(); }, 200));
  document.getElementById('txTypeFilter').addEventListener('change', (e)=>{ txFilters.type = e.target.value; renderTxList(); });
  document.getElementById('txCategoryFilter').addEventListener('change', (e)=>{ txFilters.category = e.target.value; renderTxList(); });
  document.getElementById('txDateFrom').addEventListener('change', (e)=>{ txFilters.dateFrom = e.target.value; renderTxList(); });
  document.getElementById('txDateTo').addEventListener('change', (e)=>{ txFilters.dateTo = e.target.value; renderTxList(); });

  renderTxList();

function renderTxList(){
  const listEl = document.getElementById('txListContainer');
  if(!listEl) return;

  let list = [...DB.transactions];
  if(txFilters.search){
    const q = txFilters.search.toLowerCase();
    list = list.filter(t => (t.note||'').toLowerCase().includes(q) || catMeta(t.category).label.toLowerCase().includes(q) || (t.tags||[]).some(tag=>tag.toLowerCase().includes(q)));
  }
  if(txFilters.type !== 'all') list = list.filter(t=>t.type===txFilters.type);
  if(txFilters.category !== 'all') list = list.filter(t=>t.category===txFilters.category);
  if(txFilters.dateFrom) list = list.filter(t=>t.date >= txFilters.dateFrom);
  if(txFilters.dateTo) list = list.filter(t=>t.date <= txFilters.dateTo);

  if(list.length === 0){
    listEl.innerHTML = `
      <div class="flex flex-col items-center text-center py-14 px-6">
        <div class="empty-icon-wrap w-16 h-16 rounded-full flex items-center justify-center mb-3"><span class="text-3xl">🔍</span></div>
        <h3 class="font-display font-700 text-[15px] text-ink-800 dark:text-ink-100">Không tìm thấy giao dịch</h3>
        <p class="text-[12.5px] text-ink-400 mt-1">Thử điều chỉnh bộ lọc hoặc thêm giao dịch mới.</p>
      </div>
    `;
    return;
  }

  // TÍNH NĂNG MỚI 2: giao dịch đã ghim luôn nổi lên đầu danh sách, bất kể ngày tháng,
  // tách riêng khỏi phần nhóm theo ngày bên dưới (để không phá cấu trúc tổng theo ngày).
  const pinned = list.filter(t=>t.pinned).sort((a,b)=> (b.pinnedAt||0) - (a.pinnedAt||0));
  const unpinned = list.filter(t=>!t.pinned);

  unpinned.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id.localeCompare(a.id));

  let html = '';
  if(pinned.length > 0){
    html += `
      <div>
        <div class="flex items-center gap-1.5 px-4 sm:px-5 py-2 surface-2">
          <span class="text-[12px]">📌</span>
          <p class="text-[11.5px] font-semibold text-ink-400 uppercase tracking-wide">Đã ghim (${pinned.length}/5)</p>
        </div>
        <div class="px-2 sm:px-3">
          ${pinned.map(t=>renderTxRow(t)).join('')}
        </div>
      </div>
    `;
  }

  // Nhóm phần còn lại theo ngày
  const groups = {};
  unpinned.forEach(t=>{ (groups[t.date] = groups[t.date]||[]).push(t); });

  html += Object.entries(groups).map(([date, items])=>{
    const dayTotal = items.reduce((s,t)=> s + (t.type==='income'?t.amount:-t.amount), 0);
    return `
      <div>
        <div class="flex items-center justify-between px-4 sm:px-5 py-2 surface-2">
          <p class="text-[11.5px] font-semibold text-ink-400 uppercase tracking-wide">${formatDate(date)}</p>
          <p class="text-[11.5px] font-semibold tabnum ${dayTotal>=0?'text-ok-600':'text-bad-500'}">${dayTotal>=0?'+':''}${formatVND(dayTotal)}</p>
        </div>
        <div class="px-2 sm:px-3">
          ${items.map(t=>renderTxRow(t)).join('')}
        </div>
      </div>
    `;
  }).join('');

  listEl.innerHTML = html;
}

/* Mô tả bản ghi mà một giao dịch đang gắn vào (để cảnh báo trước khi xoá) */
function describeTxLink(t){
  if(!t.source || t.source.kind === 'manual') return null;
  const k = t.source.kind;
  if(k === 'debt'){
    const d = DB.debts.find(x => x.id === t.source.id);
    return d ? { kind:'debt', ref:d, label:'khoản nợ "' + d.name + '"' } : null;
  }
  if(k === 'receivable'){
    const r = DB.receivables.find(x => x.id === t.source.id);
    return r ? { kind:'receivable', ref:r, label:'khoản phải thu "' + r.name + '"' } : null;
  }
  if(k === 'recurring'){
    const r = DB.recurring.find(x => x.id === t.source.id);
    return r ? { kind:'recurring', ref:r, label:'khoản cố định "' + (r.note||'') + '"' } : null;
  }
  if(k === 'subscription'){
    const sub = DB.subscriptions.find(x => x.id === t.source.id);
    return sub ? { kind:'subscription', ref:sub, label:'subscription "' + sub.name + '"' } : null;
  }
  if(k === 'allocation') return { kind:'allocation', ref:null, label:'một lần phân bổ thu nhập' };
  return null;
}

/* ★ Xoá giao dịch: hoàn tiền VÀ đồng bộ ngược lại bản ghi gốc.
   Trước đây chỉ hoàn tiền → xoá một giao dịch trả nợ làm dư nợ "bốc hơi",
   xoá một dòng chi của đợt ứng để lại khoản phải thu ma. */
function deleteTransaction(id){
  const t = DB.transactions.find(x => x.id === id);
  if(!t) return;
  const link = describeTxLink(t);

  let msg = 'Bạn có chắc muốn xoá giao dịch này? Số dư hiện tại sẽ được hoàn lại tương ứng.';
  if(link && link.kind === 'debt'){
    msg = `Giao dịch này thuộc ${link.label}. Xoá nó sẽ hoàn tiền vào số dư VÀ ${t.type==='expense' ? 'cộng lại phần gốc đã trả vào dư nợ' : 'trừ lại số tiền vay khỏi dư nợ'}. Tiếp tục?`;
  } else if(link && link.kind === 'receivable'){
    msg = `Giao dịch này thuộc ${link.label}. Xoá nó sẽ hoàn tiền vào số dư VÀ gỡ dòng tương ứng khỏi hồ sơ phải thu. Tiếp tục?`;
  } else if(link){
    msg = `Giao dịch này được sinh tự động từ ${link.label}. Xoá nó chỉ gỡ bản ghi và hoàn tiền — bản thân ${link.label} vẫn giữ nguyên và sẽ tiếp tục chạy ở kỳ sau. Tiếp tục?`;
  }

  confirmDelete(msg, () => applyDeleteTransaction(id));
}

/* Tách phần thực thi để kiểm thử được độc lập với hộp thoại xác nhận */
function applyDeleteTransaction(id){
  const t = DB.transactions.find(x => x.id === id);
  if(!t) return;
  const link = describeTxLink(t);

  // --- Đồng bộ ngược bản ghi gốc TRƯỚC khi gỡ giao dịch ---
  if(link && link.kind === 'debt'){
    const d = link.ref;
    if(t.type === 'expense'){
      // Đây là một lần trả nợ → khôi phục phần gốc đã trừ.
      // Tìm log tương ứng để lấy đúng phần gốc (đã tách khỏi lãi).
      const log = DB.automationLog.find(l => (l.txIds||[]).includes(t.id) && l.status === 'applied');
      const eff = log && (log.effects||[]).find(e => e.target === 'debt' && e.id === d.id);
      const principal = eff ? Math.abs(eff.delta) : t.amount;   // không có log thì lấy cả số tiền
      d.balance = Math.round(d.balance + principal);
      d.paidTotal = Math.max(0, (d.paidTotal||0) - t.amount);
      if(log) log.status = 'undone';
    } else {
      // Đây là một lần giải ngân → gỡ đánh dấu đã nhận tiền
      d.disbursed = false;
      const log = DB.automationLog.find(l => (l.txIds||[]).includes(t.id) && l.status === 'applied');
      if(log) log.status = 'undone';
    }
  } else if(link && link.kind === 'receivable'){
    const r = link.ref;
    if(r.mode === 'batch'){
      const it = r.items.find(i => i.txId === t.id);
      if(it){
        if(it.reimbursed > 0){
          showToast('Dòng này đã nhận hoàn một phần — hãy xử lý trong hồ sơ đợt ứng', 'warn');
          return;
        }
        r.items = r.items.filter(i => i.id !== it.id);
      } else {
        // Là một lần nhận hoàn ứng → đảo lại phần đã phân bổ cho từng dòng
        const pay = r.payments.find(p => p.txId === t.id);
        if(pay){
          let back = pay.amount;
          [...r.items].sort((a,b) => b.date.localeCompare(a.date)).forEach(i => {
            if(back <= 0 || !i.reimbursed) return;
            const take = Math.min(i.reimbursed, back);
            i.reimbursed -= take; back -= take;
            if(i.reimbursed < i.amount && i.status === 'reimbursed') i.status = r.submittedDate ? 'submitted' : 'pending';
          });
          r.payments = r.payments.filter(p => p.txId !== t.id);
        }
      }
      recomputeBatch(r);
    } else {
      // Khoản lẻ: chi ra thì xoá luôn hồ sơ, nhận về thì cộng lại số còn phải thu
      if(t.type === 'expense'){
        DB.receivables = DB.receivables.filter(x => x.id !== r.id);
      } else {
        r.outstanding = Math.round(r.outstanding + t.amount);
        r.payments = r.payments.filter(p => p.txId !== t.id);
        r.status = 'open';
      }
    }
    const log = DB.automationLog.find(l => (l.txIds||[]).includes(t.id) && l.status === 'applied');
    if(log) log.status = 'undone';
  } else if(t.source && t.source.kind === 'gig-bonus' && DB.gig){
    const rec = (DB.gig.bonusPayouts||[]).find(x => x.txId === t.id);
    if(rec){ rec.txId = null; rec.actual = 0; rec.status = 'pending'; rec.receivedDate = null; }
  } else if(t.source && t.source.kind === 'gig-cost' && DB.gig){
    const c = DB.gig.vehicleCosts.find(x => x.txId === t.id);
    if(c) DB.gig.vehicleCosts = DB.gig.vehicleCosts.filter(x => x.id !== c.id);
  } else if(t.source && t.source.kind === 'gig' && DB.gig){
    // Xoá giao dịch của một ca chạy → gỡ luôn tham chiếu để ca không thành mồ côi
    const sh = DB.gig.shifts.find(x => x.txId === t.id || x.fuelTxId === t.id);
    if(sh){
      if(sh.txId === t.id) sh.txId = null;
      if(sh.fuelTxId === t.id){ sh.fuelTxId = null; sh.fuel = 0; }
      if(!sh.txId && !sh.fuelTxId) DB.gig.shifts = DB.gig.shifts.filter(x => x.id !== sh.id);
    }
  } else if(link) {
    const log = DB.automationLog.find(l => (l.txIds||[]).includes(t.id) && l.status === 'applied');
    if(log){
      // Đảo các hiệu ứng NGOÀI tài khoản (vd: tiến độ mục tiêu).
      // Hiệu ứng lên tài khoản do unpostTransaction() bên dưới lo, đảo ở đây sẽ thành trừ hai lần.
      applyEffects((log.effects||[]).filter(e => e.target !== 'account'), -1);
      log.status = 'undone';
    }
  }

  // --- Gỡ giao dịch + hoàn tiền vào tài khoản ---
  unpostTransaction(id);
  saveDB();
  refreshCurrentView();
  showToast('Đã xoá giao dịch · số dư và bản ghi liên quan đã được đồng bộ', 'ok');
}

/* ---------------------- MODAL: Thêm/Sửa giao dịch ---------------------- */

  const type = editing ? editing.type : 'expense';

  openModal(`

    <form id="txForm" class="px-5 sm:px-6 py-5 space-y-4">
      <!-- Loại giao dịch -->
      <div class="grid grid-cols-2 gap-2 p-1 surface-2 rounded-xl">
        <button type="button" data-type="expense" class="tx-type-btn py-2.5 rounded-lg text-[13px] font-semibold transition ${type==='expense'?'bg-bad-500 text-white':'text-ink-500'}">Chi tiêu</button>
        <button type="button" data-type="income" class="tx-type-btn py-2.5 rounded-lg text-[13px] font-semibold transition ${type==='income'?'bg-ok-500 text-white':'text-ink-500'}">Thu nhập</button>
      </div>
      <input type="hidden" id="txTypeInput" value="${type}">

      <!-- Số tiền -->
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Số tiền (₫)</label>
        <input id="txAmountInput" type="text" inputmode="numeric" required placeholder="0"
          value="${editing ? editing.amount : ''}"
          class="money-input w-full px-3.5 py-3 rounded-xl surface-2 border border-transparent focus:border-brand-400 text-[18px] font-display font-700 text-ink-900 dark:text-white outline-none tabnum">
        <p id="timeMoneyHint" class="text-[11.5px] text-brand-500 mt-1.5 hidden"></p>
      </div>

      <!-- Danh mục -->
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Danh mục</label>
        <!-- 20 danh mục sẽ tràn màn hình nhỏ → giới hạn chiều cao, cho cuộn riêng
             để nút "Thêm giao dịch" không bị đẩy khỏi tầm nhìn -->
        <div id="categoryGrid" class="grid grid-cols-4 sm:grid-cols-5 gap-2 max-h-[196px] overflow-y-auto pr-0.5"></div>
        <input type="hidden" id="txCategoryInput" value="${editing ? editing.category : ''}">
      </div>

      <!-- Ngày -->
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ngày</label>
        <input id="txDateInput" type="date" required value="${editing ? editing.date : todayISO()}"
          class="w-full px-3.5 py-2.5 rounded-xl surface-2 border border-transparent focus:border-brand-400 text-[13px] text-ink-800 dark:text-ink-100 outline-none">
      </div>

      <!-- ★ Liên kết: chọn tài khoản bị trừ/cộng (Cash Position) -->
      ${accountSelectHtml('txAccountInput', editing ? editing.accountId : null, 'Tài khoản (số dư sẽ thay đổi ngay)')}
      <p id="txMinBalanceWarn" class="text-[11.5px] text-warn-600 -mt-2 hidden"></p>

      <!-- Ghi chú -->
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ghi chú</label>
        <input id="txNoteInput" type="text" placeholder="VD: Cà phê sáng với đồng nghiệp" value="${editing ? escapeHtml(editing.note||'') : ''}"
          class="w-full px-3.5 py-2.5 rounded-xl surface-2 border border-transparent focus:border-brand-400 text-[13px] text-ink-800 dark:text-ink-100 placeholder:text-ink-300 outline-none">
        <p id="suggestHint" class="text-[11.5px] text-ink-400 mt-1.5 hidden"></p>
      </div>

      <!-- Tags -->
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Tags (cách nhau bởi dấu phẩy)</label>
        <input id="txTagsInput" type="text" placeholder="VD: cong-viec, du-lich" value="${editing ? (editing.tags||[]).join(', ') : ''}"
          class="w-full px-3.5 py-2.5 rounded-xl surface-2 border border-transparent focus:border-brand-400 text-[13px] text-ink-800 dark:text-ink-100 placeholder:text-ink-300 outline-none">
      </div>

      <div class="flex items-center justify-between gap-2.5 pt-2">
        ${editing ? `<button type="button" onclick="deleteTransaction('${editing.id}'); closeModal();" class="text-[13px] font-semibold text-bad-500 hover:text-bad-600">Xoá giao dịch</button>` : '<span></span>'}
        <div class="flex items-center gap-2.5">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">${editing ? 'Lưu thay đổi' : 'Thêm giao dịch'}</button>
        </div>
      </div>
    </form>
  `, { width:'max-w-md' });

  renderCategoryGrid(type, editing ? editing.category : null);

  document.querySelectorAll('.tx-type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.dataset.type;
      document.getElementById('txTypeInput').value = t;
      document.querySelectorAll('.tx-type-btn').forEach(b=>{
        b.classList.remove('bg-bad-500','bg-ok-500','text-white');
        b.classList.add('text-ink-500');
      });
      btn.classList.remove('text-ink-500');
      btn.classList.add(t==='expense'?'bg-bad-500':'bg-ok-500','text-white');
      renderCategoryGrid(t, null);
    });
  });

  const noteInput = document.getElementById('txNoteInput');
  noteInput.addEventListener('input', debounce((e)=>{
    const suggestion = getSmartCategorySuggestion(e.target.value);
    const hint = document.getElementById('suggestHint');
    if(suggestion && suggestion !== document.getElementById('txCategoryInput').value){
      const meta = catMeta(suggestion);
      hint.innerHTML = `💡 Gợi ý danh mục: <button type="button" class="font-semibold text-brand-500 hover:underline" onclick="selectCategory('${suggestion}')">${meta.icon} ${meta.label}</button>`;
      hint.classList.remove('hidden');
    } else {
      hint.classList.add('hidden');
    }
  }, 400));

  const amountInput = document.getElementById('txAmountInput');
  amountInput.addEventListener('input', ()=>{
    const wage = DB.settings.hourlyWage || 0;
    // Ô này là money-input ("25.000"), phải parse qua parseMoneyInput.
    // Number("25.000") trả về 25 → quy đổi giờ công sẽ sai hoàn toàn.
    const amt = parseMoneyInput('txAmountInput');
    const hint = document.getElementById('timeMoneyHint');
    if(wage > 0 && amt > 0){
      const hours = amt / wage;
      let text;
      if(hours < 1) text = `≈ ${Math.round(hours*60)} phút làm việc của bạn`;
      else text = `≈ ${hours.toFixed(1)} giờ làm việc của bạn`;
      hint.textContent = '⏱ ' + text;
      hint.classList.remove('hidden');
    } else { hint.classList.add('hidden'); }
  });
  if(amountInput.value) amountInput.dispatchEvent(new Event('input'));

  /* Cảnh báo mềm khi khoản chi làm số dư rơi dưới mức tối thiểu.
     KHÔNG chặn: giao dịch ghi lại việc đã xảy ra ngoài đời, chặn sẽ khiến
     sổ sách sai lệch với thực tế. Chặn chỉ áp cho hành động chủ động
     (chuyển khoản, nạp tiết kiệm). */
  const syncTxMinWarn = () => {
    const el = document.getElementById('txMinBalanceWarn');
    if(!el) return;
    const type = document.getElementById('txTypeInput').value;
    const amt = parseMoneyInput('txAmountInput');
    const acc = getAccount(document.getElementById('txAccountInput').value);
    const w = type === 'expense' ? checkMinBalanceBreach(acc, amt) : null;
    el.textContent = w ? '⚠️ ' + w : '';
    el.classList.toggle('hidden', !w);
  };
  ['txAmountInput','txAccountInput'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.addEventListener('input', syncTxMinWarn); el.addEventListener('change', syncTxMinWarn); }
  });
  syncTxMinWarn();

  document.getElementById('txForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const category = document.getElementById('txCategoryInput').value;
    if(!category){ showToast('Vui lòng chọn danh mục', 'warn'); return; }
    const amount = parseMoneyInput('txAmountInput');
    if(!amount || amount <= 0){ showToast('Số tiền phải lớn hơn 0', 'warn'); return; }

    const data = {
      type: document.getElementById('txTypeInput').value,
      category,
      amount,
      date: document.getElementById('txDateInput').value,
      note: document.getElementById('txNoteInput').value.trim(),
      tags: document.getElementById('txTagsInput').value.split(',').map(s=>s.trim()).filter(Boolean),
      accountId: document.getElementById('txAccountInput').value,
    };

    // ★ Mọi giao dịch đều đi qua engine → Số dư, Ngân sách, Net Worth, Dự báo cập nhật cùng lúc
    if(editing){
      updateTransaction(editing.id, data);
      showToast('Đã cập nhật giao dịch · số dư đã điều chỉnh', 'ok');
    } else {
      postTransaction({ ...data, source:{ kind:'manual', id:null } });
      showToast('Đã thêm giao dịch · số dư còn ' + formatVND(getCashPosition()), 'ok');
    }
    saveDB();
    closeModal();
    refreshCurrentView();
    checkBudgetAlerts(category);
  });
}

function selectCategory(cat){
  document.getElementById('txCategoryInput').value = cat;
  document.getElementById('suggestHint').classList.add('hidden');
  renderCategoryGrid(document.getElementById('txTypeInput').value, cat);
}

function renderCategoryGrid(type, selected){
  const grid = document.getElementById('categoryGrid');
  const cats = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
  if(!selected) selected = cats[0];
  document.getElementById('txCategoryInput').value = selected;
  grid.innerHTML = cats.map(c=>{
    const meta = catMeta(c);
    const isSelected = c === selected;
    return `
      <button type="button" onclick="selectCategory('${c}')"
        class="flex flex-col items-center gap-1 py-2.5 rounded-xl border-2 transition text-[10.5px] font-medium ${isSelected ? 'border-brand-500 bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-300' : 'border-transparent surface-2 text-ink-500 dark:text-ink-300 hover:border-ink-200 dark:hover:border-white/10'}">
        <span class="text-lg">${meta.icon}</span>
        <span class="truncate w-full text-center px-0.5">${meta.label}</span>
      </button>
    `;
  }).join('');
}

/* Modal khoản cố định được định nghĩa lại trong "KHỐI LIÊN KẾT 9"
   (có chu kỳ, tự động ghi nhận, chọn tài khoản, kịch bản phân bổ). */
function deleteRecurring(id){
  DB.recurring = DB.recurring.filter(r=>r.id!==id);
  DB.pending = (DB.pending||[]).filter(p=>p.refId!==id);
  saveDB();
  refreshCurrentView();
  showToast('Đã xoá khoản cố định', 'ok');
}
</script>

<script>
/* ---------------------- 6c. RENDER: BUDGET ---------------------- */
function renderBudgetView(){
  const container = document.getElementById('viewBudget');
  const monthTx = getMonthTransactions().filter(t=>t.type==='expense' && isPL(t));

  const budgetData = DB.budgets.map(b=>{
    const spent = monthTx.filter(t=>t.category===b.category).reduce((s,t)=>s+t.amount,0);
    const pct = b.limit > 0 ? (spent/b.limit*100) : 0;
    return { ...b, spent, pct };
  });

  const totalLimit = budgetData.reduce((s,b)=>s+b.limit,0);
  const totalSpent = budgetData.reduce((s,b)=>s+b.spent,0);

  const smart = computeSmartBudget();

  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">

      <!-- ★ Ngân sách thông minh: khoản cố định được giữ chỗ trước, phần còn lại mới linh hoạt -->
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Ngân sách thông minh tháng này</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <button onclick="switchView('recurring')" class="text-left surface-2 rounded-xl p-3.5 hover:ring-1 hover:ring-brand-300 transition">
            <p class="text-[11px] text-ink-400 uppercase tracking-wide">Đã giữ chỗ (cố định)</p>
            <p class="font-display font-800 text-[17px] text-bad-500 tabnum mt-1">${formatVND(smart.fixedTotal)}</p>
            <p class="text-[10.5px] text-ink-400 mt-0.5">Đã chi ${formatVNDShort(smart.paidFixed)} · còn ${formatVNDShort(smart.upcomingFixed)}</p>
          </button>
          <div class="surface-2 rounded-xl p-3.5">
            <p class="text-[11px] text-ink-400 uppercase tracking-wide">Ngân sách linh hoạt</p>
            <p class="font-display font-800 text-[17px] text-ink-900 dark:text-white tabnum mt-1">${formatVND(smart.flexibleBudget)}</p>
            <p class="text-[10.5px] text-ink-400 mt-0.5">= Thu nhập ${formatVNDShort(smart.income)} − cố định</p>
          </div>
          <div class="surface-2 rounded-xl p-3.5">
            <p class="text-[11px] text-ink-400 uppercase tracking-wide">Còn được tiêu linh hoạt</p>
            <p class="font-display font-800 text-[17px] tabnum mt-1 ${smart.flexibleLeft<0?'text-bad-500':'text-ok-600'}">${formatVND(smart.flexibleLeft)}</p>
            <p class="text-[10.5px] text-ink-400 mt-0.5">Đã tiêu ${formatVNDShort(smart.flexibleSpent)}</p>
          </div>
        </div>
        ${smart.flexibleLeft < 0 ? `<p class="mt-3 text-[12px] font-semibold text-bad-500">⚠️ Bạn đã vượt phần linh hoạt ${formatVND(Math.abs(smart.flexibleLeft))}. Các khoản cố định vẫn phải trả — hãy cắt giảm chi tiêu tuỳ ý hoặc tạm dừng một subscription.</p>` : ''}
      </div>

      <div class="flex items-center justify-between">
        <div class="card rounded-xl2 p-4 shadow-card flex-1 mr-3">
          <p class="text-[12px] font-semibold text-ink-400 uppercase tracking-wide">Tổng ngân sách danh mục</p>
          <div class="flex items-baseline gap-2 mt-1">
            <p class="font-display font-800 text-xl text-ink-900 dark:text-white tabnum">${formatVND(totalSpent)}</p>
            <p class="text-[13px] text-ink-400 tabnum">/ ${formatVND(totalLimit)}</p>
          </div>
          <div class="progress-track h-2 mt-2.5">
            <div class="progress-fill ${totalSpent>totalLimit?'bg-bad-500':totalSpent>totalLimit*0.8?'bg-warn-500':'bg-ok-500'}" style="width:${clamp(totalLimit>0?totalSpent/totalLimit*100:0,0,100)}%"></div>
          </div>
        </div>
        <button onclick="openBudgetModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-xl transition shrink-0">+ Đặt ngân sách</button>
      </div>

      ${budgetData.length === 0 ? `
        <div class="card rounded-xl2 p-10 shadow-card flex flex-col items-center text-center">
          <div class="empty-icon-wrap w-20 h-20 rounded-full flex items-center justify-center mb-4"><span class="text-4xl">🎯</span></div>
          <h3 class="font-display font-800 text-lg text-ink-900 dark:text-white">Chưa đặt ngân sách nào</h3>
          <p class="text-[13px] text-ink-400 mt-1.5 max-w-sm">Đặt giới hạn chi tiêu theo danh mục để kiểm soát tài chính tốt hơn.</p>
          <button onclick="openBudgetModal()" class="mt-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-5 py-2.5 rounded-xl transition">+ Đặt ngân sách đầu tiên</button>
        </div>
      ` : `
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="space-y-3">
          ${budgetData.sort((a,b)=>b.pct-a.pct).map(b=>renderBudgetCard(b)).join('')}
        </div>
        <div class="card rounded-xl2 p-5 shadow-card h-fit">
          <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Ngân sách vs Thực tế</p>
          <div class="relative" style="height:${Math.max(220, budgetData.length*46)}px">
            <canvas id="chartBudgetCompare"></canvas>
          </div>
        </div>
      </div>
      `}
    </div>
  `;

  if(budgetData.length > 0) renderBudgetCompareChart(budgetData);
}

function renderBudgetCard(b){
  const meta = catMeta(b.category);
  const isOver = b.pct >= 100;
  const isWarn = b.pct >= 80 && b.pct < 100;
  const barColor = isOver ? 'bg-bad-500' : isWarn ? 'bg-warn-500' : 'bg-ok-500';
  const textColor = isOver ? 'text-bad-500' : isWarn ? 'text-warn-500' : 'text-ok-600';

  return `
    <div class="card rounded-xl2 p-4 shadow-card">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0" style="background:${meta.color}1A">${meta.icon}</div>
        <div class="min-w-0 flex-1 overflow-hidden">
          <div class="flex items-center justify-between gap-2">
            <p class="text-[13.5px] font-semibold text-ink-800 dark:text-ink-100 tx-clamp2">${meta.label}</p>
            <p class="text-[12.5px] font-semibold ${textColor} tabnum shrink-0">${b.pct.toFixed(0)}%</p>
          </div>
          <p class="text-[12px] text-ink-400 tabnum">${formatVND(b.spent)} / ${formatVND(b.limit)}</p>
        </div>
        <div class="flex items-center gap-0.5 shrink-0">
          <button onclick="openBudgetModal('${b.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-ink-100 dark:hover:bg-white/10">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button onclick="deleteBudget('${b.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-bad-50 hover:text-bad-500 dark:hover:bg-bad-500/10">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="progress-track h-2 mt-3">
        <div class="progress-fill ${barColor}" style="width:${clamp(b.pct,0,100)}%"></div>
      </div>
      ${isOver ? `<p class="text-[11.5px] text-bad-500 font-medium mt-1.5">⚠ Đã vượt ngân sách ${formatVND(b.spent-b.limit)}</p>` : isWarn ? `<p class="text-[11.5px] text-warn-500 font-medium mt-1.5">⚠ Sắp đạt giới hạn ngân sách</p>` : ''}
    </div>
  `;
}

function renderBudgetCompareChart(budgetData){
  const ctx = document.getElementById('chartBudgetCompare');
  if(!ctx) return;
  if(chartBudgetCompare) chartBudgetCompare.destroy();

  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,17,21,0.06)';
  const tickColor = isDark ? '#8D94A3' : '#6B7383';
  const sorted = [...budgetData].sort((a,b)=>b.limit-a.limit);

  chartBudgetCompare = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sorted.map(b=>catMeta(b.category).label),
      datasets: [
        { label:'Ngân sách', data: sorted.map(b=>b.limit), backgroundColor: isDark ? 'rgba(255,255,255,0.1)' : 'rgba(15,17,21,0.08)', borderRadius:6, barPercentage:0.7 },
        { label:'Đã chi', data: sorted.map(b=>b.spent), backgroundColor: sorted.map(b=> b.pct>=100 ? '#F43F5E' : b.pct>=80 ? '#F59E0B' : '#6366F1'), borderRadius:6, barPercentage:0.7 },
      ]
    },
    options: {
      indexAxis: 'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:'top', align:'end', labels:{ color: tickColor, boxWidth:10, font:{size:11}, usePointStyle:true, pointStyle:'circle' } },
        tooltip:{ callbacks:{ label:(ctx)=>` ${ctx.dataset.label}: ${formatVND(ctx.parsed.x)}` } }
      },
      scales:{
        x:{ grid:{ color:gridColor }, ticks:{ color:tickColor, font:{size:10.5}, callback:(v)=>formatVNDShort(v) } },
        y:{ grid:{ display:false }, ticks:{ color:tickColor, font:{size:11.5} } }
      }
    }
  });
}

function checkBudgetAlerts(category){
  const b = DB.budgets.find(bg=>bg.category===category);
  if(!b) return;
  const spent = getMonthTransactions().filter(t=>t.type==='expense'&&isPL(t)&&t.category===category).reduce((s,t)=>s+t.amount,0);
  const pct = spent/b.limit*100;
  const meta = catMeta(category);
  if(pct >= 100 && pct - (spent-DB.transactions.find(t=>t.category===category)?.amount||0)/b.limit*100 < 100){
    showToast(`Bạn đã vượt ngân sách "${meta.label}"!`, 'bad', 4500);
  } else if(pct >= 80 && pct < 100){
    showToast(`Sắp đạt giới hạn ngân sách "${meta.label}" (${pct.toFixed(0)}%)`, 'warn', 4000);
  }
}

function openBudgetModal(editId=null){
  const editing = editId ? DB.budgets.find(b=>b.id===editId) : null;
  const usedCats = DB.budgets.filter(b=>b.id!==editId).map(b=>b.category);
  const availableCats = EXPENSE_CATS.filter(c=> editing ? true : !usedCats.includes(c));

  openModal(`
    ${modalHeader(editing ? 'Sửa ngân sách' : 'Đặt ngân sách mới', 'Theo danh mục, áp dụng cho tháng hiện tại')}
    <form id="budgetForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Danh mục</label>
        <select id="budgetCategoryInput" ${editing?'disabled':''} class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] text-ink-800 dark:text-ink-100 outline-none disabled:opacity-60">
          ${availableCats.map(c=>`<option value="${c}" ${editing&&editing.category===c?'selected':''}>${catMeta(c).icon} ${catMeta(c).label}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Giới hạn ngân sách / tháng (₫)</label>
        <input id="budgetLimitInput" type="text" inputmode="numeric" required value="${editing?editing.limit:''}"
          class="money-input w-full px-3.5 py-3 rounded-xl surface-2 text-[16px] font-display font-700 outline-none tabnum">
      </div>
      <div class="flex items-center justify-end gap-2.5 pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">${editing?'Lưu':'Đặt ngân sách'}</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  document.getElementById('budgetForm').addEventListener('submit', (e)=>{

<script>

function estimateGoalCompletionDate(goal){
  // ★ Dùng "đã có thực tế": nếu đã gắn gói tiết kiệm, đây là gốc+lãi thật
  // đang có trong (các) gói đó, không phải con số nhập tay ban đầu.
  const current = getGoalEffectiveCurrent(goal);
  const remaining = goal.target - current;
  if(remaining <= 0) return null;
  // Ưu tiên dòng tiền THẬT từ khoản cố định + gói tiết kiệm đã liên kết;
  // chỉ dùng con số nhập tay khi chưa liên kết gì — tránh cộng đôi.
  const monthly = getGoalMonthlyPlan(goal).effective;
  if(!monthly || monthly <= 0) return null;
  const monthsNeeded = Math.ceil(remaining / monthly);
  const d = new Date();
  d.setMonth(d.getMonth() + monthsNeeded);
  return d;
}

function applyDeleteGoal(id){
  DB.goals = DB.goals.filter(g => g.id !== id);
