/* Hộp thoại ghi nhận một kỳ — dùng chung cho việc đang chờ (pending) và cho
   nút "Ghi nhận ngay" trên thẻ khoản cố định.
   Cho sửa CẢ BA: số tiền thực tế, tài khoản thực nhận, và ngày. */
function openPendingConfirm(pendingId){
  const p = DB.pending.find(x => x.id === pendingId);
  if(!p) return;
  const r = p.kind === 'recurring' ? DB.recurring.find(x => x.id === p.refId) : null;
  const defAcc = r ? r.accountId : DB.settings.defaultAccountId;

  openModal(`
    ${modalHeader('Xác nhận ghi nhận', p.name)}
    <form id="pendForm" class="px-5 sm:px-6 py-5 space-y-4">
      <p class="text-[12.5px] text-ink-500 dark:text-ink-300">Kỳ đến hạn ${formatDate(p.dueDate)}. Số tiền và tài khoản thực tế có thể khác cấu hình mặc định — chỉnh ở đây sẽ <b>không</b> làm thay đổi cấu hình gốc.</p>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Số tiền thực tế (₫)</label>
        <input id="pendAmount" type="text" inputmode="numeric" value="${p.amount}" class="money-input w-full px-3.5 py-3 rounded-xl surface-2 text-[17px] font-display font-700 outline-none tabnum">
        ${p.amount ? `<p id="pendDiff" class="text-[11.5px] text-ink-400 mt-1.5"></p>` : ''}
      </div>
      ${accountSelectHtml('pendAccount', defAcc, p.type === 'income' ? 'Tiền vào tài khoản' : 'Trừ từ tài khoản')}
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ngày ghi nhận</label>
        <input id="pendDate" type="date" value="${p.dueDate}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
      </div>
      <div class="flex items-center justify-end gap-2.5 pt-1">
        <button type="button" onclick="skipPending('${p.id}'); closeModal();" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Bỏ qua kỳ này</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Ghi nhận</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  const diffEl = document.getElementById('pendDiff');
  if(diffEl){
    const sync = () => {
      const v = parseMoneyInput('pendAmount');
      const d = v - p.amount;
      diffEl.textContent = d === 0 ? 'Đúng bằng mức dự kiến.'
        : (d > 0 ? '+' : '−') + formatVND(Math.abs(d)) + ' so với mức dự kiến ' + formatVND(p.amount);
      diffEl.className = 'text-[11.5px] mt-1.5 ' + (d === 0 ? 'text-ink-400' : d > 0 ? 'text-ok-600' : 'text-warn-600');
    };
    document.getElementById('pendAmount').addEventListener('input', sync);
    sync();
  }

  document.getElementById('pendForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const amt = parseMoneyInput('pendAmount');
    const acc = document.getElementById('pendAccount').value;
    const date = document.getElementById('pendDate').value;
    if(r) p.dueDate = date;
    confirmPending(p.id, amt, acc);
    closeModal();
  });
}

/* "Ghi nhận ngay" trên thẻ khoản cố định — trước đây ghi thẳng không hỏi gì.
   Nay tạo một mục chờ tạm rồi mở đúng hộp thoại xác nhận ở trên, để bạn
   luôn được chỉnh số tiền và tài khoản thực tế. */
function openRecurringPostModal(recId){
  const r = DB.recurring.find(x => x.id === recId);
  if(!r) return;
  const existing = DB.pending.find(x => x.refId === r.id);
  if(existing){ openPendingConfirm(existing.id); return; }
  const p = {
    id: uid('pen'), createdAt: Date.now(), kind:'recurring', refId:r.id,
    dueDate: (r.nextDate && r.nextDate <= todayISO()) ? r.nextDate : todayISO(),
    amount: r.amount, type: r.type,
    name: r.note || catMeta(r.category).label, category: r.category,
    __adhoc: true,
  };
  DB.pending.push(p);
  openPendingConfirm(p.id);
}

function renderForecastChart(forecast, scenarioForecast){
  const ctx = document.getElementById('chartForecast');
  if(!ctx) return;
  if(chartForecast) chartForecast.destroy();
  const dark = document.documentElement.classList.contains('dark');
  const grid = dark ? 'rgba(255,255,255,0.06)' : 'rgba(15,17,21,0.06)';
  const tick = dark ? '#8D94A3' : '#6B7383';
  const buffer = DB.settings.safetyBuffer || 0;
  const multi = forecast.months > 1;
  // Đường kỳ vọng chỉ có nghĩa khi thật sự có thu nhập không đều
  const showExpected = forecast.irregular && forecast.irregular.rate > 0;
  const days = forecast.days;
  // 1 tháng: đánh dấu mọi ngày có sự kiện. Nhiều tháng: chỉ đánh dấu điểm dưới ngưỡng, tránh rối.
  const markPoint = (d) => multi ? (d.balance < buffer ? 2.5 : 0) : (d.events.length ? 4 : 0);

  chartForecast = new Chart(ctx, {
    type:'line',
    data:{
      labels: days.map(d => multi ? d.date.slice(8,10) + '/' + d.date.slice(5,7) : 'N' + d.day),
      datasets:[
        {
          label:'Thận trọng',
          data: days.map(d => d.balance),
          borderColor:'#6366F1', backgroundColor:'rgba(99,102,241,0.12)',
          fill:true, tension:.32, borderWidth: multi ? 1.8 : 2.4,
          pointRadius: days.map(markPoint),
          pointBackgroundColor: days.map(d => d.balance < buffer ? '#F43F5E' : '#6366F1'),
        },
        {
          label:'Ngưỡng an toàn',
          data: days.map(()=> buffer),
          borderColor:'#F59E0B', borderDash:[5,5], borderWidth:1.4, pointRadius:0, fill:false,
        },
        ...(showExpected ? [{
          label:'Kỳ vọng',
          data: days.map(d => d.expected),
          borderColor:'#10B981', borderDash:[6,4], borderWidth:1.8, pointRadius:0, fill:false, tension:.32,
        }] : []),
        // Đường kịch bản "nếu…" — chỉ xuất hiện khi người dùng kéo thanh trượt
        ...(scenarioForecast ? [{
          label:'Kịch bản',
          data: scenarioForecast.days.map(d => d.balance),
          borderColor:'#0EA5E9', borderDash:[4,3], borderWidth:2.2, pointRadius:0, fill:false,
          backgroundColor:'rgba(14,165,233,0.10)',
        }] : [])
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:false },
        tooltip:{
          filter: (item) => item.dataset.label !== 'Ngưỡng an toàn',
          callbacks:{
            title: (items) => items.length ? formatDate(days[items[0].dataIndex].date) : '',
            label: (c) => c.dataset.label + ': ' + formatVND(c.parsed.y),
            afterBody: (items) => {
              const d = items.length ? days[items[0].dataIndex] : null;
              if(!d || !d.events.length) return '';
              return d.events.map(e => (e.type==='income'?'+ ':e.type==='expense'?'− ':'≈ ') + formatVNDShort(e.amount) + ' · ' + e.name);
            }
          }
        }
      },
      scales:{
        x:{ grid:{ display:false }, ticks:{ color:tick, font:{ size:10 }, maxTicksLimit: multi ? 8 : 12, maxRotation:0 } },
        y:{ grid:{ color:grid }, ticks:{ color:tick, font:{ size:10 }, callback:(v)=>formatVNDShort(v) } }
      }
    }
  });
}

    </p>
    <p class="text-[11px] text-ink-400 mt-1">
      Gồm thu/chi cố định · subscription · trả nợ · trích tiết kiệm · ${flexNote}
      <button onclick="switchView('settings')" class="underline hover:text-brand-600">chỉnh</button>
      ${irr.rate > 0 ? ` · đường kỳ vọng cộng thêm thu nhập không đều TB ${formatVNDShort(irr.monthlyAvg)}/tháng (${irr.months} tháng gần nhất)` : ''}
    </p>
    ${irr.salaryManual ? `<p class="text-[11px] text-warn-600 mt-1">⚠ Lương đang được nhập tay, chưa khai là thu cố định định kỳ, nên đường thận trọng không có lương. <button onclick="switchView('recurring')" class="underline font-semibold">Thêm thu cố định</button></p>` : ''}`);

  set('fcLegend', `
    <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-brand-500 inline-block"></span>Thận trọng</span>
    ${irr.rate > 0 ? `<span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-ok-500 inline-block"></span>Kỳ vọng</span>` : ''}
    <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-warn-500 inline-block"></span>Ngưỡng an toàn</span>
    ${scenarioIsActive() ? `<span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-sky-500 inline-block"></span>Kịch bản</span>` : ''}`);
}

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 12 — KẾ HOẠCH TIẾT KIỆM ĐỊNH KỲ (Savings Plans)
   ----------------------------------------------------------------------
   PHÂN LẬP RÕ 2 TRỤC đưa tiền vào tiết kiệm (không chồng lấn):
     A. Quy tắc phân bổ (allocationRules) — chia theo % KHI CÓ THU NHẬP
     B. Kế hoạch tiết kiệm (savingsPlans)  — trích SỐ TIỀN CỐ ĐỊNH THEO LỊCH
   Kế hoạch tiết kiệm có 2 chế độ:
     • ladder     : mỗi kỳ MỞ MỘT GÓI RIÊNG ("… - tháng 9 năm 2026"),
                    có lãi suất + kỳ hạn + ngày đáo hạn riêng (sổ bậc thang)
     • accumulate : dồn tất cả vào MỘT gói tích lũy có sẵn
   ====================================================================== */

const PLAN_MODE_LABELS = {
  ladder: 'Mỗi kỳ mở một gói riêng (sổ bậc thang)',
  accumulate: 'Dồn vào một gói tích lũy',
};
const MATURITY_ACTION_LABELS = {
  'ask':             'Hỏi tôi khi đáo hạn',
  'renew-all':       'Tái tục: nhập lãi vào gốc',
  'renew-principal': 'Tái tục gốc, lãi về số dư',
  'to-cash':         'Tất toán về số dư hiện tại',
  'to-pot':          'Chuyển sang gói tích lũy',
};

/* Sinh tên gói theo mẫu, mặc định: "Gửi tiết kiệm hàng tháng - tháng 9 năm 2026" */
function planPotName(plan, dateISO){
  const d = new Date(dateISO + 'T00:00:00');
  return (plan.namePattern || '{name} - tháng {M} năm {Y}')
    .replace(/\{name\}/g, plan.name)
    .replace(/\{MM\}/g, String(d.getMonth()+1).padStart(2,'0'))
    .replace(/\{M\}/g, String(d.getMonth()+1))
    .replace(/\{YY\}/g, String(d.getFullYear()).slice(2))
    .replace(/\{Y\}/g, String(d.getFullYear()))
    .replace(/\{DD\}/g, String(d.getDate()).padStart(2,'0'));
}

/* Thực thi MỘT kỳ của kế hoạch → trừ Số dư hiện tại, tạo/nạp gói tiết kiệm */
function executeSavingsPlan(plan, dueDate, overrideAmount){
  const amount = Math.round(overrideAmount != null ? overrideAmount : (plan.amount || 0));
  if(amount <= 0) return null;
  const accId = plan.accountId || DB.settings.defaultAccountId;

  if(plan.mode === 'accumulate'){
    const pot = DB.savings.find(p => p.id === plan.targetPotId && !p.closed);
    if(!pot){ showToast('Kế hoạch "' + plan.name + '" trỏ tới gói không còn tồn tại', 'warn'); return null; }
    const log = depositToSavings(pot.id, amount, {
      accountId: accId, date: dueDate, kind:'savings',
      title: 'Kế hoạch "' + plan.name + '" → ' + pot.name, deferSave: true
    });
    if(log){ log.refId = plan.id; log.rollback = { type:'savingsPlan', id:plan.id, prevDate:dueDate }; }
    plan.createdCount = (plan.createdCount || 0) + 1;
    return log;
  }

  /* --- ladder: mở một gói tiết kiệm MỚI cho kỳ này --- */
  const pot = newSavingsPot({
    name: planPotName(plan, dueDate),
    icon: plan.icon || '🐷',
    balance: amount,
    rate: plan.rate || 0,
    termMonths: plan.termMonths || 0,
    startDate: dueDate,
  });
  pot.maturityDate = plan.termMonths ? addMonthsISO(dueDate, plan.termMonths) : null;
  pot.planId = plan.id;
  pot.onMaturity = plan.onMaturity || 'ask';
  pot.targetPotId = plan.targetPotId || null;
  pot.lastAccrual = dueDate;
  DB.savings.push(pot);

  adjustAccount(accId, -amount);   // ★ trừ thẳng Số dư hiện tại
  const log = logAutomation({
    kind:'savings', date: dueDate, refId: plan.id, amount,
    title: 'Mở gói "' + pot.name + '" · ' + (plan.rate||0) + '%/năm · ' + (plan.termMonths||0) + ' tháng',
    effects: [{ target:'account', id: accId, delta: -amount }],
    rollback: { type:'savingsPlan', id: plan.id, prevDate: dueDate },
  });
  log.createdPotId = pot.id;      // hoàn tác sẽ xoá luôn gói vừa mở
  plan.createdCount = (plan.createdCount || 0) + 1;
  return log;
}

/* Quét các kế hoạch đến hạn (gọi trong runAutomationEngine) */
function runSavingsPlans(today){
  let applied = 0, pending = 0, steps = 0;
  (DB.savingsPlans || []).forEach(plan => {
    if(!plan.active) return;
    while(plan.nextDate && plan.nextDate <= today && steps++ < 200){
      const due = plan.nextDate;
      if((plan.skipList || []).includes(due)){ plan.nextDate = addCycle(due, plan.freq); continue; }
      // ★ Tiết kiệm là khoản DUY NHẤT trong hệ thống có thể hoãn mà không mất phí.
      //   Nếu không đủ tiền, chuyển sang chờ xác nhận thay vì tạo ra khoản tiết
      //   kiệm từ số tiền không tồn tại và đẩy tài khoản xuống âm.
      const acc = getAccount(plan.accountId);
      const enough = acc ? accountAvailable(acc) >= (plan.amount || 0) : false;
      if(plan.autoCreate && enough){
        if(executeSavingsPlan(plan, due)) applied++;
      } else if(plan.autoCreate && !enough){
        pushPending({ kind:'savingsPlan', refId:plan.id, dueDate:due, amount:plan.amount, type:'expense',
                      name:'Trích tiết kiệm: ' + plan.name + ' (hoãn vì không đủ tiền)', category:'khac' });
        pending++;
      } else {
        pushPending({ kind:'savingsPlan', refId:plan.id, dueDate:due, amount:plan.amount, type:'expense',
                      name:'Trích tiết kiệm: ' + plan.name, category:'khac' });
        pending++;
      }
      plan.nextDate = addCycle(due, plan.freq);
    }
  });
  return { applied, pending };
}

/* Tự xử lý gói đến hạn theo cài đặt onMaturity; 'ask' thì chờ người dùng chọn */
function processMaturedPots(today){
  DB.savings.filter(p => !p.closed && p.maturityDate && p.maturityDate <= today && !p.matured).forEach(p => {
    const act = p.onMaturity || 'ask';
    if(act === 'ask'){ p.matured = true; return; }
    handleMaturity(p.id,
      act === 'to-cash' ? 'cash' : act === 'to-pot' ? 'move' : act,
      p.targetPotId, { silent:true, date: p.maturityDate });
  });
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 13 — LÃI SUẤT: tính & trình bày thông minh
   Quy ước: lãi đơn theo ngày thực tế / 365 (thông lệ tiền gửi VN),
   lãi trả cuối kỳ. Rút trước hạn → hưởng lãi suất không kỳ hạn.
   ====================================================================== */
function computePotInterest(p){
  const today = todayISO();
  const accrued = Math.round(p.interestAccrued || 0);
  const hasTerm = !!(p.maturityDate && p.termMonths);
  const daysLeft = p.maturityDate ? Math.max(0, daysBetween(today, p.maturityDate)) : null;
  const projected = (p.maturityDate && p.rate) ? Math.round(p.balance * (p.rate/100) * daysLeft / 365) : 0;
  const totalInterest = accrued + projected;
  const totalDays = p.maturityDate ? Math.max(1, daysBetween(p.startDate || today, p.maturityDate)) : null;
  const elapsed = totalDays !== null ? clamp(totalDays - daysLeft, 0, totalDays) : 0;
  return {
    hasTerm,
    accrued,                                   // lãi đã tích luỹ đến hôm nay
    daysLeft,                                  // số ngày còn lại tới đáo hạn
    projected,                                 // lãi còn sinh thêm tới đáo hạn
    totalInterest,                             // tổng lãi cả kỳ
    totalAtMaturity: Math.round(p.balance + totalInterest),
    monthlyInterest: Math.round(p.balance * (p.rate/100) / 12),
    dailyInterest: Math.round(p.balance * (p.rate/100) / 365),
    totalDays, elapsed,
    progressPct: totalDays ? clamp(elapsed / totalDays * 100, 0, 100) : 0,
  };
}

/* Lãi thực nhận nếu rút NGAY hôm nay (trước hạn) — theo lãi suất không kỳ hạn */
function estimateEarlyWithdrawInterest(p){
  const days = Math.max(0, daysBetween(p.startDate || todayISO(), todayISO()));
  return Math.round(p.balance * ((DB.settings.nonTermRate || 0) / 100) * days / 365);
}
function isBeforeMaturity(p){
  return !!(p.maturityDate && p.maturityDate > todayISO() && p.rate > 0);
}

/* ---------- Helpers dùng chung ---------- */
function icAddMonths(dateStr, months){
  const d = new Date(dateStr);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + months);
  const dim = daysInMonth(d.getFullYear(), d.getMonth());
  d.setDate(Math.min(day, dim));
  return toLocalISO(d);
}

function icRunLadder(e){
  e.preventDefault();
  const firstAmount = parseMoneyInput('icL_first');
  const addAmount = parseMoneyInput('icL_add');
  const term = Number(document.getElementById('icL_term').value);
  const rate = Number(document.getElementById('icL_rate').value) || 0;
  const start = document.getElementById('icL_start').value || todayISO();
  const totalMonths = clamp(Number(document.getElementById('icL_months').value) || 12, 1, 600);
  const reinvestInterest = document.querySelector('input[name="icL_reinvest"]:checked').value === '1';

  if(firstAmount <= 0){ showToast('Nhập số tiền mở sổ đầu tiên', 'bad'); return false; }

  // Mỗi tháng k (0-indexed) mở 1 sổ mới, mở sổ = firstAmount tại k=0, addAmount tại k>0 (khoản gốc mới bơm vào hệ thống)
  // Sổ mở ở kỳ k đáo hạn ở kỳ k+term. Khi đáo hạn: tái tục = (gốc sổ đó [+lãi nếu reinvest]) + addAmount mới.
  const books = []; // sổ đang mở: {openMonth, principal}
  const timeline = []; // theo từng tháng: {month, dateISO, totalPrincipal, totalWithInterest, events:[]}
  let totalAddedPrincipalSoFar = 0; // tổng vốn gốc đã bơm vào hệ thống (để tính "lãi thực nhận" cuối kỳ)
  let totalInterestPaidOut = 0; // lãi đã rút riêng ra ngoài (khi không reinvest)

  for(let m = 0; m <= totalMonths; m++){
    const dateISO = icAddMonths(start, m);
    const events = [];

    if(m === 0){
      books.push({ openMonth:0, principal: firstAmount, rate, termMonths: term });
      totalAddedPrincipalSoFar += firstAmount;
      events.push(`Mở sổ #1: ${formatVNDShort(firstAmount)}`);
    } else {
      // Kiểm tra sổ nào đáo hạn đúng tháng m
      const maturingIdx = books.findIndex(b => b.openMonth + b.termMonths === m);
      if(maturingIdx >= 0){
        const b = books[maturingIdx];
        const interestEarned = Math.round(b.principal * (b.rate/100) * b.termMonths / 12);
        let newPrincipal = b.principal + (reinvestInterest ? interestEarned : 0) + addAmount;
        if(!reinvestInterest) totalInterestPaidOut += interestEarned;
        totalAddedPrincipalSoFar += addAmount;
        books[maturingIdx] = { openMonth:m, principal:newPrincipal, rate, termMonths: term };
        events.push(`Sổ #${maturingIdx+1} đáo hạn +${formatVNDShort(interestEarned)} lãi → tái tục ${formatVNDShort(newPrincipal)}`);
      } else if(m % 1 === 0 && books.length < term){
        // Chưa đủ N sổ (đang trong N kỳ đầu) → mở sổ mới mỗi tháng cho tới khi đủ N sổ song song
        if(m < term){
          books.push({ openMonth:m, principal: addAmount, rate, termMonths: term });
          totalAddedPrincipalSoFar += addAmount;
          events.push(`Mở sổ #${books.length}: ${formatVNDShort(addAmount)}`);
        }
      }
    }

    const totalPrincipalNow = books.reduce((s,b)=>s+b.principal, 0);
    // Lãi tạm tính (chưa đáo hạn) của mỗi sổ đang chạy tính tới thời điểm m
    const accruedNow = books.reduce((s,b)=>{
      const elapsedM = m - b.openMonth;
      return s + Math.round(b.principal * (b.rate/100) * elapsedM / 12);
    }, 0);

    timeline.push({
      month: m, date: dateISO,
      totalPrincipal: totalPrincipalNow,
      totalWithInterest: totalPrincipalNow + accruedNow + totalInterestPaidOut,
      events
    });
  }

  const last = timeline[timeline.length-1];
  const totalInterestEarned = last.totalWithInterest - totalAddedPrincipalSoFar;

  const summaryChips = [
    icKpiChip('Tổng vốn đã góp', formatVND(totalAddedPrincipalSoFar)),
    icKpiChip('Số sổ đang chạy', books.length + ' sổ'),
    icKpiChip('Tổng lãi ước tính', '+' + formatVND(totalInterestEarned), 'text-ok-600'),
    icKpiChip('Gốc hiện có trong sổ', formatVND(last.totalPrincipal)),
    icKpiChip('Lãi đã rút riêng', formatVND(totalInterestPaidOut)),
    icKpiChip('Tổng giá trị cuối kỳ', formatVND(last.totalWithInterest), 'text-brand-600'),
  ].join('');

  const rows = timeline.filter(t=>t.events.length || t.month===last.month).map(t => `
    <tr class="border-t border-ink-100/60 dark:border-white/[0.06]">
      <td class="px-3 py-2 text-ink-400 whitespace-nowrap">${formatDate(t.date)}</td>

    </tr>`).join('');

  const stepLabels = timeline.map(t => formatDate(t.date));
  const principalSeries = timeline.map(t => t.totalPrincipal + (reinvestInterest ? 0 : totalInterestPaidOut));
  const valueSeries = timeline.map(t => t.totalWithInterest);

  document.getElementById('icLadderResult').innerHTML = icResultShell(
    summaryChips,
    { head:`<th class="px-3 py-2 text-left text-ink-400 font-semibold">Ngày</th><th class="px-3 py-2 text-left text-ink-400 font-semibold">Sự kiện</th><th class="px-3 py-2 text-right text-ink-400 font-semibold">Giá trị luỹ kế</th>`, rows },

  );
  icRenderLineChart(stepLabels, principalSeries, valueSeries);
  return false;
}

function icRunAccumulate(e){
  e.preventDefault();
  const start = document.getElementById('icA_start').value;
  const maturity = document.getElementById('icA_maturity').value;
  const rate = Number(document.getElementById('icA_rate').value) || 0;
  const monthly = parseMoneyInput('icA_monthly');

  if(!start || !maturity || maturity <= start){ showToast('Ngày đáo hạn phải sau ngày mở sổ', 'bad'); return false; }

  // Gom danh sách khoản nộp: ưu tiên bảng tuỳ chỉnh nếu có nhập, ngược lại sinh từ "nộp cố định mỗi tháng"
  const customRows = Array.from(document.querySelectorAll('#icAccRows > div')).map(row => ({
    date: row.querySelector('.ic-acc-date').value,
    amount: Math.round(Number(stripMoneyFormat(row.querySelector('.ic-acc-amount').value)) || 0)
  })).filter(r => r.date && r.amount > 0);

  let deposits = [];
  if(customRows.length){
    deposits = customRows;
  } else {
    // sinh khoản nộp hàng tháng từ ngày mở sổ tới trước ngày đáo hạn
    let cursor = start;
    let guard = 0;
    while(cursor < maturity && guard < 600){
      deposits.push({ date: cursor, amount: monthly });
      cursor = icAddMonths(cursor, 1);
      guard++;
    }
  }
  deposits = deposits.filter(d => d.date >= start && d.date <= maturity && d.amount > 0)
                      .sort((a,b)=> a.date.localeCompare(b.date));

  if(!deposits.length){ showToast('Chưa có khoản nộp nào — nhập số tiền nộp mỗi tháng hoặc thêm dòng tuỳ chỉnh', 'bad'); return false; }

  let totalPrincipal = 0, totalInterest = 0;
  const rows = deposits.map((d, idx) => {
    const days = icDaysBetween(d.date, maturity);
    const interest = Math.round(d.amount * (rate/100) * days / 365);
    totalPrincipal += d.amount;
    totalInterest += interest;
    return { idx: idx+1, date:d.date, amount:d.amount, days, interest };
  });

  const rowsHtml = rows.map(r => `
    <tr class="border-t border-ink-100/60 dark:border-white/[0.06]">
      <td class="px-3 py-2 text-ink-400">#${r.idx}</td>
      <td class="px-3 py-2 text-ink-600 dark:text-ink-300 whitespace-nowrap">${formatDate(r.date)}</td>
      <td class="px-3 py-2 text-right tabnum text-ink-700 dark:text-ink-200">${formatVNDShort(r.amount)}</td>
      <td class="px-3 py-2 text-right tabnum text-ink-400">${r.days}</td>
      <td class="px-3 py-2 text-right tabnum font-semibold text-ok-600">+${formatVNDShort(r.interest)}</td>
    </tr>`).join('');

  const summaryChips = [
    icKpiChip('Tổng đã nộp', formatVND(totalPrincipal)),
    icKpiChip('Số lần nộp', deposits.length + ' lần'),
    icKpiChip('Tổng lãi khi đáo hạn', '+' + formatVND(totalInterest), 'text-ok-600'),
    icKpiChip('Nhận khi đáo hạn', formatVND(totalPrincipal + totalInterest), 'text-brand-600'),
  ].join('');

  // Chart: dòng gốc luỹ kế theo từng khoản nộp, và gốc+lãi luỹ kế (lãi quy về thời điểm nộp, hiển thị dần tới đáo hạn)
  let runningPrincipal = 0, runningInterest = 0;
  const labels = rows.map(r => formatDate(r.date));
  const principalSeries = rows.map(r => { runningPrincipal += r.amount; return runningPrincipal; });
  const valueSeries = rows.map(r => { runningInterest += r.interest; return runningPrincipal >= 0 ? (principalSeries[rows.indexOf(r)] + runningInterest) : 0; });
  // valueSeries trên cần principalSeries đã tính đủ theo index — đơn giản hoá lại cho đúng luỹ kế
  const principalCum = []; const valueCum = [];
  let rp = 0, ri = 0;
  rows.forEach(r => { rp += r.amount; ri += r.interest; principalCum.push(rp); valueCum.push(rp+ri); });
  labels.push('Đáo hạn ' + formatDate(maturity));
  principalCum.push(rp);
  valueCum.push(rp+ri);

  document.getElementById('icAccResult').innerHTML = icResultShell(
    summaryChips,
    { head:`<th class="px-3 py-2 text-left text-ink-400 font-semibold">#</th><th class="px-3 py-2 text-left text-ink-400 font-semibold">Ngày nộp</th><th class="px-3 py-2 text-right text-ink-400 font-semibold">Số tiền</th><th class="px-3 py-2 text-right text-ink-400 font-semibold">Số ngày gửi</th><th class="px-3 py-2 text-right text-ink-400 font-semibold">Lãi</th>`, rows: rowsHtml },
    `Mỗi khoản nộp tính lãi riêng: <b>số tiền nộp × lãi suất/năm × (số ngày gửi thực tế / 365)</b>, không nhập lãi vào gốc. Tổng nhận khi đáo hạn = tổng gốc đã nộp + tổng lãi từng khoản.`
  );
  icRenderLineChart(labels, principalCum, valueCum);
  return false;
}

function icRunFlexible(e){
  e.preventDefault();
  const initial = parseMoneyInput('icF_initial');
  const rate = Number(document.getElementById('icF_rate').value) || 0;
  const start = document.getElementById('icF_start').value || todayISO();
  const days = clamp(Number(document.getElementById('icF_days').value) || 365, 1, 7300);
  const topupAmount = parseMoneyInput('icF_topupAmount');
  const topupFreq = Number(document.getElementById('icF_topupFreq').value) || 0;

  if(initial <= 0 && topupAmount <= 0){ showToast('Nhập số dư ban đầu hoặc khoản nạp thêm', 'bad'); return false; }

  const dailyRate = rate / 100 / 365;
  let balance = initial;
  let totalTopup = 0;
  let totalInterest = 0;
  const points = []; // lấy mẫu để vẽ chart + bảng (theo tháng, tránh quá dài với số ngày lớn)
  const sampleEvery = days > 120 ? 30 : (days > 30 ? 7 : 1);

  for(let d = 0; d <= days; d++){
    const dateISO = toLocalISO(new Date(new Date(start).getTime() + d*86400000));
    if(d > 0){
      const interestToday = balance * dailyRate;
      balance += interestToday;
      totalInterest += interestToday;
      if(topupFreq > 0 && d % topupFreq === 0 && topupAmount > 0){
        balance += topupAmount;
        totalTopup += topupAmount;
      }
    }
    if(d % sampleEvery === 0 || d === days){
      points.push({ day:d, date:dateISO, balance: Math.round(balance) });
    }
  }
  // đảm bảo điểm cuối cùng luôn có mặt
  if(points[points.length-1].day !== days){
    points.push({ day:days, date: toLocalISO(new Date(new Date(start).getTime() + days*86400000)), balance: Math.round(balance) });
  }

  const finalBalance = Math.round(balance);
  const totalPrincipal = initial + totalTopup;
  const roundedInterest = finalBalance - totalPrincipal;

  const summaryChips = [
    icKpiChip('Tổng vốn đã nạp', formatVND(totalPrincipal)),
    icKpiChip('Lãi kép tích luỹ', '+' + formatVND(roundedInterest), 'text-ok-600'),
    icKpiChip('Số dư cuối kỳ', formatVND(finalBalance), 'text-brand-600'),
  ].join('');

  const rows = points.map(p => `
    <tr class="border-t border-ink-100/60 dark:border-white/[0.06]">
      <td class="px-3 py-2 text-ink-400 whitespace-nowrap">${formatDate(p.date)}</td>
      <td class="px-3 py-2 text-ink-400 text-right tabnum">ngày ${p.day}</td>
      <td class="px-3 py-2 text-right tabnum font-semibold text-ink-800 dark:text-ink-100">${formatVND(p.balance)}</td>
    </tr>`).join('');

  const labels = points.map(p => formatDate(p.date));
  const principalSeries = points.map(p => initial + Math.min(totalTopup, topupFreq>0 ? Math.floor(p.day/topupFreq)*topupAmount : 0));
  const valueSeries = points.map(p => p.balance);

  document.getElementById('icFlexResult').innerHTML = icResultShell(
    summaryChips,
    { head:`<th class="px-3 py-2 text-left text-ink-400 font-semibold">Ngày</th><th class="px-3 py-2 text-right text-ink-400 font-semibold">Kỳ</th><th class="px-3 py-2 text-right text-ink-400 font-semibold">Số dư</th>`, rows },
    `Lãi tính mỗi ngày trên số dư hiện tại và nhập gốc ngay (lãi kép hàng ngày): <b>lãi ngày = số dư × lãi suất/năm ÷ 365</b>. Có thể rút/nạp bất kỳ lúc nào vì không có kỳ hạn.`
  );
  icRenderLineChart(labels, principalSeries, valueSeries);
  return false;
}

function toggleSavingsPlan(id){
  const p = (DB.savingsPlans||[]).find(x=>x.id===id); if(!p) return;
  p.active = !p.active; saveDB(); refreshCurrentView();
  showToast(p.active?'Đã bật lại kế hoạch':'Đã tạm dừng kế hoạch', 'info');
}
function skipSavingsPlanPeriod(id){
  const p = (DB.savingsPlans||[]).find(x=>x.id===id); if(!p) return;
  p.skipList = p.skipList || [];
  if(!p.skipList.includes(p.nextDate)) p.skipList.push(p.nextDate);
  p.nextDate = addCycle(p.nextDate, p.freq);
  saveDB(); refreshCurrentView();
  showToast('Đã bỏ qua kỳ này · dự báo đã cập nhật', 'info');
}
function runSavingsPlanNow(id){
  const p = (DB.savingsPlans||[]).find(x=>x.id===id); if(!p) return;
  if(getCashPosition() < p.amount && !confirm('Số dư hiện tại thấp hơn số tiền trích. Vẫn tiếp tục?')) return;
  const due = p.nextDate;
  executeSavingsPlan(p, todayISO());
  p.nextDate = addCycle(due, p.freq);
  saveDB(); refreshCurrentView();
  showToast('Đã trích tiết kiệm · số dư đã cập nhật', 'ok');
}
function deleteSavingsPlan(id){
  const plan = (DB.savingsPlans||[]).find(x=>x.id===id); if(!plan) return;
  const n = DB.savings.filter(p=>p.planId===id && !p.closed).length;
  confirmDelete(`Xoá kế hoạch "${plan.name}"? ${n} gói đã mở từ kế hoạch này SẼ ĐƯỢC GIỮ NGUYÊN, chỉ dừng trích các kỳ tiếp theo.`, ()=>{
    DB.savingsPlans = DB.savingsPlans.filter(x=>x.id!==id);
    DB.pending = DB.pending.filter(p=>p.refId!==id);
    saveDB(); closeModal(); refreshCurrentView();
    showToast('Đã xoá kế hoạch tiết kiệm', 'ok');
  });
}

          <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">${editing?'Lưu':'Tạo kế hoạch'}</button>
        </div>

  `, { width:'max-w-md' });

  const preview = () => {

    if(!el) return;
    el.textContent = '→ ' + planPotName({
      name: document.getElementById('planName').value || 'Tiết kiệm',
      namePattern: document.getElementById('planNamePattern').value
    }, document.getElementById('planNextDate').value || todayISO());

  ['planName','planNamePattern','planNextDate'].forEach(id=>{

      });
      document.getElementById('planLadderWrap').classList.toggle('hidden', m !== 'ladder');
      document.getElementById('planAccWrap').classList.toggle('hidden', m !== 'accumulate');
    });
  });

  const onMat = document.getElementById('planOnMaturity');
  if(onMat) onMat.addEventListener('change', ()=>{
    document.getElementById('planTargetWrapLadder').classList.toggle('hidden', onMat.value !== 'to-pot');

    e.preventDefault();
    const m = document.getElementById('planMode').value;
    if(m === 'accumulate' && !document.getElementById('planTargetPot')){
      showToast('Cần có ít nhất một gói tiết kiệm để dồn vào', 'warn'); return;

    const data = {
      name: document.getElementById('planName').value.trim(),
      mode: m,
      amount: Math.round(parseMoneyInput('planAmount')||0),
      freq: document.getElementById('planFreq').value,
      nextDate: document.getElementById('planNextDate').value,

    else { DB.savingsPlans.push({ id: uid('plan'), active:true, skipList:[], createdCount:0, ...data }); showToast('Đã tạo kế hoạch · đã đưa vào dự báo dòng tiền', 'ok'); }
    saveDB(); closeModal(); refreshCurrentView();
  });
}

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 15 — KHOẢN PHẢI THU (ứng trước / cho mượn)
   ----------------------------------------------------------------------
   NGUYÊN TẮC KẾ TOÁN quan trọng nhất của khối này:
     Tiền ứng trước KHÔNG phải là CHI TIÊU, tiền được hoàn KHÔNG phải là
     THU NHẬP. Nó chỉ là tiền đổi chỗ: Số dư hiện tại ⇄ Khoản phải thu.
   Vì vậy các giao dịch này mang cờ excludeFromPL = true:
     • Trừ/cộng Số dư hiện tại → CÓ (nên Free Cash giảm ngay khi bạn ứng)
     • Vào tổng chi tiêu / ngân sách / điểm sức khoẻ / tốc độ đốt tiền → KHÔNG
   Chỉ khi bạn "ghi nhận mất" (write-off) thì nó mới trở thành chi phí thật.
   ====================================================================== */

const RECEIVABLE_KINDS = {
  advance: { label:'Ứng trước cho công ty', icon:'🧾' },
  loan:    { label:'Cho mượn (không lãi)',  icon:'🤝' },
  other:   { label:'Khoản phải thu khác',   icon:'📄' },
};
/* Mức chắc chắn quyết định việc khoản này có được cộng vào DỰ BÁO hay không.
   Chỉ 'high' mới được cộng — nguyên tắc thận trọng, giống gói tiết kiệm "Hỏi tôi". */
const RECV_CONFIDENCE = {
  high:   { label:'Chắc chắn thu được', chip:'bg-ok-50 text-ok-600 dark:bg-ok-500/10' },
  medium: { label:'Khá chắc',           chip:'bg-warn-50 text-warn-600 dark:bg-warn-500/10' },
  low:    { label:'Khó đòi',            chip:'bg-bad-50 text-bad-600 dark:bg-bad-500/10' },
};

function getOpenReceivables(){
  return DB.receivables.filter(r => r.status === 'open' && r.outstanding > 0);
}
function getTotalReceivables(){
  return getOpenReceivables().reduce((s,r) => s + r.outstanding, 0);
}
/* Khoản quá hạn hoàn/trả */
function getOverdueReceivables(){
  const t = todayISO();
  return getOpenReceivables().filter(r => r.expectedDate && r.expectedDate < t);
}
/* Số ngày khoản tiền đã bị "giam" */
function receivableAgeDays(r){ return Math.max(0, daysBetween(r.dateLent, todayISO())); }

/* ---- Tạo khoản phải thu: tiền RỜI tài khoản nhưng KHÔNG tính là chi tiêu ---- */
function createReceivable(data){
  const amount = Math.round(Number(data.principal) || 0);
  if(amount <= 0) return null;
  const r = {
    id: uid('recv'),
    name: data.name,
    kind: data.kind || 'advance',
    counterparty: data.counterparty || '',
    principal: amount,
    outstanding: amount,
    dateLent: data.dateLent || todayISO(),
    expectedDate: data.expectedDate || null,      // null = chưa xác định ngày
    confidence: data.confidence || 'high',
    accountId: data.accountId || DB.settings.defaultAccountId,
    note: data.note || '',
    status: 'open',
    payments: [],
  };
  DB.receivables.push(r);

  const tx = postTransaction({
    type:'expense', category:'phai-thu', amount, date: r.dateLent,
    note: (RECEIVABLE_KINDS[r.kind]||{}).label + ': ' + r.name,
    tags:['phai-thu'], accountId: r.accountId,
    source:{ kind:'receivable', id:r.id }, excludeFromPL: true,
  }, { deferSave:true });

  const log = logAutomation({
    kind:'receivable', date:r.dateLent, refId:r.id, amount,
    title:'Ứng/cho mượn: ' + r.name + ' — tiền rời tài khoản, chưa tính là chi tiêu',
    txIds:[tx.id],
    effects:[{ target:'account', id:r.accountId, delta:-amount }],
  });
  log.createdReceivableId = r.id;
  saveDB();
  return r;
}

/* ---- Ghi nhận được hoàn/trả một phần hay toàn bộ ---- */
function recordReceivablePayment(recvId, amount, opts = {}){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r) return null;
  amount = Math.round(Math.min(Number(amount) || 0, r.outstanding));
  if(amount <= 0) return null;
  const accId = opts.accountId || r.accountId;
  const date = opts.date || todayISO();
  const snap = { id:r.id, outstanding:r.outstanding, status:r.status, payments:r.payments.length };

  const tx = postTransaction({
    type:'income', category:'phai-thu', amount, date,
    note:'Được hoàn: ' + r.name, tags:['phai-thu'], accountId: accId,
    source:{ kind:'receivable', id:r.id }, excludeFromPL: true,
  }, { deferSave:true });

  r.outstanding -= amount;
  r.payments.push({ date, amount, txId: tx.id });
  if(r.outstanding <= 0){ r.outstanding = 0; r.status = 'settled'; }

  const log = logAutomation({
    kind:'receivable', date, refId:r.id, amount,
    title:'Nhận hoàn ' + r.name + (r.status==='settled' ? ' — đã tất toán' : ' (còn ' + formatVNDShort(r.outstanding) + ')'),
    txIds:[tx.id],
    effects:[{ target:'account', id:accId, delta: amount }],
  });
  log.recvSnapshot = snap;
  saveDB();
  return log;
}

/* ---- Ghi nhận MẤT: lúc này mới thành chi phí thật, nhưng KHÔNG trừ tiền lần hai ---- */
function writeOffReceivable(recvId){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r || r.outstanding <= 0) return;
  const amount = r.outstanding;
  confirmDelete(`Ghi nhận MẤT ${formatVND(amount)} của "${r.name}"? Khoản này sẽ được tính là chi tiêu thật của tháng này (số dư không bị trừ thêm lần nữa vì tiền đã ra từ trước).`,
    () => applyWriteOff(recvId));
}

/* Tách riêng phần thực thi để tái sử dụng & kiểm thử được độc lập với hộp thoại xác nhận */
function applyWriteOff(recvId){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r || r.outstanding <= 0) return;
  const amount = r.outstanding;
  {
    const snap = { id:r.id, outstanding:r.outstanding, status:r.status, payments:r.payments.length };
    // noCash = ghi nhận chi phí mà KHÔNG động tới số dư (tiền đã ra khỏi ví từ ngày ứng)
    const tx = postTransaction({
      type:'expense', category:'khac', amount, date: todayISO(),
      note:'Mất khoản phải thu: ' + r.name, tags:['phai-thu','mat-tien'],
      accountId: r.accountId, source:{ kind:'receivable', id:r.id },
      excludeFromPL: false, noCash: true,
    }, { deferSave:true });
    r.outstanding = 0; r.status = 'written-off';
    const log = logAutomation({
      kind:'receivable', date: todayISO(), refId:r.id, amount,
      title:'Ghi nhận mất: ' + r.name, txIds:[tx.id], effects:[],
    });
    log.recvSnapshot = snap;
    saveDB(); refreshCurrentView();
    showToast('Đã ghi nhận khoản mất vào chi tiêu tháng này', 'ok');
  }
}

function deleteReceivable(id){
  const r = DB.receivables.find(x => x.id === id);
  if(!r) return;
  confirmDelete(`Xoá hồ sơ "${r.name}"? Các giao dịch tiền đã phát sinh vẫn được giữ nguyên trong sổ (số dư không đổi). Dùng "Ghi nhận mất" nếu bạn muốn tính nó thành chi phí.`, ()=>{
    DB.receivables = DB.receivables.filter(x => x.id !== id);
    saveDB(); closeModal(); refreshCurrentView();
    showToast('Đã xoá hồ sơ khoản phải thu', 'ok');
  });
}

/* ======================================================================
   VIEW: KHOẢN PHẢI THU
   ====================================================================== */
function renderReceivablesView(){
  const container = document.getElementById('viewReceivables');
  const batches = DB.receivables.filter(r => r.mode === 'batch');
  const openBatches = batches.filter(r => r.status === 'open' || r.outstanding > 0);
  const periods = getClaimPeriodSummary();
  const open = getOpenReceivables().filter(r => r.mode !== 'batch');
  const overdue = getOverdueReceivables();
  const noDate = open.filter(r => !r.expectedDate);
  const total = getTotalReceivables();
  const cash = getCashPosition();
  // Danh sách đã đóng gồm cả khoản lẻ lẫn đợt ứng đã tất toán
  const settled = DB.receivables.filter(r => r.status !== 'open');

  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        ${kpiCard('Đang bị giữ', formatVND(total), 'text-ink-900 dark:text-white')}
        ${kpiCard('Trong đợt ứng', formatVND(batches.reduce((s,r)=>s+r.outstanding,0)), 'text-brand-600')}
        ${kpiCard('Quá hạn', formatVND(overdue.reduce((s,r)=>s+r.outstanding,0)), overdue.length?'text-bad-500':'text-ink-400')}
        ${kpiCard('Chưa hẹn ngày', formatVND(noDate.reduce((s,r)=>s+r.outstanding,0)), 'text-warn-600')}
      </div>

      <!-- Giải thích cơ chế, tránh hiểu nhầm với chi tiêu -->
      <div class="card rounded-xl2 p-4 shadow-card flex flex-wrap items-center gap-3">
        <div class="min-w-0 flex-1 overflow-hidden">
          <p class="text-[12.5px] font-semibold text-ink-700 dark:text-ink-200">
            Tiền ứng trước là tiền <b>đổi chỗ</b>, không phải chi tiêu
          </p>
          <p class="text-[11.5px] text-ink-400 mt-0.5">
            Số dư hiện tại giảm ngay (nên Free Cash giảm theo — bạn thật sự không tiêu được số này),
            nhưng nó <b>không</b> vào tổng chi tiêu, ngân sách hay điểm sức khoẻ tài chính.
            ${total > 0 && cash > 0 ? `Hiện có <b>${(total/(cash+total)*100).toFixed(0)}%</b> tiền lỏng của bạn đang nằm ở người khác.` : ''}
          </p>
        </div>
        <button onclick="openReceivableModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-xl transition shrink-0">+ Thêm khoản phải thu</button>
      </div>

      <!-- ===== ĐỢT ỨNG THEO LÔ — công ty hoàn theo tháng ===== -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">Đợt ứng theo lô</p>
          <p class="text-[11.5px] text-ink-400 mt-0.5">Nhiều dòng chi trong một chuyến / một tháng, hoàn ứng một lần.</p>
        </div>
        <button onclick="openBatchModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-xl transition shrink-0">+ Tạo đợt ứng</button>
      </div>

      ${periods.length ? `
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[13.5px] text-ink-800 dark:text-ink-100 mb-3">Theo dõi theo kỳ hoàn ứng</p>
        <div class="overflow-x-auto">
          <table class="w-full text-[12px]">
            <thead>
              <tr class="text-ink-400 text-[11px] uppercase tracking-wide">
                <th class="text-left font-semibold pb-2">Kỳ</th>
                <th class="text-right font-semibold pb-2">Đã ứng</th>
                <th class="text-right font-semibold pb-2">Đã hoàn</th>
                <th class="text-right font-semibold pb-2">Còn treo</th>
                <th class="text-right font-semibold pb-2">Thiếu hoá đơn</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">
              ${periods.map(p=>`
                <tr>
                  <td class="py-2 font-semibold text-ink-800 dark:text-ink-100">${ymLabel(p.ym)}<span class="text-ink-400 font-normal"> · ${p.batches.length} đợt</span></td>
                  <td class="py-2 text-right tabnum text-ink-700 dark:text-ink-200">${formatVNDShort(p.total)}</td>
                  <td class="py-2 text-right tabnum text-ok-600">${formatVNDShort(p.reimbursed)}</td>
                  <td class="py-2 text-right tabnum font-semibold ${p.outstanding>0?'text-ink-900 dark:text-white':'text-ink-400'}">${formatVNDShort(p.outstanding)}</td>
                  <td class="py-2 text-right tabnum ${p.noInvoice?'text-warn-600 font-semibold':'text-ink-400'}">${p.noInvoice||'—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>` : ''}

      ${openBatches.length
        ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${openBatches.map(r=>renderBatchCard(r)).join('')}</div>`
        : `<div class="card rounded-xl2 p-5 shadow-card text-[12.5px] text-ink-400">
             Chưa có đợt ứng nào. Ví dụ: “Công tác Tây Ninh T8” — thêm từng hoá đơn taxi, khách sạn, ăn uống vào một hồ sơ, rồi nhận hoàn một lần khi công ty chi trả.
           </div>`}

      ${batches.filter(r => r.status === 'settled' && r.outstanding === 0).length ? `
      <p class="text-[11.5px] text-ink-400">${batches.filter(r => r.status === 'settled').length} đợt đã tất toán — xem trong danh sách bên dưới.</p>` : ''}

      <!-- ===== KHOẢN LẺ ===== -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">Khoản lẻ</p>
        <button onclick="openReceivableModal()" class="surface-2 hover:bg-ink-100 dark:hover:bg-white/10 text-ink-600 dark:text-ink-300 font-semibold text-[12.5px] px-3.5 py-2.5 rounded-xl transition">+ Khoản lẻ</button>
      </div>

      ${open.length === 0 ? `
        <div class="card rounded-xl2 p-6 shadow-card flex flex-col items-center text-center">
          <div class="empty-icon-wrap w-16 h-16 rounded-full flex items-center justify-center mb-3"><span class="text-3xl">🧾</span></div>
          <h3 class="font-display font-800 text-[15px] text-ink-900 dark:text-white">Không có khoản lẻ nào đang bị giữ</h3>
          <p class="text-[12.5px] text-ink-400 mt-1.5 max-w-sm">Dùng cho khoản đơn lẻ như cho bạn bè mượn. Ứng nhiều hoá đơn cho công ty thì dùng “Đợt ứng” ở trên.</p>
        </div>
      ` : `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${
            open.sort((a,b)=>(a.expectedDate||'9999').localeCompare(b.expectedDate||'9999')).map(r=>renderReceivableCard(r)).join('')
          }</div>`}

      ${settled.length ? `
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Đã tất toán / đã ghi nhận mất (${settled.length})</p>
        <div class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">
          ${settled.slice(0,20).map(r=>`
            <div class="flex items-center gap-3 py-2.5">
              <div class="w-8 h-8 rounded-lg surface-2 flex items-center justify-center text-[13px] shrink-0">${(RECEIVABLE_KINDS[r.kind]||{}).icon||'📄'}</div>
              <div class="min-w-0 flex-1 overflow-hidden">
                <p class="text-[12.5px] font-medium text-ink-800 dark:text-ink-100 tx-clamp2">${escapeHtml(r.name)}</p>
                <p class="text-[11px] text-ink-400">${r.status==='settled'?'Đã thu đủ':'Đã ghi nhận mất'} · ứng ngày ${formatDate(r.dateLent)}</p>
              </div>
              <span class="font-display font-700 text-[12.5px] tabnum ${r.status==='settled'?'text-ok-600':'text-bad-500'}">${formatVND(r.principal)}</span>
              <button onclick="deleteReceivable('${r.id}')" class="p-1.5 rounded-lg text-ink-400 hover:text-bad-500">✕</button>
            </div>`).join('')}
        </div>
      </div>` : ''}

}

function renderReceivableCard(r){
  const meta = RECEIVABLE_KINDS[r.kind] || RECEIVABLE_KINDS.other;
  const conf = RECV_CONFIDENCE[r.confidence] || RECV_CONFIDENCE.high;
  const days = r.expectedDate ? daysBetween(todayISO(), r.expectedDate) : null;
  const overdue = days !== null && days < 0;
  const paid = r.principal - r.outstanding;
  const pct = r.principal > 0 ? clamp(paid / r.principal * 100, 0, 100) : 0;

  return `
    <div class="card rounded-xl2 p-4 shadow-card ${overdue?'ring-1 ring-bad-400':''}">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl surface-2 flex items-center justify-center text-lg shrink-0">${meta.icon}</div>
        <div class="min-w-0 flex-1 overflow-hidden">
          <p class="text-[13.5px] font-semibold text-ink-800 dark:text-ink-100 tx-clamp2">${escapeHtml(r.name)}</p>
          <p class="text-[11.5px] text-ink-400 tx-clamp2">${meta.label}${r.counterparty?' · '+escapeHtml(r.counterparty):''}</p>
        </div>
        <button onclick="openReceivableModal('${r.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-ink-100 dark:hover:bg-white/10">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <p class="font-display font-800 text-xl text-ink-900 dark:text-white mt-3 tabnum">${formatVND(r.outstanding)}</p>
      ${paid > 0 ? `
      <div class="mt-2">
        <div class="flex justify-between text-[11px] text-ink-400 mb-1"><span>Đã nhận ${formatVNDShort(paid)} / ${formatVNDShort(r.principal)}</span><span class="tabnum">${pct.toFixed(0)}%</span></div>
        <div class="progress-track h-1.5"><div class="progress-fill bg-ok-500" style="width:${pct}%"></div></div>
      </div>` : ''}

      <div class="flex flex-wrap items-center gap-1.5 mt-2.5">
        <span class="chip ${overdue?'bg-bad-50 text-bad-600 dark:bg-bad-500/10':days===null?'bg-warn-50 text-warn-600 dark:bg-warn-500/10':days<=7?'bg-warn-50 text-warn-600 dark:bg-warn-500/10':'surface-2 text-ink-500'}">
          ${r.expectedDate
            ? (overdue ? `Quá hạn ${Math.abs(days)} ngày` : days === 0 ? 'Hẹn hôm nay' : `Còn ${days} ngày`) + ' · ' + formatDate(r.expectedDate)
            : 'Chưa hẹn ngày'}
        </span>
        <span class="chip ${conf.chip}">${conf.label}</span>
        <span class="chip surface-2 text-ink-500" title="Số ngày tiền bị giam">⏳ ${receivableAgeDays(r)} ngày</span>
      </div>

      ${r.confidence !== 'high' || !r.expectedDate ? `
        <p class="text-[11px] text-ink-400 mt-2">Không được cộng vào dự báo dòng tiền (thiếu ngày hẹn hoặc chưa chắc chắn).</p>
      ` : ''}

      <div class="flex flex-wrap gap-1.5 mt-3">
        <button onclick="openReceivablePaymentModal('${r.id}')" class="flex-1 text-[11.5px] font-semibold px-2.5 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Đã nhận tiền</button>
        <button onclick="openReceivablePaymentModal('${r.id}', true)" class="text-[11.5px] font-semibold px-2.5 py-2 rounded-lg surface-2 text-ink-600 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-white/10 transition">Nhận đủ</button>
        <button onclick="writeOffReceivable('${r.id}')" class="text-[11.5px] font-semibold px-2.5 py-2 rounded-lg surface-2 text-ink-500 hover:text-bad-500 transition" title="Coi như mất, tính vào chi tiêu">Mất</button>
      </div>
    </div>`;
}

function openReceivablePaymentModal(recvId, full = false){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r) return;
  if(full){
    recordReceivablePayment(r.id, r.outstanding);
    refreshCurrentView();
    showToast('Đã nhận đủ ' + formatVND(r.principal - 0) + ' · số dư đã cập nhật', 'ok');
    return;
  }
  openModal(`
    ${modalHeader('Ghi nhận tiền về', r.name)}
    <form id="recvPayForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div class="surface-2 rounded-xl p-3 flex justify-between text-[12.5px]">
        <span class="text-ink-500 dark:text-ink-300">Còn phải thu</span><span class="font-display font-700 tabnum">${formatVND(r.outstanding)}</span>
      </div>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Số tiền nhận được (₫)</label>
        <input id="recvPayAmount" type="text" inputmode="numeric" required value="${r.outstanding}" class="money-input w-full px-3.5 py-3 rounded-xl surface-2 text-[17px] font-display font-700 outline-none tabnum">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ngày nhận</label>
        <input id="recvPayDate" type="date" value="${todayISO()}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
      </div>
      ${accountSelectHtml('recvPayAcc', r.accountId, 'Tiền vào tài khoản')}
      <p class="text-[11.5px] text-ink-400">Khoản này <b>không</b> được tính là thu nhập, nên không kích hoạt quy tắc phân bổ.</p>
      <div class="flex justify-end gap-2.5 pt-1">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Ghi nhận</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  document.getElementById('recvPayForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    recordReceivablePayment(r.id, parseMoneyInput('recvPayAmount'), {
      accountId: document.getElementById('recvPayAcc').value,
      date: document.getElementById('recvPayDate').value,
    });
    closeModal(); refreshCurrentView();
    showToast('Đã ghi nhận tiền về · số dư đã cập nhật', 'ok');
  });
}

function openReceivableModal(editId = null){
  const editing = editId ? DB.receivables.find(r => r.id === editId) : null;
  const kind = editing ? editing.kind : 'advance';

  openModal(`
    ${modalHeader(editing ? 'Sửa khoản phải thu' : 'Thêm khoản phải thu', 'Tiền bạn ứng trước hoặc cho mượn — sẽ quay về sau')}
    <form id="recvForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Loại</label>
        <div class="grid grid-cols-1 gap-2">
          ${Object.keys(RECEIVABLE_KINDS).map(k=>`
            <button type="button" data-kind="${k}" class="recv-kind-btn text-left px-3.5 py-2.5 rounded-xl border-2 transition ${kind===k?'border-brand-500 bg-brand-50 dark:bg-brand-500/10':'border-transparent surface-2'}">
              <span class="text-[12.5px] font-semibold text-ink-800 dark:text-ink-100">${RECEIVABLE_KINDS[k].icon} ${RECEIVABLE_KINDS[k].label}</span>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Tên khoản</label>
          <input id="recvName" type="text" required value="${editing?escapeHtml(editing.name):''}" placeholder="VD: Ứng vé máy bay công tác" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Bên nợ bạn</label>

      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Số tiền (₫)</label>
          <input id="recvAmount" type="text" inputmode="numeric" required ${editing?'disabled':''} value="${editing?editing.principal:''}" class="money-input w-full px-3.5 py-3 rounded-xl surface-2 text-[16px] font-display font-700 outline-none tabnum ${editing?'opacity-60':''}">
          ${editing?'<p class="text-[11px] text-ink-400 mt-1">Không sửa được số gốc — hãy ghi nhận tiền về hoặc xoá rồi tạo lại.</p>':''}
        </div>
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ngày ứng / cho mượn</label>
          <input id="recvDate" type="date" required ${editing?'disabled':''} value="${editing?editing.dateLent:todayISO()}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none ${editing?'opacity-60':''}">
        </div>
      </div>

      <div class="surface-2 rounded-xl p-3.5 space-y-3">
        <label class="flex items-center gap-2.5 text-[12.5px] text-ink-700 dark:text-ink-200">
          <input type="checkbox" id="recvNoDate" ${editing && !editing.expectedDate ? 'checked' : ''} class="w-4 h-4 rounded">
          Chưa xác định ngày được hoàn
        </label>
        <div id="recvDateWrap" class="${editing && !editing.expectedDate ? 'hidden':''}">
          <label class="text-[11.5px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ngày dự kiến nhận lại</label>
          <input id="recvExpected" type="date" value="${editing&&editing.expectedDate?editing.expectedDate:''}" class="w-full px-3.5 py-2.5 rounded-xl card text-[13px] outline-none">
        </div>
        <div>
          <label class="text-[11.5px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Mức chắc chắn</label>
          <select id="recvConfidence" class="w-full px-3.5 py-2.5 rounded-xl card text-[13px] outline-none">
            ${Object.keys(RECV_CONFIDENCE).map(k=>`<option value="${k}" ${(editing?editing.confidence===k:k==='high')?'selected':''}>${RECV_CONFIDENCE[k].label}</option>`).join('')}
          </select>
          <p class="text-[11px] text-ink-400 mt-1.5">Chỉ khoản <b>chắc chắn</b> và <b>có ngày hẹn</b> mới được cộng vào dự báo dòng tiền.</p>
        </div>
      </div>

      ${editing ? '' : accountSelectHtml('recvAccount', null, 'Tiền ra từ tài khoản')}

      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ghi chú</label>
        <input id="recvNote" type="text" value="${editing?escapeHtml(editing.note||''):''}" placeholder="VD: nộp bill cho kế toán ngày 25" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
      </div>

      <div class="flex items-center justify-between gap-2.5 pt-2">
        ${editing ? `<button type="button" onclick="deleteReceivable('${editing.id}')" class="text-[13px] font-semibold text-bad-500 hover:text-bad-600">Xoá hồ sơ</button>` : '<span></span>'}
        <div class="flex gap-2.5">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">${editing?'Lưu':'Thêm khoản'}</button>
        </div>
      </div>
    </form>
  `, { width:'max-w-md' });

  document.querySelectorAll('.recv-kind-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('recvKind').value = btn.dataset.kind;
      document.querySelectorAll('.recv-kind-btn').forEach(b=>{
        const on = b.dataset.kind === btn.dataset.kind;
        b.classList.toggle('border-brand-500', on); b.classList.toggle('bg-brand-50', on);
        b.classList.toggle('border-transparent', !on); b.classList.toggle('surface-2', !on);
      });
    });
  });
  const noDate = document.getElementById('recvNoDate');
  noDate.addEventListener('change', ()=>{
    document.getElementById('recvDateWrap').classList.toggle('hidden', noDate.checked);
  });

  document.getElementById('recvForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const expected = document.getElementById('recvNoDate').checked ? null : (document.getElementById('recvExpected').value || null);
    if(editing){
      Object.assign(editing, {
        name: document.getElementById('recvName').value.trim(),
        kind: document.getElementById('recvKind').value,
        counterparty: document.getElementById('recvParty').value.trim(),
        expectedDate: expected,
        confidence: document.getElementById('recvConfidence').value,
        note: document.getElementById('recvNote').value.trim(),
      });
      showToast('Đã cập nhật khoản phải thu', 'ok');
    } else {
      createReceivable({
        name: document.getElementById('recvName').value.trim(),
        kind: document.getElementById('recvKind').value,
        counterparty: document.getElementById('recvParty').value.trim(),
        principal: parseMoneyInput('recvAmount'),
        dateLent: document.getElementById('recvDate').value,
        expectedDate: expected,
        confidence: document.getElementById('recvConfidence').value,
        accountId: document.getElementById('recvAccount').value,
        note: document.getElementById('recvNote').value.trim(),
      });
      showToast('Đã ghi nhận · số dư giảm nhưng KHÔNG tính vào chi tiêu', 'ok', 4200);
    }
    saveDB(); closeModal(); refreshCurrentView();
  });
}
</script>

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 16 — ĐỢT ỨNG THEO LÔ (batch receivable)
   ----------------------------------------------------------------------
   Một chuyến công tác = MỘT hồ sơ chứa NHIỀU dòng chi, hoàn ứng MỘT lần.
     r.mode = 'batch'  → principal/outstanding được TÍNH LẠI từ items[]
     r.items[] = [{ id, date, amount, note, hasInvoice, status, reimbursed }]
     item.status: pending (đã chi, chưa nộp) → submitted (đã nộp đề nghị)
                  → reimbursed (đã nhận đủ) | rejected (bị từ chối)
   Mỗi dòng chi vẫn tạo giao dịch excludeFromPL: tiền RỜI ví ngay nhưng
   không tính vào chi tiêu/ngân sách. Chỉ dòng BỊ TỪ CHỐI mới thành chi phí.
   ====================================================================== */

const RECV_ITEM_STATUS = {
  pending:    { label:'Chưa nộp',   chip:'surface-2 text-ink-500' },
  submitted:  { label:'Đã nộp',     chip:'bg-brand-50 text-brand-600 dark:bg-brand-500/10' },
  reimbursed: { label:'Đã hoàn',    chip:'bg-ok-50 text-ok-600 dark:bg-ok-500/10' },
  rejected:   { label:'Bị từ chối', chip:'bg-bad-50 text-bad-600 dark:bg-bad-500/10' },
};

function ymLabel(ym){
  if(!ym) return '—';
  const [y,m] = ym.split('-');
  return 'Tháng ' + Number(m) + '/' + y;
}
function currentYM(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* Nguồn sự thật duy nhất của một đợt là items[] — mọi tổng đều tính lại từ đây */
function recomputeBatch(r){
  if(r.mode !== 'batch') return r;
  const active = r.items.filter(i => i.status !== 'rejected');
  r.principal = active.reduce((s,i) => s + i.amount, 0);
  const got = active.reduce((s,i) => s + (i.reimbursed || 0), 0);
  r.outstanding = Math.max(0, r.principal - got);
  r.status = (r.items.length > 0 && r.outstanding === 0) ? 'settled' : 'open';
  return r;
}

function createBatchReceivable(data){
  const r = {
    id: uid('recv'),
    mode: 'batch',
    name: data.name,
    kind: data.kind || 'advance',
    counterparty: data.counterparty || 'Công ty',
    claimPeriod: data.claimPeriod || currentYM(),
    principal: 0, outstanding: 0,
    dateLent: data.dateLent || todayISO(),
    expectedDate: data.expectedDate || null,
    submittedDate: null,
    confidence: data.confidence || 'high',
    accountId: data.accountId || DB.settings.defaultAccountId,
    note: data.note || '',
    status: 'open',
    items: [], payments: [],
  };
  DB.receivables.push(r);
  saveDB();
  return r;
}

/* Thêm một dòng chi vào đợt → tiền rời ví ngay */
function addReceivableItem(recvId, item){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r || r.mode !== 'batch') return null;
  const amount = Math.round(Number(item.amount) || 0);
  if(amount <= 0) return null;
  const date = item.date || todayISO();
  const accId = item.accountId || r.accountId;

  const tx = postTransaction({
    type:'expense', category:'phai-thu', amount, date,
    note:'[' + r.name + '] ' + (item.note || 'Chi phí'),
    tags:['phai-thu','dot-ung'], accountId: accId,
    source:{ kind:'receivable', id:r.id }, excludeFromPL: true,
  }, { deferSave:true });

  const it = {
    id: uid('item'), date, amount,
    note: item.note || 'Chi phí',
    hasInvoice: !!item.hasInvoice,
    status: r.submittedDate ? 'submitted' : 'pending',
    reimbursed: 0, txId: tx.id, accountId: accId,
  };
  r.items.push(it);
  r.items.sort((a,b) => a.date.localeCompare(b.date));
  recomputeBatch(r);

  const log = logAutomation({
    kind:'receivable', date, refId:r.id, amount,
    title:'Chi trong đợt "' + r.name + '": ' + it.note,
    txIds:[tx.id],
    effects:[{ target:'account', id: accId, delta: -amount }],
  });
  log.createdItem = { recvId: r.id, itemId: it.id };
  saveDB();
  return it;
}

function deleteReceivableItem(recvId, itemId){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r) return;
  const it = r.items.find(i => i.id === itemId);
  if(!it) return;
  if(it.reimbursed > 0){ showToast('Dòng này đã nhận hoàn một phần — không xoá được', 'warn'); return; }
  if(it.txId) unpostTransaction(it.txId, { deferSave:true });   // hoàn tiền về tài khoản
  r.items = r.items.filter(i => i.id !== itemId);
  recomputeBatch(r);
  saveDB(); refreshCurrentView();
  showToast('Đã xoá dòng chi · tiền đã hoàn về số dư', 'ok');
}

/* Đánh dấu đã nộp đề nghị thanh toán cho cả đợt */
function submitBatch(recvId, expectedDate){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r) return;
  const noInvoice = r.items.filter(i => !i.hasInvoice && i.status !== 'rejected').length;
  r.submittedDate = todayISO();
  r.expectedDate = expectedDate || r.expectedDate;
  r.items.forEach(i => { if(i.status === 'pending') i.status = 'submitted'; });
  saveDB(); refreshCurrentView();
  showToast('Đã nộp đề nghị' + (noInvoice ? ` · lưu ý ${noInvoice} dòng chưa có hoá đơn` : ''), noInvoice ? 'warn' : 'ok');
}

/* Nhận hoàn MỘT LẦN cho cả đợt → phân bổ lần lượt từ dòng chi cũ nhất */
function recordBatchReimbursement(recvId, amount, opts = {}){
  const r = DB.receivables.find(x => x.id === recvId);
  if(!r || r.mode !== 'batch') return null;
  amount = Math.round(Math.min(Number(amount) || 0, r.outstanding));
  if(amount <= 0) return null;
  const accId = opts.accountId || r.accountId;
  const date = opts.date || todayISO();
  const snapshot = {
    id: r.id, outstanding: r.outstanding, status: r.status, payments: r.payments.length,
    items: r.items.map(i => ({ id:i.id, reimbursed:i.reimbursed, status:i.status })),
  };

  const tx = postTransaction({
    type:'income', category:'phai-thu', amount, date,
    note:'Hoàn ứng đợt: ' + r.name, tags:['phai-thu','dot-ung'], accountId: accId,
    source:{ kind:'receivable', id:r.id }, excludeFromPL: true,
  }, { deferSave:true });

  let left = amount;
  r.items.filter(i => i.status !== 'rejected')
         .sort((a,b) => a.date.localeCompare(b.date))
         .forEach(i => {
    if(left <= 0) return;
    const need = i.amount - (i.reimbursed || 0);
    if(need <= 0) return;
    const give = Math.min(need, left);
    i.reimbursed = (i.reimbursed || 0) + give;
    left -= give;
    if(i.reimbursed >= i.amount) i.status = 'reimbursed';
  });

  r.payments.push({ date, amount, txId: tx.id });
  recomputeBatch(r);

  const log = logAutomation({
    kind:'receivable', date, refId:r.id, amount,
    title:'Nhận hoàn ứng đợt "' + r.name + '"' + (r.outstanding > 0 ? ' (còn ' + formatVNDShort(r.outstanding) + ')' : ' — đủ'),
    txIds:[tx.id],
    effects:[{ target:'account', id: accId, delta: amount }],
  });
  log.recvSnapshot = snapshot;
  log.recvItemsSnapshot = snapshot.items;
  saveDB();
  return log;
}

/* Công ty từ chối một dòng → lúc này mới thành CHI PHÍ THẬT (không trừ tiền lần hai) */
function rejectReceivableItem(recvId, itemId){
  const r = DB.receivables.find(x => x.id === recvId);
  const it = r && r.items.find(i => i.id === itemId);
  if(!it || it.status === 'rejected') return;
  confirmDelete(`Đánh dấu "${it.note}" (${formatVND(it.amount)}) bị từ chối? Khoản này sẽ chuyển thành chi tiêu thật của bạn — số dư không bị trừ thêm vì tiền đã ra từ ngày chi.`,
    () => applyRejectItem(recvId, itemId));
}
function applyRejectItem(recvId, itemId){
  const r = DB.receivables.find(x => x.id === recvId);
  const it = r && r.items.find(i => i.id === itemId);
  if(!it || it.status === 'rejected') return;
  const snapshot = { id:r.id, outstanding:r.outstanding, status:r.status, payments:r.payments.length,
                     items: r.items.map(i => ({ id:i.id, reimbursed:i.reimbursed, status:i.status })) };
  const remain = it.amount - (it.reimbursed || 0);
  const tx = postTransaction({
    type:'expense', category:'khac', amount: remain, date: todayISO(),
    note:'Bị từ chối hoàn ứng: ' + it.note, tags:['phai-thu','mat-tien'],
    accountId: it.accountId || r.accountId, source:{ kind:'receivable', id:r.id },
    excludeFromPL: false, noCash: true,
  }, { deferSave:true });
  it.status = 'rejected';
  recomputeBatch(r);
  const log = logAutomation({
    kind:'receivable', date: todayISO(), refId:r.id, amount: remain,
    title:'Từ chối hoàn: ' + it.note + ' → tính vào chi tiêu', txIds:[tx.id], effects:[],
  });
  log.recvSnapshot = snapshot;
  log.recvItemsSnapshot = snapshot.items;
  saveDB(); refreshCurrentView(); closeModal();
  showToast('Đã chuyển thành chi tiêu thật', 'ok');
}

/* Tổng hợp theo kỳ (tháng) — công ty hoàn theo tháng nên đây là cách theo dõi tự nhiên */
function getClaimPeriodSummary(){
  const map = {};
  DB.receivables.filter(r => r.mode === 'batch').forEach(r => {
    const k = r.claimPeriod || currentYM();
    if(!map[k]) map[k] = { ym:k, batches:[], total:0, reimbursed:0, outstanding:0, noInvoice:0, items:0, rejected:0 };
    const g = map[k];
    g.batches.push(r);
    const active = r.items.filter(i => i.status !== 'rejected');
    g.total += active.reduce((s,i) => s + i.amount, 0);
    g.reimbursed += active.reduce((s,i) => s + (i.reimbursed||0), 0);
    g.outstanding += r.outstanding;
    g.noInvoice += active.filter(i => !i.hasInvoice).length;
    g.rejected += r.items.filter(i => i.status === 'rejected').length;
    g.items += r.items.length;
  });
  return Object.values(map).sort((a,b) => b.ym.localeCompare(a.ym));
}

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 17 — CẢNH BÁO DỒN NGÀY (cash crunch clusters)
   Dự báo chỉ báo "ngày cháy túi" đầu tiên. Khối này chỉ ra CỤM nghĩa vụ
   gây ra nó: ngày nào, gồm những khoản gì, thiếu bao nhiêu.
   ====================================================================== */
function detectCashCrunchClusters(forecast){
  const buffer = DB.settings.safetyBuffer || 0;
  const f = forecast || computeCashflowForecast();
  const clusters = [];

  f.days.forEach((d, idx) => {
    const outs = d.events.filter(e => e.type === 'expense');
    if(!outs.length) return;
    const total = outs.reduce((s,e) => s + e.amount, 0);
    const ins = d.events.filter(e => e.type === 'income').reduce((s,e) => s + e.amount, 0);
    // Tiền có thể dùng ngay TRƯỚC khi các khoản của ngày này bị trừ
    const available = (idx > 0 ? f.days[idx-1].balance : getCashPosition()) + ins;
    const shortfall = Math.max(0, total - (available - buffer));
    const ratio = total > 0 ? available / total : 99;
    // Chỉ báo khi THỰC SỰ rủi ro: thiếu tiền, hoặc dồn ≥3 khoản mà đệm quá mỏng
    if(shortfall > 0 || (outs.length >= 3 && ratio < 1.5)){
      clusters.push({
        date: d.date, day: d.day, events: outs, count: outs.length,
        total, available, shortfall, ratio,
        level: shortfall > 0 ? 'bad' : 'warn',
      });
    }
  });
  return clusters.sort((a,b) => b.shortfall - a.shortfall || b.total - a.total);
}

function renderClusterCard(clusters){
  if(!clusters.length) return '';
  return `
    <div class="card rounded-xl2 p-5 shadow-card">
      <div class="flex items-center justify-between mb-1">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">Ngày dồn nghĩa vụ</p>
        <span class="chip ${clusters[0].level==='bad'?'bg-bad-50 text-bad-600 dark:bg-bad-500/10':'bg-warn-50 text-warn-600 dark:bg-warn-500/10'}">${clusters.length} ngày cần chú ý</span>
      </div>
      <p class="text-[11.5px] text-ink-400 mb-3">Những ngày có nhiều khoản đến hạn cùng lúc, so với số tiền dự kiến có trong tay đúng ngày hôm đó.</p>
      <div class="space-y-2.5">
        ${clusters.slice(0,3).map(c => `
          <div class="rounded-xl border ${c.level==='bad'?'border-bad-400/50 bg-bad-50 dark:bg-bad-500/10':'border-warn-400/50 bg-warn-50 dark:bg-warn-500/10'} p-3">
            <div class="flex flex-wrap items-baseline gap-x-2">
              <p class="text-[12.5px] font-semibold text-ink-800 dark:text-ink-100">${formatDate(c.date)} — ${c.count} khoản, tổng ${formatVND(c.total)}</p>
              <p class="text-[11.5px] ${c.level==='bad'?'text-bad-600 font-semibold':'text-ink-500 dark:text-ink-300'}">
                ${c.shortfall > 0 ? `thiếu ${formatVND(c.shortfall)}` : `chỉ dư ${formatVND(c.available - c.total)}`}
              </p>
            </div>
            <p class="text-[11px] text-ink-500 dark:text-ink-300 mt-1">Dự kiến có trong tay: <b class="tabnum">${formatVND(c.available)}</b></p>
            <div class="mt-2 space-y-1">
              ${c.events.map(e => `
                <div class="flex items-center gap-2 text-[11.5px]">
                  <span>${e.icon}</span>
                  <span class="min-w-0 flex-1 tx-clamp2 text-ink-600 dark:text-ink-300 overflow-hidden">${escapeHtml(e.name)}</span>
                  <span class="tabnum font-semibold text-ink-700 dark:text-ink-200">−${formatVNDShort(e.amount)}</span>
                </div>`).join('')}
            </div>
            ${c.shortfall > 0 ? `<p class="text-[11px] text-ink-500 dark:text-ink-300 mt-2">Cách gỡ: dời một khoản sang kỳ sau (“Bỏ qua kỳ”), tạm dừng một kế hoạch trích tiết kiệm, hoặc rút bớt từ gói không kỳ hạn.</p>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 18 — KỊCH BẢN "NẾU…" (what-if)
   Dùng lại đúng engine dự báo, chỉ biến đổi tập sự kiện đầu vào.
   Không ghi bất cứ thứ gì vào dữ liệu thật.
   ====================================================================== */
let forecastScenario = { delayReceivableDays: 0, flexCutPct: 0, pauseSavings: false };

function scenarioIsActive(){
  return forecastScenario.delayReceivableDays > 0
      || forecastScenario.flexCutPct > 0
      || forecastScenario.pauseSavings;
}
function setScenario(key, value){
  forecastScenario[key] = (key === 'pauseSavings') ? !!value : (Number(value) || 0);
  refreshScenarioUI();
}
function resetScenario(){
  forecastScenario = { delayReceivableDays: 0, flexCutPct: 0, pauseSavings: false };
  refreshScenarioUI();
  const d = document.getElementById('scDelayRange'); if(d) d.value = 0;
  const c = document.getElementById('scCutRange'); if(c) c.value = 0;
  const p = document.getElementById('scPauseChk'); if(p) p.checked = false;
}

/* Vẽ lại biểu đồ + số liệu mà không render lại cả Dashboard (giữ vị trí thanh trượt) */
function refreshScenarioUI(){
  // v18.3: biểu đồ + kịch bản chạy theo mốc đã chọn (1/3/6/12 tháng)
  const opts = { months: DB.settings.forecastHorizon || 1 };
  const base = computeCashflowForecast(null, opts);
  const sc = computeCashflowForecast(forecastScenario, opts);
  renderForecastChart(base, scenarioIsActive() ? sc : null);
  renderForecastHeader(base);

  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('scDelayVal', forecastScenario.delayReceivableDays + ' ngày');
  set('scCutVal', forecastScenario.flexCutPct + '%');

  if(!scenarioIsActive()){
    set('scResult', '<span class="text-ink-400">Chưa chọn kịch bản nào — biểu đồ đang là dự báo gốc.</span>');
    return;
  }
  const diff = sc.endBalance - base.endBalance;
  const pct = forecastScenario.flexCutPct;
  // ★ Dịch % thành CON SỐ MỖI NGÀY để không phải tự nhẩm thêm một bước.
  const cutLine = pct > 0 && base.dailyBurn > 0 ? `
    <span class="block mt-1.5 text-ink-600 dark:text-ink-300">
      Cắt ${pct}%: mỗi ngày chỉ tiêu tối đa
      <b class="tabnum text-ink-900 dark:text-white">${formatVND(Math.round(sc.dailyBurn))}</b>
      thay vì ${formatVND(Math.round(base.dailyBurn))}
      <span class="text-ink-400">(bớt ${formatVND(Math.round(base.dailyBurn - sc.dailyBurn))}/ngày ·
      ${formatVND(Math.round((base.dailyBurn - sc.dailyBurn) * 7))}/tuần)</span>
    </span>` : (pct > 0 ? `
    <span class="block mt-1.5 text-ink-400">Chưa có chi tiêu linh hoạt nào gần đây để cắt giảm.</span>` : '');

  set('scResult', `
    <span class="text-ink-500 dark:text-ink-300">Số dư ${forecastPeriodLabel(sc)}:</span>
    <b class="tabnum ${sc.endBalance>=0?'text-ink-900 dark:text-white':'text-bad-500'}">${formatVND(sc.endBalance)}</b>
    <span class="tabnum ${diff>=0?'text-ok-600':'text-bad-500'}">(${diff>=0?'+':'−'}${formatVNDShort(Math.abs(diff))} so với gốc)</span>
    · <span class="${sc.dangerDate?'text-bad-500 font-semibold':'text-ok-600'}">${sc.dangerDate?'dưới ngưỡng từ '+formatDate(sc.dangerDate):(sc.months===1?'an toàn cả tháng':'an toàn cả kỳ')}</span>
    ${cutLine}`);
}

function renderScenarioCard(){
  return `
    <div class="card rounded-xl2 p-5 shadow-card">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">Kịch bản “nếu…”</p>
        <button onclick="resetScenario()" class="text-[11.5px] font-semibold text-ink-500 hover:text-brand-600">Đặt lại</button>
      </div>
      <p class="text-[11.5px] text-ink-400 mb-3">Kéo thanh trượt để xem đường dự báo đổi thế nào. Đây chỉ là mô phỏng — không ghi gì vào dữ liệu thật.</p>

      <div class="space-y-3.5">
        <div>
          <div class="flex justify-between text-[12px] mb-1.5">
            <span class="text-ink-600 dark:text-ink-300">Bên nợ hoàn chậm</span>
            <span id="scDelayVal" class="font-semibold tabnum text-ink-800 dark:text-ink-100">${forecastScenario.delayReceivableDays} ngày</span>
          </div>
          <input id="scDelayRange" type="range" min="0" max="60" step="5" value="${forecastScenario.delayReceivableDays}"
            oninput="setScenario('delayReceivableDays', this.value)" class="w-full accent-brand-600">
        </div>
        <div>
          <div class="flex justify-between text-[12px] mb-1.5">
            <span class="text-ink-600 dark:text-ink-300">Cắt giảm chi tiêu linh hoạt <span class="text-ink-400">(đang ${formatVND(Math.round(computeCashflowForecast().dailyBurn))}/ngày)</span></span>
            <span id="scCutVal" class="font-semibold tabnum text-ink-800 dark:text-ink-100">${forecastScenario.flexCutPct}%</span>
          </div>
          <input id="scCutRange" type="range" min="0" max="60" step="5" value="${forecastScenario.flexCutPct}"
            oninput="setScenario('flexCutPct', this.value)" class="w-full accent-brand-600">

        <label class="flex items-center gap-2.5 text-[12.5px] text-ink-600 dark:text-ink-300">

          Tạm dừng mọi khoản trích tiết kiệm trong tháng
        </label>
      </div>

      <p id="scResult" class="text-[12px] mt-3 pt-3 border-t border-ink-100/60 dark:border-white/[0.06]"></p>
