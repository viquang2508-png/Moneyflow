/* ======================================================================
   ★ KHỐI LIÊN KẾT 25 — CHU KỲ SUBSCRIPTION CHÍNH XÁC
   ----------------------------------------------------------------------
   Nhiều gói bán theo SỐ NGÀY chứ không theo tháng lịch: gym 30 ngày, VPN
   90 ngày… Đăng ký 19/08 thì kỳ sau là 18/09 (đúng 30 ngày), không phải 19/09.
   Trước đây mọi thứ đều bị quy về "hàng tháng" nên ngày đến hạn lệch dần
   và chi phí năm bị tính thiếu (12 kỳ thay vì 12,17 kỳ).
   ====================================================================== */
const SUB_CYCLES = {
  weekly:    { label:'Hàng tuần',  perYear: 52 },
  monthly:   { label:'Hàng tháng', perYear: 12 },
  quarterly: { label:'Hàng quý',   perYear: 4 },
  yearly:    { label:'Hàng năm',   perYear: 1 },
  days:      { label:'Theo số ngày', perYear: null },   // perYear tính từ cycleDays
};

function subCycleDays(sub){
  return Math.max(1, Number(sub.cycleDays) || 30);
}
function subCycleLabel(sub){
  if(sub.cycle === 'days') return `Mỗi ${subCycleDays(sub)} ngày`;
  return (SUB_CYCLES[sub.cycle] || SUB_CYCLES.monthly).label;
}
/* Ngày đến hạn kế tiếp tính từ một mốc */
function subNextDate(sub, fromISO){
  if(sub.cycle === 'days') return shiftISO(fromISO, subCycleDays(sub));
  return addCycle(fromISO, SUB_CYCLES[sub.cycle] ? sub.cycle : 'monthly');
}
/* Chi phí quy đổi về MỖI THÁNG — dùng cho tổng hợp và ngân sách.
   Gói 30 ngày tốn nhiều hơn gói hàng tháng vì một năm có 12,17 kỳ. */
function subMonthlyCost(sub){
  const amt = sub.amount || 0;
  if(sub.cycle === 'days') return amt * (365 / subCycleDays(sub)) / 12;
  const per = (SUB_CYCLES[sub.cycle] || SUB_CYCLES.monthly).perYear;
  return amt * per / 12;
}
function subYearlyCost(sub){ return subMonthlyCost(sub) * 12; }
function activeSubs(){ return DB.subscriptions.filter(s => s.active !== false); }

  const monthlyTotal = running.reduce((s,sub)=> s + subMonthlyCost(sub), 0);
  const sorted = [...running].sort((a,b)=> new Date(a.nextDate) - new Date(b.nextDate));

  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">

          <p class="font-display font-800 text-xl text-ink-900 dark:text-white mt-1 tabnum">${formatVND(Math.round(monthlyTotal))}</p>
          <p class="text-[11.5px] text-ink-400 mt-0.5">${formatVND(Math.round(monthlyTotal*12))}/năm · ${running.length} gói đang chạy${paused.length?` · ${paused.length} tạm dừng`:''}</p>
        </div>
        <button onclick="openSubscriptionModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-xl transition shrink-0">+ Thêm dịch vụ</button>
      </div>

      ${DB.subscriptions.length === 0 ? `
        <div class="card rounded-xl2 p-10 shadow-card flex flex-col items-center text-center">
          <div class="empty-icon-wrap w-20 h-20 rounded-full flex items-center justify-center mb-4"><span class="text-4xl">📺</span></div>
          <h3 class="font-display font-800 text-lg text-ink-900 dark:text-white">Chưa có subscription nào</h3>
          <p class="text-[13px] text-ink-400 mt-1.5 max-w-sm">Thêm Netflix, Spotify, Gym... để theo dõi tổng chi phí đăng ký hàng tháng.</p>
          <button onclick="openSubscriptionModal()" class="mt-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-5 py-2.5 rounded-xl transition">+ Thêm dịch vụ đầu tiên</button>
        </div>
      ` : `

      ${paused.length ? `

      </div>` : ''}
      `}
    </div>
  `;

/* ★ Liên kết: thanh toán thủ công 1 kỳ subscription → trừ ngay số dư */
function paySubscriptionNow(id){
  const s = DB.subscriptions.find(x=>x.id===id);
  if(!s) return;
  postSubscriptionOccurrence(s, todayISO());
  // Chu kỳ tính từ NGÀY THANH TOÁN THỰC TẾ, không phải từ ngày đến hạn cũ —
  // nếu không, trả trễ 3 ngày sẽ khiến mọi kỳ sau lệch dần.
  s.nextDate = subNextDate(s, todayISO());
  DB.pending = DB.pending.filter(p => p.refId !== id);
  saveDB(); refreshCurrentView();
  showToast('Đã ghi nhận thanh toán ' + s.name, 'ok');
}
/* ★ TẠM DỪNG thay cho "Bỏ qua kỳ".
   "Bỏ qua kỳ" chỉ đẩy ngày sang kỳ sau — nếu bạn ngừng dùng dịch vụ vài tháng,
   nó vẫn âm thầm nhảy ngày và vẫn bị tính vào ngân sách. Tạm dừng thì gói
   ngừng hẳn: không tự trừ tiền, không vào dự báo, không tính vào tổng chi phí,
   nhưng vẫn giữ nguyên cấu hình để bấm "Bắt đầu lại" là chạy tiếp. */
function pauseSubscription(id){
  const s = DB.subscriptions.find(x=>x.id===id);
  if(!s) return;
  s.active = false;
  s.pausedAt = todayISO();
  DB.pending = DB.pending.filter(p => p.refId !== id);
  saveDB(); refreshCurrentView();
  showToast('Đã tạm dừng ' + s.name + ' · cấu hình vẫn được giữ', 'info');
}

/* Bắt đầu lại: chu kỳ tính LẠI TỪ ĐẦU theo đúng cấu hình cũ.
   Hỏi ngày để tránh đoán sai — người bấm "bắt đầu lại" có thể vừa thanh toán
   hôm nay, hoặc mới chỉ định ngày bắt đầu lại trong tương lai. */
function openResumeSubscriptionModal(id){
  const s = DB.subscriptions.find(x=>x.id===id);
  if(!s) return;
  const paidToday = subNextDate(s, todayISO());
  openModal(`
    ${modalHeader('Bắt đầu lại ' + s.name, subCycleLabel(s) + ' · ' + formatVND(s.amount))}
    <form id="resumeSubForm" class="px-5 sm:px-6 py-5 space-y-4">
      <p class="text-[12.5px] text-ink-500 dark:text-ink-300">
        Gói này đã tạm dừng${s.pausedAt ? ' từ ' + formatDate(s.pausedAt) : ''}. Toàn bộ cấu hình cũ vẫn còn —
        chỉ cần cho biết kỳ thanh toán kế tiếp rơi vào ngày nào.
      </p>
      <div class="surface-2 rounded-xl p-3.5 space-y-2.5">
        <label class="flex items-start gap-2.5 text-[12.5px] text-ink-700 dark:text-ink-200">
          <input type="radio" name="resumeMode" value="paid" checked class="w-4 h-4 mt-0.5">
          <span><b>Tôi vừa thanh toán hôm nay</b><br><span class="text-[11.5px] text-ink-400">Kỳ kế tiếp: ${formatDate(paidToday)} (${subCycleLabel(s).toLowerCase()} tính từ hôm nay).</span></span>
        </label>
        <label class="flex items-start gap-2.5 text-[12.5px] text-ink-700 dark:text-ink-200">
          <input type="radio" name="resumeMode" value="custom" class="w-4 h-4 mt-0.5">
          <span><b>Chọn ngày thanh toán kế tiếp</b></span>
        </label>
        <input id="resumeDate" type="date" value="${paidToday}" class="w-full px-3.5 py-2.5 rounded-xl card text-[13px] outline-none">
      </div>
      <label class="flex items-start gap-2.5 text-[12.5px] text-ink-700 dark:text-ink-200">
        <input type="checkbox" id="resumeLogPayment" class="w-4 h-4 rounded mt-0.5">
        <span>Ghi nhận luôn khoản thanh toán hôm nay <span class="text-ink-400">(trừ ${formatVND(s.amount)} khỏi số dư)</span></span>
      </label>
      <div class="flex justify-end gap-2.5 pt-1">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Bắt đầu lại</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  document.getElementById('resumeSubForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const mode = document.querySelector('input[name="resumeMode"]:checked').value;
    const date = mode === 'paid' ? paidToday : document.getElementById('resumeDate').value;
    if(document.getElementById('resumeLogPayment').checked){
      postSubscriptionOccurrence(s, todayISO());
    }
    resumeSubscription(s.id, date);
    closeModal();
  });
}

function resumeSubscription(id, nextDate){
  const s = DB.subscriptions.find(x=>x.id===id);
  if(!s) return;
  s.active = true;
  s.pausedAt = null;
  s.nextDate = nextDate || subNextDate(s, todayISO());
  saveDB(); refreshCurrentView();
  showToast('Đã bật lại ' + s.name + ' · kỳ tới ' + formatDate(s.nextDate), 'ok');
}

function deleteSubscription(id){
  confirmDelete('Xoá subscription này?', ()=>{
    DB.subscriptions = DB.subscriptions.filter(s=>s.id!==id);
    saveDB();
    refreshCurrentView();
    showToast('Đã xoá subscription', 'ok');
  });
}
</script>

<script>
/* ---------------------- 6f. RENDER: DEBT PAYOFF ---------------------- */
let debtStrategy = 'avalanche'; // 'avalanche' (lãi suất cao trước) hoặc 'snowball' (nợ nhỏ trước)
let chartNetWorth = null;

function simulateDebtPayoff(debts, extraPayment, strategy){
  if(debts.length === 0) return { months:0, schedule:[], totalInterest:0 };
  let balances = debts.map(d=>({ ...d, remaining: d.balance }));

  const order = [...balances].sort((a,b)=>{
    if(strategy === 'avalanche') return b.rate - a.rate;
    return a.remaining - b.remaining;
  }).map(d=>d.id);

  let month = 0;
  let totalInterest = 0;
  const schedule = []; // { month, payoffId, name }
  const maxMonths = 600;

  while(balances.some(b=>b.remaining > 0.5) && month < maxMonths){
    month++;
    let pool = extraPayment;
    // Trả lãi + trả tối thiểu cho tất cả
    balances.forEach(b=>{
      if(b.remaining <= 0) return;
      const interest = b.remaining * (b.rate/100/12);
      totalInterest += interest;
      b.remaining += interest;
      const pay = Math.min(b.minPayment, b.remaining);
      b.remaining -= pay;
    });
    // Dồn tiền dư vào nợ ưu tiên theo thứ tự chiến lược
    for(const id of order){
      const b = balances.find(x=>x.id===id);
      if(!b || b.remaining <= 0) continue;
      const pay = Math.min(pool, b.remaining);
      b.remaining -= pay;
      pool -= pay;
      if(pool <= 0) break;
    }
    balances.forEach(b=>{
      if(b.remaining <= 0.5 && !schedule.find(s=>s.id===b.id)){
        schedule.push({ id:b.id, name:b.name, month });
      }
    });
  }

  return { months: month, schedule, totalInterest };
}

      showToast('Đã cập nhật khoản nợ', 'ok');

      const debt = { id: uid('debt'), paidTotal:0, disbursed:false, ...data };

      DB.debts.push(debt);
      // ★ Nếu người dùng xác nhận vừa nhận tiền → cộng vào Số dư hiện tại

      }
    }
    saveDB();
    closeModal();
    refreshCurrentView();
  });
}

        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Nhận vào ví</button>

/* Trả nợ thủ công — dùng cho nợ linh hoạt, hoặc trả thêm ngoài kỳ */
function openManualDebtPayModal(debtId){
  const d = DB.debts.find(x => x.id === debtId);
  if(!d) return;
  const suggested = d.noSchedule ? Math.min(d.balance, getAvailableCash()) : Math.min(d.minPayment || d.balance, d.balance);
  openModal(`
    ${modalHeader('Trả nợ', d.name)}
    <form id="manualPayForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div class="surface-2 rounded-xl p-3 flex justify-between text-[12.5px]">
        <span class="text-ink-500 dark:text-ink-300">Dư nợ còn lại</span><span class="font-display font-700 tabnum">${formatVND(d.balance)}</span>
      </div>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Số tiền trả (₫)</label>
        <input id="manualPayAmount" type="text" inputmode="numeric" required value="${Math.max(0, suggested)}" class="money-input w-full px-3.5 py-3 rounded-xl surface-2 text-[17px] font-display font-700 outline-none tabnum">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ngày trả</label>
        <input id="manualPayDate" type="date" value="${todayISO()}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
      </div>
      ${accountSelectHtml('manualPayAcc', d.accountId, 'Trừ từ tài khoản')}
      <p id="manualPayWarn" class="text-[11.5px] text-warn-600 hidden"></p>
      <div class="flex justify-end gap-2.5 pt-1">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Ghi nhận trả nợ</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  const syncWarn = () => {
    const amt = parseMoneyInput('manualPayAmount');
    const acc = getAccount(document.getElementById('manualPayAcc').value);
    const w = checkMinBalanceBreach(acc, amt);
    const el = document.getElementById('manualPayWarn');
    el.textContent = w || '';
    el.classList.toggle('hidden', !w);
  };
  document.getElementById('manualPayAmount').addEventListener('input', syncWarn);
  document.getElementById('manualPayAcc').addEventListener('change', syncWarn);
  syncWarn();

  document.getElementById('manualPayForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const amt = parseMoneyInput('manualPayAmount');
    if(amt <= 0) return;
    payDebtOccurrence(d, document.getElementById('manualPayDate').value, amt);
    const accId = document.getElementById('manualPayAcc').value;
    // payDebtOccurrence dùng d.accountId; đảm bảo trừ đúng tài khoản người dùng chọn
    saveDB(); closeModal(); refreshCurrentView();
    showToast('Đã ghi nhận trả nợ ' + formatVND(amt), 'ok');
  });
}

/* ★ Nợ trả xong: tự chuyển sang trạng thái "đã tất toán".
   CỐ Ý KHÔNG XOÁ HẲN: các giao dịch trả nợ vẫn trỏ tới khoản này, xoá đi sẽ
   tạo giao dịch mồ côi và bạn mất luôn lịch sử đã trả bao nhiêu, trong bao lâu.
   Thay vào đó nó biến khỏi danh sách chính và nằm ở mục "Đã trả xong" thu gọn. */
function toggleSettledDebts(){
  DB.__showSettledDebts = !DB.__showSettledDebts;
  saveDB(); refreshCurrentView();
}
/* Mở lại một khoản đã tất toán (nhỡ tay, hoặc vay lại cùng người) */
function reopenDebt(id){
  const d = DB.debts.find(x => x.id === id);
  if(!d) return;
  d.settledAt = null;
  d.nextDueDate = computeInitialDebtDue(d);
  saveDB(); refreshCurrentView();
  showToast('Đã mở lại khoản nợ · hãy cập nhật dư nợ', 'info');
}

function settleDebt(d){
  if(!d || d.settledAt) return;
  d.balance = 0;
  d.settledAt = todayISO();
  d.autoPay = false;
  DB.pending = DB.pending.filter(p => p.refId !== d.id);
  showToast('🎉 Đã trả xong "' + d.name + '" · chuyển vào mục Đã trả xong', 'ok', 4200);
}
function activeDebts(){ return DB.debts.filter(d => !d.settledAt); }
function settledDebts(){ return DB.debts.filter(d => d.settledAt); }

function deleteDebt(id){
  confirmDelete('Xoá khoản nợ này?', ()=>{
    DB.debts = DB.debts.filter(d=>d.id!==id);
    saveDB();
    refreshCurrentView();
    showToast('Đã xoá khoản nợ', 'ok');
  });
}

/* ---------------------- 6g. RENDER: NET WORTH ---------------------- */
const ASSET_TYPE_LABELS = { cash:'Tiền mặt', saving:'Tiết kiệm', stock:'Cổ phiếu/Đầu tư', vehicle:'Xe cộ', property:'Bất động sản', other:'Khác' };
const ASSET_TYPE_ICONS = { cash:'💵', saving:'🏦', stock:'📈', vehicle:'🚗', property:'🏠', other:'📦' };

function renderNetworthView(){
  const container = document.getElementById('viewNetworth');
  // ★ Liên kết: tài sản = Số dư hiện tại + Tiết kiệm + Tài sản khai báo thủ công

    <div class="space-y-5 animate-fadeUp">

          <p class="text-[12px] font-semibold text-ink-400 uppercase tracking-wide">Tổng tài sản</p>

        </div>
        <div class="card rounded-xl2 p-5 shadow-card">
          <p class="text-[12px] font-semibold text-ink-400 uppercase tracking-wide">Tổng nợ</p>

        </div>

          <p class="text-[12px] font-semibold text-brand-100 uppercase tracking-wide">Tài sản ròng (Net Worth)</p>
          <p class="font-display font-800 text-2xl text-white mt-1.5 tabnum">${formatVND(netWorth)}</p>
        </div>
      </div>

      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Tăng trưởng tài sản ròng theo tháng</p>
        <div class="relative h-64">
          <canvas id="chartNetWorth"></canvas>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="card rounded-xl2 p-5 shadow-card">
          <div class="flex items-center justify-between mb-3">
            <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">Tài sản</p>
            <button onclick="openAssetModal()" class="text-[12px] font-semibold text-brand-600 hover:text-brand-700">+ Thêm</button>
          </div>
          <div class="space-y-2">
            ${DB.assets.length===0 ? `<p class="text-[12.5px] text-ink-400 text-center py-6">Chưa có tài sản nào</p>` : DB.assets.map(a=>`
              <div class="flex items-center gap-3 py-2 px-2 rounded-xl hover:bg-ink-50 dark:hover:bg-white/[0.04] group">
                <span class="text-lg shrink-0">${ASSET_TYPE_ICONS[a.type]||'📦'}</span>
                <div class="min-w-0 flex-1 overflow-hidden">
                  <p class="text-[13px] font-medium text-ink-800 dark:text-ink-100 tx-clamp2">${escapeHtml(a.name)}</p>
                  <p class="text-[11px] text-ink-400">${ASSET_TYPE_LABELS[a.type]||'Khác'}</p>
                </div>
                <p class="text-[13px] font-semibold text-ok-600 tabnum shrink-0 whitespace-nowrap">${formatVND(a.value)}</p>

                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>

          </div>
        </div>
        <div class="card rounded-xl2 p-5 shadow-card">
          <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Nợ</p>
          <div class="space-y-2">
            ${DB.debts.length===0 ? `<p class="text-[12.5px] text-ink-400 text-center py-6">Không có khoản nợ nào</p>` : DB.debts.map(d=>`
              <div class="flex items-center gap-3 py-2 px-2 rounded-xl">
                <span class="text-lg shrink-0">💳</span>
                <div class="min-w-0 flex-1 overflow-hidden">
                  <p class="text-[13px] font-medium text-ink-800 dark:text-ink-100 tx-clamp2">${escapeHtml(d.name)}</p>
                  <p class="text-[11px] text-ink-400">Lãi suất ${d.rate}%/năm</p>

/* Ghi lại lịch sử tài sản ròng theo tháng (được gọi từ view Tài sản ròng) */
function updateNetWorthHistory(currentNetWorth){
  const key = ymKey(new Date());
  const existing = DB.netWorthHistory.find(h=>h.ym===key);
  if(existing) existing.value = currentNetWorth;
  else DB.netWorthHistory.push({ ym:key, value: currentNetWorth });
  saveDB();
}

function renderNetWorthChart(){
  const ctx = document.getElementById('chartNetWorth');
  if(!ctx) return;
  if(chartNetWorth) chartNetWorth.destroy();

  const sorted = [...DB.netWorthHistory].sort((a,b)=>a.ym.localeCompare(b.ym));
  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,17,21,0.06)';
  const tickColor = isDark ? '#8D94A3' : '#6B7383';

  chartNetWorth = new Chart(ctx, {
    type: 'line',
    data: {
      labels: sorted.map(h=>{ const [y,m]=h.ym.split('-'); return `${MONTH_LABELS[Number(m)-1]}/${y.slice(2)}`; }),
      datasets: [{
        label:'Tài sản ròng', data: sorted.map(h=>h.value),
        borderColor:'#10B981', backgroundColor:'rgba(16,185,129,0.1)',
        fill:true, tension:0.35, pointRadius:3, pointBackgroundColor:'#10B981', pointBorderColor:'#fff', pointBorderWidth:2, borderWidth:2.5,
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label:(ctx)=>` ${formatVND(ctx.parsed.y)}` } } },
      scales:{
        x:{ grid:{ display:false }, ticks:{ color:tickColor, font:{size:11} } },
        y:{ grid:{ color:gridColor }, ticks:{ color:tickColor, font:{size:11}, callback:(v)=>formatVNDShort(v) } }
      }
    }
  });
}

function openAssetModal(){

      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Giá trị (₫)</label>

        </div>
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Loại</label>
          <select id="assetTypeInput" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
            ${Object.entries(ASSET_TYPE_LABELS).map(([k,v])=>`<option value="${k}">${ASSET_TYPE_ICONS[k]} ${v}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2.5 pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Thêm tài sản</button>
      </div>

  `, { width:'max-w-sm' });

  document.getElementById('assetForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    DB.assets.push({
      id: uid('asset'),
      name: document.getElementById('assetNameInput').value.trim(),
      value: parseMoneyInput('assetValueInput'),
      type: document.getElementById('assetTypeInput').value,
    });
    saveDB();
    closeModal();
    showToast('Đã thêm tài sản mới', 'ok');
    refreshCurrentView();
  });
}

function deleteAsset(id){
  confirmDelete('Xoá tài sản này?', ()=>{
    DB.assets = DB.assets.filter(a=>a.id!==id);
    saveDB();
    refreshCurrentView();
    showToast('Đã xoá tài sản', 'ok');
  });
}

<script>
/* ---------------------- 6h. RENDER: HABIT + MONEY TRACKER ---------------------- */
const HABIT_ICONS = ['🍳','🧋','🚌','🚴','🛒','💡','🚿','📵','☕','🥗','🧘','🎒'];

function renderHabitsView(){
  const container = document.getElementById('viewHabits');
  const todayStr = todayISO();
  const totalSavedThisMonth = DB.habits.reduce((sum,h)=>{
    const count = h.checkedDates.filter(d=>isSameMonth(d, currentViewMonth)).length;
    return sum + count * h.savePerCheck;
  }, 0);

  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">
      <div class="card rounded-xl2 p-5 shadow-card bg-gradient-to-br from-ok-500 to-ok-700 !border-transparent">
        <p class="text-[12px] font-semibold text-ok-100 uppercase tracking-wide">Đã tiết kiệm được từ thói quen (tháng này)</p>
        <p class="font-display font-800 text-2xl text-white mt-1.5 tabnum">${formatVND(totalSavedThisMonth)}</p>
      </div>

      <div class="flex items-center justify-between">
        <p class="text-[13px] text-ink-400">Đánh dấu mỗi khi bạn thực hiện thói quen tiết kiệm hôm nay.</p>
        <button onclick="openHabitModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-xl transition shrink-0">+ Thêm thói quen</button>
      </div>

      ${DB.habits.length === 0 ? `
        <div class="card rounded-xl2 p-10 shadow-card flex flex-col items-center text-center">
          <div class="empty-icon-wrap w-20 h-20 rounded-full flex items-center justify-center mb-4"><span class="text-4xl">🌱</span></div>
          <h3 class="font-display font-800 text-lg text-ink-900 dark:text-white">Chưa có thói quen nào</h3>
          <p class="text-[13px] text-ink-400 mt-1.5 max-w-sm">Thêm thói quen như "tự nấu ăn" hay "không mua trà sữa" để theo dõi số tiền tiết kiệm được.</p>
          <button onclick="openHabitModal()" class="mt-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-5 py-2.5 rounded-xl transition">+ Thêm thói quen đầu tiên</button>
        </div>
      ` : `
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        ${DB.habits.map(h=>renderHabitCard(h, todayStr)).join('')}
      </div>
      `}
    </div>
  `;
}

function renderHabitCard(h, todayStr){
  const checkedToday = h.checkedDates.includes(todayStr);
  const totalSaved = h.checkedDates.reduce((s)=>s+h.savePerCheck,0);
  const monthCount = h.checkedDates.filter(d=>isSameMonth(d, currentViewMonth)).length;

  // 7 ngày gần nhất mini-tracker
  const last7 = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const dStr = toLocalISO(d);
    last7.push({ date:dStr, checked: h.checkedDates.includes(dStr) });
  }

  return `
    <div class="card rounded-xl2 p-4 shadow-card">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-2.5">
          <span class="text-2xl">${h.icon}</span>
          <div>
            <p class="text-[13.5px] font-semibold text-ink-800 dark:text-ink-100">${escapeHtml(h.name)}</p>
            <p class="text-[11.5px] text-ink-400">Tiết kiệm ${formatVNDShort(h.savePerCheck)}/lần${h.linkedSavingId ? ' → ' + escapeHtml(((DB.savings.find(p=>p.id===h.linkedSavingId))||{}).name || '') : ''}</p>
          </div>
        </div>
        <button onclick="deleteHabit('${h.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-bad-50 hover:text-bad-500 dark:hover:bg-bad-500/10">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="flex items-center gap-1.5 mt-4">
        ${last7.map(d=>`
          <div class="flex-1 flex flex-col items-center gap-1">
            <span class="text-[9px] text-ink-300">${WEEKDAY_LABELS[new Date(d.date).getDay()]}</span>
            <div class="w-full aspect-square rounded-lg flex items-center justify-center ${d.checked ? 'bg-ok-500' : 'surface-2'}">
              ${d.checked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
            </div>
          </div>
        `).join('')}
      </div>

      <div class="flex items-center justify-between mt-3.5 pt-3.5 border-t border-ink-100/60 dark:border-white/[0.06]">
        <p class="text-[11.5px] text-ink-400">Tháng này: <span class="font-semibold text-ink-600 dark:text-ink-300">${monthCount} lần</span></p>
        <button onclick="toggleHabitToday('${h.id}')" class="px-3.5 py-2 rounded-xl text-[12.5px] font-semibold transition ${checkedToday ? 'bg-ok-50 dark:bg-ok-500/10 text-ok-600' : 'bg-brand-600 hover:bg-brand-700 text-white'}">
          ${checkedToday ? '✓ Đã làm hôm nay' : 'Đánh dấu hôm nay'}
        </button>
      </div>
    </div>
  `;
}

function toggleHabitToday(id){
  const h = DB.habits.find(x=>x.id===id);
  const todayStr = todayISO();
  const idx = h.checkedDates.indexOf(todayStr);
  if(idx >= 0){
    h.checkedDates.splice(idx,1);
    // ★ Liên kết: bỏ đánh dấu → hoàn tiền về số dư nếu trước đó đã chuyển vào gói tiết kiệm
    if(h.linkedSavingId){
      const log = DB.automationLog.find(l => l.kind==='habit' && l.refId===h.id && l.date===todayStr && l.status==='applied');
      if(log) undoAutomation(log.id);
    }
    showToast('Đã bỏ đánh dấu hôm nay', 'info');
  } else {
    h.checkedDates.push(todayStr);
    // ★ Liên kết: hoàn thành thói quen → chuyển tiền thật vào gói tiết kiệm
    if(h.linkedSavingId && DB.savings.some(p=>p.id===h.linkedSavingId && !p.closed)){
      depositToSavings(h.linkedSavingId, h.savePerCheck, {
        kind:'habit', date:todayStr, title:'Thói quen: ' + h.name + ' → tiết kiệm'
      });
      const pot = DB.savings.find(p=>p.id===h.linkedSavingId);
      // Ghi lại refId theo habit để có thể hoàn tác đúng bản ghi
      const last = DB.automationLog[0];
      if(last && last.kind==='habit') last.refId = h.id;
      showToast(`+${formatVND(h.savePerCheck)} đã vào gói ${pot.name}! 🎉`, 'ok');
    } else {
      showToast(`+${formatVND(h.savePerCheck)} tiết kiệm! 🎉`, 'ok');
    }
  }
  saveDB();
  refreshCurrentView();
}

/* ---------------------- 6i. RENDER: MEAL BUDGET PLANNER ---------------------- */
const MEAL_SLOTS = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];

function getCurrentWeekKey(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return `${d.getFullYear()}-W${week}`;
}

/* Ngân sách ăn uống theo TUẦN, suy ra từ ngân sách danh mục "Ăn uống".
   Một tháng trung bình có 30.44/7 = 4.35 tuần. */
function getWeeklyMealBudget(){
  const b = DB.budgets.find(x => x.category === 'an-uong');
  if(!b || !b.limit) return 0;
  return Math.round(b.limit / (30.44/7));
}

function renderMealsView(){
  const container = document.getElementById('viewMeals');
  const weekKey = getCurrentWeekKey();
  if(!DB.meals[weekKey]) DB.meals[weekKey] = MEAL_SLOTS.map(()=>({ dish:'', cost:0 }));
  const weekMeals = DB.meals[weekKey];
  const totalCost = weekMeals.reduce((s,m)=>s+(Number(m.cost)||0),0);
  // ★ Ngân sách tuần nay SUY RA từ ngân sách danh mục "Ăn uống" thay vì là
  //   một ô cài đặt riêng — trước đây hai chỗ nhập cùng một ý nghĩa, dễ lệch nhau.
  const budget = getWeeklyMealBudget();
  const pct = budget>0 ? (totalCost/budget*100) : 0;

  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">
      <div class="card rounded-xl2 p-5 shadow-card">
        <div class="flex items-center justify-between mb-1">
          <p class="text-[12px] font-semibold text-ink-400 uppercase tracking-wide">Chi phí thực đơn tuần này</p>
          <p class="text-[12px] text-ink-400">${budget>0
            ? `Ngân sách tuần: <span class="font-semibold text-ink-600 dark:text-ink-300 tabnum">${formatVND(budget)}</span> <button onclick="switchView('budget')" class="text-brand-600 font-semibold">(từ ngân sách Ăn uống)</button>`
            : `<button onclick="switchView('budget')" class="text-brand-600 font-semibold">Đặt ngân sách “Ăn uống” →</button>`}</p>
        </div>
        <p class="font-display font-800 text-2xl text-ink-900 dark:text-white tabnum">${formatVND(totalCost)}</p>
        <div class="progress-track h-2 mt-2.5">
          <div class="progress-fill ${pct>100?'bg-bad-500':pct>80?'bg-warn-500':'bg-ok-500'}" style="width:${clamp(pct,0,100)}%"></div>
        </div>
        ${pct>100 ? `<p class="text-[11.5px] text-bad-500 font-medium mt-1.5">⚠ Vượt ngân sách ăn uống ${formatVND(totalCost-budget)}</p>` : ''}
      </div>

      <div class="card rounded-xl2 shadow-card overflow-hidden">
        <div class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">
          ${MEAL_SLOTS.map((label,i)=>`
            <div class="flex items-center gap-3 p-3.5">
              <span class="text-[12px] font-semibold text-ink-400 w-16 shrink-0">${label}</span>
              <input type="text" placeholder="Món ăn dự định..." value="${escapeHtml(weekMeals[i].dish||'')}"
                oninput="updateMealDish(${i}, this.value)"
                class="flex-1 min-w-0 overflow-hidden px-3 py-2 rounded-lg surface-2 text-[13px] text-ink-800 dark:text-ink-100 placeholder:text-ink-300 outline-none focus:ring-2 focus:ring-brand-400">
              <input type="text" inputmode="numeric" placeholder="0" value="${weekMeals[i].cost ? Number(weekMeals[i].cost).toLocaleString('vi-VN') : ''}"
                oninput="updateMealCost(${i}, formatMoneyEventInput(this))"
                class="w-28 shrink-0 px-3 py-2 rounded-lg surface-2 text-[13px] text-right text-ink-800 dark:text-ink-100 outline-none focus:ring-2 focus:ring-brand-400 tabnum">
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function updateMealDish(index, value){
  const weekKey = getCurrentWeekKey();
  DB.meals[weekKey][index].dish = value;
  saveDB();
}
function updateMealCost(index, value){
  const weekKey = getCurrentWeekKey();
  DB.meals[weekKey][index].cost = Number(value) || 0;
  saveDB();
  // Cập nhật tổng mà không render lại toàn bộ input (tránh mất focus)
  const totalCost = DB.meals[weekKey].reduce((s,m)=>s+(Number(m.cost)||0),0);
  const budget = getWeeklyMealBudget();
  const pct = budget>0 ? (totalCost/budget*100) : 0;
  const card = document.querySelector('#viewMeals .card');
  if(card){
    card.querySelector('.font-display').textContent = formatVND(totalCost);
    const fill = card.querySelector('.progress-fill');
    fill.style.width = clamp(pct,0,100)+'%';
    fill.className = `progress-fill ${pct>100?'bg-bad-500':pct>80?'bg-warn-500':'bg-ok-500'}`;
  }
}
</script>

let chartYearlyStats = null;
function renderYearlyStatsChart(){
  const ctx = document.getElementById('chartYearlyStats');
  if(!ctx) return;
  if(chartYearlyStats) chartYearlyStats.destroy();

  const year = currentViewMonth.getFullYear();
  const monthlyIncome = new Array(12).fill(0);
  const monthlyExpense = new Array(12).fill(0);
  DB.transactions.forEach(t=>{
    const d = new Date(t.date);
    if(d.getFullYear() !== year) return;
    if(!isPL(t)) return;
    if(t.type==='income') monthlyIncome[d.getMonth()] += t.amount;
    else monthlyExpense[d.getMonth()] += t.amount;
  });

  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,17,21,0.06)';
  const tickColor = isDark ? '#8D94A3' : '#6B7383';

  chartYearlyStats = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: MONTH_LABELS,
      datasets: [
        { label:'Thu nhập', data: monthlyIncome, backgroundColor:'#10B981', borderRadius:5, barPercentage:0.65 },
        { label:'Chi tiêu', data: monthlyExpense, backgroundColor:'#F43F5E', borderRadius:5, barPercentage:0.65 },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', align:'end', labels:{ color:tickColor, boxWidth:10, font:{size:11}, usePointStyle:true, pointStyle:'circle' } },
        tooltip:{ callbacks:{ label:(ctx)=>` ${ctx.dataset.label}: ${formatVND(ctx.parsed.y)}` } } },
      scales:{
        x:{ grid:{ display:false }, ticks:{ color:tickColor, font:{size:11} } },
        y:{ grid:{ color:gridColor }, ticks:{ color:tickColor, font:{size:10.5}, callback:(v)=>formatVNDShort(v) } }
      }
    }
  });
}

/* ---------------------- Export / Import / Backup ---------------------- */
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportToJSON(){
  downloadFile(`moneyflow-backup-${todayISO()}.json`, JSON.stringify(DB, null, 2), 'application/json');
  showToast('Đã export dữ liệu ra JSON', 'ok');
}

function exportToCSV(){
  const header = ['Ngày','Loại','Danh mục','Số tiền','Ghi chú','Tags'];
  const rows = DB.transactions.map(t=>[
    t.date, t.type==='income'?'Thu nhập':'Chi tiêu', catMeta(t.category).label, t.amount, (t.note||'').replace(/,/g,' '), (t.tags||[]).join('|')
  ]);
  const csv = [header, ...rows].map(r=>r.join(',')).join('\n');
  downloadFile(`moneyflow-transactions-${todayISO()}.csv`, '\uFEFF'+csv, 'text/csv;charset=utf-8');
  showToast('Đã export giao dịch ra CSV', 'ok');
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      if(file.name.endsWith('.json')){
        const imported = JSON.parse(evt.target.result);
        if(!imported.transactions) throw new Error('invalid');
        DB = imported;
        showToast('Đã import dữ liệu thành công', 'ok');
        saveDBAndReinit(); // đợi ghi IndexedDB xong hẳn rồi mới nạp lại app — tránh đọc nhầm bản cũ
      } else if(file.name.endsWith('.csv')){
        const lines = evt.target.result.split('\n').filter(Boolean);
        const imported = [];
        for(let i=1;i<lines.length;i++){
          const [date, typeLabel, catLabel, amount, note] = lines[i].split(',');
          if(!date || !amount) continue;
          const type = typeLabel && typeLabel.includes('Thu') ? 'income' : 'expense';
          const catEntry = Object.entries(CATEGORY_ICONS).find(([,v])=>v.label===catLabel);
          imported.push({ type, category: catEntry?catEntry[0]:'khac', amount:Number(amount)||0, date: date.trim(), note: note||'', tags:['import'] });
        }
        // ★ Liên kết: mỗi dòng import cũng đi qua engine để số dư luôn khớp
        imported.forEach(t => postTransaction({ ...t, source:{ kind:'manual', id:null } }, { deferSave:true }));
        saveDB();
        showToast(`Đã import ${imported.length} giao dịch từ CSV`, 'ok');
        refreshCurrentView();
      }
    }catch(err){
      showToast('File không hợp lệ, vui lòng kiểm tra lại định dạng', 'bad');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function confirmResetData(){

// Sinh câu nhận xét ngắn dựa trên savings rate và tình hình ngân sách tháng
function generateMonthComment(income, expense, healthScore){
  const savingsRate = income > 0 ? (income - expense) / income : 0;
  if(income === 0 && expense === 0) return 'Chưa có dữ liệu tháng này.';
  if(savingsRate < 0) return 'Tháng này bạn chi nhiều hơn thu — cùng xem lại ngân sách nhé!';
  if(savingsRate < 0.1) return 'Bạn đã cân đối được thu chi, hãy thử tiết kiệm nhiều hơn một chút.';
  if(savingsRate < 0.3) return 'Tháng này bạn chi tiêu khá tốt! Tiếp tục duy trì nhé.';
  if(healthScore >= 80) return 'Xuất sắc! Đây là một tháng quản lý tài chính rất đáng tự hào 🎉';
  return 'Tuyệt vời! Bạn đang tiết kiệm rất hiệu quả tháng này.';
}

function getTopCategoriesThisMonth(limit=3){
  const monthTx = getMonthTransactions().filter(t=>t.type==='expense' && isPL(t));
  const byCategory = {};
  monthTx.forEach(t=>{ byCategory[t.category] = (byCategory[t.category]||0) + t.amount; });
  return Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).slice(0, limit);
}

        <span style="font-size:18px; font-weight:800; color:${d.healthScore>=60?'#10B981':d.healthScore>=40?'#F59E0B':'#F43F5E'};">${d.healthScore}<span style="font-size:11px; color:${d.textSub}; font-weight:600;">/100</span></span>
      </div>

      <p style="font-size:12.5px; font-weight:600; color:${d.textMain}; text-align:center; line-height:1.5; margin:0; padding:0 4px;">${escapeHtml(d.comment)}</p>
    </div>
  `;
}

// Render card ở độ phân giải cao (1080px width) ẩn ngoài màn hình, rồi dùng html2canvas
// để xuất PNG - tránh phụ thuộc vào kích thước card đang hiển thị trong modal (360px).
// Cập nhật dòng trạng thái trong modal thẻ tháng một cách an toàn: nếu modal đã bị đóng
// (người dùng bấm Esc/tap ra ngoài trong lúc ảnh đang render) thì phần tử không còn tồn
// tại trong DOM nữa - bỏ qua thay vì crash.
function setCardStatus(text){
  const statusEl = document.getElementById('cardStatusMsg');
  if(!statusEl) return;
  statusEl.classList.remove('hidden');
  statusEl.textContent = text;
}

async function exportMonthCard(mode, monthLabelCap){
  setCardStatus('Đang tạo ảnh...');

  const income = getMonthIncome();
  const expense = getMonthExpense();
  const balance = income - expense;
  const healthScore = computeFinancialHealthScore();
  const topCats = getTopCategoriesThisMonth(3);
  const comment = generateMonthComment(income, expense, healthScore);
  const isDark = document.documentElement.classList.contains('dark');
  const bg = isDark ? '#13161C' : '#FFFFFF';
  const bgGrad = isDark ? 'linear-gradient(160deg, #181C24 0%, #0F1115 100%)' : 'linear-gradient(160deg, #FFFFFF 0%, #F5F6F8 100%)';
  const textMain = isDark ? '#FFFFFF' : '#0F1115';
  const textSub = isDark ? '#8D94A3' : '#6B7383';
  const cardBorder = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(15,17,21,0.06)';
  const rowBg = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(15,17,21,0.03)';

  // Tạo container ẩn (off-screen), render card ở kích thước gốc 360px nhưng chụp với
  // scale:3 của html2canvas để xuất ảnh nét ở độ phân giải cao (~1080px chiều ngang).
  const hiddenWrap = document.createElement('div');
  hiddenWrap.style.cssText = 'position:fixed; left:-9999px; top:0; width:360px;';
  hiddenWrap.innerHTML = renderMonthCardHtml({ monthLabelCap, income, expense, balance, healthScore, topCats, comment, bg, bgGrad, textMain, textSub, cardBorder, rowBg });
  document.body.appendChild(hiddenWrap);

  try{
    const targetEl = hiddenWrap.firstElementChild;
    const canvas = await html2canvas(targetEl, {
      backgroundColor: bg,
      scale: 3, // xuất ảnh độ phân giải cao (~1080px chiều ngang từ card gốc 360px)
      useCORS: true,
      logging: false,
    });

    if(mode === 'download'){
      const link = document.createElement('a');
      link.download = `moneyflow-${monthLabelCap.replace(/\s+/g,'-').toLowerCase()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      setCardStatus('Đã tải ảnh về máy!');
      showToast('Đã tải thẻ tháng về máy', 'ok');
    } else {
      canvas.toBlob(async (blob)=>{
        try{
          if(navigator.clipboard && window.ClipboardItem){
            await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
            setCardStatus('Đã sao chép ảnh vào clipboard!');
            showToast('Đã sao chép ảnh vào clipboard', 'ok');
          } else {
            throw new Error('Clipboard API không khả dụng');
          }
        }catch(err){
          setCardStatus('Trình duyệt không hỗ trợ sao chép ảnh — hãy dùng "Tải ảnh về".');
          showToast('Không thể sao chép, hãy thử tải ảnh về', 'warn');
        }
      }, 'image/png');
    }
  }catch(err){
    setCardStatus('Có lỗi khi tạo ảnh, vui lòng thử lại.');
    showToast('Không thể tạo ảnh thẻ tháng', 'bad');
  }finally{
    document.body.removeChild(hiddenWrap);
  }
}
</script>

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 1 — DATA MODEL v2 & MIGRATION
   ----------------------------------------------------------------------
   Toàn bộ hệ thống xoay quanh CASH POSITION (số dư hiện tại):
       DB.accounts[]        → Tiền mặt + các tài khoản ngân hàng
       DB.savings[]         → Các gói tiết kiệm (có lãi suất, kỳ hạn)
       DB.recurring[]       → Thu/chi cố định (có chu kỳ + tự động)
       DB.subscriptions[]   → Dịch vụ đăng ký (tự động ghi nhận)
       DB.debts[]           → Nợ (trả định kỳ, tự trừ số dư)
       DB.allocationRules[] → Kịch bản phân bổ thu nhập
       DB.automationLog[]   → Lịch sử MỌI hành động tự động (có thể hoàn tác)
       DB.pending[]         → Việc đến hạn đang chờ người dùng xác nhận
   Mỗi transaction giờ mang thêm: accountId + source{kind,id}
   ====================================================================== */

const ACCOUNT_ICONS = ['💵','🏦','💳','📱','🪙','🏧'];
const SAVINGS_ICONS = ['🛟','🚗','✈️','🏠','📈','🎓','💍','🐷','🏝️','📱'];
const FREQ_LABELS = { weekly:'Hàng tuần', monthly:'Hàng tháng', quarterly:'Hàng quý', yearly:'Hàng năm' };

/* Cộng thêm 1 chu kỳ vào một ngày ISO */
function addCycle(dateISO, freq){
  const d = new Date(dateISO + 'T00:00:00');
  if(freq === 'weekly') d.setDate(d.getDate() + 7);
  else if(freq === 'quarterly') d.setMonth(d.getMonth() + 3);
  else if(freq === 'yearly') d.setFullYear(d.getFullYear() + 1);
  else d.setMonth(d.getMonth() + 1);
  return toLocalISO(d);
}
/* Lùi lại 1 chu kỳ (dùng khi hoàn tác một lần chạy tự động) */
function subCycle(dateISO, freq){
  const d = new Date(dateISO + 'T00:00:00');
  if(freq === 'weekly') d.setDate(d.getDate() - 7);
  else if(freq === 'quarterly') d.setMonth(d.getMonth() - 3);
  else if(freq === 'yearly') d.setFullYear(d.getFullYear() - 1);
  else d.setMonth(d.getMonth() - 1);
  return toLocalISO(d);
}
/* Dời một ngày ISO đi n ngày (dùng cho kịch bản "hoàn chậm N ngày") */
function shiftISO(iso, days){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + Number(days || 0));
  return toLocalISO(d);
}
function daysBetween(aISO, bISO){
  return Math.round((new Date(bISO+'T00:00:00') - new Date(aISO+'T00:00:00')) / 86400000);
}
function endOfMonthISO(ref = currentViewMonth){
  const y = ref.getFullYear(), m = ref.getMonth();
  return `${y}-${String(m+1).padStart(2,'0')}-${String(daysInMonth(y,m)).padStart(2,'0')}`;
}
function startOfMonthISO(ref = currentViewMonth){
  return `${ref.getFullYear()}-${String(ref.getMonth()+1).padStart(2,'0')}-01`;
}
/* Ngày trong tháng hiện tại của một khoản định kỳ theo dayOfMonth (kẹp vào ngày cuối tháng) */
function dayOfMonthISO(year, month, day){
  const dim = daysInMonth(year, month);
  return `${year}-${String(month+1).padStart(2,'0')}-${String(clamp(day,1,dim)).padStart(2,'0')}`;
}

/* ---------- MIGRATION: nâng cấp DB cũ lên model v2, giữ nguyên dữ liệu ---------- */
function migrateDB(){
  if(!DB) return;
  DB.settings = DB.settings || {};
  const S = DB.settings;

  /* ★ Đảm bảo MỌI mảng tồn tại TRƯỚC khi bất kỳ bước nào bên dưới dùng tới.
     Trước đây các dòng này nằm rải rác (một số ở "7b" — sau cả "7a"),
     nên khối 7a gọi DB.allocationRules.find() khi mảng còn undefined → crash. */
  DB.transactions    = Array.isArray(DB.transactions)    ? DB.transactions    : [];
  DB.budgets         = Array.isArray(DB.budgets)         ? DB.budgets         : [];
  DB.goals           = Array.isArray(DB.goals)           ? DB.goals           : [];
  DB.assets          = Array.isArray(DB.assets)          ? DB.assets          : [];
  DB.netWorthHistory = Array.isArray(DB.netWorthHistory) ? DB.netWorthHistory : [];
  DB.habits          = Array.isArray(DB.habits)          ? DB.habits          : [];
  DB.recurring       = Array.isArray(DB.recurring)       ? DB.recurring       : [];
  DB.subscriptions   = Array.isArray(DB.subscriptions)   ? DB.subscriptions   : [];
  DB.debts           = Array.isArray(DB.debts)           ? DB.debts           : [];
  DB.savingsPlans    = Array.isArray(DB.savingsPlans)    ? DB.savingsPlans    : [];
  DB.receivables     = Array.isArray(DB.receivables)     ? DB.receivables     : [];
  DB.allocationRules = Array.isArray(DB.allocationRules) ? DB.allocationRules : [];
  DB.automationLog   = Array.isArray(DB.automationLog)   ? DB.automationLog   : [];
  DB.pending         = Array.isArray(DB.pending)         ? DB.pending         : [];
  // v18.3: tiền rút từ tài khoản có độ trễ, đã rời nguồn nhưng chưa về đích
  DB.inTransit       = Array.isArray(DB.inTransit)       ? DB.inTransit       : [];
  if(!DB.meals || typeof DB.meals !== 'object') DB.meals = {};

  /* 1. Tài khoản — nguồn của Cash Position */
  if(!Array.isArray(DB.accounts)){
    DB.accounts = [];
    const legacyCash = (DB.assets || []).filter(a => a.type === 'cash');
    if(legacyCash.length){
      // Chuyển tài sản dạng "tiền mặt" cũ thành tài khoản thật để tránh đếm 2 lần
      legacyCash.forEach(a => DB.accounts.push({
        id: uid('acc'), name: a.name || 'Tiền mặt', icon:'💵', type:'cash', balance: a.value || 0
      }));
      DB.assets = DB.assets.filter(a => a.type !== 'cash');
    } else {
      DB.accounts.push({ id: uid('acc'), name:'Tiền mặt', icon:'💵', type:'cash', balance:0 });
      DB.accounts.push({ id: uid('acc'), name:'Ngân hàng', icon:'🏦', type:'bank', balance:0 });
    }
  }
  // v11: mức tối thiểu ngân hàng bắt duy trì
  // v12: tài khoản sinh lời tự động (MoMo Túi Thần Tài, ZaloPay Số dư sinh lời…)
  DB.accounts.forEach(a => {
    if(a.minBalance === undefined) a.minBalance = 0;
    if(a.earnEnabled === undefined) a.earnEnabled = false;
    if(a.earnRate === undefined) a.earnRate = 0;
    if(a.earnCompound === undefined) a.earnCompound = true;
    if(a.accruedInterest === undefined) a.accruedInterest = 0;
    if(!a.lastEarnAccrual) a.lastEarnAccrual = todayISO();
    // v18.3: rút tiền có độ trễ (T+1 ngày làm việc) → toàn bộ số dư không tính vào Free Cash
    if(a.delayedWithdraw === undefined) a.delayedWithdraw = false;
  });
  if(!S.defaultAccountId || !DB.accounts.some(a=>a.id===S.defaultAccountId)){
    S.defaultAccountId = DB.accounts[0] ? DB.accounts[0].id : null;
  }

  /* 2. Gói tiết kiệm — chuyển tài sản dạng "saving" cũ thành gói tiết kiệm */
  if(!Array.isArray(DB.savings)){
    DB.savings = [];
    (DB.assets || []).filter(a => a.type === 'saving').forEach(a => {
      DB.savings.push(newSavingsPot({ name: a.name || 'Sổ tiết kiệm', balance: a.value || 0, icon:'🐷' }));
    });
    DB.assets = (DB.assets || []).filter(a => a.type !== 'saving');
  }
  DB.savings.forEach(p => {
    if(p.autoMode === undefined) p.autoMode = 'none';
    if(p.autoValue === undefined) p.autoValue = 0;
    if(p.interestAccrued === undefined) p.interestAccrued = 0;
    if(!p.lastAccrual) p.lastAccrual = todayISO();
    if(p.closed === undefined) p.closed = false;
  });

  /* 3. Thu/chi cố định — thêm chu kỳ, tự động, tài khoản, nextDate */
  DB.recurring = DB.recurring || [];
  DB.recurring.forEach(r => {
    if(!r.freq) r.freq = 'monthly';
    if(r.autoCreate === undefined) r.autoCreate = true;
    if(r.active === undefined) r.active = true;
    if(!r.accountId) r.accountId = S.defaultAccountId;
    if(!r.dayOfMonth) r.dayOfMonth = 1;
    if(!r.skipList) r.skipList = [];          // danh sách kỳ bị bỏ qua (ISO date)
    if(r.allocationRuleId === undefined) r.allocationRuleId = null;
    // v10: khoản CHI cố định có thể đóng góp cho một mục tiêu
    if(r.goalId === undefined) r.goalId = null;
    // Mục tiêu đã bị xoá → gỡ liên kết mồ côi để tiến độ không trỏ vào hư không
    if(r.goalId && !DB.goals.some(g => g.id === r.goalId)) r.goalId = null;
    if(r.confirmBeforePost === undefined) r.confirmBeforePost = (r.type === 'income');
    if(!r.nextDate) r.nextDate = computeInitialNextDate(r);
  });

  /* 4. Subscription — tự động ghi nhận + cảnh báo trước */
  DB.subscriptions = DB.subscriptions || [];
  DB.subscriptions.forEach(s => {
    // v13: chu kỳ theo số ngày + trạng thái tạm dừng
    if(!SUB_CYCLES[s.cycle]) s.cycle = 'monthly';
    if(s.cycleDays === undefined) s.cycleDays = 30;
    if(s.pausedAt === undefined) s.pausedAt = null;
    if(s.autoCreate === undefined) s.autoCreate = true;
    if(!s.accountId) s.accountId = S.defaultAccountId;
    if(s.active === undefined) s.active = true;
    if(!s.alertDays) s.alertDays = 3;
  });

  /* 5. Nợ — có ngày đến hạn + tự động trả */
  DB.debts = DB.debts || [];
  DB.debts.forEach(d => {
    if(!d.dueDay) d.dueDay = 10;
    if(d.autoPay === undefined) d.autoPay = false;
    if(!d.accountId) d.accountId = S.defaultAccountId;
    if(!d.nextDueDate) d.nextDueDate = computeInitialDebtDue(d);
    if(d.paidTotal === undefined) d.paidTotal = 0;
    /* v11 — NỢ TRẢ LINH HOẠT.
       Trước đây form bắt buộc nhập "trả tối thiểu/tháng", nên nợ gia đình
       (trả khi nào có) bị nhập 1đ để lách. Hậu quả: mỗi tháng sinh một giao
       dịch 1đ và dự báo dòng tiền đầy rác.
       Một khoản 1đ/tháng trên dư nợ hàng triệu không thể là lịch trả thật,
       nên chuyển thẳng sang chế độ linh hoạt. minPayment cũ vẫn giữ nguyên
       để bạn sửa lại bất cứ lúc nào. */
    if(d.settledAt === undefined) d.settledAt = (d.balance <= 0 && (d.paidTotal||0) > 0) ? todayISO() : null;
    if(d.noSchedule === undefined){
      d.noSchedule = (!d.minPayment || d.minPayment < 1000) && d.balance > 0;
      if(d.noSchedule) d.autoPay = false;
    }
    // Nợ đã tồn tại từ trước: coi như tiền đã nhận rồi, TUYỆT ĐỐI không cộng
    // thêm vào số dư khi nâng cấp — nếu không mỗi lần mở app tiền sẽ tự nhân lên.
    if(d.disbursed === undefined) d.disbursed = true;
  });

  /* 6. Thói quen — có thể nối vào một gói tiết kiệm */
  DB.habits = DB.habits || [];
  DB.habits.forEach(h => { if(h.linkedSavingId === undefined) h.linkedSavingId = null; });

  /* 7a. Kế hoạch tiết kiệm định kỳ + hợp nhất cơ chế tự trích (model v3)
     Trước đây có 2 nơi cấu hình tự trích (autoMode trên gói + quy tắc phân bổ)
     → dễ hiểu nhầm là cộng dồn. Nay tách bạch:
       % thu nhập  → allocationRules
       tiền cố định → savingsPlans
     Cấu hình autoMode cũ được chuyển đổi tự động sang đúng trục của nó. */
  if(!Array.isArray(DB.savingsPlans)) DB.savingsPlans = [];
  DB.savings.forEach(p => {
    if(p.onMaturity === undefined) p.onMaturity = 'ask';
    if(p.planId === undefined) p.planId = null;
    if(p.targetPotId === undefined) p.targetPotId = null;
  });
  if(!DB.__autoModeMigrated){
    DB.savings.filter(p => p.autoMode && p.autoMode !== 'none' && p.autoValue > 0).forEach(p => {
      if(p.autoMode === 'fixed'){
        const first = new Date(); first.setMonth(first.getMonth() + 1); first.setDate(1);
        DB.savingsPlans.push({
          id: uid('plan'), name: 'Trích tự động → ' + p.name, mode:'accumulate', targetPotId: p.id,
          amount: p.autoValue, freq:'monthly', nextDate: toLocalISO(first),
          accountId: DB.settings.defaultAccountId, autoCreate:true, active:true,
          icon: p.icon || '🐷', rate:0, termMonths:0, onMaturity:'ask', namePattern:null,
          skipList:[], createdCount:0,
        });
      } else if(p.autoMode === 'percent'){
        let rule = DB.allocationRules.find(r => r.active) || DB.allocationRules[0];
        if(!rule){
          rule = { id: uid('alloc'), name:'Phân bổ mặc định', active:true, items:[] };
          DB.allocationRules.push(rule);
        }
        if(!rule.items.some(i => i.kind === 'savings' && i.targetId === p.id)){
          rule.items.push({ kind:'savings', targetId: p.id, percent: p.autoValue });
        }
      }
      p.autoMode = 'none'; p.autoValue = 0;
    });
    DB.__autoModeMigrated = true;
  }

  /* 7c. Khoản phải thu (ứng trước công ty / cho mượn) */
  if(!Array.isArray(DB.receivables)) DB.receivables = [];
  DB.receivables.forEach(r => {
    if(r.status === undefined) r.status = r.outstanding > 0 ? 'open' : 'settled';
    if(!Array.isArray(r.payments)) r.payments = [];
    if(r.confidence === undefined) r.confidence = 'high';
    if(r.outstanding === undefined) r.outstanding = r.principal || 0;
    // v6: khoản lẻ cũ giữ nguyên mode 'single'; đợt ứng theo lô dùng items[]
    if(!r.mode) r.mode = 'single';
    if(!Array.isArray(r.items)) r.items = [];
    if(r.submittedDate === undefined) r.submittedDate = null;
    if(r.mode === 'batch'){
      if(!r.claimPeriod) r.claimPeriod = (r.dateLent || todayISO()).slice(0,7);
      r.items.forEach(i => {
        if(i.reimbursed === undefined) i.reimbursed = 0;
        if(!i.status) i.status = 'pending';
        if(i.hasInvoice === undefined) i.hasInvoice = false;
      });
      recomputeBatch(r);   // luôn tính lại tổng từ items để không bao giờ lệch
    }
  });

  /* 7b. (allocationRules/automationLog/pending giờ đã đảm bảo ở đầu migrateDB — mục ★ trên) */

  /* 7d. ★ KHỐI LIÊN KẾT 27 — THEO DÕI DAO ĐỘNG THU NHẬP NHIỀU NGUỒN.
     Tách đúng 5 nguồn theo category có sẵn (lương/thưởng/đầu tư/thu nhập
     khác từ transactions, Chạy Be từ DB.gig.shifts) — KHÔNG gộp chung
     thành "việc chính" để tránh hiểu lầm thưởng/tiền mừng tuổi là lương
     đều đặn (góp ý của Quang). Khối này KHÔNG tạo lại dữ liệu thu nhập —
     chỉ tổng hợp những gì đã có sẵn theo tháng. Field mới:
       DB.settings.inflation = { mode:'off'|'manual'|'preset', monthly:{ 'YYYY-MM': percentNăm }, presetAnnual: percentNăm }
       DB.settings.dismissedAdviceIds = [] — id lời khuyên đã bấm "Bỏ qua",
         dùng chung cho TOÀN BỘ generateAdvice(), không riêng phần thu nhập. */
  /* v18.3 — Dự báo dòng tiền nhiều tháng:
       forecastHorizon   — số tháng dự báo (1 | 3 | 6 | 12), 1 = đến cuối tháng này như trước
       flexDailyOverride — tốc độ chi linh hoạt/ngày tự đặt; 0 = tự tính theo trung bình 90 ngày */
  if(![1,3,6,12].includes(S.forecastHorizon)) S.forecastHorizon = 1;
  if(!(S.flexDailyOverride >= 0)) S.flexDailyOverride = 0;

  if(!S.inflation){
    S.inflation = { mode:'off', monthly:{}, presetAnnual:4 };
  }
  if(!S.inflation.monthly) S.inflation.monthly = {};
  if(S.inflation.presetAnnual === undefined) S.inflation.presetAnnual = 4;
  if(!Array.isArray(S.dismissedAdviceIds)) S.dismissedAdviceIds = [];
  // Input tùy chọn cho cố vấn deal lương — Quang có thể để trống
  if(S.marketSalaryRef === undefined) S.marketSalaryRef = 0;      // mức lương thị trường tham khảo, tự nhập
  if(S.lastReviewRating === undefined) S.lastReviewRating = '';   // kết quả đánh giá KPI gần nhất, tự nhập (text ngắn)
  if(S.lastReviewDate === undefined) S.lastReviewDate = null;

  /* 8. Giao dịch cũ: gán tài khoản mặc định + nguồn "manual" */
  DB.transactions = DB.transactions || [];
  DB.transactions.forEach(t => {
    if(!t.accountId) t.accountId = S.defaultAccountId;
    if(!t.source) t.source = { kind: t.recurringId ? 'recurring' : 'manual', id: t.recurringId || null };
    if(t.excludeFromPL === undefined) t.excludeFromPL = false;
    if(t.noCash === undefined) t.noCash = false;
  });

  /* ★ v14 — Phân loại lại các giao dịch TRẢ NỢ cũ.
     Trước đây toàn bộ tiền trả nợ (cả gốc) bị ghi là chi tiêu, làm phồng
     chi tiêu tháng vì khoản vay lúc tiêu đã được ghi một lần rồi.
     Nay tách: phần gốc → excludeFromPL, phần lãi → giữ là chi phí.
     Phần gốc lấy từ automationLog (đã ghi delta dư nợ); nếu không có log
     mà khoản nợ không có lãi thì toàn bộ là gốc. Trường hợp không xác định
     được thì GIỮ NGUYÊN và báo trong mục Đối soát — thà để nguyên còn hơn đoán. */
  if(!DB.__debtPLMigrated){
    DB.transactions.forEach(t => {
      if(t.type !== 'expense' || !t.source || t.source.kind !== 'debt') return;
      if(t.excludeFromPL || t.category === 'lai-vay' || t.category === 'tra-no-goc') return;
      if(t.tags && t.tags.includes('mat-tien')) return;              // ghi nhận mất, là chi phí thật
      if(t.note && /Nhận tiền vay/i.test(t.note)) return;
      const log = DB.automationLog.find(l => (l.txIds||[]).includes(t.id));
      const eff = log && (log.effects||[]).find(e => e.target === 'debt');
      const debt = DB.debts.find(x => x.id === t.source.id);
      let principal = null;
      if(eff) principal = Math.min(t.amount, Math.abs(eff.delta));
      else if(debt && !(debt.rate > 0)) principal = t.amount;        // nợ không lãi → toàn bộ là gốc
      if(principal === null) return;                                  // không chắc thì để nguyên
      if(principal >= t.amount){
        t.excludeFromPL = true;
        t.category = 'tra-no-goc';
        t.note = t.note && !/gốc/i.test(t.note) ? t.note.replace(/^Trả nợ:/, 'Trả nợ gốc:') : t.note;
      } else {
        // Vừa gốc vừa lãi trong một giao dịch: giữ lại phần lãi ở giao dịch này,
        // tách phần gốc thành một giao dịch riêng KHÔNG đụng tới số dư.
        const interest = t.amount - principal;
        t.amount = interest;
        t.category = 'lai-vay';
        t.note = 'Lãi vay: ' + (debt ? debt.name : '');
        DB.transactions.push({
          id: uid('tx'), type:'expense', category:'tra-no-goc', amount: principal,
          date: t.date, note:'Trả nợ gốc: ' + (debt ? debt.name : ''), tags:['tra-no'],
          accountId: t.accountId, source:{ kind:'debt', id:t.source.id },
          excludeFromPL: true, noCash: true,     // tiền đã ra ở giao dịch gốc, không trừ lần nữa
        });
      }
    });
    DB.__debtPLMigrated = true;
  }

  /* 9. Cài đặt liên kết */
  if(S.safetyBuffer === undefined) S.safetyBuffer = 0;
  if(S.emergencyThreshold === undefined) S.emergencyThreshold = 0;
  if(S.autoRun === undefined) S.autoRun = true;
  if(S.forecastBurnDays === undefined) S.forecastBurnDays = 30;
  // Lãi suất không kỳ hạn — dùng khi rút tiết kiệm trước hạn (thông lệ ngân hàng VN)
  if(S.nonTermRate === undefined) S.nonTermRate = 0.5;
  // Ngưỡng "đáng chú ý" khi so sánh tháng — chỉnh trong Cài đặt
  if(S.compareMinDelta === undefined) S.compareMinDelta = 100000;
  if(S.compareMinPct === undefined) S.compareMinPct = 15;
  // Mốc bắt đầu dùng app — để Cố vấn không đòi dữ liệu của giai đoạn chưa tồn tại
  if(!S.startedAt){
    const ds = DB.transactions.map(t => t.date).filter(Boolean).sort();
    S.startedAt = ds.length ? ds[0] : todayISO();
  }

  // v15: module tài xế công nghệ
  if(typeof gigInit === 'function') gigInit();

  DB.__modelVersion = 3;
}

/* Tính nextDate lần đầu cho khoản cố định cũ (tránh tạo trùng giao dịch đã có) */
function computeInitialNextDate(r){
  const now = new Date();
  let iso = dayOfMonthISO(now.getFullYear(), now.getMonth(), r.dayOfMonth || 1);
  const appliedThisMonth = (DB.transactions || []).some(t =>
    (t.recurringId === r.id || (t.source && t.source.id === r.id)) && ymKey(t.date) === ymKey(now)
  );
  if(appliedThisMonth || iso < todayISO()) iso = addCycle(iso, r.freq || 'monthly');
  return iso;
}
function computeInitialDebtDue(d){
  const now = new Date();
  let iso = dayOfMonthISO(now.getFullYear(), now.getMonth(), d.dueDay || 10);
  if(iso < todayISO()) iso = addCycle(iso, 'monthly');
  return iso;
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 2 — CASH POSITION (trung tâm của toàn hệ thống)
   Mọi thay đổi tiền đều đi qua các hàm dưới đây để không bao giờ lệch số.
   ====================================================================== */

function getAccount(id){ return DB.accounts.find(a => a.id === id) || DB.accounts[0] || null; }
/* Số dư hiện tại = tiền trong mọi tài khoản + tiền ĐANG TRÊN ĐƯỜNG (v18.3).
   Tiền đang về đã rời tài khoản nguồn nhưng vẫn là tiền của bạn — nếu không
   cộng vào đây, Tổng tài sản / Tài sản ròng / dự báo sẽ tụt ảo trong 1–3 ngày
   chờ về. Free Cash vẫn loại nó ra (xem computeFreeCash). */
function getCashPosition(){
  return DB.accounts.reduce((s,a) => s + (a.balance || 0), 0) + getInTransitTotal();
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 28 — TÀI KHOẢN RÚT TIỀN CÓ ĐỘ TRỄ + TIỀN ĐANG TRÊN ĐƯỜNG
   ----------------------------------------------------------------------
   Một số ví (vd. ví tài xế) rút về ngân hàng không nhận ngay:
     rút Thứ 2–5 → nhận ngày hôm sau · rút Thứ 6, 7, CN → nhận Thứ 2.
   · Tài khoản bật delayedWithdraw: TOÀN BỘ số dư khả dụng không tính vào
     Free Cash (phải rút mới tiêu được) — vẫn tính vào Số dư & Tài sản ròng.
   · Chuyển khoản TỪ tài khoản đó: tiền rời nguồn ngay, nằm trong
     DB.inTransit tới ngày về, tự cộng vào đích khi tới ngày (settleInTransit).
   · Cố ý KHÔNG ghi vào nhật ký tự động: hoàn tác qua nhật ký sẽ chỉ đảo 1
     vế và làm tiền "nhân đôi" hoặc biến mất. Thay vào đó mỗi khoản đang về
     có nút riêng: Đã nhận / Đổi ngày / Huỷ.
   ====================================================================== */
function getPendingTransits(){ return (DB.inTransit || []).filter(t => t.status === 'pending'); }
function getInTransitTotal(){ return getPendingTransits().reduce((s,t) => s + (t.amount || 0), 0); }

/* Phần tiền nằm trong tài khoản rút chậm — không tiêu ngay được.
   Trừ phần tối thiểu ra vì phần đó Free Cash đã trừ qua getTotalMinBalance(),
   tránh trừ hai lần. */
function getDelayedAccountsHeld(){
  return DB.accounts.filter(a => a.delayedWithdraw)
    .reduce((s,a) => s + Math.max(0, (a.balance||0) - (a.minBalance||0)), 0);
}

/* Ngày tiền về theo quy tắc T+1 ngày làm việc:
   T2–T5 → hôm sau · T6 → T2 (+3) · T7 → T2 (+2) · CN → T2 (+1).
   Không biết ngày lễ — nên ô ngày về trong form luôn sửa tay được. */
function nextBusinessDayISO(iso){
  const d = new Date(iso + 'T12:00:00');
  const add = { 0:1, 1:1, 2:1, 3:1, 4:1, 5:3, 6:2 }[d.getDay()];
  d.setDate(d.getDate() + add);
  return toLocalISO(d);
}

function createInTransit(fromId, toId, amount, arriveDate, note){
  const amt = Math.round(Number(amount) || 0);
  const fromAcc = getAccount(fromId), toAcc = getAccount(toId);
  if(amt <= 0 || !fromAcc || !toAcc || fromId === toId) return null;
  adjustAccount(fromId, -amt);
  const rec = { id: uid('trn'), fromId, toId, amount: amt, note: note || '',
                createdDate: todayISO(), arriveDate, status: 'pending' };
  DB.inTransit.unshift(rec);
  saveDB();
  return rec;
}

/* Gọi mỗi lần app mở (đầu runAutomationEngine) — kể cả khi tắt chế độ tự
   chạy, vì tiền về là việc của ngân hàng, không phải của app. */
function settleInTransit(){
  const today = todayISO();
  let n = 0;
  getPendingTransits().forEach(t => {
    if(t.arriveDate > today) return;
    if(!getAccount(t.toId)){ return; } // đích đã bị xoá → giữ nguyên, người dùng tự xử lý
    adjustAccount(t.toId, t.amount);
    t.status = 'arrived'; t.arrivedDate = today; n++;
  });
  // Giữ lịch sử gọn: tối đa 60 khoản đã về gần nhất
  const done = DB.inTransit.filter(t => t.status !== 'pending');
  if(done.length > 60){
    const keep = new Set(done.slice(0, 60).map(t => t.id));
    DB.inTransit = DB.inTransit.filter(t => t.status === 'pending' || keep.has(t.id));
  }
  return n;
}

function markTransitArrived(id){
  const t = DB.inTransit.find(x => x.id === id && x.status === 'pending');
  if(!t) return;
  if(!getAccount(t.toId)){ showToast('Tài khoản đích không còn tồn tại', 'warn'); return; }
  adjustAccount(t.toId, t.amount);
  t.status = 'arrived'; t.arrivedDate = todayISO();
  saveDB(); refreshCurrentView();
  showToast('Đã ghi nhận tiền về ' + formatVND(t.amount), 'ok');
}

function cancelTransit(id){
  const t = DB.inTransit.find(x => x.id === id && x.status === 'pending');
  if(!t) return;
  confirmDelete(`Huỷ khoản rút ${formatVND(t.amount)}? Tiền sẽ được trả lại tài khoản nguồn.`, () => {
    if(getAccount(t.fromId)) adjustAccount(t.fromId, t.amount);
    t.status = 'cancelled';
    saveDB(); refreshCurrentView();
    showToast('Đã huỷ, tiền trả về tài khoản nguồn', 'ok');
  });
}

/* ★ SỐ DƯ TỐI THIỂU (v11)
   Nhiều ngân hàng buộc duy trì một mức tối thiểu; phần đó KHÔNG tiêu được.
   getCashPosition() vẫn là tiền thật đang có; getAvailableCash() mới là tiền
   thực sự dùng được. Free Cash trừ luôn phần này. */
function getTotalMinBalance(){
  return DB.accounts.reduce((s,a) => s + (a.minBalance || 0), 0);
}
function getAvailableCash(){
  return DB.accounts.reduce((s,a) => s + Math.max(0, (a.balance||0) - (a.minBalance||0)), 0);
}
function accountAvailable(acc){
  if(!acc) return 0;
  return Math.max(0, (acc.balance||0) - (acc.minBalance||0));
}
/* Các tài khoản đang nằm DƯỚI mức tối thiểu */
function getBreachedAccounts(){
  return DB.accounts.filter(a => (a.minBalance||0) > 0 && (a.balance||0) < a.minBalance);
}
/* Trả về câu cảnh báo nếu rút `amount` sẽ phá vỡ mức tối thiểu, ngược lại null */
function checkMinBalanceBreach(acc, amount){
  if(!acc || !acc.minBalance || amount <= 0) return null;
  const after = (acc.balance||0) - amount;
  if(after >= acc.minBalance) return null;
  return `${acc.name} phải duy trì tối thiểu ${formatVND(acc.minBalance)}. `
       + `Sau giao dịch này sẽ còn ${formatVND(after)}`
       + (after < 0 ? ' (âm tài khoản).' : `, thiếu ${formatVND(acc.minBalance - after)}.`)
       + ` Tối đa rút được: ${formatVND(accountAvailable(acc))}.`;
}
function getTotalSavings(){ return DB.savings.filter(p=>!p.closed).reduce((s,p) => s + (p.balance||0), 0); }
function getEmergencyBalance(){ return DB.savings.filter(p => p.isEmergency && !p.closed).reduce((s,p)=>s+(p.balance||0),0); }
function getTotalDebt(){ return DB.debts.reduce((s,d) => s + (d.balance||0), 0); }

/* Cộng/trừ trực tiếp vào một tài khoản (delta dương = tiền vào) */
function adjustAccount(accountId, delta){
  const acc = getAccount(accountId);
  if(!acc) return;
  acc.balance = Math.round((acc.balance || 0) + delta);
}

/* ---- ĐIỂM VÀO DUY NHẤT để tạo giao dịch: cập nhật Cash Position ngay lập tức ---- */
function postTransaction(tx, opts = {}){
  const t = {
    id: uid('tx'),
    type: tx.type,
    category: tx.category,
    amount: Math.round(Number(tx.amount) || 0),
    date: tx.date || todayISO(),
    note: tx.note || '',
    tags: tx.tags || [],
    accountId: tx.accountId || DB.settings.defaultAccountId,
    source: tx.source || { kind:'manual', id:null },
    // excludeFromPL: tiền đổi chỗ (ứng trước/được hoàn) — có đổi số dư, không phải thu/chi
    excludeFromPL: !!tx.excludeFromPL,
    // noCash: chỉ ghi nhận vào thu/chi, KHÔNG đụng số dư (vd: ghi nhận mất khoản phải thu)
    noCash: !!tx.noCash,
  };
  if(tx.recurringId) t.recurringId = tx.recurringId;   // giữ tương thích dữ liệu cũ
  DB.transactions.push(t);
  // → Liên kết 1: cập nhật số dư hiện tại NGAY LẬP TỨC
  if(!t.noCash) adjustAccount(t.accountId, t.type === 'income' ? t.amount : -t.amount);
  if(!opts.deferSave) saveDB();
  return t;
}

/* Gỡ giao dịch và hoàn lại số dư (dùng cho xoá / hoàn tác) */
function unpostTransaction(txId, opts = {}){
  const idx = DB.transactions.findIndex(t => t.id === txId);
  if(idx < 0) return null;
  const t = DB.transactions[idx];
  if(!t.noCash) adjustAccount(t.accountId, t.type === 'income' ? -t.amount : t.amount);
  DB.transactions.splice(idx, 1);
  if(!opts.deferSave) saveDB();
  return t;
}

/* Sửa giao dịch: đảo hiệu ứng cũ rồi áp hiệu ứng mới (số tiền / loại / tài khoản có thể đổi) */
function updateTransaction(txId, data){
  const t = DB.transactions.find(x => x.id === txId);
  if(!t) return;
  if(!t.noCash) adjustAccount(t.accountId, t.type === 'income' ? -t.amount : t.amount);
  Object.assign(t, data);
  t.amount = Math.round(Number(t.amount) || 0);
  if(!t.noCash) adjustAccount(t.accountId, t.type === 'income' ? t.amount : -t.amount);
  saveDB();
}

/* ---- Chuyển tiền nội bộ giữa 2 tài khoản (VD: rút ATM = Ngân hàng → Tiền mặt) ----
   KHÔNG tạo transaction income/expense để không thổi phồng báo cáo thu/chi tháng;
   chỉ điều chỉnh số dư 2 tài khoản + ghi automationLog để có lịch sử và hoàn tác được.
   Tổng Cash Position không đổi, nên Free Cash và dự báo cũng không đổi. */
function transferBetweenAccounts(fromId, toId, amount, note = ''){
  const amt = Math.round(Number(amount) || 0);
  if(amt <= 0 || !fromId || !toId || fromId === toId) return null;
  const fromAcc = getAccount(fromId), toAcc = getAccount(toId);
  if(!fromAcc || !toAcc) return null;
  adjustAccount(fromId, -amt);
  adjustAccount(toId, amt);
  const log = logAutomation({
    kind: 'transfer',
    amount: amt,
    title: `Chuyển khoản: ${fromAcc.icon} ${fromAcc.name} → ${toAcc.icon} ${toAcc.name}` + (note ? ' · ' + note : ''),
    effects: [
      { target:'account', id: fromId, delta: -amt },
      { target:'account', id: toId, delta: amt },
    ],
  });
  saveDB();
  return log;
}

function openTransferModal(){

      </div>
      <!-- v18.3: chỉ hiện khi tài khoản nguồn là loại rút tiền có độ trễ -->
      <div id="transferDelayBox" class="hidden rounded-xl p-3 bg-warn-50/60 dark:bg-warn-500/[0.08] border border-warn-300/50 dark:border-warn-500/30">
        <p class="text-[12px] font-semibold text-warn-700 dark:text-warn-300">⏳ Tài khoản này rút tiền có độ trễ</p>
        <p class="text-[11.5px] text-ink-500 dark:text-ink-300 mt-0.5 mb-2">Tiền sẽ nằm ở mục "Tiền đang về" và chưa tính vào Free Cash cho tới ngày nhận. Gặp ngày lễ thì sửa ngày cho đúng.</p>

        <input id="transferArriveInput" type="date" class="w-full px-3.5 py-2 rounded-xl surface-2 text-[13px] outline-none">
      </div>
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Ghi chú (tuỳ chọn)</label>
        <input id="transferNoteInput" type="text" placeholder="VD: Rút tiền ATM" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
      </div>

        <span>· Không làm thay đổi tổng Số dư hiện tại. Free Cash chỉ đổi khi có tài khoản rút chậm.</span>

  // Bật/tắt khung "độ trễ" theo tài khoản nguồn đang chọn

    box.classList.toggle('hidden', !on);
    const inp = document.getElementById('transferArriveInput');
    if(on && !inp.value) inp.value = nextBusinessDayISO(todayISO());
    if(on) inp.min = todayISO();
  };
  document.getElementById('transferFromAcc').addEventListener('change', syncDelayBox);

  document.getElementById('transferForm').addEventListener('submit', (e)=>{
    e.preventDefault();

    const toId = document.getElementById('transferToAcc').value;
    const amt = parseMoneyInput('transferAmountInput');
    const note = document.getElementById('transferNoteInput').value.trim();

    const arrive = (fromAcc && fromAcc.delayedWithdraw) ? document.getElementById('transferArriveInput').value : '';
