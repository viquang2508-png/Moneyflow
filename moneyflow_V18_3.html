    transferBetweenAccounts(fromId, toId, amt, note);
    closeModal(); refreshCurrentView();
    showToast('Đã chuyển ' + formatVND(amt), 'ok');
  });
}

function __swapTransferAccs(){
  const f = document.getElementById('transferFromAcc'), t = document.getElementById('transferToAcc');
  const tmp = f.value; f.value = t.value; t.value = tmp;
  f.dispatchEvent(new Event('change'));   // cập nhật khung "rút có độ trễ" theo nguồn mới
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 3 — NHẬT KÝ TỰ ĐỘNG (mọi hành động đều hoàn tác được)
   effects[] mô tả mọi thay đổi số dư để có thể đảo ngược chính xác.
   ====================================================================== */
function logAutomation(entry){
  const log = {
    id: uid('log'),
    ts: Date.now(),
    date: entry.date || todayISO(),
    kind: entry.kind,                 // recurring | subscription | debt | savings | allocation | habit | maturity | transfer
    title: entry.title || '',
    amount: entry.amount || 0,
    refId: entry.refId || null,
    txIds: entry.txIds || [],
    effects: entry.effects || [],     // [{target:'account'|'savings'|'debt', id, delta}]
    rollback: entry.rollback || null, // {type:'recurring'|'subscription'|'debt', id, prevDate}
    status: 'applied',
  };
  DB.automationLog.unshift(log);
  if(DB.automationLog.length > 400) DB.automationLog.length = 400;
  return log;
}

function applyEffects(effects, sign = 1){
  effects.forEach(e => {
    const d = e.delta * sign;
    if(e.target === 'account') adjustAccount(e.id, d);
    else if(e.target === 'savings'){
      const p = DB.savings.find(x => x.id === e.id);
      if(p) p.balance = Math.round((p.balance||0) + d);
    } else if(e.target === 'debt'){
      const dd = DB.debts.find(x => x.id === e.id);
      if(dd) dd.balance = Math.round((dd.balance||0) + d);
    } else if(e.target === 'goal'){
      const g = DB.goals.find(x => x.id === e.id);
      if(g) g.current = Math.round((g.current||0) + d);
    }
  });
}

/* Hoàn tác một hành động tự động: xoá giao dịch, đảo mọi hiệu ứng, lùi ngày đến hạn */
function undoAutomation(logId){
  const log = DB.automationLog.find(l => l.id === logId);
  if(!log || log.status !== 'applied') return;
  (log.txIds || []).forEach(id => {
    const idx = DB.transactions.findIndex(t => t.id === id);
    if(idx >= 0) DB.transactions.splice(idx, 1);   // hiệu ứng số dư nằm trong effects nên chỉ xoá bản ghi
  });
  applyEffects(log.effects || [], -1);
  // Hoàn tác việc MỞ GÓI mới từ kế hoạch bậc thang → xoá luôn gói đó
  if(log.createdPotId){
    DB.savings = DB.savings.filter(p => p.id !== log.createdPotId);
  }
  // Hoàn tác việc rút lãi → trả lãi về ô "chờ rút"
  if(log.earnClaim){
    const a = getAccount(log.earnClaim.accountId);
    if(a) a.accruedInterest = log.earnClaim.restore;
  }
  // Hoàn tác tạo khoản phải thu → xoá luôn hồ sơ
  if(log.createdReceivableId){
    DB.receivables = DB.receivables.filter(r => r.id !== log.createdReceivableId);
  }
  // Hoàn tác thêm một dòng chi trong đợt ứng → gỡ luôn dòng đó
  if(log.createdItem){
    const r = DB.receivables.find(x => x.id === log.createdItem.recvId);
    if(r){
      r.items = r.items.filter(i => i.id !== log.createdItem.itemId);
      recomputeBatch(r);
    }
  }
  // Hoàn tác ghi nhận tiền về / ghi nhận mất → khôi phục số còn phải thu
  if(log.recvSnapshot){
    const r = DB.receivables.find(x => x.id === log.recvSnapshot.id);
    if(r){
      r.outstanding = log.recvSnapshot.outstanding;
      r.status = log.recvSnapshot.status;
      r.payments = r.payments.slice(0, log.recvSnapshot.payments);
      // Khôi phục trạng thái từng dòng chi (đợt ứng theo lô)
      if(log.recvItemsSnapshot){
        log.recvItemsSnapshot.forEach(snapIt => {
          const it = r.items.find(x => x.id === snapIt.id);
          if(it){ it.reimbursed = snapIt.reimbursed; it.status = snapIt.status; }
        });
        recomputeBatch(r);
      }
    }
  }
  // Hoàn tác xử lý đáo hạn → khôi phục ngày bắt đầu / đáo hạn / trạng thái gói
  if(log.potSnapshot){
    const p = DB.savings.find(x => x.id === log.potSnapshot.id);
    if(p){
      p.startDate = log.potSnapshot.startDate;
      p.maturityDate = log.potSnapshot.maturityDate;
      p.matured = log.potSnapshot.matured;
      p.closed = log.potSnapshot.closed;
      p.interestAccrued = log.potSnapshot.interestAccrued;
      p.lastAccrual = log.potSnapshot.lastAccrual;
    }
  }
  if(log.rollback){
    const { type, id, prevDate } = log.rollback;
    if(type === 'recurring'){ const r = DB.recurring.find(x=>x.id===id); if(r) r.nextDate = prevDate; }
    if(type === 'subscription'){ const s = DB.subscriptions.find(x=>x.id===id); if(s) s.nextDate = prevDate; }
    if(type === 'debt'){ const d = DB.debts.find(x=>x.id===id); if(d) d.nextDueDate = prevDate; }
    if(type === 'savingsPlan'){ const pl = (DB.savingsPlans||[]).find(x=>x.id===id); if(pl) pl.nextDate = prevDate; }
  }
  log.status = 'undone';
  saveDB();
  showToast('Đã hoàn tác hành động tự động', 'ok');
  refreshCurrentView();
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 4 — ĐỘNG CƠ TỰ ĐỘNG
   Quét mọi khoản đến hạn (cố định, subscription, nợ) tính đến HÔM NAY.
   - autoCreate = true  → ghi nhận ngay + tạo log hoàn tác được
   - autoCreate = false → đẩy vào DB.pending chờ "Ghi nhận" / "Bỏ qua"
   ====================================================================== */
function runAutomationEngine(){
  settleInTransit();   // v18.3: tiền rút chậm tới ngày thì về — không phụ thuộc chế độ tự chạy
  if(!DB.settings.autoRun) return { applied:0, pending:0 };
  const today = todayISO();
  let applied = 0, pending = 0;
  const guard = 400; let steps = 0;

  /* --- 4.1 Thu / chi cố định --- */
  DB.recurring.forEach(r => {
    if(!r.active) return;
    while(r.nextDate && r.nextDate <= today && steps++ < guard){
      const due = r.nextDate;
      if((r.skipList || []).includes(due)){ r.nextDate = addCycle(due, r.freq); continue; }
      if(r.autoCreate && !r.confirmBeforePost){
        postRecurringOccurrence(r, due);
        applied++;
      } else {
        pushPending({ kind:'recurring', refId:r.id, dueDate:due, amount:r.amount, type:r.type,
                      name:r.note || catMeta(r.category).label, category:r.category });
        pending++;
      }
      r.nextDate = addCycle(due, r.freq);
    }
  });

  /* --- 4.2 Subscription --- */
  DB.subscriptions.forEach(s => {
    if(s.active === false) return;
    let n = s.nextDate;
    while(n && n <= today && steps++ < guard){
      if(s.autoCreate){
        postSubscriptionOccurrence(s, n);
        applied++;
      } else {
        pushPending({ kind:'subscription', refId:s.id, dueDate:n, amount:s.amount, type:'expense',
                      name:s.name, category:s.category });
        pending++;
      }
      n = subNextDate(s, n);
      s.nextDate = n;
    }
  });

  /* --- 4.3 Trả nợ định kỳ --- */
  DB.debts.forEach(d => {
    if(d.balance <= 0) return;
    if(d.noSchedule) return;   // trả khi nào có → không có kỳ để tự động chạy
    while(d.nextDueDate && d.nextDueDate <= today && steps++ < guard){
      const due = d.nextDueDate;
      if(d.autoPay){
        payDebtOccurrence(d, due);
        applied++;
      } else {
        pushPending({ kind:'debt', refId:d.id, dueDate:due, amount:Math.min(d.minPayment, d.balance),
                      type:'expense', name:'Trả nợ: ' + d.name, category:'khac' });
        pending++;
      }
      d.nextDueDate = addCycle(due, 'monthly');
    }
  });

  /* --- 4.4 Kế hoạch tiết kiệm định kỳ (mở gói mới / dồn vào gói tích lũy) --- */
  const planRes = runSavingsPlans(today);
  applied += planRes.applied; pending += planRes.pending;

  /* --- 4.5 Lãi tạm tính cho các gói tiết kiệm --- */
  accrueSavingsInterest();

  /* --- 4.5b Lãi sinh lời hàng ngày của tài khoản (chưa cộng vào số dư) --- */
  accrueAccountInterest();

  /* --- 4.6 Gói đến hạn: xử lý theo cài đặt onMaturity, hoặc chờ người dùng chọn --- */
  processMaturedPots(today);

  saveDB();
  return { applied, pending };
}

/* Thêm việc chờ xác nhận (chống trùng theo refId + dueDate) */
function pushPending(item){
  const exists = DB.pending.some(p => p.refId === item.refId && p.dueDate === item.dueDate);
  if(exists) return;
  DB.pending.push({ id: uid('pen'), createdAt: Date.now(), ...item });
}

/* ---- Ghi nhận 1 kỳ của khoản cố định (+ phân bổ nếu là thu nhập) ---- */
function postRecurringOccurrence(r, dueDate, overrideAmount, opts = {}){
  const amount = Math.round(overrideAmount != null ? overrideAmount : r.amount);
  // opts.accountId cho phép ghi vào tài khoản KHÁC với cấu hình mặc định,
  // mà không làm thay đổi cấu hình gốc của khoản cố định.
  const accountId = opts.accountId || r.accountId;
  const tx = postTransaction({
    type: r.type, category: r.category, amount, date: dueDate,
    note: r.note || catMeta(r.category).label, tags:['tu-dong','dinh-ky'],
    accountId, source:{ kind:'recurring', id:r.id }, recurringId: r.id
  }, { deferSave:true });

  const effects = [{ target:'account', id: tx.accountId, delta: r.type==='income' ? amount : -amount }];

  // ★ Liên kết mục tiêu: khoản CHI cố định đẩy tiến độ mục tiêu lên tương ứng.
  //   Đưa vào cùng mảng effects nên hoàn tác chạy đúng mà không cần code riêng.
  const goal = (r.type === 'expense' && r.goalId) ? DB.goals.find(g => g.id === r.goalId) : null;
  if(goal) effects.push(...buildGoalContributionEffects(goal.id, amount));

  const log = logAutomation({
    kind:'recurring', date: dueDate, refId: r.id, amount,
    title: (r.type==='income' ? 'Thu nhập cố định: ' : 'Chi cố định: ') + (r.note || catMeta(r.category).label)
           + (goal ? ' → mục tiêu ' + goal.name : ''),
    txIds:[tx.id], effects,
    rollback:{ type:'recurring', id:r.id, prevDate: dueDate }
  });

  if(goal){
    // effects của account đã được postTransaction áp dụng; phần goal áp ở đây
    applyEffects([{ target:'goal', id: goal.id, delta: amount }], 1);
    if(getGoalEffectiveCurrent(goal) >= goal.target && goal.target > 0){
      showToast('🎉 Mục tiêu "' + goal.name + '" đã hoàn thành!', 'ok', 4200);
    }
  }

  // → Liên kết: thu nhập cố định kích hoạt QUY TẮC PHÂN BỔ
  if(r.type === 'income') runAllocation(amount, r.allocationRuleId, dueDate, accountId, r.note);
  return log;
}

/* ---- Ghi nhận 1 kỳ subscription ---- */
function postSubscriptionOccurrence(s, dueDate){
  const tx = postTransaction({
    type:'expense', category:s.category, amount:s.amount, date:dueDate,
    note:'Subscription: ' + s.name, tags:['tu-dong','subscription'],
    accountId:s.accountId, source:{ kind:'subscription', id:s.id }
  }, { deferSave:true });
  return logAutomation({
    kind:'subscription', date:dueDate, refId:s.id, amount:s.amount,
    title:'Thanh toán ' + s.name, txIds:[tx.id],
    effects:[{ target:'account', id:tx.accountId, delta:-s.amount }],
    rollback:{ type:'subscription', id:s.id, prevDate:dueDate }
  });
}

/* ---- Giải ngân khoản vay: tiền vào ví, dư nợ đã có sẵn trong DB.debts ----
   KHÔNG phải khoản nợ nào cũng làm tăng tiền mặt, nên đây là một LỰA CHỌN:
     • Vay tiền mặt / chuyển khoản  → tiền vào ví ngay      (disbursed = true)
     • Dư nợ thẻ tín dụng, nợ mua trả góp một món đồ, hoặc
       khoản nợ CŨ đang khai báo lại → KHÔNG cộng tiền      (disbursed = false)
   Ghi log để có thể hoàn tác, và giao dịch mang excludeFromPL:
   tiền vay không phải THU NHẬP, nó chỉ là tiền đổi chỗ (ví ⇄ dư nợ). */
function disburseDebt(debtId, amount, opts = {}){
  const d = DB.debts.find(x => x.id === debtId);
  const amt = Math.round(Number(amount) || 0);
  if(!d || amt <= 0) return null;
  const accId = opts.accountId || d.accountId || DB.settings.defaultAccountId;
  const date = opts.date || todayISO();

  const tx = postTransaction({
    type:'income', category:'khac', amount: amt, date,
    note:'Nhận tiền vay: ' + d.name, tags:['vay','giai-ngan'],
    accountId: accId, source:{ kind:'debt', id:d.id }, excludeFromPL: true,
  }, { deferSave:true });

  const log = logAutomation({
    kind:'debt', date, refId:d.id, amount: amt,
    title:'Nhận tiền vay "' + d.name + '" → số dư hiện tại',
    txIds:[tx.id],
    effects:[{ target:'account', id: accId, delta: amt }],
  });
  log.disbursedDebtId = d.id;
  d.disbursed = true;
  if(!opts.deferSave) saveDB();
  return log;
}

/* ---- Trả nợ 1 kỳ: trừ số dư + giảm dư nợ + cộng lãi phát sinh ---- */
/* ★ TRẢ NỢ = HAI PHẦN KHÁC HẲN NHAU VỀ BẢN CHẤT (sửa ở v14)
   • Tiền GỐC: không phải chi tiêu. Đó là tiền đổi chỗ — ví giảm, dư nợ cũng
     giảm đúng bằng đó, tài sản ròng không đổi. Khoản tiền vay ngày trước bạn
     đã tiêu và ĐÃ được ghi vào chi tiêu rồi; ghi lại lần nữa lúc trả là
     đếm hai lần, thổi phồng chi tiêu tháng.
   • Tiền LÃI: đây mới là chi phí thật, tiền ra khỏi túi mà không đổi lại gì.
   Vì vậy tách thành hai giao dịch: gốc mang excludeFromPL, lãi là chi phí thường. */
function payDebtOccurrence(d, dueDate, overrideAmount, opts = {}){
  const monthlyInterest = Math.round(d.balance * (d.rate||0) / 100 / 12);
  const pay = Math.round(Math.min(overrideAmount != null ? overrideAmount : d.minPayment, d.balance + monthlyInterest));
  const interest = Math.min(monthlyInterest, pay);
  const principal = pay - interest;
  const accountId = opts.accountId || d.accountId;
  const txIds = [];

  if(principal > 0){
    const txP = postTransaction({
      type:'expense', category:'tra-no-goc', amount:principal, date:dueDate,
      note:'Trả nợ gốc: ' + d.name, tags:['tu-dong','tra-no'],
      accountId, source:{ kind:'debt', id:d.id }, excludeFromPL: true,
    }, { deferSave:true });
    txIds.push(txP.id);
  }
  if(interest > 0){
    const txI = postTransaction({
      type:'expense', category:'lai-vay', amount:interest, date:dueDate,
      note:'Lãi vay: ' + d.name, tags:['tu-dong','lai-vay'],
      accountId, source:{ kind:'debt', id:d.id },
    }, { deferSave:true });
    txIds.push(txI.id);
  }

  const effects = [
    { target:'account', id:accountId, delta:-pay },
    { target:'debt', id:d.id, delta:-principal }
  ];
  applyEffects([{ target:'debt', id:d.id, delta:-principal }], 1);
  d.paidTotal = (d.paidTotal||0) + pay;
  if(d.balance < 0) d.balance = 0;

  const log = logAutomation({
    kind:'debt', date:dueDate, refId:d.id, amount:pay,
    title:'Trả nợ ' + d.name + ' (gốc ' + formatVNDShort(principal) + ' / lãi ' + formatVNDShort(interest) + ')',
    txIds, effects,
    rollback:{ type:'debt', id:d.id, prevDate:dueDate }
  });

  // → Liên kết: trả hết nợ thì gợi ý chuyển dòng tiền đó sang tiết kiệm,
  //   và tự chuyển khoản nợ sang mục "đã trả xong" (không còn nằm ở danh sách chính)
  if(d.balance <= 0){
    DB.__debtJustCleared = { name:d.name, monthly:d.minPayment };
    settleDebt(d);
  }
  return log;
}

/* ---- Xử lý việc đang chờ ---- */
function confirmPending(pendingId, overrideAmount, overrideAccountId){
  const p = DB.pending.find(x => x.id === pendingId);
  if(!p) return;
  if(p.kind === 'recurring'){
    const r = DB.recurring.find(x => x.id === p.refId);
    // Tài khoản thực nhận có thể khác tài khoản đã cài sẵn (lương về ACB thay
    // vì Momo chẳng hạn) → phải tôn trọng lựa chọn tại thời điểm ghi nhận.
    if(r) postRecurringOccurrence(r, p.dueDate, overrideAmount, { accountId: overrideAccountId });
  } else if(p.kind === 'subscription'){
    const s = DB.subscriptions.find(x => x.id === p.refId);
    if(s) postSubscriptionOccurrence(s, p.dueDate);
  } else if(p.kind === 'debt'){
    const d = DB.debts.find(x => x.id === p.refId);
    if(d) payDebtOccurrence(d, p.dueDate, overrideAmount);
  } else if(p.kind === 'savingsPlan'){
    const pl = (DB.savingsPlans||[]).find(x => x.id === p.refId);
    if(pl) executeSavingsPlan(pl, p.dueDate, overrideAmount);
  }
  // Mục tạo tạm từ nút "Ghi nhận ngay": engine chưa đẩy kỳ nên phải tự đẩy
  if(p.__adhoc && p.kind === 'recurring'){
    const r = DB.recurring.find(x => x.id === p.refId);
    if(r && r.nextDate <= p.dueDate) r.nextDate = addCycle(p.dueDate, r.freq);
  }
  DB.pending = DB.pending.filter(x => x.id !== pendingId);
  saveDB();
  showToast('Đã ghi nhận · số dư đã cập nhật', 'ok');
  refreshCurrentView();
}
function skipPending(pendingId){
  const p = DB.pending.find(x => x.id === pendingId);
  if(!p) return;
  if(p.kind === 'recurring'){
    const r = DB.recurring.find(x => x.id === p.refId);
    if(r){ r.skipList = r.skipList || []; r.skipList.push(p.dueDate); }
  } else if(p.kind === 'savingsPlan'){
    const pl = (DB.savingsPlans||[]).find(x => x.id === p.refId);
    if(pl){ pl.skipList = pl.skipList || []; pl.skipList.push(p.dueDate); }
  }
  if(p.__adhoc){ DB.pending = DB.pending.filter(x => x.id !== pendingId); saveDB(); refreshCurrentView(); return; }
  DB.pending = DB.pending.filter(x => x.id !== pendingId);
  saveDB();
  showToast('Đã bỏ qua kỳ này', 'info');
  refreshCurrentView();
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 5 — TIẾT KIỆM & PHÂN BỔ THU NHẬP
   ====================================================================== */

/* Chuyển tiền từ Số dư hiện tại → gói tiết kiệm (có log, hoàn tác được) */
function depositToSavings(potId, amount, opts = {}){
  const p = DB.savings.find(x => x.id === potId);
  if(!p || amount <= 0) return null;
  const accId = opts.accountId || DB.settings.defaultAccountId;
  const effects = [
    { target:'account', id:accId, delta:-amount },
    { target:'savings', id:p.id, delta: amount }
  ];
  if(p.goalId && DB.goals.some(g=>g.id===p.goalId)) effects.push({ target:'goal', id:p.goalId, delta:amount });
  applyEffects(effects, 1);
  const log = logAutomation({
    kind: opts.kind || 'savings', date: opts.date || todayISO(), refId:p.id, amount,
    title: (opts.title || 'Trích tiết kiệm → ' + p.name), effects
  });
  if(!opts.deferSave) saveDB();
  return log;
}

/* Rút từ gói tiết kiệm → Số dư hiện tại */
function withdrawFromSavings(potId, amount, opts = {}){
  const p = DB.savings.find(x => x.id === potId);
  if(!p || amount <= 0) return null;
  amount = Math.min(amount, p.balance);
  // ★ Rút trước hạn: lãi được tính lại theo lãi suất KHÔNG kỳ hạn (thông lệ ngân hàng VN)
  let lostInterest = 0;
  if(isBeforeMaturity(p) && !opts.keepInterest){
    const early = estimateEarlyWithdrawInterest(p);
    lostInterest = Math.max(0, Math.round((p.interestAccrued||0) - early));
    p.interestAccrued = early;
  }
  const accId = opts.accountId || DB.settings.defaultAccountId;
  const effects = [
    { target:'savings', id:p.id, delta:-amount },
    { target:'account', id:accId, delta: amount }
  ];
  applyEffects(effects, 1);
  const log = logAutomation({
    kind:'savings', date: todayISO(), refId:p.id, amount,
    title: (opts.title || 'Rút từ ' + p.name + ' → số dư hiện tại')
           + (lostInterest > 0 ? ' (rút trước hạn, mất ' + formatVNDShort(lostInterest) + ' lãi)' : ''),
    effects
  });
  if(!opts.deferSave) saveDB();
  return log;
}

/* Lãi tạm tính theo ngày: balance × rate%/365 (cộng dồn vào interestAccrued) */
function accrueSavingsInterest(){
  const today = todayISO();
  DB.savings.forEach(p => {
    if(p.closed || !p.rate) { p.lastAccrual = today; return; }
    const days = daysBetween(p.lastAccrual || today, today);
    if(days <= 0) return;
    p.interestAccrued = Math.round((p.interestAccrued||0) + p.balance * (p.rate/100) * days / 365);
    p.lastAccrual = today;
  });
}
function estimateSavingsInterestToMaturity(p){
  if(!p.maturityDate || !p.rate) return 0;
  const days = Math.max(0, daysBetween(p.startDate || todayISO(), p.maturityDate));
  return Math.round(p.balance * (p.rate/100) * days / 365);
}

/* ---- QUY TẮC PHÂN BỔ: chia thu nhập vào tiết kiệm / trả nợ / chi tiêu tự do ---- */
function getActiveAllocationRule(ruleId){
  if(ruleId) return DB.allocationRules.find(r => r.id === ruleId) || null;
  return DB.allocationRules.find(r => r.active) || null;
}

function runAllocation(incomeAmount, ruleId, dateISO, accountId, sourceLabel){
  const rule = getActiveAllocationRule(ruleId);
  const results = [];

  if(rule){
    rule.items.forEach(item => {
      const amt = Math.round(incomeAmount * (item.percent||0) / 100);
      if(amt <= 0) return;
      if(item.kind === 'savings'){
        const log = depositToSavings(item.targetId, amt, {
          accountId, date:dateISO, kind:'allocation',
          title:'Phân bổ ' + item.percent + '% ' + (sourceLabel||'thu nhập') + ' → ' + (DB.savings.find(p=>p.id===item.targetId)||{}).name,
          deferSave:true
        });
        if(log) results.push(log);
      } else if(item.kind === 'debt'){
        const d = DB.debts.find(x => x.id === item.targetId);
        if(!d || d.balance <= 0) return;
        const pay = Math.min(amt, d.balance);
        const tx = postTransaction({
          type:'expense', category:'khac', amount:pay, date:dateISO,
          note:'Trả nợ (phân bổ): ' + d.name, tags:['tu-dong','phan-bo'],
          accountId, source:{ kind:'allocation', id:rule.id }
        }, { deferSave:true });
        const effects = [
          { target:'account', id:accountId, delta:-pay },
          { target:'debt', id:d.id, delta:-pay }
        ];
        applyEffects([{ target:'debt', id:d.id, delta:-pay }], 1);
        results.push(logAutomation({
          kind:'allocation', date:dateISO, refId:rule.id, amount:pay,
          title:'Phân bổ ' + item.percent + '% → trả nợ ' + d.name,
          txIds:[tx.id], effects
        }));
      }
      // kind === 'free' → giữ lại trong số dư, không cần thao tác
    });
  }
  // Không có kịch bản → KHÔNG tự trích gì cả. Việc trích số tiền cố định
  // theo lịch nay thuộc về "Kế hoạch tiết kiệm" (savingsPlans), tránh trùng nguồn.
  saveDB();
  return results;
}

/* Xử lý gói tiết kiệm đến hạn: tái tục / chuyển về số dư / chuyển sang gói khác */
/* Xử lý gói đến hạn. action: 'renew'|'renew-all' | 'renew-principal' | 'cash' | 'move'
   Mọi nhánh đều ghi snapshot để hoàn tác được từ Trung tâm tự động. */
function handleMaturity(potId, action, targetPotId, opts = {}){
  const p = DB.savings.find(x => x.id === potId);
  if(!p) return;
  const interest = Math.round(p.interestAccrued || 0);
  const accId = DB.settings.defaultAccountId;
  const date = opts.date || todayISO();
  const snap = {
    id: p.id, startDate: p.startDate, maturityDate: p.maturityDate,
    matured: !!p.matured, closed: !!p.closed,
    interestAccrued: p.interestAccrued, lastAccrual: p.lastAccrual,
  };
  let log = null;

  if(action === 'renew' || action === 'renew-all'){
    const effects = [{ target:'savings', id:p.id, delta: interest }];
    applyEffects(effects, 1);
    p.interestAccrued = 0; p.startDate = date; p.lastAccrual = date;
    p.maturityDate = p.termMonths ? addMonthsISO(date, p.termMonths) : null;
    p.matured = false;
    log = logAutomation({ kind:'maturity', date, refId:p.id, amount:interest,
      title:'Tái tục ' + p.name + ' · nhập lãi ' + formatVNDShort(interest) + ' vào gốc', effects });
    if(!opts.silent) showToast('Đã tái tục ' + p.name, 'ok');

  } else if(action === 'renew-principal'){
    const effects = [{ target:'account', id:accId, delta: interest }];
    applyEffects(effects, 1);
    p.interestAccrued = 0; p.startDate = date; p.lastAccrual = date;
    p.maturityDate = p.termMonths ? addMonthsISO(date, p.termMonths) : null;
    p.matured = false;
    log = logAutomation({ kind:'maturity', date, refId:p.id, amount:interest,
      title:'Tái tục gốc ' + p.name + ' · lãi ' + formatVNDShort(interest) + ' về số dư', effects });
    if(!opts.silent) showToast('Đã tái tục gốc, lãi về số dư', 'ok');

  } else if(action === 'cash'){
    const principal = p.balance;
    const total = Math.round(principal + interest);
    const effects = [
      { target:'savings', id:p.id, delta: -principal },
      { target:'account', id:accId, delta: total }
    ];
    applyEffects(effects, 1);
    p.interestAccrued = 0; p.matured = false; p.closed = true;
    log = logAutomation({ kind:'maturity', date, refId:p.id, amount:total,
      title:'Tất toán ' + p.name + ' → số dư (gốc ' + formatVNDShort(principal) + ' + lãi ' + formatVNDShort(interest) + ')', effects });
    if(!opts.silent) showToast('Đã chuyển ' + formatVND(total) + ' về số dư hiện tại', 'ok');

  } else if(action === 'move'){
    const target = DB.savings.find(x => x.id === targetPotId && !x.closed);
    if(!target){
      // Gói đích không còn → an toàn nhất là chuyển về số dư thay vì làm mất tiền
      if(!opts.silent) showToast('Gói đích không tồn tại, đã chuyển về số dư', 'warn');
      return handleMaturity(potId, 'cash', null, opts);
    }
    const total = Math.round(p.balance + interest);
    const effects = [
      { target:'savings', id:p.id, delta: -p.balance },
      { target:'savings', id:target.id, delta: total }
    ];
    applyEffects(effects, 1);
    p.interestAccrued = 0; p.matured = false; p.closed = true;
    log = logAutomation({ kind:'maturity', date, refId:p.id, amount:total,
      title:'Chuyển ' + p.name + ' → ' + target.name, effects });
    if(!opts.silent) showToast('Đã chuyển sang gói ' + target.name, 'ok');
  }

  if(log) log.potSnapshot = snap;
  saveDB();
  if(!opts.silent) refreshCurrentView();
}

function addMonthsISO(iso, months){
  const d = new Date(iso + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return toLocalISO(d);
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 6 — CÁC CHỈ SỐ DẪN XUẤT (Free Cash, giữ chỗ, dự báo)
   ====================================================================== */

/* Danh sách MỌI sự kiện tiền sắp tới trong khoảng [from, to] */
function getUpcomingEvents(fromISO, toISO){
  const events = [];

  DB.recurring.filter(r => r.active).forEach(r => {
    let n = r.nextDate;
    let guard = 0;
    while(n && n <= toISO && guard++ < 60){
      if(n >= fromISO && !(r.skipList||[]).includes(n)){
        events.push({ date:n, kind:'recurring', type:r.type, amount:r.amount,
                      name:r.note || catMeta(r.category).label, refId:r.id, icon: r.type==='income'?'💰':'📌' });
      }
      n = addCycle(n, r.freq);
    }
  });

  DB.subscriptions.filter(s => s.active !== false).forEach(s => {
    let n = s.nextDate; let guard = 0;
    while(n && n <= toISO && guard++ < 60){
      if(n >= fromISO) events.push({ date:n, kind:'subscription', type:'expense', amount:s.amount,
                                     name:s.name, refId:s.id, icon:s.icon || '📺' });
      n = subNextDate(s, n);
    }
  });

  // Nợ trả linh hoạt không có ngày đến hạn nên KHÔNG đưa vào dự báo —
  // đưa vào sẽ tạo nghĩa vụ ảo và làm sai cả cảnh báo dồn ngày.
  DB.debts.filter(d => d.balance > 0 && !d.noSchedule).forEach(d => {
    let n = d.nextDueDate; let guard = 0;
    while(n && n <= toISO && guard++ < 24){
      if(n >= fromISO) events.push({ date:n, kind:'debt', type:'expense', amount:Math.min(d.minPayment, d.balance),
                                     name:'Trả nợ ' + d.name, refId:d.id, icon:'💳' });
      n = addCycle(n, 'monthly');
    }
  });

  // (A) Trích tiết kiệm theo % thu nhập — từ kịch bản phân bổ đang áp dụng
  const rule = getActiveAllocationRule(null);
  if(rule){
    events.filter(e => e.kind === 'recurring' && e.type === 'income').forEach(inc => {
      rule.items.filter(i => i.kind === 'savings').forEach(i => {
        const amt = Math.round(inc.amount * (i.percent||0)/100);
        const pot = DB.savings.find(p => p.id === i.targetId);
        if(amt > 0 && pot) events.push({ date:inc.date, kind:'savings', type:'expense', amount:amt,
                                         name:'Trích ' + i.percent + '% → ' + pot.name, refId:pot.id, icon:'🐷' });
      });
    });
  }

  // (B) Trích tiết kiệm theo lịch cố định — từ các Kế hoạch tiết kiệm
  (DB.savingsPlans || []).filter(pl => pl.active).forEach(pl => {
    let n = pl.nextDate; let guard = 0;
    while(n && n <= toISO && guard++ < 60){
      if(n >= fromISO && !(pl.skipList||[]).includes(n)){
        events.push({ date:n, kind:'savings', type:'expense', amount:pl.amount,
                      name:(pl.mode==='ladder' ? 'Mở gói: ' + planPotName(pl, n) : 'Trích → ' + ((DB.savings.find(p=>p.id===pl.targetPotId)||{}).name || pl.name)),
                      refId:pl.id, icon:'🪜' });
      }
      n = addCycle(n, pl.freq);
    }
  });

  // (C) ★ ĐÁO HẠN TIẾT KIỆM — ảnh hưởng trực tiếp tới dự báo dòng tiền
  DB.savings.filter(p => !p.closed && p.maturityDate).forEach(p => {
    if(p.maturityDate < fromISO || p.maturityDate > toISO) return;
    const info = computePotInterest(p);
    const act = p.onMaturity || 'ask';
    if(act === 'to-cash'){
      events.push({ date:p.maturityDate, kind:'maturity', type:'income', amount:info.totalAtMaturity,
                    name:'Đáo hạn ' + p.name + ' (gốc + lãi)', refId:p.id, icon:'🔔' });
    } else if(act === 'renew-principal'){
      events.push({ date:p.maturityDate, kind:'maturity', type:'income', amount:info.totalInterest,
                    name:'Đáo hạn ' + p.name + ' — lãi về số dư', refId:p.id, icon:'🔔' });
    } else {
      // 'ask' / tái tục / chuyển gói: KHÔNG cộng vào dự báo (thận trọng),
      // nhưng vẫn hiện làm mốc để bạn thấy và quyết định.
      events.push({ date:p.maturityDate, kind:'maturity', type:'neutral', amount:info.totalAtMaturity,
                    name:'Đáo hạn ' + p.name + (act==='ask'?' — chờ bạn chọn':' — tự tái tục'), refId:p.id, icon:'🔔' });
    }
  });

  // (D) ★ KHOẢN PHẢI THU — tiền sắp quay lại ví
  //     Chỉ khoản CÓ NGÀY HẸN và mức chắc chắn 'high' mới được cộng vào dự báo.
  //     Khoản chưa hẹn ngày / khó đòi chỉ hiện làm mốc, không làm đẹp số dư giả.
  getOpenReceivables().forEach(r => {
    if(!r.expectedDate || r.expectedDate < fromISO || r.expectedDate > toISO) return;
    events.push({
      date: r.expectedDate, kind:'receivable',
      type: r.confidence === 'high' ? 'income' : 'neutral',
      amount: r.outstanding,
      name: 'Nhận lại: ' + r.name + (r.confidence === 'high' ? '' : ' (chưa chắc)'),
      refId: r.id, icon:'🧾'
    });
  });

  // Việc đang chờ xác nhận cũng là nghĩa vụ sắp phải trả
  DB.pending.forEach(p => {
    events.push({ date: p.dueDate < fromISO ? fromISO : p.dueDate, kind:'pending', type:p.type,
                  amount:p.amount, name:p.name + ' (chờ xác nhận)', refId:p.id, icon:'⏳' });
  });

  return events.sort((a,b) => a.date.localeCompare(b.date));
}

/* Tiền đã "giữ chỗ" cho phần còn lại của tháng (chi cố định + sub + nợ) */
function getReservedRemaining(){
  const today = todayISO();
  const end = endOfMonthISO(new Date());
  return getUpcomingEvents(today, end)
    .filter(e => e.type === 'expense' && e.kind !== 'savings')
    .reduce((s,e) => s + e.amount, 0);
}
/* Tiền đã lên kế hoạch trích tiết kiệm trong phần còn lại của tháng */
function getPlannedSavingsRemaining(){
  const today = todayISO();
  const end = endOfMonthISO(new Date());
  return getUpcomingEvents(today, end)
    .filter(e => e.kind === 'savings')
    .reduce((s,e) => s + e.amount, 0);
}

/* ★★ FREE CASH — con số quan trọng nhất trên Dashboard ★★ */
function computeFreeCash(){
  const cash = getCashPosition();
  const reserved = getReservedRemaining();
  const planned = getPlannedSavingsRemaining();
  const buffer = DB.settings.safetyBuffer || 0;
  // Phần bị ngân hàng khoá lại để duy trì tài khoản — không tiêu được
  const minReserve = getTotalMinBalance();
  // Khoản phải thu KHÔNG được cộng vào Free Cash: tiền chưa nằm trong tay bạn.
  // Nó chỉ đi kèm để hiển thị bối cảnh ("bạn còn X đang bị người khác giữ").
  const receivable = getTotalReceivables();
  // v18.3: tiền nằm trong tài khoản rút chậm + tiền đang trên đường chưa tiêu được ngay
  const delayed = getDelayedAccountsHeld();
  const transit = getInTransitTotal();
  return {
    cash, reserved, planned, buffer, minReserve, receivable, delayed, transit,
    free: Math.round(cash - reserved - planned - buffer - minReserve - delayed - transit)
  };
}

/* ======================================================================
   ★ DỰ BÁO DÒNG TIỀN NHIỀU THÁNG (v18.3)
   ----------------------------------------------------------------------
   Sửa lỗi cũ: tốc độ chi linh hoạt từng được tính = chi từ đầu tháng ÷ số
   ngày đã qua. Ngày 1 chi 3tr → app hiểu 3tr/ngày tới hết tháng. Nay tính
   theo TRUNG BÌNH 90 NGÀY gần nhất (hoặc số Quang tự đặt trong Cài đặt).
   ====================================================================== */

/* Tốc độ chi linh hoạt/ngày. Chi linh hoạt = chi nhập tay (không phải khoản
   tự động như chi cố định, subscription, trả nợ) — cùng tiêu chí như bản cũ. */
function getFlexDailyRate(opts){
  const override = (opts && opts.ignoreOverride) ? 0 : (Number(DB.settings.flexDailyOverride) || 0);
  if(override > 0) return { rate: override, source: 'override', days: 0, thin: false };
  const today = todayISO();
  const first = getFirstDataDate();
  const from = [shiftISO(today, -89), first].sort()[1];      // muộn hơn trong 2 mốc
  const days = Math.max(1, daysBetween(from, today) + 1);
  const spent = DB.transactions
    .filter(t => t.type === 'expense' && isPL(t) && t.date >= from && t.date <= today
              && (!t.source || t.source.kind === 'manual'))
    .reduce((s,t) => s + t.amount, 0);
  // Dưới 30 ngày dữ liệu: chia cho 30 để một khoản chi lớn đầu kỳ không bị
  // nhân lên thành "mỗi ngày đều chi như vậy". Có cờ thin để UI nói rõ.
  const denom = Math.max(days, 30);
  return { rate: spent / denom, source: 'avg', days, thin: days < 30 };
}

/* Thu nhập KHÔNG ĐỀU trung bình/ngày — dùng cho đường "kỳ vọng".
   = thu nhập thực nhận KHÔNG đến từ khoản thu cố định định kỳ và KHÔNG phải
   khoản phải thu (2 loại đó đã có trong lịch sự kiện, cộng nữa là đếm 2 lần).
   Lấy tối đa 3 tháng TRỌN VẸN gần nhất kể từ ngày bắt đầu dùng app. */
function getIrregularIncomeDailyRate(){
  const first = getFirstDataDate();
  const now = new Date();
  let total = 0, dayCount = 0, months = 0;
  for(let i = 1; i <= 3; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    if(toLocalISO(d) < first) break;            // tháng chưa dùng app trọn vẹn
    total += getMonthTransactions(d)
      .filter(t => t.type === 'income' && isPL(t)
                && !(t.source && (t.source.kind === 'recurring' || t.source.kind === 'receivable')))
      .reduce((s,t) => s + t.amount, 0);
    dayCount += daysInMonth(d.getFullYear(), d.getMonth());
    months++;
  }
  // Lương đang nhập tay thay vì khai là thu cố định → đường thận trọng sẽ thiếu lương.
  const hasRecurringIncome = DB.recurring.some(r => r.active && r.type === 'income');
  const salaryManual = !hasRecurringIncome && DB.transactions.some(t =>
    t.type === 'income' && t.category === 'luong' && t.date >= shiftISO(todayISO(), -92)
    && !(t.source && t.source.kind === 'recurring'));
  return { rate: dayCount ? total / dayCount : 0, months, monthlyAvg: dayCount ? Math.round(total / dayCount * 30) : 0, salaryManual };
}

/* Dự báo dòng tiền.
   scenario (tuỳ chọn) chỉ BIẾN ĐỔI tập sự kiện đầu vào, không đụng dữ liệu thật:
     delayReceivableDays — dời mọi khoản phải thu ra sau N ngày
     flexCutPct          — cắt bớt % tốc độ chi tiêu linh hoạt
     pauseSavings        — bỏ mọi khoản trích tiết kiệm trong kỳ
   opts.months: 1 (mặc định, đến cuối tháng này — giữ nguyên hành vi cũ cho
   mọi nơi đang gọi) | 3 | 6 | 12 — đến cuối tháng thứ N tính cả tháng này.
   Trả về 2 đường:
     balance  — THẬN TRỌNG: chỉ thu cố định + khoản phải thu chắc chắn
     expected — KỲ VỌNG: cộng thêm trung bình thu nhập không đều (Be, thưởng…) */
function computeCashflowForecast(scenario, opts){
  const sc = Object.assign({ delayReceivableDays:0, flexCutPct:0, pauseSavings:false }, scenario || {});
  const months = clamp(Math.round((opts && opts.months) || 1), 1, 12);
  const now = new Date();
  const today = todayISO();
  const end = endOfMonthISO(new Date(now.getFullYear(), now.getMonth() + months - 1, 1));
  let events = getUpcomingEvents(today, end);

  if(sc.delayReceivableDays > 0){
    // Khoản bị dời ra ngoài phạm vi dự báo thì biến mất — đó chính là thiệt hại
    events = events
      .map(e => e.kind === 'receivable' ? Object.assign({}, e, { date: shiftISO(e.date, sc.delayReceivableDays) }) : e)
      .filter(e => e.date <= end);
  }
  if(sc.pauseSavings) events = events.filter(e => e.kind !== 'savings');

  const flex = getFlexDailyRate();
  const rawBurn = flex.rate;
  const dailyBurn = rawBurn * (1 - clamp(sc.flexCutPct, 0, 100) / 100);
  const irregular = getIrregularIncomeDailyRate();

  const byDate = {};
  events.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });

  const buffer = DB.settings.safetyBuffer || 0;
  let balance = getCashPosition();
  let expected = balance;
  const days = [];
  let dangerDate = null, expectedDangerDate = null;
  let low = { balance: Infinity, date: today };

  for(let iso = today; iso <= end; iso = shiftISO(iso, 1)){
    const dayEvents = byDate[iso] || [];
    // 'neutral' = mốc chưa chắc chắn → không tác động tới số dư dự báo
    dayEvents.forEach(e => {
      const v = e.type === 'income' ? e.amount : e.type === 'expense' ? -e.amount : 0;
      balance += v; expected += v;
    });
    if(iso > today){                    // hôm nay đã tiêu rồi nên không trừ thêm
      balance -= dailyBurn;
      expected += irregular.rate - dailyBurn;
    }
    days.push({ date: iso, day: Number(iso.slice(8,10)), balance: Math.round(balance),
                expected: Math.round(expected), events: dayEvents });
    if(dangerDate === null && balance < buffer) dangerDate = iso;
    if(expectedDangerDate === null && expected < buffer) expectedDangerDate = iso;
    if(balance < low.balance) low = { balance: Math.round(balance), date: iso };
  }

  return { days, dailyBurn, rawBurn, flex, irregular, months, end,
           endBalance: Math.round(balance), endExpected: Math.round(expected),
           dangerDate, expectedDangerDate, low, events, scenario: sc };
}

/* Ngân sách thông minh: phần cứng (đã giữ chỗ) vs phần linh hoạt */
function computeSmartBudget(ref = currentViewMonth){
  const y = ref.getFullYear(), m = ref.getMonth();
  const monthStart = startOfMonthISO(ref), monthEnd = endOfMonthISO(ref);

  // Nghĩa vụ cố định của CẢ tháng (đã chi + sắp chi)
  const paidFixed = DB.transactions
    .filter(t => t.type === 'expense' && isPL(t) && t.date >= monthStart && t.date <= monthEnd &&
                 t.source && ['recurring','subscription','debt','allocation'].includes(t.source.kind))
    .reduce((s,t) => s + t.amount, 0);
  const upcomingFixed = getUpcomingEvents(todayISO() > monthStart ? todayISO() : monthStart, monthEnd)
    .filter(e => e.type === 'expense' && e.kind !== 'savings')
    .reduce((s,e) => s + e.amount, 0);
  const fixedTotal = paidFixed + upcomingFixed;

  const income = getMonthIncome(ref);
  const flexibleBudget = Math.max(0, income - fixedTotal);
  const flexibleSpent = DB.transactions
    .filter(t => t.type === 'expense' && isPL(t) && t.date >= monthStart && t.date <= monthEnd &&
                 (!t.source || t.source.kind === 'manual'))
    .reduce((s,t) => s + t.amount, 0);

  return { fixedTotal, paidFixed, upcomingFixed, income, flexibleBudget, flexibleSpent,
           flexibleLeft: flexibleBudget - flexibleSpent };
}

/* Tổng tiền trả nợ trong một tháng, tách rõ gốc và lãi.
   Gốc không nằm trong "chi tiêu" nên nếu chỉ nhìn báo cáo chi tiêu bạn sẽ
   không thấy nó — mục này để bù lại phần thông tin đó. */
function getMonthDebtPayments(ref = currentViewMonth){
  const start = startOfMonthISO(ref), end = endOfMonthISO(ref);
  let principal = 0, interest = 0;
  DB.transactions.forEach(t => {
    if(t.type !== 'expense' || t.date < start || t.date > end) return;
    if(!t.source || t.source.kind !== 'debt') return;
    if(t.category === 'lai-vay') interest += t.amount;
    else if(t.category === 'tra-no-goc' || t.excludeFromPL) principal += t.amount;
    else principal += t.amount;   // dữ liệu cũ chưa tách
  });
  return { principal, interest, total: principal + interest };
}

/* Cảnh báo liên module */
function getSystemAlerts(){
  const alerts = [];
  const fc = computeFreeCash();
  const emergency = getEmergencyBalance();
  const threshold = DB.settings.emergencyThreshold || 0;
  const forecast = computeCashflowForecast();
  const sb = computeSmartBudget(new Date());

  if(threshold > 0 && (fc.cash + emergency) < threshold){
    alerts.push({ level:'bad', icon:'🚨', title:'Quỹ khẩn cấp dưới ngưỡng an toàn',
      text:`Số dư + quỹ khẩn cấp (${formatVND(fc.cash + emergency)}) đang thấp hơn ngưỡng ${formatVND(threshold)}. Cân nhắc tạm dừng subscription hoặc giảm trích tiết kiệm tháng này.`,
      action:{ label:'Xem subscription', view:'subscriptions' } });
  }
  if(fc.free < 0){
    alerts.push({ level:'bad', icon:'⚠️', title:'Free Cash đang âm',
      text:`Sau khi giữ chỗ cho các khoản cố định và tiết kiệm, bạn đang thiếu ${formatVND(Math.abs(fc.free))}. Hãy hoãn một khoản trích hoặc bỏ qua một kỳ cố định.`,
      action:{ label:'Xem khoản cố định', view:'recurring' } });
  }
  const crunch = detectCashCrunchClusters(forecast).filter(c => c.level === 'bad');
  if(crunch.length){
    const c = crunch[0];
    alerts.push({ level:'bad', icon:'📅', title:`Ngày ${formatDate(c.date)} dồn ${c.count} khoản, tổng ${formatVND(c.total)}`,
      text:`Dự kiến chỉ có ${formatVND(c.available)} trong tay ngày hôm đó — thiếu ${formatVND(c.shortfall)}. Gồm: ${c.events.slice(0,3).map(e=>e.name).join(', ')}${c.events.length>3?'…':''}.`,
      action:{ label:'Xem chi tiết', view:'dashboard' } });
  }
  if(forecast.dangerDate){
    alerts.push({ level:'warn', icon:'🔥', title:'Ngày có nguy cơ cháy túi: ' + formatDate(forecast.dangerDate),
      text:`Theo lịch thu/chi sắp tới và tốc độ chi tiêu hiện tại (${formatVND(forecast.dailyBurn)}/ngày), số dư sẽ chạm ngưỡng an toàn vào ngày này.`,
      action:{ label:'Xem dự báo', view:'dashboard' } });
  }
  if(sb.flexibleLeft < 0){
    alerts.push({ level:'warn', icon:'📉', title:'Vượt ngân sách linh hoạt',
      text:`Bạn đã tiêu vượt ${formatVND(Math.abs(sb.flexibleLeft))} so với phần linh hoạt còn lại sau khi giữ chỗ chi cố định.`,
      action:{ label:'Xem ngân sách', view:'budget' } });
  }
  const accrued = getTotalAccruedInterest();
  if(accrued >= 50000){
    alerts.push({ level:'ok', icon:'💰', title:'Có ' + formatVND(accrued) + ' tiền lãi đang chờ rút',
      text:'Lãi sinh lời chưa được cộng vào số dư. Bấm “Rút lãi” ở thẻ Lãi sinh lời để đưa vào ví.',
      action:{ label:'Xem', view:'dashboard' } });
  }

  if(DB.gig && DB.gig.shifts && DB.gig.shifts.length){
    const overdue = gigBonusLedger().filter(x => x.state === 'overdue');
    if(overdue.length){
      alerts.push({ level:'warn', icon:'🏆', title:overdue.length + ' tuần thưởng Be quá hạn chưa xác nhận · ' + formatVND(overdue.reduce((s,x)=>s+x.expected,0)),
        text:'Đã qua thứ Ba mà bạn chưa đánh dấu tiền về. Kiểm tra ví Be — nếu thiếu, khiếu nại trong 30 ngày.',
        action:{ label:'Sổ thưởng', view:'gig' } });
    }
  }

  const breached = getBreachedAccounts();
  if(breached.length){
    alerts.push({ level:'bad', icon:'🏦', title: breached.length + ' tài khoản đang dưới số dư tối thiểu',
      text: breached.map(a => `${a.name}: ${formatVND(a.balance)} / cần ${formatVND(a.minBalance)}`).join(' · ')
            + '. Ngân hàng có thể thu phí hoặc khoá dịch vụ — hãy nạp bù phần thiếu.',
      action:{ label:'Xem tài khoản', view:'dashboard' } });
  }

  const flexDebt = DB.debts.filter(d => d.noSchedule && d.balance > 0);
  if(flexDebt.length){
    alerts.push({ level:'info', icon:'🤝', title: flexDebt.length + ' khoản nợ trả linh hoạt · ' + formatVND(flexDebt.reduce((s,d)=>s+d.balance,0)),
      text:'Các khoản này không có kỳ cố định nên không nằm trong dự báo dòng tiền. Chúng vẫn là nợ thật và đã trừ vào Tài sản ròng.',
      action:{ label:'Xem nợ', view:'debt' } });
  }

  const overdueRecv = getOverdueReceivables();
  if(overdueRecv.length){
    const t = overdueRecv.reduce((s,r)=>s+r.outstanding,0);
    alerts.push({ level:'warn', icon:'🧾', title:overdueRecv.length + ' khoản phải thu đã quá hạn · ' + formatVND(t),
      text:'Quá ngày hẹn mà tiền chưa về: ' + overdueRecv.slice(0,3).map(r=>r.name).join(', ') + '. Nhắc bên nợ hoặc dời ngày hẹn để dự báo dòng tiền không bị sai.',
      action:{ label:'Xem', view:'receivables' } });
  }
  const staleRecv = getOpenReceivables().filter(r => !r.expectedDate && receivableAgeDays(r) >= 60);
  if(staleRecv.length){
    alerts.push({ level:'info', icon:'⏳', title:staleRecv.length + ' khoản chưa hẹn ngày, đã quá 60 ngày',
      text:'Tiền bị giam lâu mà không có mốc thu hồi. Đặt một ngày hẹn, hoặc hạ mức chắc chắn xuống "Khó đòi" cho thực tế.',
      action:{ label:'Xem', view:'receivables' } });
  }
  const recvTotal = getTotalReceivables();
  if(recvTotal > 0 && fc.cash > 0 && recvTotal / (fc.cash + recvTotal) >= 0.3){
    alerts.push({ level:'warn', icon:'⚖️', title:'Tiền lỏng đang tập trung ở người khác',
      text:Math.round(recvTotal/(fc.cash+recvTotal)*100) + '% tiền lỏng của bạn (' + formatVND(recvTotal) + ') đang nằm ở khoản ứng trước / cho mượn. Free Cash vì thế thấp hơn cảm giác thực tế.',
      action:{ label:'Xem', view:'receivables' } });
  }

  const maturingSoon = DB.savings.filter(p => !p.closed && p.maturityDate &&
      daysBetween(todayISO(), p.maturityDate) >= 0 && daysBetween(todayISO(), p.maturityDate) <= 7);
  if(maturingSoon.length){
    const total = maturingSoon.reduce((s,p)=> s + computePotInterest(p).totalAtMaturity, 0);
    alerts.push({ level:'info', icon:'🔔', title:maturingSoon.length + ' gói tiết kiệm đáo hạn trong 7 ngày',
      text:'Tổng gốc + lãi ' + formatVND(total) + '. Gói để chế độ "Hỏi tôi" chưa được tính vào dự báo dòng tiền cho tới khi bạn chọn hướng xử lý.',
      action:{ label:'Xử lý', view:'savings' } });
  }
  if(DB.savings.some(p => p.matured && !p.closed)){
    alerts.push({ level:'warn', icon:'⏰', title:'Có gói đã đáo hạn đang chờ quyết định',
      text:'Tiền đang nằm im, chưa sinh lãi theo kỳ hạn mới. Chọn Tái tục / Về số dư / Chuyển gói.',
      action:{ label:'Chọn ngay', view:'savings' } });
  }
  if(DB.pending.length > 0){
    alerts.push({ level:'info', icon:'⏳', title:DB.pending.length + ' khoản đến hạn chờ xác nhận',
      text:'Các khoản này chưa trừ vào số dư nhưng đã được giữ chỗ trong dự báo.',
      action:{ label:'Xử lý ngay', view:'automation' } });
  }
  if(DB.__debtJustCleared){
    const c = DB.__debtJustCleared;
    alerts.push({ level:'ok', icon:'🎉', title:'Đã trả xong nợ: ' + c.name,
      text:`Bạn vừa giải phóng ${formatVND(c.monthly)}/tháng. Chuyển dòng tiền này sang một gói tiết kiệm để không "bốc hơi" vào chi tiêu.`,
      action:{ label:'Tới Tiết kiệm', view:'savings' } });
  }
  return alerts;
}

  const earnChk = document.getElementById('accEarnEnabled');
  if(earnChk) earnChk.addEventListener('change', ()=>{
    document.getElementById('accEarnWrap').classList.toggle('hidden', !earnChk.checked);
  });

  document.getElementById('accForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const newBalance = parseMoneyInput('accBalance');
    const data = {
      icon: document.getElementById('accIcon').value,
      name: document.getElementById('accName').value.trim(),
      type: document.getElementById('accType').value,
      minBalance: Math.max(0, parseMoneyInput('accMinBalance')),
      earnEnabled: document.getElementById('accEarnEnabled').checked,
      earnRate: clamp(Number(document.getElementById('accEarnRate').value)||0, 0, 100),
      earnCompound: document.getElementById('accEarnCompound').checked,
      delayedWithdraw: document.getElementById('accDelayed').checked,
    };
    if(editing){
      const diff = newBalance - editing.balance;
      Object.assign(editing, data);
      if(diff !== 0){
        editing.balance = newBalance;
        // Ghi lịch sử để không "mất dấu" tiền khi đối soát thủ công
        logAutomation({ kind:'transfer', refId:editing.id, amount:Math.abs(diff),
          title:'Đối soát số dư ' + editing.name + ' (' + (diff>0?'+':'−') + formatVND(Math.abs(diff)) + ')',
          effects:[{ target:'account', id:editing.id, delta:diff }] });
      }
      if(document.getElementById('accDefault').checked) DB.settings.defaultAccountId = editing.id;
      showToast('Đã cập nhật tài khoản', 'ok');
    } else {
      const acc = { id: uid('acc'), balance: newBalance, accruedInterest:0, lastEarnAccrual: todayISO(), ...data };
      DB.accounts.push(acc);
      if(document.getElementById('accDefault').checked) DB.settings.defaultAccountId = acc.id;
      showToast('Đã thêm tài khoản', 'ok');
    }
    saveDB(); closeModal(); refreshCurrentView();
  });
}

function deleteAccount(id){
  if(DB.accounts.length <= 1){ showToast('Cần giữ lại ít nhất 1 tài khoản', 'warn'); return; }
  confirmDelete('Xoá tài khoản này? Các giao dịch cũ sẽ được chuyển sang tài khoản mặc định.', ()=>{
    DB.accounts = DB.accounts.filter(a => a.id !== id);
    if(DB.settings.defaultAccountId === id) DB.settings.defaultAccountId = DB.accounts[0].id;
    DB.transactions.forEach(t => { if(t.accountId === id) t.accountId = DB.settings.defaultAccountId; });
    [...DB.recurring, ...DB.subscriptions, ...DB.debts].forEach(x => { if(x.accountId === id) x.accountId = DB.settings.defaultAccountId; });
    saveDB(); closeModal(); refreshCurrentView();
    showToast('Đã xoá tài khoản', 'ok');
  });
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 9 — VIEW: THU/CHI CỐ ĐỊNH (Recurring thông minh)

function renderRecurringView(){
  const container = document.getElementById('viewRecurring');

  const expenses = DB.recurring.filter(r => r.type === 'expense');

  const monthlyOut = expenses.filter(r=>r.active).reduce((s,r)=>s+normalizeMonthly(r),0);
  const subsMonthly = activeSubs().reduce((s,x)=>s+subMonthlyCost(x),0);
  const debtMonthly = DB.debts.filter(d=>d.balance>0 && !d.noSchedule).reduce((s,d)=>s+d.minPayment,0);

  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        ${kpiCard('Thu cố định / tháng', formatVND(monthlyIn), 'text-ok-600')}
        ${kpiCard('Chi cố định / tháng', formatVND(monthlyOut), 'text-bad-500')}
        ${kpiCard('Subscription / tháng', formatVND(subsMonthly), 'text-ink-800 dark:text-white')}
        ${kpiCard('Trả nợ / tháng', formatVND(debtMonthly), 'text-ink-800 dark:text-white')}
      </div>

      <div class="card rounded-xl2 p-4 shadow-card flex flex-wrap items-center gap-3">
        <div class="min-w-0 flex-1 overflow-hidden">
          <p class="text-[12.5px] font-semibold text-ink-700 dark:text-ink-200">Tổng nghĩa vụ cố định mỗi tháng: <span class="font-display font-800 tabnum">${formatVND(monthlyOut + subsMonthly + debtMonthly)}</span></p>
          <p class="text-[11.5px] text-ink-400 mt-0.5">Toàn bộ khoản này được giữ chỗ trong ngân sách và trừ khỏi Free Cash ngay từ đầu tháng.</p>
        </div>
        <button onclick="openRecurringModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-4 py-2.5 rounded-xl transition shrink-0">+ Thêm khoản cố định</button>
      </div>

      ${DB.recurring.length === 0 ? `
        <div class="card rounded-xl2 p-10 shadow-card flex flex-col items-center text-center">
          <div class="empty-icon-wrap w-20 h-20 rounded-full flex items-center justify-center mb-4"><span class="text-4xl">📌</span></div>
          <h3 class="font-display font-800 text-lg text-ink-900 dark:text-white">Chưa có khoản thu/chi cố định</h3>
          <p class="text-[13px] text-ink-400 mt-1.5 max-w-sm">Thêm lương, tiền nhà, tiền gửi về nhà, trả góp, bảo hiểm… để hệ thống tự ghi nhận và giữ chỗ ngân sách.</p>
          <button onclick="openRecurringModal()" class="mt-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[13px] px-5 py-2.5 rounded-xl transition">+ Thêm khoản đầu tiên</button>
        </div>
      ` : `
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div>
          <p class="font-display font-700 text-[13.5px] text-ink-700 dark:text-ink-200 mb-2.5">💰 Thu nhập cố định</p>
          <div class="space-y-3">${incomes.length ? incomes.map(r=>renderRecurringCard(r)).join('') : '<p class="text-[12.5px] text-ink-400">Chưa có khoản thu cố định nào.</p>'}</div>
        </div>
        <div>
          <p class="font-display font-700 text-[13.5px] text-ink-700 dark:text-ink-200 mb-2.5">📌 Chi tiêu cố định</p>
          <div class="space-y-3">${expenses.length ? expenses.map(r=>renderRecurringCard(r)).join('') : '<p class="text-[12.5px] text-ink-400">Chưa có khoản chi cố định nào.</p>'}</div>
        </div>
      </div>
      `}

function normalizeMonthly(r){
  if(r.freq === 'weekly') return r.amount * 52 / 12;
  if(r.freq === 'quarterly') return r.amount / 3;
  if(r.freq === 'yearly') return r.amount / 12;
  return r.amount;
}

function renderRecurringCard(r){
  const meta = catMeta(r.category);
  const days = r.nextDate ? daysBetween(todayISO(), r.nextDate) : null;
  const acc = getAccount(r.accountId);
  const skippedThis = (r.skipList||[]).includes(r.nextDate);
  return `
    <div class="card rounded-xl2 p-4 shadow-card ${!r.active ? 'opacity-60' : ''}">

        <div class="w-10 h-10 rounded-xl surface-2 flex items-center justify-center text-lg shrink-0">${meta.icon}</div>

          <p class="text-[11.5px] text-ink-400">${FREQ_LABELS[r.freq]||'Hàng tháng'} · ${meta.label} · ${acc ? acc.icon + ' ' + escapeHtml(acc.name) : ''}</p>
        </div>
        <div class="flex items-center gap-0.5 shrink-0">
          <button onclick="openRecurringModal('${r.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-ink-100 dark:hover:bg-white/10" title="Sửa">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button onclick="deleteRecurring('${r.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-bad-50 hover:text-bad-500 dark:hover:bg-bad-500/10" title="Xoá">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <p class="font-display font-800 text-lg mt-3 tabnum ${r.type==='income'?'text-ok-600':'text-ink-900 dark:text-white'}">${r.type==='income'?'+':'−'}${formatVND(r.amount)}</p>

      <div class="flex flex-wrap items-center gap-1.5 mt-2">
        <span class="chip ${!r.active?'surface-2 text-ink-400':days<=3?'bg-warn-50 text-warn-600 dark:bg-warn-500/10':'surface-2 text-ink-500'}">
          ${!r.active ? 'Đang tạm dừng' : skippedThis ? 'Đã bỏ qua kỳ này' : (days<=0?'Đến hạn':`${days} ngày nữa`)} · ${formatDate(r.nextDate)}
        </span>
        <span class="chip ${r.autoCreate && !r.confirmBeforePost ? 'bg-ok-50 text-ok-600 dark:bg-ok-500/10' : 'surface-2 text-ink-500'}">
          ${r.autoCreate && !r.confirmBeforePost ? '⚡ Tự động ghi nhận' : '✋ Hỏi trước khi ghi'}
        </span>
        ${r.type==='income' && r.allocationRuleId ? `<span class="chip bg-brand-50 text-brand-600 dark:bg-brand-500/10">🔀 ${escapeHtml((DB.allocationRules.find(x=>x.id===r.allocationRuleId)||{}).name || 'Có phân bổ')}</span>` : ''}
        ${r.type==='expense' && r.goalId ? (()=>{ const g = DB.goals.find(x=>x.id===r.goalId); return g ? `<button onclick="switchView('goals')" class="chip bg-brand-50 text-brand-600 dark:bg-brand-500/10 hover:ring-1 hover:ring-brand-300 transition">🎯 ${escapeHtml(g.name)} · ${clamp(getGoalEffectiveCurrent(g)/g.target*100,0,100).toFixed(0)}%</button>` : ''; })() : ''}
      </div>

      <div class="flex flex-wrap gap-1.5 mt-3">
        <button onclick="toggleRecurringActive('${r.id}')" class="text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg surface-2 text-ink-600 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-white/10 transition">${r.active?'Tạm dừng':'Bật lại'}</button>
        <button onclick="skipRecurringPeriod('${r.id}')" class="text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg surface-2 text-ink-600 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-white/10 transition">Bỏ qua kỳ này</button>
        <button onclick="postRecurringNow('${r.id}')" class="text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Ghi nhận ngay</button>
      </div>
    </div>`;
}

function toggleRecurringActive(id){
  const r = DB.recurring.find(x=>x.id===id);
  if(!r) return;
  r.active = !r.active;
  saveDB(); refreshCurrentView();
  showToast(r.active ? 'Đã bật lại khoản cố định' : 'Đã tạm dừng khoản cố định', 'info');
}
function skipRecurringPeriod(id){
  const r = DB.recurring.find(x=>x.id===id);
  if(!r) return;
  r.skipList = r.skipList || [];
  if(!r.skipList.includes(r.nextDate)) r.skipList.push(r.nextDate);
  r.nextDate = addCycle(r.nextDate, r.freq);
  saveDB(); refreshCurrentView();
  showToast('Đã bỏ qua kỳ này · dự báo đã cập nhật', 'info');
}
function postRecurringNow(id){
  // Luôn hỏi trước: số tiền thực nhận và tài khoản thực tế thường khác cấu hình
  openRecurringPostModal(id);
}

      ${accountSelectHtml('recAccount', editing?editing.accountId:null, 'Trừ / cộng vào tài khoản')}

        </label>

      <div id="recGoalWrap" class="${type==='expense'?'':'hidden'}">
        ${goalSelectHtml('recGoalInput', editing ? editing.goalId : null)}

      <div id="recAllocWrap" class="${type==='income'?'':'hidden'}">

        <select id="recAllocRule" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
          <option value="">— Theo cài đặt tự trích của từng gói tiết kiệm —</option>
          ${DB.allocationRules.map(rule=>`<option value="${rule.id}" ${editing&&editing.allocationRuleId===rule.id?'selected':''}>${escapeHtml(rule.name)}</option>`).join('')}
        </select>
        <p class="text-[11px] text-ink-400 mt-1.5">Tạo/sửa kịch bản trong mục <button type="button" onclick="closeModal(); switchView('savings')" class="text-brand-600 font-semibold">Tiết kiệm</button>.</p>

        ${editing ? `<button type="button" onclick="deleteRecurring('${editing.id}'); closeModal();" class="text-[13px] font-semibold text-bad-500 hover:text-bad-600">Xoá</button>` : '<span></span>'}
        <div class="flex gap-2.5">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">${editing?'Lưu thay đổi':'Thêm khoản cố định'}</button>
        </div>
      </div>
    </form>
  `, { width:'max-w-md' });

  const renderRecCats = (t, selected) => {
    const cats = t === 'income' ? INCOME_CATS : EXPENSE_CATS;
    if(!selected || !cats.includes(selected)) selected = cats[0];
    document.getElementById('recCategoryInput').value = selected;
    document.getElementById('recCategoryGrid').innerHTML = cats.map(c=>{
      const meta = catMeta(c);
      const sel = c === selected;
      return `<button type="button" onclick="selectRecCategory('${c}')" data-cat="${c}"
        class="rec-cat-btn flex flex-col items-center gap-1 py-2.5 rounded-xl border-2 transition text-[10.5px] font-medium ${sel?'border-brand-500 bg-brand-50 dark:bg-brand-500/10 text-brand-600':'border-transparent surface-2 text-ink-500 dark:text-ink-300 hover:border-ink-200'}">
        <span class="text-lg">${meta.icon}</span><span class="truncate w-full text-center">${meta.label}</span>
      </button>`;
    }).join('');
  };
  window.selectRecCategory = (c) => {
    document.getElementById('recCategoryInput').value = c;
    document.querySelectorAll('.rec-cat-btn').forEach(b=>{
      const on = b.dataset.cat === c;
      b.classList.toggle('border-brand-500', on);
      b.classList.toggle('bg-brand-50', on);
      b.classList.toggle('text-brand-600', on);
      b.classList.toggle('border-transparent', !on);
      b.classList.toggle('surface-2', !on);
    });
  };
  renderRecCats(type, editing ? editing.category : null);

  document.querySelectorAll('.rec-type-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = btn.dataset.type;
      document.getElementById('recTypeInput').value = t;
      document.querySelectorAll('.rec-type-btn').forEach(b=>{ b.classList.remove('bg-bad-500','bg-ok-500','text-white'); b.classList.add('text-ink-500'); });
      btn.classList.remove('text-ink-500'); btn.classList.add(t==='expense'?'bg-bad-500':'bg-ok-500','text-white');
      document.getElementById('recAllocWrap').classList.toggle('hidden', t !== 'income');
      document.getElementById('recGoalWrap').classList.toggle('hidden', t !== 'expense');
      renderRecCats(t, null);
    });
  });

  // Nhắc khi mục tiêu đã có gói tiết kiệm riêng — tránh cộng tiến độ hai lần
  const goalSel = document.getElementById('recGoalInput');
  const warnEl = document.getElementById('goalLinkWarn');
  if(goalSel && warnEl){
    const syncWarn = () => {
      const w = goalSel.value ? goalLinkWarning(goalSel.value) : null;
      warnEl.textContent = w || '';
      warnEl.classList.toggle('hidden', !w);
    };
    goalSel.addEventListener('change', syncWarn);
    syncWarn();
  }

  document.getElementById('recForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const nextDate = document.getElementById('recNextDate').value;
    const data = {
      type: document.getElementById('recTypeInput').value,
      category: document.getElementById('recCategoryInput').value,
      amount: parseMoneyInput('recAmountInput'),
      freq: document.getElementById('recFreqInput').value,
      note: document.getElementById('recNoteInput').value.trim() || catMeta(document.getElementById('recCategoryInput').value).label,
      nextDate,
      dayOfMonth: Number(nextDate.slice(8,10)),
      accountId: document.getElementById('recAccount').value,
      autoCreate: document.getElementById('recAuto').checked,
      confirmBeforePost: document.getElementById('recConfirm').checked,
      allocationRuleId: document.getElementById('recAllocRule') ? (document.getElementById('recAllocRule').value || null) : null,
      // Chỉ khoản CHI mới giữ liên kết mục tiêu
      goalId: (document.getElementById('recTypeInput').value === 'expense' && document.getElementById('recGoalInput'))
        ? (document.getElementById('recGoalInput').value || null) : null,
    };
    if(editing){ Object.assign(editing, data); showToast('Đã cập nhật khoản cố định', 'ok'); }
    else { DB.recurring.push({ id: uid('rec'), active:true, skipList:[], ...data }); showToast('Đã thêm khoản cố định · đã giữ chỗ trong ngân sách', 'ok'); }
    saveDB(); closeModal(); refreshCurrentView();
  });
}

/* ======================================================================

        <div class="min-w-0 flex-1">
          <p class="font-display font-700 text-[13.5px] text-ink-800 dark:text-ink-100">Máy tính lãi tiết kiệm</p>
          <p class="text-[11.5px] text-ink-400 mt-0.5">Mô phỏng bậc thang xoay vòng, gửi góp tích luỹ, gửi linh hoạt lãi nhập gốc hàng ngày</p>

            <button onclick="handleMaturity('${p.id}','renew-principal')" class="text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg surface-2 text-ink-600 dark:text-ink-300">Tái tục gốc</button>

      ${pots.length === 0 ? `

/* Thẻ gói tiết kiệm — hiển thị lãi & tiến độ kỳ hạn một cách "biết nói" */
function renderSavingsCard(p){
  const i = computePotInterest(p);
  const pct = p.target > 0 ? clamp(p.balance / p.target * 100, 0, 100) : 0;
  const early = isBeforeMaturity(p) ? estimateEarlyWithdrawInterest(p) : null;

  return `
    <div class="card rounded-xl2 p-4 shadow-card ${p.matured?'ring-1 ring-warn-400':''}">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl surface-2 flex items-center justify-center text-lg shrink-0">${p.icon}</div>
        <div class="min-w-0 flex-1 overflow-hidden">
          <p class="text-[13.5px] font-semibold text-ink-800 dark:text-ink-100 tx-clamp2">${escapeHtml(p.name)}${p.isEmergency?' 🛟':''}</p>
          <p class="text-[11.5px] text-ink-400">${p.rate?p.rate+'%/năm':'Không lãi'}${p.termMonths?' · kỳ hạn '+p.termMonths+' tháng':' · không kỳ hạn'}</p>
        </div>
        <button onclick="openSavingsModal('${p.id}')" class="p-1.5 rounded-lg text-ink-400 hover:bg-ink-100 dark:hover:bg-white/10">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <p class="font-display font-800 text-xl text-ink-900 dark:text-white mt-3 tabnum">${formatVND(p.balance)}</p>

      ${p.rate ? `
      <!-- Bảng lãi: đã tích luỹ / còn sinh thêm / tổng nhận -->
      <div class="surface-2 rounded-xl p-2.5 mt-2.5 space-y-1">
        <div class="flex justify-between text-[11.5px]"><span class="text-ink-400">Lãi đã tích luỹ</span><span class="font-semibold tabnum text-ok-600">+${formatVND(i.accrued)}</span></div>
        ${i.daysLeft !== null ? `<div class="flex justify-between text-[11.5px]"><span class="text-ink-400">Lãi còn sinh thêm</span><span class="font-semibold tabnum text-ink-600 dark:text-ink-300">+${formatVND(i.projected)}</span></div>` : ''}
        <div class="flex justify-between text-[11.5px] pt-1 border-t border-ink-100/60 dark:border-white/[0.06]">
          <span class="text-ink-500 dark:text-ink-300 font-semibold">${i.daysLeft !== null ? 'Nhận khi đáo hạn' : 'Ước tính / tháng'}</span>
          <span class="font-display font-700 tabnum text-ink-900 dark:text-white">${i.daysLeft !== null ? formatVND(i.totalAtMaturity) : '+'+formatVND(i.monthlyInterest)}</span>
        </div>
      </div>` : ''}

      ${p.maturityDate ? `
      <div class="mt-2.5">
        <div class="flex justify-between text-[11px] text-ink-400 mb-1">
          <span>${formatDate(p.startDate)} → ${formatDate(p.maturityDate)}</span>
          <span class="tabnum">${i.daysLeft<=0?'Đã đáo hạn':'còn '+i.daysLeft+' ngày'}</span>
        </div>
        <div class="progress-track h-1.5"><div class="progress-fill ${i.daysLeft<=7?'bg-warn-500':'bg-brand-500'}" style="width:${i.progressPct}%"></div></div>
      </div>` : ''}

      ${p.target ? `
      <div class="mt-2.5">
        <div class="flex justify-between text-[11px] text-ink-400 mb-1"><span>Mục tiêu ${formatVNDShort(p.target)}</span><span class="tabnum">${pct.toFixed(0)}%</span></div>
        <div class="progress-track h-1.5"><div class="progress-fill bg-ok-500" style="width:${pct}%"></div></div>
      </div>` : ''}

      <div class="flex flex-wrap items-center gap-1.5 mt-2.5">
        ${p.planId ? `<span class="chip surface-2 text-ink-500">🪜 từ kế hoạch</span>` : ''}
        <span class="chip surface-2 text-ink-500">${MATURITY_ACTION_LABELS[p.onMaturity||'ask']}</span>
        ${early !== null ? `<span class="chip bg-warn-50 text-warn-600 dark:bg-warn-500/10" title="Rút trước hạn chỉ hưởng lãi không kỳ hạn">Rút nay chỉ được ${formatVNDShort(early)} lãi</span>` : ''}
      </div>

      <div class="flex gap-1.5 mt-3">
        <button onclick="openSavingsTransferModal('${p.id}','in')" class="flex-1 text-[11.5px] font-semibold px-2.5 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Nạp vào</button>
        <button onclick="openSavingsTransferModal('${p.id}','out')" class="flex-1 text-[11.5px] font-semibold px-2.5 py-2 rounded-lg surface-2 text-ink-600 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-white/10 transition">Rút về</button>
      </div>
    </div>`;
}

  openModal(`
    ${modalHeader(editing ? 'Sửa gói tiết kiệm' : 'Tạo gói tiết kiệm')}
    <form id="savForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div>

      isEmergency: document.getElementById('savEmergency').checked,
      goalId: goalSel ? (goalSel.value || null) : null,
    };
    if(!data.maturityDate && data.termMonths) data.maturityDate = addMonthsISO(todayISO(), data.termMonths);

function deleteSavings(id){
  const p = DB.savings.find(x=>x.id===id);
  if(!p) return;
  confirmDelete(`Xoá gói "${p.name}"? Số dư ${formatVND(p.balance)} sẽ được chuyển về Số dư hiện tại.`, ()=>{
    if(p.balance > 0) withdrawFromSavings(p.id, p.balance, { title:'Đóng gói ' + p.name + ' → số dư hiện tại' });
    DB.savings = DB.savings.filter(x=>x.id!==id);
    DB.allocationRules.forEach(r => { r.items = r.items.filter(i => i.targetId !== id); });
    saveDB(); closeModal(); refreshCurrentView();
    showToast('Đã xoá gói tiết kiệm', 'ok');
  });
}

function openSavingsTransferModal(potId, dir){
  const p = DB.savings.find(x=>x.id===potId);
  if(!p) return;
  const isIn = dir === 'in';
  openModal(`
    ${modalHeader(isIn ? 'Nạp vào ' + p.name : 'Rút từ ' + p.name, isIn ? 'Tiền được trừ khỏi Số dư hiện tại' : 'Tiền được cộng vào Số dư hiện tại')}
    <form id="savTransferForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div class="surface-2 rounded-xl p-3 flex justify-between text-[12.5px]">
        <span class="text-ink-500 dark:text-ink-300">Số dư hiện tại</span><span class="font-display font-700 tabnum">${formatVND(getCashPosition())}</span>
      </div>
      <div class="surface-2 rounded-xl p-3 flex justify-between text-[12.5px]">
        <span class="text-ink-500 dark:text-ink-300">Trong gói</span><span class="font-display font-700 tabnum">${formatVND(p.balance)}</span>
      </div>
      ${!isIn && isBeforeMaturity(p) ? `
      <div class="rounded-xl border border-warn-400/50 bg-warn-50 dark:bg-warn-500/10 p-3">
        <p class="text-[12px] font-semibold text-ink-800 dark:text-ink-100">⚠️ Rút trước hạn (đáo hạn ${formatDate(p.maturityDate)})</p>
        <p class="text-[11.5px] text-ink-500 dark:text-ink-300 mt-1">
          Lãi sẽ tính lại theo lãi suất không kỳ hạn ${DB.settings.nonTermRate||0}%/năm:
          <b>${formatVND(p.interestAccrued||0)} → ${formatVND(estimateEarlyWithdrawInterest(p))}</b>.
          Nếu chờ tới đáo hạn bạn nhận ${formatVND(computePotInterest(p).totalInterest)} lãi.
        </p>
      </div>` : ''}
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Số tiền (₫)</label>
        <input id="savTransferAmount" type="text" inputmode="numeric" required class="money-input w-full px-3.5 py-3 rounded-xl surface-2 text-[17px] font-display font-700 outline-none tabnum">
      </div>
      ${accountSelectHtml('savTransferAcc', null, isIn ? 'Trừ từ tài khoản' : 'Cộng vào tài khoản')}
      <div class="flex justify-end gap-2.5 pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">${isIn?'Nạp vào gói':'Rút về số dư'}</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  document.getElementById('savTransferForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const amt = Math.round(parseMoneyInput('savTransferAmount')||0);
    const accId = document.getElementById('savTransferAcc').value;
    if(amt <= 0) return;
    // Nạp tiết kiệm là lựa chọn chủ động → chặn nếu phá mức tối thiểu
    if(isIn){
      const breach = checkMinBalanceBreach(getAccount(accId), amt);
      if(breach){ showToast(breach, 'warn', 5000); return; }
    }
    if(isIn) depositToSavings(p.id, amt, { accountId: accId, title:'Nạp vào ' + p.name });
    else withdrawFromSavings(p.id, amt, { accountId: accId });
    closeModal(); refreshCurrentView();
    showToast('Đã chuyển ' + formatVND(amt), 'ok');
  });
}

function setActiveRule(id){

  saveDB(); refreshCurrentView();
  showToast('Đã kích hoạt kịch bản phân bổ', 'ok');
}

function openAllocationRulesModal(editId = null){
  const editing = editId ? DB.allocationRules.find(r=>r.id===editId) : null;
  const items = editing ? JSON.parse(JSON.stringify(editing.items)) : [];
  window.__allocItems = items;

  const render = () => {
    const totalPct = window.__allocItems.reduce((s,i)=>s+(Number(i.percent)||0),0);
    document.getElementById('allocItems').innerHTML = window.__allocItems.map((it, idx)=>`
      <div class="flex items-center gap-2 surface-2 rounded-xl p-2.5">
        <select onchange="__allocSet(${idx},'kind',this.value)" class="px-2 py-1.5 rounded-lg card text-[12px] outline-none">
          <option value="savings" ${it.kind==='savings'?'selected':''}>Tiết kiệm</option>
          <option value="debt" ${it.kind==='debt'?'selected':''}>Trả nợ</option>
          <option value="free" ${it.kind==='free'?'selected':''}>Chi tiêu tự do</option>
        </select>
        <select onchange="__allocSet(${idx},'targetId',this.value)" class="flex-1 min-w-0 overflow-hidden px-2 py-1.5 rounded-lg card text-[12px] outline-none ${it.kind==='free'?'invisible':''}">
          ${(it.kind==='debt' ? DB.debts : DB.savings.filter(p=>!p.closed)).map(o=>`<option value="${o.id}" ${it.targetId===o.id?'selected':''}>${escapeHtml(o.name)}</option>`).join('')}
        </select>
        <input type="number" min="0" max="100" value="${it.percent}" onchange="__allocSet(${idx},'percent',this.value)" class="w-16 px-2 py-1.5 rounded-lg card text-[12px] outline-none tabnum">
        <span class="text-[12px] text-ink-400">%</span>
        <button type="button" onclick="__allocRemove(${idx})" class="p-1 rounded text-ink-400 hover:text-bad-500">✕</button>
      </div>`).join('');
    document.getElementById('allocTotal').innerHTML = `Tổng: <b class="${totalPct>100?'text-bad-500':'text-ink-800 dark:text-ink-100'}">${totalPct}%</b>${totalPct>100?' — vượt 100%!':totalPct<100?` · còn ${100-totalPct}% giữ trong số dư`:''}`;
  };
  window.__allocSet = (idx, key, val) => {
    window.__allocItems[idx][key] = key==='percent' ? Number(val) : val;
    if(key==='kind'){
      const list = val==='debt' ? DB.debts : DB.savings.filter(p=>!p.closed);
      window.__allocItems[idx].targetId = val==='free' ? null : (list[0] ? list[0].id : null);
    }
    render();
  };
  window.__allocRemove = (idx) => { window.__allocItems.splice(idx,1); render(); };
  window.__allocAdd = () => {
    const first = DB.savings.filter(p=>!p.closed)[0];
    window.__allocItems.push({ kind:'savings', targetId: first?first.id:null, percent:10 });
    render();
  };

  openModal(`
    ${modalHeader(editing ? 'Sửa kịch bản phân bổ' : 'Kịch bản phân bổ thu nhập', 'Mỗi khi ghi nhận thu nhập cố định, hệ thống tự chia theo tỷ lệ này')}
    <form id="allocForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div>
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Tên kịch bản</label>
        <input id="allocName" type="text" required value="${editing?escapeHtml(editing.name):''}" placeholder="VD: Tháng bình thường / Tháng tiết kiệm mạnh" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
      </div>
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300">Phân bổ</label>
          <button type="button" onclick="__allocAdd()" class="text-[12px] font-semibold text-brand-600">+ Thêm dòng</button>
        </div>
        <div id="allocItems" class="space-y-2"></div>
        <p id="allocTotal" class="text-[11.5px] text-ink-400 mt-2"></p>
      </div>
      <label class="flex items-center gap-2.5 text-[12.5px] text-ink-700 dark:text-ink-200">
        <input type="checkbox" id="allocActive" ${!editing || editing.active ? 'checked':''} class="w-4 h-4 rounded">
        Đặt làm kịch bản đang áp dụng
      </label>
      ${DB.allocationRules.length && !editing ? `<p class="text-[11.5px] text-ink-400">Bạn có ${DB.allocationRules.length} kịch bản khác — chỉ 1 kịch bản được áp dụng tại một thời điểm.</p>` : ''}
      <div class="flex items-center justify-between gap-2.5 pt-2">
        ${editing ? `<button type="button" onclick="deleteAllocationRule('${editing.id}')" class="text-[13px] font-semibold text-bad-500">Xoá</button>` : '<span></span>'}
        <div class="flex gap-2.5">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
          <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Lưu kịch bản</button>
        </div>
      </div>
    </form>
  `, { width:'max-w-md' });

  render();

  document.getElementById('allocForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const data = {
      name: document.getElementById('allocName').value.trim(),
      items: window.__allocItems.filter(i => i.percent > 0),
      active: document.getElementById('allocActive').checked,
    };
    if(data.active) DB.allocationRules.forEach(r => r.active = false);
    if(editing) Object.assign(editing, data);
    else DB.allocationRules.push({ id: uid('alloc'), ...data });
    saveDB(); closeModal(); refreshCurrentView();
    showToast('Đã lưu kịch bản phân bổ', 'ok');
  });
}

function deleteAllocationRule(id){
  DB.allocationRules = DB.allocationRules.filter(r=>r.id!==id);
  DB.recurring.forEach(r => { if(r.allocationRuleId === id) r.allocationRuleId = null; });
  saveDB(); closeModal(); refreshCurrentView();
  showToast('Đã xoá kịch bản', 'ok');
}

  const prev = DB.settings.autoRun;

/* Tài sản ròng = số dư + tiết kiệm + tài sản khác − dư nợ */
function computeNetWorth(){
  const others = DB.assets.reduce((s,a) => s + (a.value||0), 0);
  return getCashPosition() + getTotalSavings() + others + getTotalReceivables() - getTotalDebt();
}
