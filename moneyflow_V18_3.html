/* Trung bình 3 tháng gần nhất — một tháng lẻ dễ bị méo bởi sự kiện bất thường */
function getAvgMonthly(months = 3){
  const now = new Date();
  let inc = 0, exp = 0, counted = 0;
  for(let i = 1; i <= months; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const mi = getMonthIncome(d), me = getMonthExpense(d);
    if(mi > 0 || me > 0){ inc += mi; exp += me; counted++; }
  }
  if(!counted) return { income: getMonthIncome(now), expense: getMonthExpense(now), months: 0 };
  return { income: Math.round(inc/counted), expense: Math.round(exp/counted), months: counted };
}

/* ★ THU NHẬP THAM CHIẾU — mẫu số cho mọi tỷ lệ.
   Nếu chỉ lấy thu nhập ĐÃ GHI NHẬN, người mới dùng app (chưa kịp nhập lương)
   sẽ nhận những con số vô nghĩa kiểu "nghĩa vụ cố định chiếm 933% thu nhập".
   Nên lấy mức LỚN HƠN giữa thu nhập thực tế trung bình và thu nhập cố định
   ĐÃ KHAI BÁO, đồng thời trả về nguồn để lời khuyên nói rõ đang dựa vào đâu. */
function getReferenceIncome(){
  const avg = getAvgMonthly(3);
  const declared = Math.round(
    DB.recurring.filter(r => r.type === 'income' && r.active).reduce((s,r) => s + normalizeMonthly(r), 0)
  );
  const actual = avg.income || 0;
  if(declared > actual){
    return { value: declared, source: 'declared', actual, declared,
             note: 'dựa trên thu nhập cố định bạn đã khai báo' };
  }
  return { value: actual, source: 'actual', actual, declared,
           note: `trung bình ${avg.months || 1} tháng ghi nhận thực tế` };
}

/* Ngày có dữ liệu đầu tiên — mốc để biết app đã theo dõi được bao lâu */
function getFirstDataDate(){
  if(DB.settings.startedAt) return DB.settings.startedAt;
  const dates = DB.transactions.map(t => t.date).filter(Boolean).sort();
  return dates.length ? dates[0] : todayISO();
}

/* ★ Đã có kỳ thu nhập nào ĐÁNG LẼ phải xảy ra sau khi bắt đầu dùng app chưa?
   Nếu bạn bắt đầu dùng app ngày 20 mà lương về ngày 5, thì tháng đầu tiên
   KHÔNG hề thiếu dữ liệu — kỳ lương đó xảy ra trước khi app tồn tại.
   Nhắc "bạn quên ghi lương" trong tình huống này là sai và làm bạn phải
   bịa số liệu để cân bằng lại. */
function incomeCyclesSinceStart(){
  const start = getFirstDataDate();
  const today = todayISO();
  let cycles = 0;
  DB.recurring.filter(r => r.type === 'income' && r.active).forEach(r => {
    // Đi ngược từ kỳ kế tiếp về quá khứ, đếm số kỳ rơi vào [start, today]
    let d = r.nextDate || today, guard = 0;
    while(d > start && guard++ < 60){
      d = subCycle(d, r.freq || 'monthly');
      if(d >= start && d <= today) cycles++;
    }
  });
  return cycles;
}

/* Số tháng dữ liệu ĐẦY ĐỦ (tháng bắt đầu giữa chừng không tính) */
function completeMonthsOfData(){
  const start = new Date(getFirstDataDate() + 'T12:00:00');
  const now = new Date();
  let m = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(start.getDate() > 1) m -= 1;          // tháng đầu dở dang
  if(now.getDate() < daysInMonth(now.getFullYear(), now.getMonth())) m -= 0;
  return Math.max(0, m);
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 27 — THU NHẬP NHIỀU NGUỒN THEO THÁNG
   ----------------------------------------------------------------------
   Tách đúng 5 nguồn thu nhập theo category đã có sẵn trong INCOME_CATS
   (không gộp Thưởng/Đầu tư/Thu nhập khác vào chung "lương" — Quang góp ý
   gộp như vậy dễ hiểu lầm vì thưởng lễ/tiền mừng tuổi không đều đặn,
   khác bản chất với lương hàng tháng):
     · 'luong', 'thuong', 'dau-tu', 'thu-nhap-khac': đếm trực tiếp từ
       transactions theo category, giống mọi nơi khác trong app.
     · 'freelance' (chạy Be): tính từ DB.gig.shifts qua shiftNet() — CHÍNH
       XÁC HƠN đếm giao dịch category 'freelance', vì đã trừ chiết khấu,
       cộng thưởng/tip đúng từng ca. Vì vậy category 'freelance' trong
       transactions KHÔNG được đếm ở đây nữa (đã có ở sổ ca) — tránh đếm
       trùng 2 lần cùng một khoản thu.
   KHÔNG tạo lại dữ liệu, không thêm field sourceId lên transaction — chỉ
   đọc và tổng hợp những gì đã có, nên không có rủi ro lệch số với các
   module khác (Dashboard, Cố vấn, Free Cash…) vẫn đang đếm y hệt vậy. */

const INCOME_SRC_META = {
  luong:         { label: 'Lương',         color: '#10B981' },
  thuong:        { label: 'Thưởng',        color: '#059669' },
  'dau-tu':      { label: 'Đầu tư',        color: '#0D9488' },
  freelance:     { label: 'Chạy Be',       color: '#0891B2' },
  'thu-nhap-khac': { label: 'Khác',        color: '#65A30D' },
};
const INCOME_SRC_ORDER = ['luong','thuong','dau-tu','freelance','thu-nhap-khac'];

/* Thu nhập theo TỪNG category (trừ freelance) trong 1 tháng — đối tượng
   trả về luôn đủ cả 4 key dù bằng 0, để UI không phải tự kiểm tra thiếu. */
function getMonthIncomeByCategory(refDate){
  const txs = getMonthTransactions(refDate).filter(t => t.type === 'income' && isPL(t));
  const out = { luong:0, thuong:0, 'dau-tu':0, 'thu-nhap-khac':0 };
  txs.forEach(t => { if(out[t.category] !== undefined) out[t.category] += t.amount; });
  return out;
}

/* Thu nhập từ chạy Be trong 1 tháng, tính từ sổ ca (không phải giao dịch) */
function getMonthGigIncome(refDate){
  if(!DB.gig || !Array.isArray(DB.gig.shifts)) return 0;
  const y = refDate.getFullYear(), m = refDate.getMonth();
  const from = toLocalISO(new Date(y, m, 1));
  const to = toLocalISO(new Date(y, m+1, 0));
  return DB.gig.shifts
    .filter(s => s.date >= from && s.date <= to)
    .reduce((sum, s) => sum + shiftNet(s), 0);
}

/* Dữ liệu 1 tháng: 5 nguồn tách riêng (m.byCat) + tổng, dùng cho biểu đồ
   và bảng chuyên sâu. months=6 nghĩa là tháng hiện tại + 5 tháng trước,
   mới → cũ bị đảo lại thành cũ → mới trước khi trả về (thuận cho vẽ biểu
   đồ theo thời gian). */
function getIncomeTrend(months = 6){
  const now = new Date();
  const out = [];
  for(let i = months - 1; i >= 0; i--){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const byCat = getMonthIncomeByCategory(d);
    byCat.freelance = getMonthGigIncome(d);
    const total = INCOME_SRC_ORDER.reduce((s,k) => s + byCat[k], 0);
    out.push({
      date: d, label: `Th${d.getMonth()+1}/${d.getFullYear()}`,
      key: ymKey(d),
      byCat, total,
      hasData: total > 0,
    });
  }
  return out;
}

/* Độ lệch chuẩn đơn giản — dùng đo "dao động" thu nhập giữa các tháng có dữ liệu */
function stdDev(arr){
  const xs = arr.filter(x => x !== null && x !== undefined);
  if(xs.length < 2) return 0;
  const mean = xs.reduce((s,x)=>s+x,0) / xs.length;
  const variance = xs.reduce((s,x)=>s+(x-mean)*(x-mean),0) / xs.length;
  return Math.sqrt(variance);
}

/* Tóm tắt xu hướng: dùng cho cả tab Tổng quan và cho generateAdvice().
   consecutiveDown: số tháng liên tiếp GẦN NHẤT có dữ liệu mà tổng thu nhập
   giảm so với tháng trước đó — 0 nếu tháng gần nhất tăng hoặc đi ngang.
   catShare: tỷ trọng % mỗi nguồn trên tổng cả giai đoạn (luôn đủ 5 key). */
function summarizeIncomeTrend(months = 6){
  const trend = getIncomeTrend(months).filter(m => m.hasData);
  const emptyShare = Object.fromEntries(INCOME_SRC_ORDER.map(k => [k, 0]));
  if(trend.length < 2){
    return { trend, months: trend.length, avgTotal: trend[0]?.total || 0,
             volatility: 0, growthRate: null, consecutiveDown: 0,
             catShare: emptyShare };
  }
  const totals = trend.map(m => m.total);
  const avgTotal = Math.round(totals.reduce((s,x)=>s+x,0) / totals.length);
  const volatility = avgTotal > 0 ? Math.round(stdDev(totals) / avgTotal * 100) : 0; // % so với TB
  const first = trend[0].total, last = trend[trend.length-1].total;
  const growthRate = first > 0 ? Math.round((last - first) / first * 1000) / 10 : null; // % cả giai đoạn

  let consecutiveDown = 0;
  for(let i = trend.length - 1; i > 0; i--){
    if(trend[i].total < trend[i-1].total) consecutiveDown++;
    else break;
  }

  const sumByCat = Object.fromEntries(INCOME_SRC_ORDER.map(k => [k, trend.reduce((s,m)=>s+m.byCat[k],0)]));
  const sumTotal = INCOME_SRC_ORDER.reduce((s,k) => s + sumByCat[k], 0);
  const catShare = Object.fromEntries(INCOME_SRC_ORDER.map(k => [k, sumTotal > 0 ? Math.round(sumByCat[k]/sumTotal*100) : 0]));
  return { trend, months: trend.length, avgTotal, volatility, growthRate, consecutiveDown, catShare };
}

/* ★ LẠM PHÁT — 3 chế độ, đọc từ DB.settings.inflation.
   'off'    → không dùng, mọi hàm gọi hàm này coi như lạm phát = 0.
   'preset' → một mức %/năm cố định Quang tự nhập 1 lần, quy đổi tuyến tính
              theo số tháng của giai đoạn đang so sánh (ước tính, không đòi
              chính xác tuyệt đối — đúng tinh thần "linh hoạt, không cần số
              thật" mà Quang chọn).
   'manual' → Quang tự nhập %/năm cho TỪNG tháng (DB.settings.inflation.monthly),
              cộng dồn các tháng có trong giai đoạn; tháng chưa nhập thì bỏ qua
              (không suy diễn) và hàm trả kèm số tháng thiếu để UI cảnh báo. */
function estimateInflationForPeriod(months){
  const inf = DB.settings.inflation || { mode:'off' };
  if(!inf.mode || inf.mode === 'off') return { percent: 0, mode: 'off', missingMonths: 0 };

  if(inf.mode === 'preset'){
    const annual = Number(inf.presetAnnual || 0);
    return { percent: Math.round(annual / 12 * months * 10) / 10, mode: 'preset', missingMonths: 0 };
  }

  // manual: cộng dồn theo từng tháng thực tế trong giai đoạn đang xét
  const trend = getIncomeTrend(months).filter(m => m.hasData);
  let sum = 0, missing = 0;
  trend.forEach(m => {
    const v = inf.monthly[m.key];
    if(v === undefined || v === null || v === '') { missing++; return; }
    sum += Number(v) / 12; // %/năm → %/tháng
  });
  return { percent: Math.round(sum * 10) / 10, mode: 'manual', missingMonths: missing };
}

/* Tháng hiện tại có phải tháng đầu tiên và bắt đầu giữa chừng không? */
function isPartialFirstMonth(){
  const start = getFirstDataDate();
  const now = new Date();
  return isSameMonth(start, now) && Number(start.slice(8,10)) > 1;
}

/* Dữ liệu thu nhập có đáng tin để tính tỷ lệ không?
   CHỈ coi là thiếu khi đã có ít nhất một kỳ lương lẽ ra phải rơi vào
   khoảng thời gian app theo dõi — nếu không thì đây là chuyện bình thường
   của người mới bắt đầu, không phải lỗi nhập liệu. */
function incomeDataIsThin(){
  const r = getReferenceIncome();
  if(!(r.declared > 0)) return false;
  if(incomeCyclesSinceStart() === 0) return false;
  return r.actual < r.declared * 0.5;
}

/* Chi phí sinh hoạt hàng tháng — dùng để đo quỹ khẩn cấp */
function getMonthlyBurnForEmergency(){
  const avg = getAvgMonthly(3);
  const fixed = DB.recurring.filter(r => r.type === 'expense' && r.active).reduce((s,r) => s + normalizeMonthly(r), 0)
              + activeSubs().reduce((s,x) => s + subMonthlyCost(x), 0)
              + DB.debts.filter(d => d.balance > 0 && !d.noSchedule).reduce((s,d) => s + d.minPayment, 0);
  // Lấy mức lớn hơn giữa chi tiêu thực tế và nghĩa vụ cố định
  return Math.round(Math.max(avg.expense, fixed));
}

/* Phát hiện "rò rỉ nhỏ": danh mục có nhiều giao dịch lẻ, mỗi lần ít nhưng cộng lại nhiều */
function findSmallLeaks(){
  const now = new Date();
  const tx = DB.transactions.filter(t => t.type === 'expense' && isPL(t) && isSameMonth(t.date, now)
                                      && (!t.source || t.source.kind === 'manual'));
  const byCat = {};
  tx.forEach(t => {
    if(!byCat[t.category]) byCat[t.category] = { count:0, total:0 };
    byCat[t.category].count++;
    byCat[t.category].total += t.amount;
  });
  return Object.entries(byCat)
    .map(([c,v]) => ({ category:c, meta:catMeta(c), ...v, avg: Math.round(v.total/v.count) }))
    .filter(x => x.count >= 8 && x.avg <= 120000 && x.total >= 300000)
    .sort((a,b) => b.total - a.total);
}

/* ---------------------------------------------------------------- ĐỘNG CƠ */
function generateAdvice(){
  const out = [];
  const add = (o) => out.push(o);

  const avg = getAvgMonthly(3);
  const now = new Date();
  const incomeNow = getMonthIncome(now);
  const expenseNow = getMonthExpense(now);
  const ref = getReferenceIncome();
  const income = ref.value;
  const expense = avg.expense || expenseNow;
  const fc = computeFreeCash();
  const emergency = getEmergencyBalance();
  const savings = getTotalSavings();
  const debts = DB.debts.filter(d => d.balance > 0);
  const totalDebt = getTotalDebt();
  const burn = getMonthlyBurnForEmergency();

  /* --- 0. Chưa đủ dữ liệu thì nói thẳng, không bịa lời khuyên --- */
  if(income <= 0 && expense <= 0){
    return [{
      id:'no-data', level:'tip', priority:0,
      title:'Chưa đủ dữ liệu để đưa ra lời khuyên',
      body:'Hãy ghi lại thu nhập và chi tiêu của ít nhất một tháng. Mọi lời khuyên ở đây đều dựa trên số liệu thật của bạn — không có số liệu thì không có lời khuyên nào đáng tin.',
      evidence:'Chưa có giao dịch nào trong 3 tháng gần đây.',
      principle:'Không khuyên khi thiếu dữ liệu.',
    }];
  }

  /* --- 0a. Mới bắt đầu dùng app giữa tháng — nói rõ thay vì bắt nhập bù --- */
  if(isPartialFirstMonth()){
    const start = getFirstDataDate();
    const daysTracked = daysBetween(start, todayISO()) + 1;
    add({
      id:'partial-first-month', level:'tip', priority:99,
      title:`Tháng đầu tiên — mới theo dõi được ${daysTracked} ngày`,
      body:'Bạn bắt đầu dùng app từ giữa tháng nên tháng này chưa có bức tranh đầy đủ. '
         + '<b>Đừng nhập bù các khoản đã xảy ra trước đó</b> chỉ để cho số liệu đẹp — làm vậy sẽ khiến mọi so sánh về sau sai lệch. '
         + 'Cứ ghi từ hôm nay trở đi; các tỷ lệ như tiết kiệm, quỹ khẩn cấp, so sánh tháng sẽ chính xác dần từ tháng sau.',
      evidence:`Dữ liệu bắt đầu từ ${formatDate(start)} · ${daysTracked}/${daysInMonth(new Date().getFullYear(), new Date().getMonth())} ngày của tháng.`,
      principle:'Số liệu một phần thì đọc như số liệu một phần, không suy rộng.',
    });
  }

  /* --- 0b. Dữ liệu thu nhập chưa đầy đủ — phải nói TRƯỚC mọi tỷ lệ,
         nếu không người đọc sẽ tin vào những con số dựa trên nền sai.
         Chỉ nói khi đã thật sự có kỳ lương bị bỏ sót. --- */
  if(incomeDataIsThin()){
    add({
      id:'thin-income-data', level:'warn', priority:98,
      title:'Thu nhập ghi nhận thấp hơn nhiều so với mức bạn khai báo',
      body:`Bạn khai thu nhập cố định ${formatVND(ref.declared)}/tháng nhưng thực tế mới ghi nhận ${formatVND(ref.actual)}/tháng. `
         + 'Nhiều khả năng lương về mà chưa được ghi vào app. Các tỷ lệ bên dưới đang tạm lấy con số khai báo làm mẫu số — '
         + 'chúng chỉ chính xác khi bạn ghi nhận đủ thu nhập. Vào Thu/chi cố định và bấm “Ghi nhận ngay” cho khoản lương đã nhận.',
      evidence:`Khai báo ${formatVND(ref.declared)}/tháng · ghi nhận thực tế ${formatVND(ref.actual)}/tháng.`,
      principle:'Chỉ số chỉ đáng tin khi dữ liệu đầy đủ.',
      action:{ label:'Ghi nhận thu nhập', view:'recurring' },
    });
  }

  /* --- 1. Free Cash âm — cấp bách nhất --- */
  if(fc.free < 0){
    add({
      id:'free-cash-negative', level:'critical', priority:100,
      title:'Bạn đang thiếu ' + formatVND(Math.abs(fc.free)) + ' cho các nghĩa vụ còn lại trong tháng',
      body:'Cần xử lý theo thứ tự: (1) Hoãn khoản trích tiết kiệm tháng này — đây là thứ dễ dời nhất mà không mất phí; '
         + '(2) Bấm “Bỏ qua kỳ” cho một khoản chi cố định có thể dời; (3) Nếu vẫn thiếu, rút từ gói tiết kiệm không kỳ hạn trước, tuyệt đối không rút gói có kỳ hạn vì sẽ mất phần lớn tiền lãi.',
      evidence:`Số dư ${formatVND(fc.cash)} · đã giữ chỗ ${formatVND(fc.reserved)} · kế hoạch tiết kiệm ${formatVND(fc.planned)}.`,
      principle:'Thanh khoản trước, tối ưu sau.',
      action:{ label:'Xem khoản cố định', view:'recurring' },
    });
  }

  /* --- 2. Quỹ khẩn cấp (chuẩn 3–6 tháng chi phí) --- */
  if(burn > 0){
    const liquid = emergency + Math.max(0, fc.cash);
    const monthsCovered = liquid / burn;
    if(monthsCovered < 1){
      add({
        id:'emergency-none', level:'critical', priority:95,
        title:'Quỹ khẩn cấp chưa đủ 1 tháng chi phí',
        body:'Đây là rủi ro lớn nhất trong bức tranh tài chính của bạn: một sự cố xe cộ hay ốm đau sẽ buộc bạn vay nóng với lãi rất cao. '
           + `Mục tiêu bước một là ${formatVND(burn)} (một tháng chi phí) — chưa cần nghĩ tới 6 tháng vội. `
           + 'Cách làm: tạo một gói tiết kiệm không kỳ hạn, đánh dấu “Quỹ khẩn cấp”, và lập Kế hoạch trích định kỳ ngay sau ngày lương.',
        evidence:`Tiền lỏng ${formatVND(liquid)} / chi phí ${formatVND(burn)}/tháng = ${monthsCovered.toFixed(1)} tháng.`,
        principle:'Chuẩn phổ biến: quỹ khẩn cấp 3–6 tháng chi phí sinh hoạt.',
        action:{ label:'Tạo gói tiết kiệm', view:'savings' },
      });
    } else if(monthsCovered < 3){
      add({
        id:'emergency-thin', level:'warn', priority:70,
        title:`Quỹ khẩn cấp mới đủ ${monthsCovered.toFixed(1)} tháng — chuẩn là 3–6 tháng`,
        body:`Bạn đã qua được ngưỡng nguy hiểm nhất. Để đạt mốc 3 tháng cần thêm ${formatVND(Math.max(0, burn*3 - liquid))}. `
           + 'Nếu công việc của bạn ổn định thì 3 tháng là đủ; nếu thu nhập biến động theo mùa thì nên hướng tới 6 tháng.',
        evidence:`Tiền lỏng ${formatVND(liquid)} / chi phí ${formatVND(burn)}/tháng.`,
        principle:'Quỹ khẩn cấp 3–6 tháng chi phí sinh hoạt.',
        action:{ label:'Xem tiết kiệm', view:'savings' },
      });
    } else if(monthsCovered >= 3 && monthsCovered <= 9){
      add({
        id:'emergency-ok', level:'good', priority:12,
        title:`Quỹ khẩn cấp đủ ${monthsCovered.toFixed(1)} tháng chi phí`,
        body:'Đây là nền tảng vững. Từ đây bạn có thể yên tâm hướng dòng tiền dư sang trả nợ lãi cao hoặc mục tiêu dài hạn thay vì tích thêm tiền mặt.',
        evidence:`Tiền lỏng ${formatVND(liquid)} / chi phí ${formatVND(burn)}/tháng.`,
        principle:'Quỹ khẩn cấp 3–6 tháng chi phí sinh hoạt.',
      });
    } else if(monthsCovered > 12 && liquid > 20000000){
      add({
        id:'too-much-cash', level:'tip', priority:45,
        title:`Bạn đang giữ tiền mặt nhiều hơn mức cần (${monthsCovered.toFixed(0)} tháng chi phí)`,
        body:'Tiền mặt nhàn rỗi mất giá dần vì lạm phát. Phần vượt quá 6 tháng chi phí có thể đưa vào gói tiết kiệm có kỳ hạn hoặc tài khoản sinh lời hàng ngày. '
           + 'Đây là gợi ý phân bổ, không phải lời khuyên đầu tư — tôi không biết khẩu vị rủi ro và kế hoạch lớn sắp tới của bạn.',
        evidence:`Có thể đưa đi khoảng ${formatVND(Math.max(0, liquid - burn*6))} mà vẫn giữ đủ 6 tháng dự phòng.`,
        principle:'Giữ đủ thanh khoản, phần dư nên sinh lời.',
        impact:{ amount: Math.round(Math.max(0, liquid - burn*6) * 0.045),
                 text:`~${formatVND(Math.round(Math.max(0, liquid - burn*6) * 0.045))}/năm tiền lãi nếu gửi phần dư ở mức giả định 4,5%/năm` },
        action:{ label:'Xem tiết kiệm', view:'savings' },
      });
    }
  }

  /* --- 3. Tiền nhàn rỗi chưa bật sinh lời (nối với khối tài khoản sinh lời) --- */
  const idleAcc = DB.accounts.filter(a => !a.earnEnabled && (a.balance||0) >= 2000000 && a.type !== 'cash');
  if(idleAcc.length){
    const idleTotal = idleAcc.reduce((s,a)=>s+a.balance,0);
    add({
      id:'idle-cash', level:'tip', priority:40,
      title:formatVND(idleTotal) + ' đang nằm im, chưa bật sinh lời',
      body:'Các ví như MoMo (Túi Thần Tài) hay ZaloPay (Số dư sinh lời) trả lãi theo ngày quanh mức 4–4,7%/năm, tiền vẫn tiêu được bình thường. '
         + 'Bật tính năng sinh lời trong app tương ứng, rồi khai báo lãi suất vào tài khoản ở đây để theo dõi. '
         + 'Lưu ý: đây là sản phẩm hợp tác đầu tư, không phải tiền gửi ngân hàng được bảo hiểm — mức rủi ro thấp nhưng không phải bằng không.',
      evidence:idleAcc.map(a => `${a.name}: ${formatVND(a.balance)}`).join(' · ')
             + ` → ước tính ~${formatVND(Math.round(idleTotal*0.045/12))}/tháng nếu ở mức 4,5%/năm.`,
      principle:'Tiền nhàn rỗi nên sinh lời, miễn là không ảnh hưởng thanh khoản.',
      impact:{ amount: Math.round(idleTotal*0.045), text:`~${formatVND(Math.round(idleTotal*0.045))}/năm nếu bật sinh lời ở mức giả định 4,5%/năm` },
      action:{ label:'Cài đặt tài khoản', view:'dashboard' },
    });
  }

  /* --- 4. Tỷ lệ tiết kiệm (chuẩn 20% theo quy tắc 50/30/20) --- */
  if(income > 0){
    const rate = (income - expense) / income * 100;
    if(rate < 0 && !incomeDataIsThin() && !isPartialFirstMonth()){
      add({
        id:'negative-savings', level:'critical', priority:92,
        title:'Bạn đang tiêu nhiều hơn kiếm được',
        body:`Trung bình ${avg.months || 1} tháng gần đây, chi vượt thu ${formatVND(expense - income)} mỗi tháng. `
           + 'Khoảng chênh này đang được bù bằng tiết kiệm cũ hoặc bằng nợ mới — cả hai đều không kéo dài được. '
           + 'Việc cần làm trước tiên là mở màn So sánh tháng để xem danh mục nào phình ra, rồi cắt đúng chỗ đó thay vì cắt dàn trải.',
        evidence:`Thu ${formatVND(income)} · chi ${formatVND(expense)} mỗi tháng.`,
        principle:'Quy tắc 50/30/20: tiết kiệm nên đạt 20% thu nhập.',
        action:{ label:'So sánh tháng', view:'compare' },
      });
    } else if(rate < 10 && !isPartialFirstMonth()){
      add({
        id:'low-savings', level:'warn', priority:65,
        title:`Tỷ lệ tiết kiệm ${rate.toFixed(0)}% — thấp hơn mức khuyến nghị 20%`,
        body:`Để đạt 20% bạn cần dôi ra thêm ${formatVND(Math.round(income*0.2 - (income-expense)))} mỗi tháng. `
           + 'Cách hiệu quả hơn cả việc "cố tiêu ít đi" là trích tiết kiệm ngay khi lương về, trước khi tiêu — vì phần còn lại sẽ tự co lại theo. '
           + 'Bạn có thể lập việc này bằng Quy tắc phân bổ thu nhập.',
        evidence:`Thu ${formatVND(income)} · chi ${formatVND(expense)} · dôi ra ${formatVND(income-expense)}/tháng.`,
        principle:'Quy tắc 50/30/20 và nguyên tắc "trả cho mình trước".',
        impact:{ amount: Math.round((income*0.2 - (income-expense))*12),
                 text:`+${formatVND(Math.round((income*0.2 - (income-expense))*12))}/năm tiết kiệm thêm nếu đạt 20%` },
        action:{ label:'Đặt quy tắc phân bổ', view:'savings' },
      });
    } else if(rate >= 20){
      add({
        id:'good-savings', level:'good', priority:10,
        title:`Tỷ lệ tiết kiệm ${rate.toFixed(0)}% — đạt chuẩn 20%`,
        body:'Đây là chỉ số quan trọng nhất và bạn đang làm tốt. Giữ nguyên nhịp này; nếu thu nhập tăng, hãy tăng phần trích thay vì tăng chi tiêu.',
        evidence:`Thu ${formatVND(income)} · chi ${formatVND(expense)} mỗi tháng.`,
        principle:'Quy tắc 50/30/20.',
      });
    }
  }

  /* --- 5. Nghĩa vụ cố định chiếm quá nhiều thu nhập --- */
  if(income > 0){
    const fixed = DB.recurring.filter(r => r.type === 'expense' && r.active).reduce((s,r)=>s+normalizeMonthly(r),0)
                + activeSubs().reduce((s,x)=>s+subMonthlyCost(x),0)
                + debts.filter(d => !d.noSchedule).reduce((s,d)=>s+d.minPayment,0);
    const ratio = fixed / income * 100;
    if(ratio > 200){
      // Tỷ lệ kiểu "933%" gần như luôn là dấu hiệu dữ liệu thiếu, không phải
      // tình hình tài chính thật. Nêu con số tuyệt đối thay vì phần trăm.
      add({
        id:'fixed-exceeds-income', level:'critical', priority:87,
        title:'Nghĩa vụ cố định ' + formatVND(Math.round(fixed)) + '/tháng lớn hơn hẳn thu nhập đang ghi nhận',
        body:'Hoặc là thu nhập chưa được ghi đủ vào app, hoặc bạn thật sự đang cam kết nhiều hơn khả năng chi trả. '
           + 'Hãy kiểm tra lại phần thu nhập trước — nếu số liệu đã đúng thì đây là tình huống cần xử lý gấp: '
           + 'tạm dừng các khoản trích tiết kiệm và thương lượng giãn nợ.',
        evidence:`Cố định ${formatVND(Math.round(fixed))}/tháng · thu nhập tham chiếu ${formatVND(income)} (${ref.note}).`,
        principle:'Nghĩa vụ cố định không được vượt thu nhập.',
        action:{ label:'Xem khoản cố định', view:'recurring' },
      });
    } else if(ratio > 70){
      add({
        id:'fixed-too-high', level:'critical', priority:88,
        title:`Nghĩa vụ cố định chiếm ${ratio.toFixed(0)}% thu nhập`,
        body:'Khi phần cứng chiếm quá nhiều, bạn gần như không còn dư địa xoay xở khi có việc đột xuất — mọi cú sốc nhỏ đều thành khủng hoảng. '
           + 'Ba chỗ có thể cắt theo thứ tự dễ dần: subscription không dùng thường xuyên, khoản trích tiết kiệm quá tay, rồi mới tới thương lượng giãn nợ.',
        evidence:`Cố định ${formatVND(Math.round(fixed))} / thu nhập ${formatVND(income)} (${ref.note}).`,
        principle:'Phần chi cố định nên dưới 50% thu nhập (quy tắc 50/30/20).',
        action:{ label:'Xem khoản cố định', view:'recurring' },
      });
    } else if(ratio > 50){
      add({
        id:'fixed-high', level:'warn', priority:60,
        title:`Nghĩa vụ cố định chiếm ${ratio.toFixed(0)}% thu nhập`,
        body:`Chuẩn 50/30/20 gợi ý phần thiết yếu nên dưới 50%. Bạn đang vượt ${formatVND(Math.round(fixed - income*0.5))} mỗi tháng. `
           + 'Chưa đến mức nguy hiểm, nhưng nên rà lại xem có khoản nào đã hết cần thiết mà vẫn tự động chạy.',
        evidence:`Cố định ${formatVND(Math.round(fixed))} / thu nhập ${formatVND(income)} (${ref.note}).`,
        principle:'Quy tắc 50/30/20.',
        action:{ label:'Xem khoản cố định', view:'recurring' },
      });
    }
  }

  /* --- 6. Tỷ lệ trả nợ / thu nhập (DTI) --- */
  if(income > 0 && debts.length){
    const debtPay = debts.filter(d => !d.noSchedule).reduce((s,d)=>s+d.minPayment,0);
    const dti = debtPay / income * 100;
    if(dti > 200){
      add({
        id:'dti-absurd', level:'critical', priority:84,
        title:'Khoản trả nợ ' + formatVND(debtPay) + '/tháng vượt xa thu nhập đang ghi nhận',
        body:'Con số này thường xuất hiện khi thu nhập chưa được ghi đủ. Hãy kiểm tra lại phần thu nhập; '
           + 'nếu số liệu đã đúng thì cần thương lượng giãn kỳ ngay, vì lịch trả hiện tại không thể duy trì.',
        evidence:`Trả nợ ${formatVND(debtPay)}/tháng · thu nhập tham chiếu ${formatVND(income)} (${ref.note}).`,
        principle:'Ngưỡng DTI 36% dùng trong thẩm định tín dụng.',
        action:{ label:'Xem nợ', view:'debt' },
      });
    } else if(dti > 36){
      add({
        id:'dti-high', level:'critical', priority:85,
        title:`Trả nợ chiếm ${dti.toFixed(0)}% thu nhập — vượt ngưỡng an toàn 36%`,
        body:'Ngân hàng thường coi mức trên 36% là dấu hiệu quá tải nợ. Nên tạm dừng mọi khoản vay mới, và cân nhắc thương lượng giãn kỳ với các khoản vay cá nhân trước khi rơi vào trả nợ bằng nợ.',
        evidence:`Trả nợ ${formatVND(debtPay)}/tháng trên thu nhập ${formatVND(income)} (${ref.note}). Tổng dư nợ ${formatVND(totalDebt)}.`,
        principle:'Ngưỡng DTI 36% được dùng phổ biến trong thẩm định tín dụng.',
        action:{ label:'Xem nợ', view:'debt' },
      });
    }
  }

  /* --- 7. Thứ tự trả nợ: Avalanche (lãi cao trước) --- */
  const interestDebts = debts.filter(d => (d.rate||0) > 0).sort((a,b) => b.rate - a.rate);
  if(interestDebts.length >= 2){
    const top = interestDebts[0];
    add({
      id:'avalanche', level:'tip', priority:50,
      title:`Ưu tiên dồn tiền trả "${top.name}" (${top.rate}%/năm) trước`,
      body:'Khi có nhiều khoản nợ, trả tối thiểu cho tất cả rồi dồn toàn bộ phần dư vào khoản lãi CAO NHẤT sẽ tiết kiệm tổng tiền lãi nhiều nhất (phương pháp Avalanche). '
         + 'Nếu bạn thấy khó giữ động lực, phương pháp Snowball — trả xong khoản nhỏ nhất trước để có cảm giác thắng — tốn nhiều lãi hơn nhưng tỷ lệ theo được cao hơn. Chọn cái bạn duy trì nổi.',
      evidence:interestDebts.slice(0,3).map(d => `${d.name}: ${d.rate}%/năm, dư ${formatVNDShort(d.balance)}`).join(' · '),
      principle:'Avalanche tối ưu tiền; Snowball tối ưu động lực.',
      action:{ label:'Xem nợ', view:'debt' },
    });
  }

  /* --- 8. Nợ lãi cao trong khi tiết kiệm lãi thấp --- */
  const highRateDebt = debts.filter(d => (d.rate||0) >= 15);
  if(highRateDebt.length && savings > 0){
    const lowPot = DB.savings.filter(p => !p.closed && !p.isEmergency && !p.maturityDate && (p.rate||0) < 6 && p.balance > 0);
    const lowTotal = lowPot.reduce((s,p)=>s+p.balance,0);
    if(lowTotal >= 1000000){
      const d = highRateDebt[0];
      const saved = Math.round(Math.min(lowTotal, d.balance) * (d.rate - 5) / 100);
      add({
        id:'debt-vs-savings', level:'tip', priority:55,
        title:`Trả bớt "${d.name}" (${d.rate}%/năm) sinh lợi hơn để tiền trong gói tiết kiệm lãi thấp`,
        body:`Trả nợ lãi ${d.rate}%/năm là khoản "đầu tư" chắc chắn sinh lợi ${d.rate}%/năm, cao hơn hẳn lãi tiết kiệm. `
           + 'Nhưng đừng dùng quỹ khẩn cấp để trả nợ — mất thanh khoản còn nguy hiểm hơn tiền lãi tiết kiệm được. '
           + 'Chỉ dùng phần tiết kiệm nằm ngoài quỹ khẩn cấp và không có kỳ hạn.',
        evidence:`Có ${formatVND(lowTotal)} trong gói lãi thấp; chuyển sang trả nợ tiết kiệm khoảng ${formatVND(saved)}/năm tiền lãi.`,
        principle:'So sánh lãi vay và lãi gửi trước khi quyết định.',
        impact:{ amount: saved, text:`~${formatVND(saved)}/năm tiền lãi bớt phải trả` },
        action:{ label:'Xem nợ', view:'debt' },
      });
    }
  }

  /* --- 9. Chi phí nhà ở > 30% thu nhập --- */
  if(income > 0){
    const housing = DB.recurring.filter(r => r.type==='expense' && r.active && r.category==='nha-o').reduce((s,r)=>s+normalizeMonthly(r),0);
    if(housing > 0 && housing/income > 0.35){
      add({
        id:'housing-high', level:'warn', priority:58,
        title:`Chi phí nhà ở chiếm ${(housing/income*100).toFixed(0)}% thu nhập`,
        body:'Chuẩn thường dùng là dưới 30%. Đây là khoản khó cắt nhất trong ngắn hạn, nhưng cũng là khoản có tác động lớn nhất nếu thay đổi được — ở ghép, chuyển chỗ gần chỗ làm để bớt cả tiền nhà lẫn tiền đi lại.',
        evidence:`Nhà ở ${formatVND(Math.round(housing))} / thu nhập ${formatVND(income)}.`,
        principle:'Quy tắc chi phí nhà ở dưới 30% thu nhập.',
        action:{ label:'Xem khoản cố định', view:'recurring' },
      });
    }
  }

  /* --- 10. Subscription creep --- */
  const subs = DB.subscriptions.filter(s => s.active !== false);
  if(subs.length){
    const subMonthly = subs.reduce((s,x)=>s+subMonthlyCost(x),0);
    if(income > 0 && subMonthly/income > 0.08){
      add({
        id:'sub-creep', level:'warn', priority:52,
        title:`Subscription chiếm ${(subMonthly/income*100).toFixed(0)}% thu nhập · ${formatVND(Math.round(subMonthly*12))}/năm`,
        body:'Các khoản nhỏ tự động gia hạn rất dễ bị bỏ quên. Cách rà nhanh: với mỗi dịch vụ, tự hỏi “tháng trước tôi có dùng nó không”. Nếu ngập ngừng quá 3 giây thì huỷ. '
           + 'Có thể đăng ký lại bất cứ lúc nào — chi phí của việc huỷ nhầm gần như bằng không.',
        evidence:subs.slice(0,4).map(s => `${s.name} ${formatVNDShort(s.amount)}`).join(' · '),
        principle:'Rà soát định kỳ các khoản tự động gia hạn.',
        action:{ label:'Xem subscription', view:'subscriptions' },
      });
    }
  }

  /* --- 11. Rò rỉ nhỏ --- */
  const leaks = findSmallLeaks();
  if(leaks.length){
    const l = leaks[0];
    add({
      id:'small-leak', level:'tip', priority:42,
      title:`${l.meta.label}: ${l.count} lần trong tháng, tổng ${formatVND(l.total)}`,
      body:`Trung bình ${formatVND(l.avg)}/lần — mỗi lần nhỏ nên không ai để ý, nhưng cả năm là ${formatVND(l.total*12)}. `
         + 'Không cần bỏ hẳn. Giảm một nửa số lần vẫn giữ được niềm vui mà tiết kiệm được phân nửa. '
         + 'Nếu muốn có động lực, gắn khoản tiết kiệm đó vào một mục tiêu cụ thể trong mục Thói quen.',
      evidence:leaks.slice(0,3).map(x => `${x.meta.label}: ${x.count} lần · ${formatVNDShort(x.total)}`).join(' · '),
      principle:'Chi phí nhỏ lặp lại thường lớn hơn chi phí lớn hiếm gặp.',
      impact:{ amount: Math.round(l.total*12/2), text:`~${formatVND(Math.round(l.total*12/2))}/năm nếu giảm một nửa số lần` },
      action:{ label:'Xem thói quen', view:'habits' },
    });
  }

  /* --- 12. Lạm phát lối sống --- */
  const cmp = compareMonths(new Date(), { prorate:true });
  if(cmp.totalBefore > 0 && cmp.incomeBefore > 0){
    const expUp = cmp.totalDelta / cmp.totalBefore * 100;
    const incUp = (cmp.incomeNow - cmp.incomeBefore) / cmp.incomeBefore * 100;
    if(expUp > 20 && expUp > incUp + 15){
      add({
        id:'lifestyle-inflation', level:'warn', priority:56,
        title:`Chi tiêu tăng ${expUp.toFixed(0)}% trong khi thu nhập ${incUp >= 0 ? 'chỉ tăng '+incUp.toFixed(0)+'%' : 'giảm '+Math.abs(incUp).toFixed(0)+'%'}`,
        body:'Đây là dấu hiệu của lạm phát lối sống — mức sống nhích lên nhanh hơn thu nhập. Nếu đó là lựa chọn có ý thức thì không sao; nếu là do trôi theo quán tính thì rất khó nhận ra cho tới khi hết tiền. '
           + 'Mở màn So sánh tháng để biết chính xác danh mục nào phình ra.',
        evidence:`Chi ${formatVND(cmp.totalBefore)} → ${formatVND(cmp.totalNow)}${cmp.up[0] ? ' · tăng mạnh nhất: ' + cmp.up[0].meta.label : ''}.`,
        principle:'Giữ mức sống ổn định khi thu nhập tăng là cách tích luỹ nhanh nhất.',
        action:{ label:'So sánh tháng', view:'compare' },
      });
    }
  }

  /* --- 13. Chi tiêu dồn vào một danh mục --- */
  if(expenseNow > 0){
    const cats = getTopCategoriesThisMonth(20);
    if(cats.length){
      const [cat, amt] = cats[0];
      const share = amt / expenseNow * 100;
      if(share > 45 && cat !== 'nha-o'){
        add({
          id:'concentration', level:'tip', priority:35,
          title:`${catMeta(cat).label} chiếm ${share.toFixed(0)}% tổng chi tháng này`,
          body:'Một danh mục chiếm gần nửa chi tiêu nghĩa là chỉ cần điều chỉnh riêng nó là toàn bộ bức tranh đổi. Đây thường là chỗ dễ tối ưu nhất — nhưng cũng nên kiểm tra xem có phải do một khoản bất thường một lần hay không.',
          evidence:`${catMeta(cat).label}: ${formatVND(amt)} / tổng ${formatVND(expenseNow)}.`,
          principle:'Tập trung vào khoản lớn nhất trước (nguyên tắc 80/20).',
          action:{ label:'Xem giao dịch', view:'transactions' },
        });
      }
    }
  }

  /* --- 14. Chưa đặt ngân sách nào --- */
  if(!DB.budgets.length && expense > 0){
    add({
      id:'no-budget', level:'tip', priority:30,
      title:'Bạn chưa đặt ngân sách cho danh mục nào',
      body:`Không cần đặt cho tất cả — chỉ cần 2–3 danh mục bạn hay vượt là đủ. Dựa trên chi tiêu thực tế, mức khởi điểm hợp lý là quanh ${formatVND(Math.round(expense/3))} cho danh mục lớn nhất. `
         + 'Ngân sách chỉ có tác dụng khi bạn thấy cảnh báo lúc sắp vượt, chứ không phải khi đọc báo cáo cuối tháng.',
      evidence:`Chi trung bình ${formatVND(expense)}/tháng, chưa có ngân sách nào.`,
      principle:'Ngân sách theo danh mục giúp phát hiện lệch sớm.',
      action:{ label:'Đặt ngân sách', view:'budget' },
    });
  }

  /* --- 15. Khoản phải thu để quá lâu --- */
  const oldRecv = getOpenReceivables().filter(r => receivableAgeDays(r) >= 45);
  if(oldRecv.length){
    const t = oldRecv.reduce((s,r)=>s+r.outstanding,0);
    add({
      id:'stale-receivable', level:'tip', priority:38,
      title:formatVND(t) + ' đã nằm ở người khác hơn 45 ngày',
      body:'Tiền cho mượn càng lâu càng khó đòi, và bạn đang mất cả phần lãi lẽ ra nhận được. Cách nhắc đỡ ngại nhất là nhắc kèm một mốc cụ thể — “cuối tháng này mình cần khoản đó để đóng tiền nhà” — thay vì hỏi chung chung.',
      evidence:oldRecv.slice(0,3).map(r => `${r.name}: ${formatVNDShort(r.outstanding)} · ${receivableAgeDays(r)} ngày`).join(' · '),
      principle:'Khoản phải thu là tài sản kém thanh khoản nhất.',
      action:{ label:'Xem phải thu', view:'receivables' },
    });
  }

  /* --- 16. Chưa tự động hoá việc tiết kiệm --- */
  if(!(DB.savingsPlans||[]).some(p => p.active) && !DB.allocationRules.some(r => r.active) && income > 0 && (income - expense) > 500000){
    add({
      id:'automate-savings', level:'tip', priority:48,
      title:'Bạn đang tiết kiệm bằng ý chí, chưa bằng hệ thống',
      body:`Mỗi tháng bạn dôi ra khoảng ${formatVND(income-expense)} nhưng chưa có cơ chế tự trích. `
         + 'Tiết kiệm phần còn lại cuối tháng gần như luôn thất bại vì chi tiêu tự giãn ra cho vừa số tiền có. '
         + 'Đặt một Kế hoạch trích định kỳ vào ngay ngày sau khi lương về, số tiền vừa phải để không phải rút ngược lại.',
      evidence:`Thu ${formatVND(income)} · chi ${formatVND(expense)} · chưa có kế hoạch trích hay quy tắc phân bổ nào.`,
      principle:'"Trả cho mình trước" — tự động hoá thắng ý chí.',
      action:{ label:'Lập kế hoạch trích', view:'savings' },
    });
  }

  /* --- 17. ★ KHỐI LIÊN KẾT 27 — XU HƯỚNG THU NHẬP & DEAL LƯƠNG.
     3 mục, đúng cấu trúc {level,evidence,principle} như mọi mục khác —
     không viết engine riêng cho phần này, chỉ thêm items vào cùng danh
     sách để dùng chung UI, chung cơ chế "Bỏ qua" (S.dismissedAdviceIds). */
  const incSum = summarizeIncomeTrend(6);
  if(incSum.months >= 2){
    // 17a. Cảnh báo định tính — thu nhập giảm liên tục nhiều tháng
    if(incSum.consecutiveDown >= 3){
      add({
        id:'income-declining', level:'warn', priority:62,
        title:`Tổng thu nhập giảm ${incSum.consecutiveDown} tháng liên tiếp`,
        body:'Đây là cảnh báo dạng xu hướng, không phải kết luận — nguyên nhân có thể là mùa vụ (ví dụ Be ít cuốc dịp lễ, hoặc giảm giờ chạy), hoặc do biến động thật ở công việc chính. '
           + 'Xem tab Xu hướng thu nhập trong mục So sánh để biết nguồn nào đang kéo tổng xuống, rồi mới quyết định có cần điều chỉnh chi tiêu hay tìm thêm nguồn không.',
        evidence:`Xu hướng ${incSum.months} tháng gần nhất, giảm liên tục từ tháng gần nhất trở về trước.`,
        principle:'Xu hướng nhiều tháng đáng tin hơn một tháng đơn lẻ.',
        action:{ label:'Xem xu hướng', view:'compare' },
      });
    }
    // 17b. Thu nhập tăng chậm hơn lạm phát đã cấu hình (chỉ khi Quang đã bật)
    const gia = estimateInflationForPeriod(incSum.months);
    if(gia.mode !== 'off' && incSum.growthRate !== null){
      const real = incSum.growthRate - gia.percent;
      if(real < -3){
        add({
          id:'income-below-inflation', level:'warn', priority:54,
          title:`Thu nhập tăng chậm hơn lạm phát ước tính khoảng ${Math.abs(Math.round(real*10)/10)}%`,
          body:'Số tuyệt đối có thể vẫn tăng, nhưng sức mua thực tế đang giảm dần. Đây là lúc đáng cân nhắc: (1) trao đổi tăng lương ở việc chính nếu đã lâu chưa điều chỉnh, (2) hoặc tăng thời lượng/hiệu suất chạy Be nếu còn dư sức, (3) hoặc chủ động điều chỉnh kế hoạch chi tiêu/tiết kiệm cho phù hợp với sức mua thực tế mới.',
          evidence:`Thu nhập +${incSum.growthRate}% trong ${incSum.months} tháng · lạm phát ước tính ${gia.percent}% (${gia.mode==='preset'?'mức năm tự nhập':'tự nhập theo tháng'}).`,
          principle:'So sánh tăng trưởng danh nghĩa với lạm phát để biết sức mua thực tế.',
          action:{ label:'Xem xu hướng', view:'compare' },
        });
      }
    }
    // 17c. Đề xuất deal lương — chỉ khi có tín hiệu đủ mạnh, dùng dữ liệu nội bộ
    // + input thị trường/KPI nếu Quang đã nhập (S.marketSalaryRef, lastReviewRating).
    const S = DB.settings;
    const monthsSinceReview = S.lastReviewDate ? daysBetween(S.lastReviewDate, todayISO())/30 : null;
    const longSinceReview = monthsSinceReview === null || monthsSinceReview >= 11;
    // Chỉ xét riêng "lương" (category luong) — không gộp thưởng/đầu tư/khác vào đây,
    // vì mục này đánh giá cụ thể lương cố định từ việc chính, không phải tổng thu nhập.
    const luongShare = incSum.catShare.luong || 0;
    const luongTrend = incSum.trend.length >= 2 && incSum.trend[0].byCat.luong > 0
      ? Math.round((incSum.trend[incSum.trend.length-1].byCat.luong - incSum.trend[0].byCat.luong) / incSum.trend[0].byCat.luong * 1000) / 10
      : null;
    const strongInternal = luongShare >= 40 && luongTrend !== null && luongTrend <= 2 && incSum.months >= 4;
    if(strongInternal && longSinceReview){
      const marketNote = S.marketSalaryRef > 0
        ? `Mức bạn tự khai tham khảo trên thị trường là ${formatVND(S.marketSalaryRef)}/tháng — so với lương hiện tại, tự đối chiếu để cân nhắc mức đề xuất.`
        : 'Bạn chưa nhập mức lương thị trường tham khảo — vào Cài đặt để nhập nếu muốn lời khuyên cụ thể hơn về con số nên đề xuất.';
      add({
        id:'salary-negotiation', level:'tip', priority:44,
        title:'Có thể đã đến lúc cân nhắc trao đổi tăng lương ở việc chính',
        body:`Lương gần như đứng yên trong ${incSum.months} tháng gần đây (chỉ +${luongTrend}%)${S.lastReviewDate ? `, và lần đánh giá gần nhất đã hơn ${Math.round(monthsSinceReview)} tháng` : ''}. `
           + `${marketNote} Đây chỉ là tín hiệu để cân nhắc thời điểm — không thay thế đánh giá thực tế về hiệu suất công việc và tình hình công ty của bạn.`,
        evidence:`Lương chiếm ${luongShare}% tổng thu nhập · thay đổi ${incSum.months} tháng: +${luongTrend}%${S.lastReviewRating ? ` · đánh giá gần nhất: "${escapeHtml(S.lastReviewRating)}"` : ''}.`,
        principle:'Lương trì trệ kéo dài trong khi vẫn là nguồn thu chính là tín hiệu đáng trao đổi.',
        action:{ label:'Cập nhật thông tin', view:'settings' },
      });
    }
  }

  /* --- 18. ★ v18.3 — CẢNH BÁO SỚM THEO DỰ BÁO 6 THÁNG.
     Dùng cùng hàm dự báo với Dashboard (không có logic riêng). Nếu lương
     đang nhập tay (chưa khai thu cố định), đường thận trọng không có lương
     → sẽ báo động giả; khi đó dùng đường kỳ vọng và nói rõ. */
  const f6 = computeCashflowForecast(null, { months: 6 });
  const useExpected = f6.irregular.salaryManual;
  const dDate = useExpected ? f6.expectedDangerDate : f6.dangerDate;
  const buf = DB.settings.safetyBuffer || 0;
  if(dDate){
    const daysAway = Math.max(0, daysBetween(todayISO(), dDate));
    const lowDay = f6.days.reduce((m,d) => {
      const v = useExpected ? d.expected : d.balance;
      return v < m.v ? { v, date: d.date } : m;
    }, { v: Infinity, date: dDate });
    const shortfall = Math.max(0, Math.round(buf - lowDay.v));
    const level = daysAway <= 14 ? 'critical' : daysAway <= 45 ? 'warn' : 'tip';
    add({
      id:'forecast-early-warning', level, priority: level==='critical' ? 90 : level==='warn' ? 64 : 46,
      horizon: daysAway <= 14 ? 'now' : daysAway <= 45 ? 'month' : 'long',
      title:`Dự báo: số dư xuống dưới ngưỡng an toàn từ ${formatDate(dDate)}${daysAway > 0 ? ` (còn ${daysAway} ngày)` : ''}`,
      body: (useExpected
          ? 'Tính theo đường <b>kỳ vọng</b> (có cộng thu nhập không đều), vì lương đang nhập tay nên đường thận trọng chưa có lương. '
          : (f6.expectedDangerDate ? 'Cả đường thận trọng lẫn đường kỳ vọng đều chạm ngưỡng. '
             : 'Đây là đường <b>thận trọng</b> (chỉ tính thu cố định). Nếu thu nhập không đều như chạy Be, thưởng giữ mức trung bình thì vẫn qua được — nhưng phần đó không chắc chắn. '))
         + 'Còn thời gian thì xử lý từ từ được: dời một khoản chi lớn, tạm giảm trích tiết kiệm, hoặc tăng thu trước mốc này. Mở biểu đồ dự báo ở Dashboard, chọn 6T để xem khoản nào kéo số dư xuống.',
      evidence:`Điểm thấp nhất ${formatVND(Math.round(lowDay.v))} ngày ${formatDate(lowDay.date)} · ngưỡng an toàn ${formatVND(buf)} · chi linh hoạt ${formatVND(Math.round(f6.rawBurn))}/ngày.`,
      principle:'Thấy trước vài tháng thì chỉ cần chỉnh nhẹ; thấy trước vài ngày thì phải cắt gắt.',
      impact: shortfall > 0 ? (() => {
        const perDay = Math.ceil(shortfall / Math.max(1, daysBetween(todayISO(), lowDay.date)));
        // Cắt chi linh hoạt chỉ là lời khuyên hợp lý khi nó thực sự đủ bù
        const tail = daysAway <= 0 ? ''
          : perDay <= f6.rawBurn * 0.6
            ? ` — tương đương bớt ${formatVND(perDay)}/ngày chi linh hoạt từ hôm nay`
            : ` — lớn hơn mức cắt giảm chi tiêu hằng ngày có thể bù (đang tiêu ${formatVND(Math.round(f6.rawBurn))}/ngày), cần dời khoản chi lớn hoặc tăng thu`;
        return { amount: shortfall, text:`Cần bù ~${formatVND(shortfall)} trước ${formatDate(lowDay.date)}${tail}` };
      })() : null,
      action:{ label:'Xem dự báo', view:'dashboard' },
    });
  } else if(f6.days.length > 60){
    add({
      id:'forecast-6m-ok', level:'good', priority:8,
      title:'Dòng tiền 6 tháng tới không chạm ngưỡng an toàn',
      body: (useExpected
          ? 'Tính theo đường kỳ vọng (có cộng thu nhập không đều) vì lương đang nhập tay, chưa khai là thu cố định. '
          : 'Với các khoản thu/chi cố định đã khai báo và tốc độ chi linh hoạt hiện tại, ')
         + 'số dư dự kiến luôn trên mức đệm an toàn. Giữ nhịp này.',
      evidence:`Điểm thấp nhất ${formatVND(f6.low.balance)} ngày ${formatDate(f6.low.date)} · cuối kỳ ${formatVND(f6.endBalance)}.`,
      principle:'Dự báo xa giúp quyết định sớm, không phải chạy theo.',
    });
  }

  /* --- 19. ★ v18.3 — DANH MỤC CHI TĂNG BẤT THƯỜNG so với CHÍNH MÌNH.
     So 30 ngày gần nhất với mức trung bình/30 ngày của tối đa 90 ngày trước
     đó — cửa sổ trượt nên không bị lệch vì đang ở đầu hay cuối tháng. */
  const anomalies = detectCategoryAnomalies();
  if(anomalies.length){
    const top = anomalies[0];
    // Chỉ quy ra "mỗi năm" khi chi lặp lại (≥3 lần) — nhân 12 một khoản mua đơn lẻ là suy diễn sai
    const extraYear = top.oneOff ? 0 : Math.round(top.diff * 12);
    add({
      id:'category-anomaly', level: top.oneOff ? 'tip' : 'warn', priority: top.oneOff ? 36 : 57, horizon:'month',
      title: top.oneOff
        ? `${top.meta.icon} ${top.meta.label}: ${top.count === 1 ? '1 khoản chi lớn' : top.count + ' khoản chi lớn'} ${formatVND(top.recent)} trong 30 ngày${top.baseline > 0 ? `, mức thường ~${formatVNDShort(top.baseline)}` : ''}`
        : top.baseline > 0
        ? `${top.meta.icon} ${top.meta.label}: 30 ngày qua chi ${formatVND(top.recent)}, gấp ${(top.recent/top.baseline).toFixed(1)} lần mức thường`
        : `${top.meta.icon} ${top.meta.label}: khoản chi mới phát sinh ${formatVND(top.recent)} trong 30 ngày`,
      body:'Đây là so với <b>chính thói quen của bạn</b>, không phải chuẩn chung. Có thể do một khoản chi có chủ đích (mua đồ lớn, sửa xe…) — nếu vậy cứ bấm Bỏ qua. '
         + 'Nếu không, hãy xem lại các giao dịch của danh mục này trong 30 ngày qua.',
      evidence: anomalies.slice(0,3).map(a => `${a.meta.label}: ${formatVNDShort(a.recent)} (thường ~${formatVNDShort(a.baseline)}/30 ngày)`).join(' · '),
      principle:'So với chính mình trước đây nhạy hơn so với trung bình xã hội.',
      impact: extraYear > 0 ? { amount: extraYear, text:`~${formatVND(extraYear)}/năm nếu mức chi mới này kéo dài` } : null,
      action:{ label:'Xem giao dịch', view:'transactions' },
    });
  }

  // ★ v18.3: xếp mỗi lời khuyên vào 1 mốc hành động. Mục tự khai horizon thì
  //   giữ nguyên; còn lại suy từ mức độ. Ghi chú về dữ liệu tách riêng.
  const NOTE_IDS = ['no-data', 'partial-first-month', 'thin-income-data'];
  out.forEach(a => {
    if(a.horizon) return;
    a.horizon = NOTE_IDS.includes(a.id) ? 'note'
              : a.level === 'critical' ? 'now'
              : a.level === 'warn' ? 'month' : 'long';
  });

  return out
    .filter(a => a.level === 'critical' || !DB.settings.dismissedAdviceIds.includes(a.id))
    .sort((a,b) => b.priority - a.priority);
}

/* ★ v18.3 — Danh mục chi tiêu tăng bất thường (chỉ chi nhập tay = chi hành vi,
   loại khoản tự động như tiền nhà, subscription vì chúng không phản ánh thói quen).
   Cần ít nhất 30 ngày dữ liệu nền trước cửa sổ 30 ngày gần nhất. */
function detectCategoryAnomalies(){
  const today = todayISO();
  const first = getFirstDataDate();
  const recentFrom = shiftISO(today, -29);
  const baseTo = shiftISO(today, -30);
  const baseFrom = [shiftISO(today, -119), first].sort()[1];
  const baseDays = daysBetween(baseFrom, baseTo) + 1;
  if(baseDays < 30) return [];
  const minDelta = Math.max(300000, DB.settings.compareMinDelta || 0);
  const recent = {}, count = {}, base = {};
  DB.transactions.forEach(t => {
    if(t.type !== 'expense' || !isPL(t) || (t.source && t.source.kind !== 'manual')) return;
    if(t.date >= recentFrom && t.date <= today){
      recent[t.category] = (recent[t.category] || 0) + t.amount;
      count[t.category] = (count[t.category] || 0) + 1;
    }
    else if(t.date >= baseFrom && t.date <= baseTo) base[t.category] = (base[t.category] || 0) + t.amount;
  });
  return Object.keys(recent).map(cat => {
    const r = recent[cat];
    const b = Math.round((base[cat] || 0) / baseDays * 30);
    // count ≤ 2: nhiều khả năng là 1–2 khoản chi lớn đơn lẻ, không phải thói quen mới
    return { cat, meta: catMeta(cat), recent: r, baseline: b, diff: r - b, count: count[cat], oneOff: count[cat] <= 2 };
  }).filter(x => x.baseline > 0
      ? (x.recent >= x.baseline * 1.4 && x.diff >= minDelta)
      : (x.recent >= Math.max(500000, minDelta)))
    // Thói quen chi lặp lại xếp trước khoản mua lớn đơn lẻ, cùng loại thì theo mức tăng
    .sort((a,b) => (a.oneOff - b.oneOff) || (b.diff - a.diff));
}

/* Điểm của một dịch vụ tại giờ & ngày cho trước */
function bePointsFor(svc, hour, dayCol){
  const row = (svc.rows||[]).find(r => r.from <= hour && hour < r.to);
  if(row) return row.pts[dayCol];
  if(svc.fallback) return svc.fallback[dayCol];
  return null;
}
/* Xếp hạng mọi dịch vụ theo điểm tại một thời điểm */
function beRankServices(hour, dayCol){
  return (DB.gig.rules.services||[])
    .map(s => ({ ...s, points: bePointsFor(s, hour, dayCol) }))
    .filter(s => s.points !== null)
    .sort((a,b) => b.points - a.points);
}
/* Các khung giờ "vàng" trong ngày: nơi một dịch vụ đạt điểm cao nhất của nó */
function beGoldenWindows(dayCol){
  const out = [];
  (DB.gig.rules.services||[]).forEach(s => {
    const rows = (s.rows||[]);
    if(!rows.length) return;
    const max = Math.max(...rows.map(r => r.pts[dayCol]));
    const base = s.fallback ? s.fallback[dayCol] : Math.min(...rows.map(r => r.pts[dayCol]));
    if(max <= base) return;
    rows.filter(r => r.pts[dayCol] === max).forEach(r =>
      out.push({ svc:s.name, icon:s.icon, from:r.from, to:r.to, points:max }));
  });
  return out.sort((a,b) => a.from - b.from || b.points - a.points);
}

/* Mốc thưởng đang ở đâu với số điểm hiện có */
function beMilestoneStatus(points, date){
  const weekend = beIsWeekendRate(date);
  const ms = (DB.gig.rules.milestones||[]).slice().sort((a,b)=>a.points-b.points);

    if(points >= m.points) reached = m;
    else if(!next) next = m;
  });
  const rate = m => weekend ? m.weekend : m.weekday;
  return {
    weekend, points,
    reached, next,
    earned: reached ? rate(reached) : 0,
    nextGap: next ? next.points - points : 0,
    nextReward: next ? rate(next) : 0,
    gain: next ? rate(next) - (reached ? rate(reached) : 0) : 0,
    all: ms.map(m => ({ ...m, reward: rate(m), done: points >= m.points })),
  };
}

/* ---------------------------------------------------------------- KHỞI TẠO */
function gigInit(){
  if(!DB.gig){
    DB.gig = {
      enabled:false, platform:'Be', city:'TP.HCM',
      shifts:[], vehicleCosts:[],
      goals:{ daily:0, weekly:0, monthly:0, yearly:0 },
      rules: JSON.parse(JSON.stringify(GIG_DEFAULT_RULES)),
      accountId:null, incomeCategory:'freelance', costCategory:'di-chuyen',
      defaultRevenueMode:'gross', defaultCommissionMode:'percent', defaultCommissionValue:0,
    };
  }
  const g = DB.gig;
  if(!Array.isArray(g.shifts)) g.shifts = [];
  if(!Array.isArray(g.vehicleCosts)) g.vehicleCosts = [];
  if(!Array.isArray(g.bonusPayouts)) g.bonusPayouts = [];   // sổ đối soát thưởng tuần
  if(!Array.isArray(g.programs)) g.programs = [];           // chương trình ngắn hạn
  if(!g.goals) g.goals = { daily:0, weekly:0, monthly:0, yearly:0 };
  if(!g.rules || !g.rules.services || !g.rules.milestones){
    g.rules = JSON.parse(JSON.stringify(GIG_DEFAULT_RULES));   // nâng từ bản cũ chưa có bảng điểm
  }
  if(!g.rules.modifiers) g.rules.modifiers = GIG_DEFAULT_RULES.modifiers;
  if(!g.accountId || !DB.accounts.some(a=>a.id===g.accountId)) g.accountId = DB.settings.defaultAccountId;
  if(!g.incomeCategory) g.incomeCategory = 'freelance';
  if(!g.costCategory) g.costCategory = 'di-chuyen';
  if(!g.defaultRevenueMode) g.defaultRevenueMode = 'gross';
  if(!g.defaultCommissionMode) g.defaultCommissionMode = 'percent';
  if(g.defaultCommissionValue === undefined) g.defaultCommissionValue = 0;
  delete g.vehicle;   // chỉ còn be 2 bánh
  /* Nâng cấp ca cũ sang mô hình nhập linh hoạt */
  g.shifts.forEach(sh => {
    if(!sh.revenueMode){
      sh.revenueMode = 'gross';
      sh.revenue = sh.gross || 0;
      sh.commissionMode = 'amount';
      sh.commissionValue = sh.commission || 0;
    }
    if(sh.area !== undefined) delete sh.area;   // bỏ ô khu vực: chạy random, không biết trước
    if(sh.limitedBonus === undefined) sh.limitedBonus = 0;   // thưởng chương trình ngắn hạn
  });
}

/* ---------------------------------------------------------------- TÍNH TOÁN */
function shiftHours(sh){
  if(!sh.start || !sh.end) return 0;
  const [h1,m1] = sh.start.split(':').map(Number);
  const [h2,m2] = sh.end.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if(mins <= 0) mins += 24*60;
  return mins / 60;
}

/* ★ NHẬP LINH HOẠT
   revenueMode  : 'gross' = doanh thu TRƯỚC chiết khấu · 'net' = thực nhận SAU chiết khấu
   commissionMode: 'percent' = % chiết khấu · 'amount' = số tiền cụ thể
   Bốn tổ hợp đều quy về cùng một bộ số: gross, commission, net. */
function shiftMoney(sh){
  const rev = Math.round(sh.revenue || 0);
  const cm = sh.commissionMode || 'amount';
  const cv = Number(sh.commissionValue || 0);
  let gross, commission;
  if((sh.revenueMode || 'gross') === 'gross'){
    gross = rev;
    commission = cm === 'percent' ? Math.round(rev * clamp(cv,0,100) / 100) : Math.round(cv);
  } else {
    // Đã là tiền thực nhận. Suy ngược doanh thu gốc:  net = gross × (1 − p)
    if(cm === 'percent'){
      const p = clamp(cv, 0, 99.9);
      gross = Math.round(rev / (1 - p/100));
      commission = gross - rev;
    } else {
      commission = Math.round(cv);
      gross = rev + commission;
    }
  }
  commission = Math.max(0, Math.min(commission, gross));
  const afterCom = gross - commission;
  const net = afterCom + (sh.bonus||0) + (sh.tips||0);
  return { gross, commission, afterCom, net: Math.round(net) };
}
function shiftNet(sh){ return shiftMoney(sh).net; }
function shiftProfit(sh){ return shiftNet(sh) - (sh.fuel||0); }
function shiftPerHour(sh){ const h = shiftHours(sh); return h > 0 ? Math.round(shiftProfit(sh)/h) : 0; }
function shiftTakeRate(sh){ const m = shiftMoney(sh); return m.gross > 0 ? m.commission/m.gross*100 : 0; }

function gigShiftsInRange(fromISO, toISO){
  return DB.gig.shifts.filter(s => s.date >= fromISO && s.date <= toISO)
                      .sort((a,b) => a.date.localeCompare(b.date));
}
function gigCostsInRange(fromISO, toISO){
  return DB.gig.vehicleCosts.filter(c => c.date >= fromISO && c.date <= toISO)
                            .sort((a,b) => b.date.localeCompare(a.date));
}

/* Tổng hợp. `vehicleCost` là chi phí xe RIÊNG (bảo dưỡng, nhớt…), tách khỏi
   xăng theo ca — vì hai loại này có nhịp phát sinh hoàn toàn khác nhau. */
function gigSummary(list, costList){
  const money = list.map(shiftMoney);
  const gross = money.reduce((s,m)=>s+m.gross,0);
  const commission = money.reduce((s,m)=>s+m.commission,0);
  const bonus = list.reduce((s,x)=>s+(x.bonus||0),0);
  // Thưởng mốc + CT giới hạn KHÔNG nằm ở đây: chúng chỉ vào sổ khi tiền thật về ví
  const limitedBonus = list.reduce((s,x)=>s+(x.limitedBonus||0),0);
  const tips = list.reduce((s,x)=>s+(x.tips||0),0);
  const fuel = list.reduce((s,x)=>s+(x.fuel||0),0);
  const vehicleCost = (costList||[]).reduce((s,c)=>s+(c.amount||0),0);
  const trips = list.reduce((s,x)=>s+(x.trips||0),0);
  const points = list.reduce((s,x)=>s+(x.points||0),0);
  const hours = list.reduce((s,x)=>s+shiftHours(x),0);
  const net = gross - commission + bonus + tips;
  const afterFuel = net - fuel;
  const profit = afterFuel - vehicleCost;
  return {
    n:list.length, gross, commission, bonus, tips, limitedBonus, fuel, vehicleCost, trips, points, hours,
    net: Math.round(net), afterFuel: Math.round(afterFuel), profit: Math.round(profit),
    perHour: hours > 0 ? Math.round(afterFuel/hours) : 0,
    perHourAll: hours > 0 ? Math.round(profit/hours) : 0,
    perTrip: trips > 0 ? Math.round(afterFuel/trips) : 0,
    takeRate: gross > 0 ? commission/gross*100 : 0,
    days: new Set(list.map(x=>x.date)).size,
  };
}
function gigRangeSummary(fromISO, toISO){
  return gigSummary(gigShiftsInRange(fromISO,toISO), gigCostsInRange(fromISO,toISO));
}

function weekRangeOf(dateISO){
  const d = new Date(dateISO + 'T12:00:00');
  const dow = (d.getDay() + 6) % 7;
  const mon = new Date(d); mon.setDate(d.getDate() - dow);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { from: toLocalISO(mon), to: toLocalISO(sun) };
}

/* Hiệu quả theo TỪNG GIỜ trong ngày, tính từ dữ liệu thật của người dùng */
function gigHourPerformance(){
  const hours = Array.from({length:24}, (_,h)=>({ hour:h, hours:0, profit:0 }));
  DB.gig.shifts.forEach(sh => {
    const h = shiftHours(sh); if(h <= 0) return;
    const pf = shiftNet(sh) - (sh.fuel||0);
    const [sh1,sm1] = sh.start.split(':').map(Number);
    const startMin = sh1*60 + sm1, totalMin = h*60;
    for(let m = 0; m < totalMin; m += 15){
      const hr = Math.floor(((startMin + m) % 1440) / 60);
      hours[hr].hours += 0.25;
      hours[hr].profit += pf * (0.25/h);
    }
  });
  return hours.map(x => ({ ...x, profit: Math.round(x.profit),
    perHour: x.hours > 0 ? Math.round(x.profit/x.hours) : null }));
}

/* Các điểm cộng đang có hiệu lực NGAY LÚC NÀY */
function gigActiveModifiers(){
  const now = new Date();
  const hour = now.getHours(), dow = now.getDay();
  return (DB.gig.rules.modifiers||[]).filter(m => {
    if(m.days && !m.days.includes(dow)) return false;
    if(!m.windows || !m.windows.length) return true;
    return m.windows.some(([a,b]) => a < b ? (hour >= a && hour < b) : (hour >= a || hour < b));
  });
}

/* ---------------------------------------------------------------- GHI DỮ LIỆU */
function saveGigShift(data, editId){
  gigInit();
  const g = DB.gig;
  if(editId){
    const old = g.shifts.find(s => s.id === editId);
    if(old){
      if(old.txId) unpostTransaction(old.txId, { deferSave:true });
      if(old.fuelTxId) unpostTransaction(old.fuelTxId, { deferSave:true });
      g.shifts = g.shifts.filter(s => s.id !== editId);
    }
  }
  const sh = {
    id: editId || uid('gig'),
    date: data.date || todayISO(),
    start: data.start || '', end: data.end || '',
    revenueMode: data.revenueMode || 'gross',
    revenue: Math.round(data.revenue||0),
    commissionMode: data.commissionMode || 'percent',
    commissionValue: Number(data.commissionValue||0),
    bonus: Math.round(data.bonus||0),
    tips: Math.round(data.tips||0),
    fuel: Math.round(data.fuel||0),
    limitedBonus: Math.round(data.limitedBonus||0),
    trips: Math.round(data.trips||0),
    points: Math.round(data.points||0),
    note: data.note || '',
    accountId: data.accountId || g.accountId,
  };
  const net = shiftNet(sh);
  if(net > 0){
    const tx = postTransaction({
      type:'income', category: g.incomeCategory, amount: net, date: sh.date,
      note:'Chạy xe ' + g.platform + (sh.trips ? ' · ' + sh.trips + ' cuốc' : ''),
      tags:['tai-xe'], accountId: sh.accountId, source:{ kind:'gig', id:sh.id },
    }, { deferSave:true });
    sh.txId = tx.id;
  }
  if(sh.fuel > 0){
    const txf = postTransaction({
      type:'expense', category: g.costCategory, amount: sh.fuel, date: sh.date,
      note:'Xăng ca ' + formatDate(sh.date), tags:['tai-xe','xang'],
      accountId: sh.accountId, source:{ kind:'gig', id:sh.id },
    }, { deferSave:true });
    sh.fuelTxId = txf.id;
  }
  g.shifts.push(sh);
  g.shifts.sort((a,b) => b.date.localeCompare(a.date));
  saveDB();
  return sh;
}

function deleteGigShift(id){
  const sh = DB.gig.shifts.find(s => s.id === id);
  if(!sh) return;
  confirmDelete(`Xoá ca ngày ${formatDate(sh.date)}? Giao dịch thu nhập ${formatVND(shiftNet(sh))} tương ứng cũng bị gỡ và số dư hoàn lại.`,
    () => applyDeleteGigShift(id));
}
function applyDeleteGigShift(id){
  const sh = DB.gig.shifts.find(s => s.id === id);
  if(!sh) return;
  if(sh.txId) unpostTransaction(sh.txId, { deferSave:true });
  if(sh.fuelTxId) unpostTransaction(sh.fuelTxId, { deferSave:true });
  DB.gig.shifts = DB.gig.shifts.filter(s => s.id !== id);
  saveDB(); closeModal(); refreshCurrentView();
  showToast('Đã xoá ca · số dư đã hoàn lại', 'ok');
}

/* ---- Chi phí xe: khoản không gắn với một ca cụ thể ---- */
const VEHICLE_COST_TYPES = [
  { id:'bao-duong', label:'Bảo dưỡng', icon:'🔧' },

  { id:'rua-xe',    label:'Rửa xe',     icon:'🧼' },
  { id:'bao-hiem',  label:'Bảo hiểm / đăng kiểm', icon:'📄' },
  { id:'phu-tung',  label:'Phụ tùng',   icon:'🔩' },
  { id:'khac',      label:'Khác',       icon:'📦' },
];

function saveVehicleCost(data, editId){
  gigInit();
  const g = DB.gig;
  if(editId){
    const old = g.vehicleCosts.find(c => c.id === editId);
    if(old && old.txId) unpostTransaction(old.txId, { deferSave:true });
    g.vehicleCosts = g.vehicleCosts.filter(c => c.id !== editId);
  }
  const c = {
    id: editId || uid('vcost'),
    date: data.date || todayISO(),
    type: data.type || 'khac',
    amount: Math.round(data.amount||0),
    odo: Math.round(data.odo||0),
    note: data.note || '',
    accountId: data.accountId || g.accountId,
  };
  if(c.amount > 0){
    const meta = VEHICLE_COST_TYPES.find(t => t.id === c.type) || VEHICLE_COST_TYPES[7];
    const tx = postTransaction({
      type:'expense', category: g.costCategory, amount: c.amount, date: c.date,
      note:'Chi phí xe · ' + meta.label + (c.note ? ' · ' + c.note : ''),
      tags:['tai-xe','chi-phi-xe'], accountId: c.accountId, source:{ kind:'gig-cost', id:c.id },
    }, { deferSave:true });
    c.txId = tx.id;
  }
  g.vehicleCosts.push(c);
  g.vehicleCosts.sort((a,b) => b.date.localeCompare(a.date));
  saveDB();
  return c;
}
function deleteVehicleCost(id){
  const c = DB.gig.vehicleCosts.find(x => x.id === id);

  if(c.txId) unpostTransaction(c.txId, { deferSave:true });

  saveDB(); closeModal(); refreshCurrentView();
  showToast('Đã xoá chi phí xe · số dư đã hoàn lại', 'ok');
}

function renderGigGoals(today, wk, month){
  const g = DB.gig.goals;
  const y = new Date().getFullYear();
  const year = gigRangeSummary(`${y}-01-01`, `${y}-12-31`);
  const rows = [
    ['Hôm nay', g.daily, today.profit], ['Tuần này', g.weekly, wk.profit],
    ['Tháng này', g.monthly, month.profit], ['Năm nay', g.yearly, year.profit],
  ].filter(r => r[1] > 0);

  if(!rows.length) return `
    <div class="card rounded-xl2 p-4 shadow-card flex flex-wrap items-center justify-between gap-2">
      <p class="text-[12.5px] text-ink-500 dark:text-ink-300">Chưa đặt mục tiêu thu nhập. Có mục tiêu thì mới biết hôm nay nên chạy tới mấy giờ.</p>
      <button onclick="setGigTab('settings')" class="text-[12px] font-semibold text-brand-600 shrink-0">Đặt mục tiêu →</button>
    </div>`;

  return `
    <div class="card rounded-xl2 p-5 shadow-card">
      <div class="flex items-center justify-between mb-3">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">Tiến độ mục tiêu</p>
        <button onclick="setGigTab('settings')" class="text-[11.5px] font-semibold text-brand-600">Sửa</button>
      </div>
      <div class="space-y-3">
        ${rows.map(([label, target, actual]) => {
          const pct = clamp(actual/target*100, 0, 100);
          const left = target - actual, hourly = wk.perHour || 0;
          return `
          <div>
            <div class="flex flex-wrap justify-between gap-x-2 text-[12px] mb-1">
              <span class="text-ink-600 dark:text-ink-300">${label}</span>
              <span class="tabnum ${actual>=target?'text-ok-600 font-semibold':'text-ink-700 dark:text-ink-200'}">${formatVND(actual)} / ${formatVND(target)}</span>
            </div>
            <div class="progress-track h-2"><div class="progress-fill ${actual>=target?'bg-ok-500':'bg-brand-500'}" style="width:${pct}%"></div></div>
            <p class="text-[11px] text-ink-400 mt-1">${actual>=target ? '✓ Đã đạt, vượt ' + formatVND(actual-target)
              : `Còn thiếu ${formatVND(left)}` + (hourly>0 ? ` ≈ ${(left/hourly).toFixed(1)} giờ chạy nữa theo mức ${formatVND(hourly)}/giờ của bạn` : '')}</p>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderGigWeekTab(wk, shifts, sum){
  const days = []; for(let i=0;i<7;i++) days.push(shiftISO(wk.from, i));
  const dowNames = ['T2','T3','T4','T5','T6','T7','CN'];
  const maxProfit = Math.max(...days.map(d => gigRangeSummary(d,d).profit), 1);

  return `
    <div class="card rounded-xl2 p-5 shadow-card">
      <div class="flex items-center justify-between mb-3">
        <button onclick="gigShiftWeek(-1)" class="p-2 rounded-lg surface-2 text-ink-500 hover:bg-ink-100 dark:hover:bg-white/10">‹</button>
        <div class="text-center">
          <p class="font-display font-700 text-[13.5px] text-ink-800 dark:text-ink-100">${formatDate(wk.from)} – ${formatDate(wk.to)}</p>
          <p class="text-[11px] text-ink-400">${sum.n} ca · ${sum.hours.toFixed(1)} giờ · ${sum.trips} cuốc · ${sum.points} điểm</p>
        </div>
        <button onclick="gigShiftWeek(1)" class="p-2 rounded-lg surface-2 text-ink-500 hover:bg-ink-100 dark:hover:bg-white/10">›</button>
      </div>

      <div class="grid grid-cols-7 gap-1.5 mb-4">
        ${days.map((d,i) => {
          const s = gigRangeSummary(d,d);
          const h = s.profit > 0 ? Math.max(8, s.profit/maxProfit*56) : 4;
          const isToday = d === todayISO();
          return `
          <button onclick="openGigShiftModal(null,'${d}')" class="flex flex-col items-center gap-1 group">
            <span class="text-[10px] ${isToday?'text-brand-600 font-bold':'text-ink-400'}">${dowNames[i]}</span>
            <div class="w-full h-16 flex items-end">
              <div class="w-full rounded-md transition ${s.profit>0?'bg-brand-500 group-hover:bg-brand-600':'surface-2'}" style="height:${h}px"></div>
            </div>
            <span class="text-[9.5px] tabnum ${s.profit>0?'text-ink-600 dark:text-ink-300':'text-ink-300'}">${s.profit>0?formatVNDShort(s.profit):'—'}</span>
          </button>`;
        }).join('')}
      </div>

      ${shifts.length === 0 ? `<p class="text-[12.5px] text-ink-400 text-center py-4">Chưa có ca nào trong tuần. Bấm một cột phía trên để ghi ca cho ngày đó.</p>` : `
      <div class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">${shifts.map(renderGigShiftRow).join('')}</div>`}
    </div>`;
}

function renderGigShiftRow(s){

  return `
    <button onclick="openGigShiftModal('${s.id}')" class="w-full text-left py-3 flex flex-wrap items-center gap-x-3 gap-y-1 hover:bg-ink-50 dark:hover:bg-white/[0.03] rounded-lg px-1.5 transition">

  const sum = gigSummary(all, DB.gig.vehicleCosts);

  const byDow = [1,2,3,4,5,6,0].map(i => {

        <table class="w-full text-[12.5px]">
          ${[['Doanh thu trước chiết khấu', formatVND(sum.gross), ''],
             ['Chiết khấu Be', '− '+formatVND(sum.commission), 'text-bad-500'],
             ['Thưởng + tip', '+ '+formatVND(sum.bonus+sum.tips), 'text-ok-600'],
             ['Xăng theo ca', '− '+formatVND(sum.fuel), 'text-warn-600'],
             ['Chi phí xe (bảo dưỡng, nhớt…)', '− '+formatVND(sum.vehicleCost), 'text-warn-600']].map(([l,v,c])=>`
            <tr><td class="py-1.5 text-ink-500 dark:text-ink-300">${l}</td>
                <td class="py-1.5 text-right tabnum font-semibold ${c||'text-ink-800 dark:text-ink-100'}">${v}</td></tr>`).join('')}
          <tr class="border-t-2 border-ink-200 dark:border-white/10">

          </tr>
        </table>
        <p class="text-[11.5px] text-ink-400 mt-2">Sau xăng: <b>${formatVND(sum.perHour)}/giờ</b> · sau tất cả chi phí xe: <b>${formatVND(sum.perHourAll)}/giờ</b> · <b>${formatVND(sum.perTrip)}/cuốc</b> · chiết khấu <b>${sum.takeRate.toFixed(1)}%</b>.</p>
      </div>

      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-1">Tiền thật theo từng giờ, so với điểm Be</p>
        <p class="text-[11.5px] text-ink-400 mb-3">Cột xanh là tiền bạn thật sự kiếm được; số bên phải là điểm beBike của khung đó (${BE_DAY_COL_LABELS[col]}). Điểm cao mà tiền thấp nghĩa là khung đó ít khách — điểm chỉ có giá trị khi có cuốc để chạy.</p>
        <div class="space-y-1.5">
          ${hours.map(h => {
            const svc = DB.gig.rules.services.find(s=>s.id==='bike');

            <div class="flex items-center gap-2">

              <span class="text-[10.5px] tabnum text-ink-600 dark:text-ink-300 w-16 text-right shrink-0">${formatVNDShort(h.perHour)}</span>

        ${hours.some(h=>h.hours<1) ? `<p class="text-[11px] text-warn-600 mt-2">⚠️ Các khung dưới 1 giờ dữ liệu chưa đáng tin.</p>` : ''}
      </div>

      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Theo thứ trong tuần</p>

        <p class="text-[11px] text-ink-400 mt-2">Cột là thực nhận mỗi giờ. Lưu ý mốc thưởng T6–CN cao hơn T2–T5, nên cùng số điểm thì cuối tuần ăn hơn.</p>
      </div>
    </div>`;
}

/* --- CHI PHÍ XE --- */
function renderGigCostsTab(){
  const costs = DB.gig.vehicleCosts;
  const mStart = startOfMonthISO(new Date()), mEnd = endOfMonthISO(new Date());
  const month = gigCostsInRange(mStart, mEnd).reduce((s,c)=>s+c.amount,0);
  const total = costs.reduce((s,c)=>s+c.amount,0);
  const byType = {};
  costs.forEach(c => { byType[c.type] = (byType[c.type]||0) + c.amount; });
  const all = gigSummary(DB.gig.shifts, costs);
  const perHourCost = all.hours > 0 ? Math.round((all.fuel+all.vehicleCost)/all.hours) : 0;

  return `
    <div class="space-y-4">
      <div class="card rounded-xl2 p-4 shadow-card flex flex-wrap items-center gap-3">
        <div class="min-w-0 flex-1 overflow-hidden">
          <p class="text-[12.5px] font-semibold text-ink-700 dark:text-ink-200">Chi phí xe tháng này: ${formatVND(month)} · tổng ${formatVND(total)}</p>
          <p class="text-[11.5px] text-ink-400 mt-0.5">Tách riêng khỏi xăng theo ca vì hai loại này phát sinh theo nhịp khác nhau. Cộng cả hai, mỗi giờ chạy tốn <b>${formatVND(perHourCost)}</b> chi phí xe.</p>
        </div>
        <button onclick="openVehicleCostModal()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[12.5px] px-4 py-2.5 rounded-xl transition shrink-0">+ Ghi chi phí</button>
      </div>

      ${Object.keys(byType).length ? `
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Theo loại</p>
        <div class="space-y-1.5">
          ${Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,v])=>{
            const meta = VEHICLE_COST_TYPES.find(x=>x.id===t) || VEHICLE_COST_TYPES[7];
            return `<div class="flex items-center gap-2 text-[12.5px]">
              <span>${meta.icon}</span><span class="flex-1 text-ink-600 dark:text-ink-300">${meta.label}</span>
              <span class="tabnum font-semibold text-ink-800 dark:text-ink-100">${formatVND(v)}</span></div>`;
          }).join('')}
        </div>
      </div>` : ''}

      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Lịch sử</p>
        ${costs.length === 0 ? `<p class="text-[12.5px] text-ink-400">Chưa ghi chi phí xe nào. Bảo dưỡng, thay nhớt, lốp, sửa chữa — ghi lại để biết chạy xe thật sự tốn bao nhiêu.</p>` : `
        <div class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">
          ${costs.map(c => {
            const meta = VEHICLE_COST_TYPES.find(x=>x.id===c.type) || VEHICLE_COST_TYPES[7];
            return `
            <button onclick="openVehicleCostModal('${c.id}')" class="w-full text-left py-2.5 flex flex-wrap items-center gap-x-3 gap-y-1 hover:bg-ink-50 dark:hover:bg-white/[0.03] rounded-lg px-1.5">
              <div class="w-9 h-9 rounded-lg surface-2 flex items-center justify-center text-[14px] shrink-0">${meta.icon}</div>
              <div class="min-w-0 flex-1 overflow-hidden">
                <p class="text-[12.5px] font-medium text-ink-800 dark:text-ink-100">${meta.label}${c.note?' · '+escapeHtml(c.note):''}</p>
                <p class="text-[11px] text-ink-400">${formatDate(c.date)}${c.odo?` · ${c.odo.toLocaleString('vi-VN')} km`:''}</p>
              </div>
              <span class="font-display font-700 text-[13px] tabnum text-warn-600 shrink-0 whitespace-nowrap">${formatVND(c.amount)}</span>
            </button>`;
          }).join('')}
        </div>`}
      </div>
    </div>`;
}

function __gigDefComToggle(){
  const mode = document.getElementById('gigDefComMode').value;
  document.getElementById('gigDefComPct').classList.toggle('hidden', mode !== 'percent');
  const amt = document.getElementById('gigDefComAmt');
  amt.classList.toggle('hidden', mode !== 'amount');
  bindAllMoneyInputs(amt.parentElement);
}

function saveGigSettings(){
  const g = DB.gig;
  g.goals = { daily:parseMoneyInput('gigGoalDaily'), weekly:parseMoneyInput('gigGoalWeekly'),
              monthly:parseMoneyInput('gigGoalMonthly'), yearly:parseMoneyInput('gigGoalYearly') };
  g.defaultRevenueMode = document.getElementById('gigDefRevMode').value;
  g.defaultCommissionMode = document.getElementById('gigDefComMode').value;
  g.defaultCommissionValue = g.defaultCommissionMode === 'percent'
    ? (Number(document.getElementById('gigDefComPct').value)||0)
    : parseMoneyInput('gigDefComAmt');
  g.accountId = document.getElementById('gigAccount').value;
  g.incomeCategory = document.getElementById('gigIncomeCat').value;
  g.costCategory = document.getElementById('gigCostCat').value;
  g.rules.completionRate = clamp(Number(document.getElementById('gigCompletion').value)||0, 0, 100);
  g.enabled = true;
  saveDB(); renderGigView();
  showToast('Đã lưu cài đặt tài xế', 'ok');
}
function resetGigRules(){
  confirmDelete('Khôi phục bảng điểm và mốc thưởng về bản gốc? Mọi chỉnh sửa của bạn sẽ mất.',
    () => applyResetGigRules());
}
/* Tách phần thực thi để kiểm thử được độc lập với hộp thoại xác nhận */
function applyResetGigRules(){
  DB.gig.rules = JSON.parse(JSON.stringify(GIG_DEFAULT_RULES));
  saveDB(); closeModal(); renderGigView();
  showToast('Đã khôi phục bảng điểm gốc', 'ok');
}
