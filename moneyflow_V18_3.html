</script>

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 19 — ĐỐI SOÁT DỮ LIỆU (integrity check)
   ----------------------------------------------------------------------
   Mục tiêu: phát hiện "hao hụt không rõ nguyên nhân" TRƯỚC khi bạn nhận ra
   qua cảm giác. Kiểm tra các bất biến mà hệ thống phải luôn thoả mãn:
     1. Mọi giao dịch trỏ tới một tài khoản có thật
     2. Mọi giao dịch tự động trỏ tới bản ghi gốc còn tồn tại (không mồ côi)
     3. Tổng của đợt ứng khớp với items[]
     4. Không có số âm ở nơi không được phép
   Công cụ này CHỈ ĐỌC — không tự sửa gì, để bạn tự quyết định.
   ====================================================================== */
function runIntegrityCheck(){
  const issues = [];

  /* --- 1. Giao dịch trỏ tới tài khoản không tồn tại --- */
  const accIds = new Set(DB.accounts.map(a => a.id));
  const badAcc = DB.transactions.filter(t => !accIds.has(t.accountId));
  if(badAcc.length){
    issues.push({
      level:'bad',
      title: badAcc.length + ' giao dịch trỏ tới tài khoản đã bị xoá',
      detail:'Số tiền của chúng không nằm trong bất kỳ tài khoản nào — đây là nguồn hao hụt trực tiếp. Tổng: ' + formatVND(badAcc.reduce((s,t)=>s+t.amount,0)),
      fix:'Mở từng giao dịch và gán lại tài khoản.',
    });
  }

  /* --- 2. Giao dịch mồ côi: bản ghi gốc đã bị xoá --- */
  const orphans = { debt:[], receivable:[], recurring:[], subscription:[] };
  DB.transactions.forEach(t => {
    if(!t.source || t.source.kind === 'manual' || !t.source.id) return;
    const k = t.source.kind;
    if(k === 'debt' && !DB.debts.some(d => d.id === t.source.id)) orphans.debt.push(t);
    else if(k === 'receivable' && !DB.receivables.some(r => r.id === t.source.id)) orphans.receivable.push(t);
    else if(k === 'recurring' && !DB.recurring.some(r => r.id === t.source.id)) orphans.recurring.push(t);
    else if(k === 'subscription' && !DB.subscriptions.some(x => x.id === t.source.id)) orphans.subscription.push(t);
  });
  Object.keys(orphans).forEach(k => {
    if(!orphans[k].length) return;
    const nameMap = { debt:'khoản nợ', receivable:'khoản phải thu', recurring:'khoản cố định', subscription:'subscription' };
    issues.push({
      level:'info',
      title: orphans[k].length + ' giao dịch còn lại từ ' + nameMap[k] + ' đã xoá',
      detail:'Số dư vẫn đúng (tiền đã được ghi nhận), nhưng các giao dịch này không còn nguồn gốc để tra cứu. Tổng: ' + formatVND(orphans[k].reduce((s,t)=>s+t.amount,0)),
      fix:'Không bắt buộc xử lý. Đây là chuyện bình thường sau khi bạn xoá một bản ghi.',
    });
  });

  /* --- 3. Đợt ứng: tổng có khớp items[] không --- */
  const badBatch = [];
  DB.receivables.filter(r => r.mode === 'batch').forEach(r => {
    const active = r.items.filter(i => i.status !== 'rejected');
    const principal = active.reduce((s,i)=>s+i.amount,0);
    const got = active.reduce((s,i)=>s+(i.reimbursed||0),0);
    if(r.principal !== principal || r.outstanding !== Math.max(0, principal - got)) badBatch.push(r);
  });
  if(badBatch.length){
    issues.push({
      level:'bad',
      title: badBatch.length + ' đợt ứng có tổng không khớp với các dòng chi',
      detail: badBatch.map(r => r.name).join(', '),
      fix:'Bấm “Tính lại” bên dưới để đồng bộ từ danh sách dòng chi.',
      action:'recompute-batches',
    });
  }

  /* --- 4. Dòng chi mồ côi: giao dịch gốc đã bị xoá --- */
  const txIds = new Set(DB.transactions.map(t => t.id));
  const ghostItems = [];
  DB.receivables.filter(r => r.mode === 'batch').forEach(r => {
    r.items.forEach(i => { if(i.txId && !txIds.has(i.txId)) ghostItems.push({ r, i }); });
  });
  if(ghostItems.length){
    issues.push({
      level:'warn',
      title: ghostItems.length + ' dòng chi không còn giao dịch tương ứng',
      detail:'Các dòng này vẫn được tính là phải thu nhưng tiền đã được hoàn về ví — bạn đang tính dư. Tổng: ' + formatVND(ghostItems.reduce((s,x)=>s+x.i.amount,0)),
      fix:'Gỡ các dòng này khỏi hồ sơ đợt ứng.',
      action:'remove-ghost-items',
    });
  }

  /* --- 5. Số âm ở nơi không được phép --- */
  const negSaving = DB.savings.filter(p => p.balance < 0);
  const negDebt = DB.debts.filter(d => d.balance < 0);
  const negRecv = DB.receivables.filter(r => r.outstanding < 0);
  if(negSaving.length || negDebt.length || negRecv.length){
    issues.push({
      level:'bad',
      title:'Có số dư âm ở nơi không được phép',
      detail:[...negSaving.map(p=>'Gói "'+p.name+'"'), ...negDebt.map(d=>'Nợ "'+d.name+'"'), ...negRecv.map(r=>'Phải thu "'+r.name+'"')].join(', '),
      fix:'Mở từng mục và điều chỉnh lại số dư.',
    });
  }

  /* --- 5b. Tài khoản dưới mức tối thiểu ngân hàng --- */
  const breachedAcc = getBreachedAccounts();
  if(breachedAcc.length){
    issues.push({
      level:'warn',
      title: breachedAcc.length + ' tài khoản dưới số dư tối thiểu phải duy trì',
      detail: breachedAcc.map(a => `${a.name}: ${formatVND(a.balance)} / cần ${formatVND(a.minBalance)}`).join(' · '),
      fix:'Nạp bù phần thiếu, hoặc sửa lại mức tối thiểu nếu ngân hàng đã thay đổi quy định.',
    });
  }

  /* --- 5c. Nợ có lịch trả phi thực tế (dấu vết của việc nhập 1đ để lách) --- */
  const absurdDebt = DB.debts.filter(d => !d.noSchedule && d.balance > 0 && d.minPayment > 0 && (d.balance / d.minPayment) > 600);
  if(absurdDebt.length){
    issues.push({
      level:'warn',
      title: absurdDebt.length + ' khoản nợ có lịch trả phi thực tế',
      detail: absurdDebt.map(d => `${d.name}: ${formatVND(d.minPayment)}/tháng cho dư nợ ${formatVND(d.balance)} → ${Math.round(d.balance/d.minPayment/12).toLocaleString('vi-VN')} năm`).join(' · '),
      fix:'Đặt lại số tiền trả hàng tháng, hoặc bật “Trả linh hoạt” để khoản này không tạo giao dịch rác mỗi tháng.',
      action:'fix-absurd-debt',
    });
  }

  /* --- 5d. Giao dịch trả nợ cũ chưa tách được gốc/lãi --- */
  const unsplit = DB.transactions.filter(t => t.type === 'expense' && t.source && t.source.kind === 'debt'
    && !t.excludeFromPL && t.category !== 'lai-vay' && !(t.tags||[]).includes('mat-tien'));
  if(unsplit.length){
    issues.push({
      level:'info',
      title: unsplit.length + ' giao dịch trả nợ cũ vẫn tính trọn vào chi tiêu',
      detail:'Không xác định được phần nào là gốc, phần nào là lãi nên hệ thống giữ nguyên. Tổng: ' + formatVND(unsplit.reduce((s,t)=>s+t.amount,0)) + '. Chi tiêu các tháng đó có thể cao hơn thực tế.',
      fix:'Nếu các khoản này là nợ không lãi, bấm nút bên dưới để chuyển toàn bộ thành tiền gốc.',
      action:'fix-debt-pl',
    });
  }

  /* --- 6. Tài khoản âm (cảnh báo mềm, có thể là thật) --- */
  const negAcc = DB.accounts.filter(a => a.balance < 0);
  if(negAcc.length){
    issues.push({
      level:'warn',
      title: negAcc.length + ' tài khoản đang âm',
      detail: negAcc.map(a => a.name + ': ' + formatVND(a.balance)).join(', '),
      fix:'Có thể đúng nếu bạn đang thấu chi. Nếu không, hãy đối soát lại với sao kê ngân hàng.',
    });
  }

  renderIntegrityResult(issues);
}

function renderIntegrityResult(issues){
  const el = document.getElementById('integrityResult');
  if(!el) return;
  if(!issues.length){
    el.innerHTML = `
      <div class="rounded-xl border border-ok-400/50 bg-ok-50 dark:bg-ok-500/10 p-3.5">
        <p class="text-[12.5px] font-semibold text-ink-800 dark:text-ink-100">✓ Không phát hiện bất thường</p>
        <p class="text-[11.5px] text-ink-500 dark:text-ink-300 mt-1">
          Số dư hiện tại ${formatVND(getCashPosition())} · dư nợ ${formatVND(getTotalDebt())} · phải thu ${formatVND(getTotalReceivables())} — tất cả đều khớp với sổ giao dịch.
        </p>
      </div>`;
    return;
  }
  el.innerHTML = issues.map(i => {
    const tone = i.level === 'bad' ? 'border-bad-400/50 bg-bad-50 dark:bg-bad-500/10'
              : i.level === 'warn' ? 'border-warn-400/50 bg-warn-50 dark:bg-warn-500/10'
              : 'border-ink-200/60 surface-2';
    return `
      <div class="rounded-xl border ${tone} p-3.5 mb-2">
        <p class="text-[12.5px] font-semibold text-ink-800 dark:text-ink-100">${i.level==='bad'?'⚠️':i.level==='warn'?'🔎':'ℹ️'} ${escapeHtml(i.title)}</p>
        <p class="text-[11.5px] text-ink-500 dark:text-ink-300 mt-1">${escapeHtml(i.detail)}</p>
        <p class="text-[11.5px] text-ink-400 mt-1">Cách xử lý: ${escapeHtml(i.fix)}</p>
        ${i.action === 'recompute-batches' ? `<button onclick="fixRecomputeBatches()" class="mt-2 text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Tính lại</button>` : ''}
        ${i.action === 'remove-ghost-items' ? `<button onclick="fixRemoveGhostItems()" class="mt-2 text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Gỡ các dòng này</button>` : ''}
        ${i.action === 'fix-absurd-debt' ? `<button onclick="fixAbsurdDebts()" class="mt-2 text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Chuyển sang “Trả linh hoạt”</button>` : ''}
        ${i.action === 'fix-debt-pl' ? `<button onclick="fixDebtPLSplit()" class="mt-2 text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition">Coi toàn bộ là tiền gốc</button>` : ''}
      </div>`;
  }).join('');
}

function fixRecomputeBatches(){
  DB.receivables.filter(r => r.mode === 'batch').forEach(recomputeBatch);
  saveDB();
  showToast('Đã tính lại tổng các đợt ứng', 'ok');
  runIntegrityCheck();
}
function fixDebtPLSplit(){
  let cnt = 0;
  DB.transactions.forEach(t => {
    if(t.type !== 'expense' || !t.source || t.source.kind !== 'debt') return;
    if(t.excludeFromPL || t.category === 'lai-vay' || (t.tags||[]).includes('mat-tien')) return;
    t.excludeFromPL = true;
    t.category = 'tra-no-goc';
    cnt++;
  });
  saveDB();
  showToast('Đã chuyển ' + cnt + ' giao dịch sang “trả nợ gốc” · chi tiêu các tháng đã được tính lại', 'ok');
  runIntegrityCheck();
}

function fixAbsurdDebts(){
  let cnt = 0;
  DB.debts.forEach(d => {
    if(!d.noSchedule && d.balance > 0 && d.minPayment > 0 && (d.balance / d.minPayment) > 600){
      d.noSchedule = true; d.autoPay = false; cnt++;
    }
  });
  saveDB();
  showToast('Đã chuyển ' + cnt + ' khoản sang chế độ trả linh hoạt', 'ok');
  runIntegrityCheck();
}

function fixRemoveGhostItems(){
  const txIds = new Set(DB.transactions.map(t => t.id));
  let removed = 0;
  DB.receivables.filter(r => r.mode === 'batch').forEach(r => {
    const before = r.items.length;
    r.items = r.items.filter(i => !i.txId || txIds.has(i.txId));
    removed += before - r.items.length;
    recomputeBatch(r);
  });
  saveDB();
  showToast('Đã gỡ ' + removed + ' dòng chi mồ côi', 'ok');
  runIntegrityCheck();
}
</script>

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 20 — SO SÁNH THÁNG THEO DANH MỤC
   ----------------------------------------------------------------------
   Mục tiêu KHÔNG phải là liệt kê mọi thay đổi (mọi con số đều đổi mỗi
   tháng), mà là chỉ ra thay đổi ĐÁNG CHÚ Ý. Ba bộ lọc chống nhiễu:
     1. Ngưỡng tiền tuyệt đối — tăng 30% của 20.000đ không đáng bận tâm
     2. Ngưỡng % — tăng 200.000đ trên nền 10 triệu cũng không đáng
     3. Danh mục mới xuất hiện / biến mất được tách riêng, không tính %
   Mọi phép tính CHỈ dùng giao dịch P&L (isPL) — tiền ứng trước, hoàn ứng,
   giải ngân vay đều bị loại vì chúng không phải chi tiêu thật.
   ====================================================================== */

/* Ngưỡng nhiễu mặc định — người dùng chỉnh được trong Cài đặt.
   Giữ hằng số làm giá trị dự phòng khi settings chưa có. */
const COMPARE_MIN_DELTA_DEFAULT = 100000;   // 100k
const COMPARE_MIN_PCT_DEFAULT = 15;         // 15%
function compareMinDelta(){
  const v = DB && DB.settings ? DB.settings.compareMinDelta : undefined;
  return (v === undefined || v === null) ? COMPARE_MIN_DELTA_DEFAULT : v;
}
function compareMinPct(){
  const v = DB && DB.settings ? DB.settings.compareMinPct : undefined;
  return (v === undefined || v === null) ? COMPARE_MIN_PCT_DEFAULT : v;
}

function getMonthCategoryTotals(ref){
  const totals = {};
  DB.transactions.forEach(t => {
    if(t.type !== 'expense' || !isPL(t)) return;
    if(!isSameMonth(t.date, ref)) return;
    totals[t.category] = (totals[t.category] || 0) + t.amount;
  });
  return totals;
}

function prevMonthOf(ref){
  const d = new Date(ref.getFullYear(), ref.getMonth(), 1);
  d.setMonth(d.getMonth() - 1);
  return d;
}

/* Số ngày đã trôi qua của một tháng — dùng để so sánh CÔNG BẰNG khi
   tháng hiện tại chưa kết thúc (so 20 ngày với 31 ngày là so sai). */
function elapsedDaysInMonth(ref){
  const now = new Date();
  if(ref.getFullYear() === now.getFullYear() && ref.getMonth() === now.getMonth()){
    return now.getDate();
  }
  return daysInMonth(ref.getFullYear(), ref.getMonth());
}

/* So sánh hai tháng theo danh mục.
   opts.prorate = true → quy đổi tháng trước về cùng số ngày đã trôi qua,
   để tháng đang chạy dở không bị "trông có vẻ tiết kiệm". */
function compareMonths(ref = currentViewMonth, opts = {}){
  const cur = new Date(ref.getFullYear(), ref.getMonth(), 1);
  const prev = prevMonthOf(cur);
  const curTotals = getMonthCategoryTotals(cur);
  const prevTotalsRaw = getMonthCategoryTotals(prev);

  const curDays = elapsedDaysInMonth(cur);
  const prevDays = daysInMonth(prev.getFullYear(), prev.getMonth());
  const isPartial = curDays < daysInMonth(cur.getFullYear(), cur.getMonth());
  const prorate = opts.prorate !== false && isPartial;
  const factor = prorate ? (curDays / prevDays) : 1;

  const prevTotals = {};
  Object.keys(prevTotalsRaw).forEach(k => { prevTotals[k] = Math.round(prevTotalsRaw[k] * factor); });

  const minDelta = opts.minDelta !== undefined ? opts.minDelta : compareMinDelta();
  const minPct = opts.minPct !== undefined ? opts.minPct : compareMinPct();

  const cats = new Set([...Object.keys(curTotals), ...Object.keys(prevTotals)]);
  const rows = [];
  cats.forEach(c => {
    const now = curTotals[c] || 0;
    const before = prevTotals[c] || 0;
    const delta = now - before;
    const pct = before > 0 ? (delta / before * 100) : (now > 0 ? null : 0);  // null = danh mục mới
    rows.push({
      category: c, meta: catMeta(c),
      now, before, rawBefore: prevTotalsRaw[c] || 0,
      delta, pct,
      isNew: before === 0 && now > 0,
      isGone: before > 0 && now === 0,
      // "Đáng chú ý" = vượt CẢ hai ngưỡng, hoặc là danh mục mới/biến mất đủ lớn
      notable: Math.abs(delta) >= minDelta &&
               (pct === null || Math.abs(pct) >= minPct || before === 0 || now === 0),
    });
  });

  rows.sort((a,b) => b.delta - a.delta);   // tăng nhiều nhất lên đầu

  const totalNow = Object.values(curTotals).reduce((s,v)=>s+v,0);
  const totalBefore = Object.values(prevTotals).reduce((s,v)=>s+v,0);

  return {
    cur, prev, rows,
    notable: rows.filter(r => r.notable),
    up: rows.filter(r => r.notable && r.delta > 0),
    down: rows.filter(r => r.notable && r.delta < 0),
    totalNow, totalBefore,
    totalDelta: totalNow - totalBefore,
    totalPct: totalBefore > 0 ? (totalNow - totalBefore) / totalBefore * 100 : null,
    prorate, curDays, prevDays, isPartial,
    minDelta, minPct,
    incomeNow: getMonthIncome(cur),
    incomeBefore: getMonthIncome(prev),
  };
}

/* Câu tóm tắt bằng lời — nói thẳng vào thứ đáng chú ý nhất */
function describeComparison(cmp){
  if(!cmp.totalBefore && !cmp.totalNow) return 'Chưa có chi tiêu nào ở cả hai tháng để so sánh.';
  if(!cmp.totalBefore) return 'Tháng trước chưa có dữ liệu chi tiêu nên không so sánh được.';
  const top = cmp.up[0];
  const dir = cmp.totalDelta > 0 ? 'nhiều hơn' : 'ít hơn';
  let s = `Tổng chi ${formatVND(cmp.totalNow)}, ${dir} ${formatVND(Math.abs(cmp.totalDelta))}`;
  if(cmp.totalPct !== null) s += ` (${cmp.totalDelta>0?'+':'−'}${Math.abs(cmp.totalPct).toFixed(0)}%)`;
  s += ' so với tháng trước';
  if(cmp.prorate) s += ` (đã quy đổi về cùng ${cmp.curDays} ngày)`;
  s += '.';
  if(top) s += ` Tăng mạnh nhất: ${top.meta.label} ${top.pct===null?'(mới phát sinh)':'+'+top.pct.toFixed(0)+'%'}.`;
  return s;
}

/* ---------------------------------------------------------------- VIEW */
let compareProrate = true;
let compareTab = 'months'; // 'months' = so 2 tháng liền kề (như cũ) · 'income' = xu hướng thu nhập nhiều tháng

function toggleCompareProrate(){
  compareProrate = !compareProrate;
  renderCompareView();
}

function setCompareTab(tab){
  compareTab = tab;
  renderCompareView();
}

function renderCompareView(){
  const container = document.getElementById('viewCompare');
  container.innerHTML = `
    <div class="space-y-5 animate-fadeUp">
      <div class="flex flex-wrap gap-1.5">
        ${[['months','⚖️ So 2 tháng'],['income','📊 Xu hướng thu nhập']].map(([k,l])=>`
          <button onclick="setCompareTab('${k}')" class="px-3.5 py-2 rounded-xl text-[12.5px] font-semibold transition ${compareTab===k?'bg-brand-600 text-white':'surface-2 text-ink-600 dark:text-ink-300 hover:bg-ink-100 dark:hover:bg-white/10'}">${l}</button>`).join('')}
      </div>
      <div id="compareTabBody"></div>
    </div>`;
  const body = document.getElementById('compareTabBody');
  if(compareTab === 'income'){ body.innerHTML = renderIncomeTrendTab(); bindAllMoneyInputs(body); return; }
  renderCompareMonthsTab(body);
}

function renderCompareMonthsTab(body){
  const cmp = compareMonths(currentViewMonth, { prorate: compareProrate });
  const curLabel = `Th${cmp.cur.getMonth()+1}/${cmp.cur.getFullYear()}`;
  const prevLabel = `Th${cmp.prev.getMonth()+1}/${cmp.prev.getFullYear()}`;

  const bar = (r) => {
    const max = Math.max(...cmp.rows.map(x => Math.max(x.now, x.before)), 1);
    return `
      <div class="flex items-center gap-1.5">
        <div class="flex-1 h-1.5 rounded-full surface-2 overflow-hidden"><div class="h-full bg-ink-300 dark:bg-white/25" style="width:${r.before/max*100}%"></div></div>
        <div class="flex-1 h-1.5 rounded-full surface-2 overflow-hidden"><div class="h-full ${r.delta>0?'bg-bad-500':'bg-ok-500'}" style="width:${r.now/max*100}%"></div></div>
      </div>`;
  };

  body.innerHTML = `
    <div class="space-y-5 animate-fadeUp">

      <!-- Tổng quan -->
      <div class="card rounded-xl2 p-5 shadow-card">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0">
            <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100">${curLabel} so với ${prevLabel}</p>
            <p class="text-[12px] text-ink-500 dark:text-ink-300 mt-1 max-w-xl">${describeComparison(cmp)}</p>
          </div>
          <div class="flex gap-2 shrink-0">
            <button onclick="openCompareThresholdModal()" class="surface-2 hover:bg-ink-100 dark:hover:bg-white/10 text-ink-600 dark:text-ink-300 font-semibold text-[12.5px] px-3.5 py-2.5 rounded-xl transition">⚙️ Ngưỡng</button>
            <button onclick="openMonthReport()" class="bg-brand-600 hover:bg-brand-700 text-white font-semibold text-[12.5px] px-4 py-2.5 rounded-xl transition">📄 Xuất báo cáo</button>
          </div>
        </div>

        ${cmp.isPartial ? `
        <label class="flex items-center gap-2.5 text-[12px] text-ink-600 dark:text-ink-300 mt-3 surface-2 rounded-xl p-3">
          <input type="checkbox" ${compareProrate?'checked':''} onchange="toggleCompareProrate()" class="w-4 h-4 rounded">
          <span>Quy đổi tháng trước về cùng <b>${cmp.curDays} ngày</b> đã trôi qua — nếu tắt, tháng này sẽ trông tiết kiệm hơn thực tế vì chưa hết tháng.</span>
        </label>` : ''}

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-3">
          <div class="surface-2 rounded-xl p-3">
            <p class="text-[10.5px] text-ink-400 uppercase tracking-wide">Chi ${curLabel}</p>
            <p class="font-display font-800 text-[16px] tabnum text-ink-900 dark:text-white mt-0.5">${formatVND(cmp.totalNow)}</p>
          </div>
          <div class="surface-2 rounded-xl p-3">
            <p class="text-[10.5px] text-ink-400 uppercase tracking-wide">Chi ${prevLabel}${cmp.prorate?' (quy đổi)':''}</p>
            <p class="font-display font-800 text-[16px] tabnum text-ink-600 dark:text-ink-300 mt-0.5">${formatVND(cmp.totalBefore)}</p>
          </div>
          <div class="surface-2 rounded-xl p-3">
            <p class="text-[10.5px] text-ink-400 uppercase tracking-wide">Chênh lệch</p>
            <p class="font-display font-800 text-[16px] tabnum mt-0.5 ${cmp.totalDelta>0?'text-bad-500':'text-ok-600'}">${cmp.totalDelta>0?'+':'−'}${formatVND(Math.abs(cmp.totalDelta))}</p>
          </div>
          <div class="surface-2 rounded-xl p-3">
            <p class="text-[10.5px] text-ink-400 uppercase tracking-wide">Thu nhập</p>
            <p class="font-display font-800 text-[16px] tabnum text-ink-900 dark:text-white mt-0.5">${formatVNDShort(cmp.incomeNow)}</p>
          </div>
        </div>
      </div>

      ${cmp.notable.length === 0 ? `
      <div class="card rounded-xl2 p-8 shadow-card text-center">
        <div class="empty-icon-wrap w-16 h-16 rounded-full flex items-center justify-center mb-3 mx-auto"><span class="text-3xl">⚖️</span></div>
        <h3 class="font-display font-800 text-[15px] text-ink-900 dark:text-white">Không có thay đổi bất thường</h3>
        <p class="text-[12.5px] text-ink-400 mt-1.5 max-w-md mx-auto">Mọi danh mục đều biến động dưới ngưỡng đáng chú ý (${formatVNDShort(cmp.minDelta)} và ${cmp.minPct}%). Chi tiêu của bạn đang khá ổn định.</p>
        <button onclick="openCompareThresholdModal()" class="mt-3 text-[12px] font-semibold text-brand-600">Hạ ngưỡng để xem chi tiết hơn</button>
      </div>` : `

      ${cmp.up.length ? `
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-1">📈 Tăng đáng chú ý (${cmp.up.length})</p>
        <p class="text-[11.5px] text-ink-400 mb-3">Chỉ hiện danh mục biến động từ ${formatVNDShort(cmp.minDelta)} trở lên VÀ vượt ${cmp.minPct}% — tránh báo động vì những thay đổi vụn vặt. <button onclick="openCompareThresholdModal()" class="text-brand-600 font-semibold">Đổi ngưỡng</button></p>
        <div class="space-y-3">${cmp.up.map(r => renderCompareRow(r, bar)).join('')}</div>
      </div>` : ''}

      ${cmp.down.length ? `
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">📉 Giảm đáng chú ý (${cmp.down.length})</p>
        <div class="space-y-3">${cmp.down.map(r => renderCompareRow(r, bar)).join('')}</div>
      </div>` : ''}
      `}

      <!-- Bảng đầy đủ -->
      <div class="card rounded-xl2 p-5 shadow-card">
        <p class="font-display font-700 text-[14px] text-ink-800 dark:text-ink-100 mb-3">Toàn bộ danh mục</p>
        <div class="overflow-x-auto">
          <table class="w-full text-[12px]">
            <thead>
              <tr class="text-ink-400 text-[11px] uppercase tracking-wide">
                <th class="text-left font-semibold pb-2">Danh mục</th>
                <th class="text-right font-semibold pb-2">${prevLabel}</th>
                <th class="text-right font-semibold pb-2">${curLabel}</th>
                <th class="text-right font-semibold pb-2">Chênh</th>
                <th class="text-right font-semibold pb-2">%</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">
              ${cmp.rows.map(r => `
                <tr class="${r.notable?'':'opacity-60'}">
                  <td class="py-2 font-medium text-ink-800 dark:text-ink-100">${r.meta.icon} ${r.meta.label}</td>

}

function incomeKpi(label, value, sub, cls){

function renderIncomeTrendChart(trendAll){
  const ctx = document.getElementById('chartIncomeTrend');
  if(!ctx) return;
  if(chartIncomeTrend) chartIncomeTrend.destroy();

  const isDark = document.documentElement.classList.contains('dark');
  const gridColor = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(15,17,21,0.06)';
  const tickColor = isDark ? '#8D94A3' : '#6B7383';

  chartIncomeTrend = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: trendAll.map(m => m.label),
      datasets: INCOME_SRC_ORDER.map(k => ({
        label: INCOME_SRC_META[k].label,
        data: trendAll.map(m => m.byCat[k]),
        backgroundColor: INCOME_SRC_META[k].color,
        borderRadius: 4, stack: 'income',
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: (item) => item.raw > 0,   // ẩn dòng tooltip của nguồn = 0đ tháng đó, đỡ rối
          callbacks: { label: (c) => ` ${c.dataset.label}: ${formatVND(c.parsed.y)}` }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { color: tickColor, font: { size: 11 } } },
        y: { stacked: true, grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 11 }, callback: (v) => formatVNDShort(v) } }
      }
    }

/* Phần chuyên sâu: bảng chi tiết từng tháng (đủ 5 nguồn) + so tháng trước.
   Chỉ hiện khi mở rộng (details/summary) — không tính toán gì thêm ngoài
   dữ liệu đã có trong `sum`, nên mở/đóng không tốn thêm chi phí.
   Chỉ hiện cột cho nguồn nào có phát sinh trong ít nhất 1 tháng của giai
   đoạn đang xem — Thưởng/Đầu tư/Khác thường không đều, ép hiện cột toàn
   số 0 chỉ gây rối bảng mà không thêm thông tin gì. */
function renderIncomeDeepDive(sum, gia){
  const activeCats = INCOME_SRC_ORDER.filter(k => sum.trend.some(m => m.byCat[k] > 0));

  const rows = sum.trend.map((m, i) => {
    const prev = sum.trend[i - 1];
    const delta = prev ? m.total - prev.total : null;
    const pct = prev && prev.total > 0 ? Math.round(delta / prev.total * 1000) / 10 : null;
    return `
      <tr>
        <td class="py-2 font-medium text-ink-800 dark:text-ink-100">${m.label}</td>
        ${activeCats.map(k => `<td class="py-2 text-right tabnum text-ink-600 dark:text-ink-300">${m.byCat[k] > 0 ? formatVNDShort(m.byCat[k]) : '—'}</td>`).join('')}
        <td class="py-2 text-right tabnum font-semibold text-ink-900 dark:text-white">${formatVNDShort(m.total)}</td>
        <td class="py-2 text-right tabnum ${delta===null?'text-ink-400':delta>=0?'text-ok-600':'text-bad-500'}">${delta===null?'—':(delta>=0?'+':'')+pct+'%'}</td>
      </tr>`;
  }).join('');

  return `
    <div class="overflow-x-auto">
      <table class="w-full text-[12px]">
        <thead>
          <tr class="text-ink-400 text-[11px] uppercase tracking-wide">
            <th class="text-left font-semibold pb-2">Tháng</th>
            ${activeCats.map(k => `<th class="text-right font-semibold pb-2">${INCOME_SRC_META[k].label}</th>`).join('')}
            <th class="text-right font-semibold pb-2">Tổng</th>
            <th class="text-right font-semibold pb-2">So tháng trước</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-ink-100/60 dark:divide-white/[0.06]">${rows}</tbody>
      </table>
    </div>
    <p class="text-[11px] text-ink-400 mt-3">
      Thu nhập từ Be tính từ sổ ca (đã trừ chiết khấu, cộng thưởng/tip) — chính xác hơn đếm theo danh mục giao dịch.
      Nếu con số ở đây khác với Dashboard, khả năng cao là có ca chạy chưa được ghi vào sổ.
    </p>`;
}

/* Tóm tắt lạm phát — hiển thị khác nhau tuỳ chế độ đã chọn trong Cài đặt */
function renderInflationSummary(sum, gia){
  if(gia.mode === 'off'){
    return `<p class="text-[12.5px] text-ink-400 mt-3">Chưa bật so sánh lạm phát. Bấm "Cấu hình" để chọn cách bạn muốn dùng — tự nhập tay theo tháng, hoặc một mức ước tính chung cho cả năm.</p>`;
  }
  const real = sum.growthRate === null ? null : Math.round((sum.growthRate - gia.percent) * 10) / 10;
  return `
    <div class="grid grid-cols-2 gap-2.5 mt-3">
      <div class="surface-2 rounded-xl p-3">
        <p class="text-[10.5px] text-ink-400 uppercase tracking-wide">Thu nhập tăng (danh nghĩa)</p>
        <p class="font-display font-800 text-[16px] tabnum mt-0.5 ${sum.growthRate===null?'text-ink-400':sum.growthRate>=0?'text-ok-600':'text-bad-500'}">${sum.growthRate===null?'—':(sum.growthRate>=0?'+':'')+sum.growthRate+'%'}</p>
      </div>
      <div class="surface-2 rounded-xl p-3">
        <p class="text-[10.5px] text-ink-400 uppercase tracking-wide">Lạm phát ước tính (${gia.mode==='preset'?'mức năm':'tự nhập'})</p>
        <p class="font-display font-800 text-[16px] tabnum text-ink-900 dark:text-white mt-0.5">${gia.percent}%</p>
      </div>
    </div>
    <p class="text-[12.5px] mt-3 ${real===null?'text-ink-400':real>=0?'text-ok-700 dark:text-ok-400':'text-bad-600 dark:text-bad-400'}">
      ${real===null ? 'Chưa đủ dữ liệu để so sánh.'
        : real >= 0 ? `Thu nhập đang tăng nhanh hơn lạm phát ước tính khoảng <b>${real}%</b> — sức mua thực tế của bạn đang cải thiện.`
        : `Thu nhập đang tăng <b>chậm hơn</b> lạm phát ước tính khoảng <b>${Math.abs(real)}%</b> — dù số tuyệt đối tăng, sức mua thực tế có thể đang giảm.`}
    </p>
    ${gia.mode==='manual' && gia.missingMonths > 0 ? `<p class="text-[11px] text-warn-600 mt-2">Còn ${gia.missingMonths} tháng chưa nhập tỷ lệ lạm phát — số trên chỉ tính từ các tháng đã có.</p>` : ''}
    <p class="text-[10.5px] text-ink-400 mt-2 italic">Đây là ước tính để tham khảo xu hướng, không phải số liệu CPI chính thức — tự bạn nhập nên độ chính xác phụ thuộc vào nguồn bạn dùng.</p>`;
}

/* Cố vấn deal lương/xu hướng thu nhập — KHÔNG viết engine riêng, chỉ lọc
   ra đúng những item liên quan thu nhập từ generateAdvice() (Khối 27, mục
   17) để dùng chung UI thẻ + cơ chế "Bỏ qua" của renderAdviceCard(). Nếu
   Quang đã bỏ qua ở đây, nó cũng biến mất khỏi màn Cố vấn chung và ngược
   lại — một danh sách dismiss duy nhất, không có 2 nguồn sự thật. */
function renderIncomeAdviceCards(sum, gia){
  const items = generateAdvice().filter(a => a.id === 'income-declining' || a.id === 'income-below-inflation' || a.id === 'salary-negotiation');
  if(!items.length){
    return `
      <div class="card rounded-xl2 p-6 shadow-card text-center">
        <p class="text-[12.5px] text-ink-400">Chưa có tín hiệu nào đáng lưu ý về thu nhập lúc này. Mục này sẽ tự xuất hiện khi phát hiện xu hướng đáng chú ý (thu nhập giảm liên tục, tăng chậm hơn lạm phát, hoặc lương trì trệ lâu ngày).</p>
      </div>`;
  }
  return items.map(a => renderAdviceCard(a)).join('');
}

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 21 — BÁO CÁO THÁNG (xuất PDF / PNG)
   ----------------------------------------------------------------------
   Khác với "Thẻ tháng" (một ảnh vuông để chia sẻ), đây là báo cáo ĐẦY ĐỦ
   nhiều mục để lưu trữ hoặc gửi đi.
   Kỹ thuật xuất:
     • PDF  → window.print() trên một khung in chuyên dụng. KHÔNG dùng thư
              viện PDF nào: giữ ràng buộc "một file HTML", và chữ trong PDF
              vẫn là chữ thật (chọn/tìm kiếm được), không phải ảnh.
     • PNG  → html2canvas (đã có sẵn), phù hợp gửi qua chat.
   ====================================================================== */

/* Số liệu cho báo cáo — tách khỏi phần hiển thị để kiểm thử được độc lập */
function buildMonthReportData(ref = currentViewMonth){
  const income = getMonthIncome(ref);
  const expense = getMonthExpense(ref);
  const cmp = compareMonths(ref, { prorate: false });   // báo cáo dùng số thô cả tháng
  const smart = computeSmartBudget(ref);

  const monthStart = startOfMonthISO(ref), monthEnd = endOfMonthISO(ref);
  const monthTx = DB.transactions.filter(t => t.date >= monthStart && t.date <= monthEnd);
  const plTx = monthTx.filter(isPL);

  // Top danh mục chi trong tháng
  const byCat = {};
  plTx.filter(t => t.type === 'expense').forEach(t => { byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const topCats = Object.entries(byCat).sort((a,b) => b[1]-a[1]);

  // 5 giao dịch lớn nhất — thường là nơi tiền thật sự đi
  const topTx = plTx.filter(t => t.type === 'expense').sort((a,b) => b.amount - a.amount).slice(0,5);

  // Tiền vào/ra không thuộc thu chi (ứng trước, hoàn ứng, giải ngân)
  const nonPL = monthTx.filter(t => !isPL(t));
  const advanced = nonPL.filter(t => t.type === 'expense').reduce((s,t)=>s+t.amount,0);
  const reimbursed = nonPL.filter(t => t.type === 'income').reduce((s,t)=>s+t.amount,0);

  const budgets = DB.budgets.map(b => {
    const spent = plTx.filter(t => t.type === 'expense' && t.category === b.category).reduce((s,t)=>s+t.amount,0);
    return { ...b, meta: catMeta(b.category), spent, pct: b.limit>0 ? spent/b.limit*100 : 0, over: spent > b.limit };
  }).sort((a,b) => b.pct - a.pct);

  return {
    ref,
    label: `Tháng ${ref.getMonth()+1}/${ref.getFullYear()}`,
    income, expense, balance: income - expense,
    savingsRate: income > 0 ? (income - expense) / income * 100 : 0,
    txCount: plTx.length,
    cmp, smart, topCats, topTx, budgets,
    advanced, reimbursed,
    debtPayments: getMonthDebtPayments(ref),
    cashPosition: getCashPosition(),
    totalSavings: getTotalSavings(),
    totalDebt: getTotalDebt(),
    totalReceivables: getTotalReceivables(),
    netWorth: computeNetWorth(),
    healthScore: computeFinancialHealthScore(),
    generatedAt: new Date(),
  };
}

/* HTML của báo cáo. inline style vì html2canvas và cửa sổ in
   đều không kế thừa được các lớp Tailwind chạy từ CDN. */
function renderMonthReportHtml(d, opts = {}){
  const dark = opts.forceLight ? false : document.documentElement.classList.contains('dark');
  const C = {
    bg: dark ? '#13161C' : '#FFFFFF',
    card: dark ? 'rgba(255,255,255,0.04)' : '#F7F8FA',
    text: dark ? '#FFFFFF' : '#0F1115',
    sub: dark ? '#8D94A3' : '#6B7383',
    line: dark ? 'rgba(255,255,255,0.08)' : 'rgba(15,17,21,0.08)',
    ok: '#059669', bad: '#E11D48', brand: '#4F46E5', warn: '#D97706',
  };
  const money = (v) => formatVND(v);
  const row = (label, value, color) =>
    `<tr><td style="padding:7px 0;color:${C.sub};font-size:12px">${label}</td>
         <td style="padding:7px 0;text-align:right;font-weight:700;font-size:12.5px;color:${color||C.text}">${value}</td></tr>`;

  const cmpRows = d.cmp.notable.slice(0, 8);

  return `
  <div id="reportSheet" class="rpt-sheet" style="width:760px;box-sizing:border-box;padding:${opts.print?'0':'36px 40px'};background:${C.bg};color:${C.text};
       font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.45">

    <!-- Đầu trang -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid ${C.brand};padding-bottom:14px;margin-bottom:22px">
      <div>
        <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:${C.sub};font-weight:700">MoneyFlow · Báo cáo tài chính</div>
        <div style="font-size:26px;font-weight:800;margin-top:4px">${d.label}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:${C.sub}">Điểm sức khoẻ</div>
        <div style="font-size:24px;font-weight:800;color:${d.healthScore>=70?C.ok:d.healthScore>=45?C.warn:C.bad}">${d.healthScore}<span style="font-size:13px;color:${C.sub}">/100</span></div>
      </div>
    </div>

    <!-- Tổng quan -->
    <div class="rpt-block" style="display:flex;gap:10px;margin-bottom:20px">
      ${[['Thu nhập', money(d.income), C.ok],
         ['Chi tiêu', money(d.expense), C.bad],
         ['Chênh lệch', money(d.balance), d.balance>=0?C.text:C.bad],
         ['Tỷ lệ tiết kiệm', d.savingsRate.toFixed(0)+'%', d.savingsRate>=20?C.ok:C.warn]
        ].map(([l,v,c])=>`
        <div style="flex:1;background:${C.card};border-radius:12px;padding:12px 14px">
          <div style="font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:${C.sub};font-weight:700">${l}</div>
          <div style="font-size:16px;font-weight:800;margin-top:4px;color:${c}">${v}</div>
        </div>`).join('')}
    </div>

    <!-- So sánh tháng trước -->
    <div class="rpt-block" style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">So với tháng trước</div>
      <div style="font-size:12px;color:${C.sub};margin-bottom:10px">${describeComparison(d.cmp)}</div>
      ${cmpRows.length ? `
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr style="border-bottom:1px solid ${C.line}">
          <th style="text-align:left;padding:6px 0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:${C.sub}">Danh mục</th>
          <th style="text-align:right;padding:6px 0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:${C.sub}">Tháng trước</th>
          <th style="text-align:right;padding:6px 0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:${C.sub}">Tháng này</th>
          <th style="text-align:right;padding:6px 0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:${C.sub}">Thay đổi</th>
        </tr>
        ${cmpRows.map(r=>`
        <tr style="border-bottom:1px solid ${C.line}">
          <td style="padding:7px 0">${r.meta.icon} ${r.meta.label}</td>
          <td style="padding:7px 0;text-align:right;color:${C.sub}">${r.before?money(r.before):'—'}</td>
          <td style="padding:7px 0;text-align:right;font-weight:600">${r.now?money(r.now):'—'}</td>
          <td style="padding:7px 0;text-align:right;font-weight:700;color:${r.delta>0?C.bad:C.ok}">
            ${r.delta>0?'+':'−'}${money(Math.abs(r.delta))}
            <span style="font-size:10.5px;font-weight:500"> ${r.pct===null?'(mới)':'('+(r.delta>0?'+':'')+r.pct.toFixed(0)+'%)'}</span>
          </td>
        </tr>`).join('')}
      </table>` : `<div style="font-size:12px;color:${C.sub}">Không có danh mục nào biến động vượt ngưỡng đáng chú ý.</div>`}
    </div>

    <!-- Hai cột: danh mục & giao dịch lớn -->
    <div class="rpt-block" style="display:flex;gap:24px;margin-bottom:20px">
      <div style="flex:1">
        <div style="font-size:14px;font-weight:800;margin-bottom:8px">Chi theo danh mục</div>
        <table style="width:100%;border-collapse:collapse">
          ${d.topCats.length ? d.topCats.slice(0,8).map(([c,v])=>{
            const m = catMeta(c);
            const pct = d.expense>0 ? v/d.expense*100 : 0;
            return `<tr>
              <td style="padding:5px 0;font-size:12px">${m.icon} ${m.label}</td>
              <td style="padding:5px 0;text-align:right;font-size:12px;font-weight:700">${money(v)}</td>
              <td style="padding:5px 0 5px 10px;text-align:right;font-size:11px;color:${C.sub};width:44px">${pct.toFixed(0)}%</td>
            </tr>`;
          }).join('') : `<tr><td style="font-size:12px;color:${C.sub}">Chưa có chi tiêu</td></tr>`}
        </table>
      </div>
      <div style="flex:1">
        <div style="font-size:14px;font-weight:800;margin-bottom:8px">5 khoản chi lớn nhất</div>
        <table style="width:100%;border-collapse:collapse">
          ${d.topTx.length ? d.topTx.map(t=>`
            <tr>
              <td style="padding:5px 0;font-size:12px">${escapeHtml((t.note||catMeta(t.category).label).slice(0,28))}
                <div style="font-size:10px;color:${C.sub}">${formatDate(t.date)}</div></td>
              <td style="padding:5px 0;text-align:right;font-size:12px;font-weight:700">${money(t.amount)}</td>
            </tr>`).join('') : `<tr><td style="font-size:12px;color:${C.sub}">Chưa có giao dịch</td></tr>`}
        </table>
      </div>
    </div>

    ${d.budgets.length ? `
    <div class="rpt-block" style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">Ngân sách</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        ${d.budgets.slice(0,8).map(b=>`
        <tr style="border-bottom:1px solid ${C.line}">
          <td style="padding:6px 0">${b.meta.icon} ${b.meta.label}</td>
          <td style="padding:6px 0;text-align:right;color:${C.sub}">${money(b.spent)} / ${money(b.limit)}</td>
          <td style="padding:6px 0;text-align:right;width:70px;font-weight:700;color:${b.over?C.bad:C.ok}">${b.pct.toFixed(0)}%${b.over?' ⚠':''}</td>
        </tr>`).join('')}
      </table>
    </div>` : ''}

    <!-- Bảng cân đối -->
    <div class="rpt-block" style="margin-bottom:20px">
      <div style="font-size:14px;font-weight:800;margin-bottom:8px">Tình hình tài sản (tại ngày lập báo cáo)</div>
      <table style="width:100%;border-collapse:collapse">
        ${row('Số dư hiện tại (tiền mặt + ngân hàng)', money(d.cashPosition))}
        ${row('Tiết kiệm', money(d.totalSavings))}
        ${row('Khoản phải thu (ứng trước / cho mượn)', money(d.totalReceivables))}
        ${row('Dư nợ', '− ' + money(d.totalDebt), C.bad)}
        <tr><td colspan="2" style="border-top:2px solid ${C.line};padding-top:2px"></td></tr>
        ${row('<b>Tài sản ròng</b>', '<b>' + money(d.netWorth) + '</b>', d.netWorth>=0?C.text:C.bad)}
      </table>
    </div>

    ${d.debtPayments.total > 0 ? `
    <div class="rpt-block" style="background:${C.card};border-radius:12px;padding:12px 14px;margin-bottom:20px">
      <div style="font-size:12px;font-weight:700;margin-bottom:5px">Trả nợ trong tháng</div>
      <div style="font-size:11.5px;color:${C.sub}">
        Tổng trả <b style="color:${C.text}">${money(d.debtPayments.total)}</b> ·
        gốc <b style="color:${C.text}">${money(d.debtPayments.principal)}</b> ·
        lãi <b style="color:${C.bad}">${money(d.debtPayments.interest)}</b>.
        Chỉ phần lãi được tính vào chi tiêu; tiền gốc là tiền đổi chỗ nên không nằm trong tổng chi.
      </div>
    </div>` : ''}

    ${(d.advanced || d.reimbursed) ? `
    <div class="rpt-block" style="background:${C.card};border-radius:12px;padding:12px 14px;margin-bottom:20px">
      <div style="font-size:12px;font-weight:700;margin-bottom:5px">Tiền đổi chỗ trong tháng (không tính vào thu/chi)</div>
      <div style="font-size:11.5px;color:${C.sub}">
        Ứng trước / cho mượn: <b style="color:${C.text}">${money(d.advanced)}</b> ·
        Được hoàn / nhận lại: <b style="color:${C.text}">${money(d.reimbursed)}</b>.
        Các khoản này làm thay đổi số dư nhưng không phải chi tiêu hay thu nhập thật.
      </div>
    </div>` : ''}

    <div class="rpt-foot" style="border-top:1px solid ${C.line};padding-top:10px;margin:0;font-size:10.5px;color:${C.sub};display:flex;justify-content:space-between">
      <span>Lập lúc ${d.generatedAt.toLocaleString('vi-VN')} · ${d.txCount} giao dịch trong tháng</span>
      <span>MoneyFlow · Personal Finance OS</span>
    </div>
  </div>`;
}

/* Chỉnh ngưỡng ngay trong màn So sánh, không phải đi vòng qua Cài đặt */
function applyComparePreset(delta, pct){
  const d = document.getElementById('compareMinDeltaInput');
  const p = document.getElementById('compareMinPctInput');
  if(d){ d.value = Number(delta).toLocaleString('vi-VN'); }
  if(p){ p.value = pct; }
  // Nếu đang ở modal nhanh thì áp dụng luôn
  if(document.getElementById('cmpThresholdForm')){
    DB.settings.compareMinDelta = delta;
    DB.settings.compareMinPct = pct;
    saveDB(); closeModal(); renderCompareView();
    showToast('Đã đổi ngưỡng · ' + formatVNDShort(delta) + ' / ' + pct + '%', 'ok');
  }
}

function openCompareThresholdModal(){
  const cur = compareMonths(currentViewMonth, { prorate: compareProrate });
  openModal(`
    ${modalHeader('Ngưỡng thay đổi đáng chú ý', 'Quyết định danh mục nào được nêu trong màn So sánh')}
    <form id="cmpThresholdForm" class="px-5 sm:px-6 py-5 space-y-4">
      <p class="text-[12px] text-ink-500 dark:text-ink-300">Một danh mục chỉ được nêu khi vượt <b>cả hai</b> ngưỡng dưới đây. Với ngưỡng hiện tại, <b>${cur.notable.length}/${cur.rows.length}</b> danh mục được coi là đáng chú ý.</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Mức tiền tối thiểu (₫)</label>
          <input id="compareMinDeltaInput" type="text" inputmode="numeric" value="${DB.settings.compareMinDelta}" class="money-input w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none tabnum">
        </div>
        <div>
          <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Mức % tối thiểu</label>
          <input id="compareMinPctInput" type="number" min="0" max="500" step="1" value="${DB.settings.compareMinPct}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none tabnum">
        </div>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <button type="button" onclick="applyComparePreset(50000,10)" class="chip surface-2 text-ink-500 hover:text-brand-600">Nhạy · 50k / 10%</button>
        <button type="button" onclick="applyComparePreset(100000,15)" class="chip surface-2 text-ink-500 hover:text-brand-600">Cân bằng · 100k / 15%</button>
        <button type="button" onclick="applyComparePreset(500000,25)" class="chip surface-2 text-ink-500 hover:text-brand-600">Chỉ việc lớn · 500k / 25%</button>
      </div>
      <p class="text-[11px] text-ink-400">Ngưỡng thấp giúp thấy chi tiết hơn nhưng dễ bị nhiễu bởi những thay đổi vụn vặt. Cài đặt này cũng nằm trong mục Cài đặt → Liên kết &amp; tự động.</p>
      <div class="flex justify-end gap-2.5 pt-1">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Áp dụng</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  document.getElementById('cmpThresholdForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    DB.settings.compareMinDelta = Math.max(0, parseMoneyInput('compareMinDeltaInput'));
    DB.settings.compareMinPct = clamp(Number(document.getElementById('compareMinPctInput').value) || 0, 0, 500);
    saveDB(); closeModal(); renderCompareView();
    showToast('Đã cập nhật ngưỡng so sánh', 'ok');
  });
}

/* ★ Cấu hình lạm phát — 3 chế độ, xem giải thích chi tiết ở
   estimateInflationForPeriod() (Khối 27). Chế độ 'manual' chỉ hiện ô nhập
   cho các tháng ĐANG có dữ liệu thu nhập trong khoảng đang xem, để không
   bắt Quang nhập cho những tháng chưa dùng app. */
function openInflationSettingsModal(){
  const inf = DB.settings.inflation;
  const trend = getIncomeTrend(incomeTrendMonths).filter(m => m.hasData);

  openModal(`
    ${modalHeader('So sánh với lạm phát', 'Chọn cách bạn muốn dùng — có thể đổi bất cứ lúc nào')}
    <form id="inflationForm" class="px-5 sm:px-6 py-5 space-y-4">
      <div class="space-y-2">
        ${[
          ['off', 'Không dùng', 'Chỉ xem thu nhập tăng/giảm bao nhiêu, không so với lạm phát.'],
          ['preset', 'Một mức ước tính cho cả năm', 'Nhập một con số %/năm, quy đổi tuyến tính theo số tháng đang xem. Không cần chính xác tuyệt đối.'],
          ['manual', 'Tự nhập theo từng tháng', 'Chính xác hơn nếu bạn theo dõi CPI hoặc có số liệu riêng cho từng tháng.'],
        ].map(([val,label,desc]) => `
          <label class="flex items-start gap-3 p-3 rounded-xl surface-2 cursor-pointer hover:bg-ink-100 dark:hover:bg-white/10 transition">
            <input type="radio" name="inflationMode" value="${val}" ${inf.mode===val?'checked':''} onchange="toggleInflationModeFields('${val}')" class="mt-0.5 w-4 h-4">
            <div>
              <p class="text-[13px] font-semibold text-ink-800 dark:text-ink-100">${label}</p>
              <p class="text-[11.5px] text-ink-400 mt-0.5">${desc}</p>
            </div>
          </label>`).join('')}
      </div>

      <div id="inflationPresetField" class="${inf.mode==='preset'?'':'hidden'}">
        <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Mức lạm phát ước tính (%/năm)</label>
        <input id="inflationPresetInput" type="number" min="0" max="100" step="0.1" value="${inf.presetAnnual}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none tabnum">
        <p class="text-[11px] text-ink-400 mt-1.5">Tham khảo: CPI Việt Nam thường dao động 2–5%/năm gần đây — tự kiểm tra số mới nhất nếu muốn chính xác hơn.</p>
      </div>

      <div id="inflationManualField" class="${inf.mode==='manual'?'':'hidden'} space-y-2">
        ${trend.length === 0 ? `<p class="text-[12px] text-ink-400">Chưa có tháng nào có dữ liệu thu nhập để nhập lạm phát.</p>` : trend.map(m => `
          <div class="flex items-center justify-between gap-3">
            <span class="text-[12.5px] text-ink-600 dark:text-ink-300">${m.label}</span>
            <div class="flex items-center gap-1.5">
              <input type="number" min="0" max="100" step="0.1" data-inflation-month="${m.key}" value="${inf.monthly[m.key] ?? ''}" placeholder="—" class="w-20 px-2.5 py-1.5 rounded-lg surface-2 text-[12.5px] outline-none tabnum text-right">
              <span class="text-[11.5px] text-ink-400">%/năm</span>
            </div>
          </div>`).join('')}
      </div>

      <div class="flex justify-end gap-2.5 pt-1">
        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-[13px] font-semibold text-ink-600 dark:text-ink-300 hover:bg-ink-50 dark:hover:bg-white/5">Huỷ</button>
        <button type="submit" class="px-5 py-2.5 rounded-xl text-[13px] font-semibold bg-brand-600 hover:bg-brand-700 text-white">Lưu</button>
      </div>
    </form>
  `, { width:'max-w-sm' });

  document.getElementById('inflationForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const mode = document.querySelector('input[name="inflationMode"]:checked').value;
    DB.settings.inflation.mode = mode;
    if(mode === 'preset'){
      DB.settings.inflation.presetAnnual = clamp(Number(document.getElementById('inflationPresetInput').value) || 0, 0, 100);
    } else if(mode === 'manual'){
      document.querySelectorAll('[data-inflation-month]').forEach(el => {
        const key = el.dataset.inflationMonth;
        const v = el.value.trim();
        if(v === '') delete DB.settings.inflation.monthly[key];
        else DB.settings.inflation.monthly[key] = clamp(Number(v) || 0, 0, 100);
      });
    }
    saveDB(); closeModal(); renderCompareView();
    showToast('Đã lưu cấu hình lạm phát', 'ok');
  });
}
function toggleInflationModeFields(mode){
  document.getElementById('inflationPresetField').classList.toggle('hidden', mode !== 'preset');
  document.getElementById('inflationManualField').classList.toggle('hidden', mode !== 'manual');
}

function setReportStatus(text){
  const el = document.getElementById('reportStatus');
  if(!el) return;
  el.classList.remove('hidden');
  el.textContent = text;
}

/* --- Xuất PDF qua cửa sổ in. Không dùng thư viện PDF: giữ ràng buộc
       "một file HTML", và chữ trong PDF vẫn là văn bản thật. --- */
function exportReportPDF(){
  const d = buildMonthReportData(currentViewMonth);
  // forceLight: nền tối in ra sẽ tốn mực và khó đọc
  const html = renderMonthReportHtml(d, { forceLight: true, print: true });
  const win = window.open('', '_blank');
  if(!win){
    setReportStatus('Trình duyệt đã chặn cửa sổ bật lên — hãy cho phép pop-up rồi thử lại.');
    showToast('Trình duyệt chặn pop-up · hãy cho phép rồi thử lại', 'warn');
    return;
  }
  win.document.write(`<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
    <title>MoneyFlow · Báo cáo ${d.label}</title>
    <style>

/* --- Xuất PNG bằng html2canvas (đã có sẵn trong app) --- */
async function exportReportImage(mode){
  setReportStatus('Đang tạo ảnh…');
  const d = buildMonthReportData(currentViewMonth);
  const dark = document.documentElement.classList.contains('dark');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-99999px;top:0;width:760px;';
  wrap.innerHTML = renderMonthReportHtml(d);
  document.body.appendChild(wrap);
  try{
    const canvas = await html2canvas(wrap.firstElementChild, {
      backgroundColor: dark ? '#13161C' : '#FFFFFF',
      scale: 2, useCORS: true, logging: false,
    });
    const fileName = `moneyflow-bao-cao-${d.ref.getFullYear()}-${String(d.ref.getMonth()+1).padStart(2,'0')}.png`;
    if(mode === 'download'){
      const a = document.createElement('a');
      a.download = fileName;
      a.href = canvas.toDataURL('image/png');
      a.click();
      setReportStatus('Đã tải ảnh về máy.');
      showToast('Đã tải báo cáo về máy', 'ok');
    } else {
      canvas.toBlob(async (blob) => {
        try{
          if(navigator.clipboard && window.ClipboardItem){
            await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
            setReportStatus('Đã sao chép ảnh vào clipboard.');
            showToast('Đã sao chép báo cáo', 'ok');
          } else {
            setReportStatus('Trình duyệt không hỗ trợ sao chép ảnh — hãy dùng nút “Tải ảnh PNG”.');
          }
        } catch(err){
          setReportStatus('Không sao chép được — hãy dùng nút “Tải ảnh PNG”.');
        }
      }, 'image/png');
    }
  } catch(err){
    setReportStatus('Không tạo được ảnh. Hãy thử nút “Xuất PDF / In”.');
    showToast('Không tạo được ảnh', 'warn');
  } finally {
    document.body.removeChild(wrap);
  }
}
</script>

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 22 — MỤC TIÊU ⇄ THU/CHI CỐ ĐỊNH
   ----------------------------------------------------------------------
   BẢN CHẤT (quyết định thiết kế quan trọng nhất của khối này):
   Có HAI kiểu "để dành cho một mục tiêu", và chúng khác nhau về kế toán:

     (A) Tiền RỜI KHỎI TAY BẠN — góp tiền xây nhà, đóng học phí trả góp…
         → Đây là CHI TIÊU THẬT. Mục tiêu chỉ là thanh tiến độ.
         → Dùng: khoản chi cố định + liên kết mục tiêu (khối này).

     (B) Tiền VẪN LÀ CỦA BẠN — tích luỹ mua xe, quỹ du lịch…
         → Tiền chuyển sang gói tiết kiệm, Net Worth không đổi.
         → Dùng: Kế hoạch trích định kỳ + gói tiết kiệm gắn goalId.

   Vì vậy khối này CHỈ cho phép liên kết KHOẢN CHI cố định với mục tiêu,
   và cố ý KHÔNG cộng số tiền đó vào Net Worth — tiền đã đi thật.
   Nếu người dùng chọn nhầm kiểu, hàm cảnh báo bên dưới sẽ nhắc.
   ====================================================================== */

/* Các khoản cố định đang nuôi một mục tiêu */
function getGoalLinkedRecurring(goalId){
  return DB.recurring.filter(r => r.goalId === goalId && r.type === 'expense');
}
/* Các gói tiết kiệm gắn với mục tiêu (kênh B) */
function getGoalLinkedPots(goalId){
  return DB.savings.filter(p => p.goalId === goalId && !p.closed);
}

/* ★ Tổng số dư THẬT (gốc + lãi đã tích luỹ) của các gói tiết kiệm gắn với
   một mục tiêu — dùng để tiến độ mục tiêu phản ánh đúng tiền đang có,
   không chỉ dựa vào số nhập tay ban đầu. */
function getGoalSavingsTotal(goalId){
  return getGoalLinkedPots(goalId).reduce((s,p) => s + (p.balance||0) + (p.interestAccrued||0), 0);
}

/* Tốc độ tăng mỗi tháng của MỘT gói tiết kiệm, cộng từ 2 nguồn không trùng nhau:
   - lãi suất đang chạy (computePotInterest().monthlyInterest, từ p.rate × p.balance)
   - tiền nạp định kỳ đang bật CHỈ TÍNH khi gói đó là đích của một
     "Kế hoạch trích định kỳ" (savingsPlans, mode 'accumulate') — vì đây là
     dòng tiền chắc chắn, có lịch cụ thể. Quy tắc phân bổ theo % thu nhập
     KHÔNG được cộng vào đây vì phụ thuộc thu nhập biến động, dễ ước tính sai. */
function getPotMonthlyGrowth(pot){
  const interest = computePotInterest(pot).monthlyInterest || 0;
  const plan = (DB.savingsPlans||[]).find(pl => pl.active && pl.mode === 'accumulate' && pl.targetPotId === pot.id);
  const deposit = plan ? normalizeMonthly(plan) : 0;
  return Math.round(interest + deposit);
}

/* ★ Tốc độ tăng mỗi tháng của TẤT CẢ gói tiết kiệm gắn với một mục tiêu */
function getGoalPotsMonthlyGrowth(goalId){
  return getGoalLinkedPots(goalId).reduce((s,p) => s + getPotMonthlyGrowth(p), 0);
}

/* Dòng tiền vào mục tiêu mỗi tháng.
   linked  = tự động từ các khoản cố định đang bật (kênh A) + lãi/nạp định kỳ
             từ các gói tiết kiệm đã gắn (kênh B)
   manual  = con số người dùng tự nhập trong form mục tiêu
   effective = ưu tiên linked; CHỈ dùng manual khi chưa có liên kết nào.
   → Cách này loại bỏ hoàn toàn nguy cơ cộng đôi khi người dùng vừa nhập tay
     vừa liên kết một khoản cố định/gói tiết kiệm cùng ý nghĩa. */
function getGoalMonthlyPlan(g){
  const rec = getGoalLinkedRecurring(g.id).filter(r => r.active);
  const fromRecurring = rec.reduce((s,r) => s + normalizeMonthly(r), 0);
  const fromPots = getGoalPotsMonthlyGrowth(g.id);
  const linked = fromRecurring + fromPots;
  const manual = g.monthly || 0;
  return {
    rec, linked: Math.round(linked), fromRecurring: Math.round(fromRecurring),
    fromPots: Math.round(fromPots), manual,
    effective: Math.round(linked > 0 ? linked : manual),
    fromLink: linked > 0,
  };
}

/* ★ Số tiền "đã có" THỰC TẾ của một mục tiêu.
   Khi mục tiêu đã gắn ít nhất 1 gói tiết kiệm, dùng luôn tổng gốc+lãi của
   (các) gói đó — số dư thật đang nằm ở đâu — thay cho con số nhập tay, để
   tránh lệch giữa "tiến độ hiển thị" và "tiền thật đang có". Khi chưa gắn
   gói nào, vẫn dùng g.current như cũ (nhập tay / cộng qua khoản chi cố định
   liên kết, kênh A). */
function getGoalEffectiveCurrent(g){
  const pots = getGoalLinkedPots(g.id);
  if(pots.length) return Math.round(getGoalSavingsTotal(g.id));
  return g.current || 0;
}

/* Kỳ đóng góp kế tiếp cho mục tiêu (lấy khoản cố định đến hạn sớm nhất) */
function getGoalNextContribution(g){
  const rec = getGoalLinkedRecurring(g.id).filter(r => r.active && r.nextDate);
  if(!rec.length) return null;
  return rec.slice().sort((a,b) => a.nextDate.localeCompare(b.nextDate))[0];
}

/* Ghi nhận đóng góp vào mục tiêu. Trả về mảng effects để hàm gọi gộp vào log
   → hoàn tác tự động chạy đúng nhờ applyEffects đã hỗ trợ target 'goal'. */
function buildGoalContributionEffects(goalId, amount){
  const g = DB.goals.find(x => x.id === goalId);
  if(!g || amount <= 0) return [];
  return [{ target:'goal', id: g.id, delta: Math.round(amount) }];
}

/* Cảnh báo khi người dùng có thể đang chọn nhầm kiểu liên kết */
function goalLinkWarning(goalId){
  const pots = getGoalLinkedPots(goalId);
  if(!pots.length) return null;
  return `Mục tiêu này đã được gắn với gói tiết kiệm “${pots.map(p=>p.name).join(', ')}”. `
       + `Nếu tiền vẫn nằm trong túi bạn, hãy dùng Kế hoạch trích định kỳ thay vì khoản chi cố định — `
       + `nếu không, tiến độ sẽ được cộng hai lần từ hai nguồn.`;
}

/* Mục tiêu đã đạt → gợi ý dừng khoản cố định để tiền không tiếp tục chảy đi */
function getCompletedGoalSuggestions(){
  return DB.goals.filter(g => g.target > 0 && getGoalEffectiveCurrent(g) >= g.target)
    .map(g => ({ goal: g, rec: getGoalLinkedRecurring(g.id).filter(r => r.active) }))
    .filter(x => x.rec.length);
}

/* ---------------------------------------------------------------- UI */

/* Ô chọn mục tiêu dùng trong form khoản cố định */
function goalSelectHtml(id, selectedId){
  if(!DB.goals.length) return `
    <div class="surface-2 rounded-xl p-3.5">
      <p class="text-[11.5px] text-ink-400">Chưa có mục tiêu nào để liên kết.
        <button type="button" onclick="closeModal(); switchView('goals')" class="text-brand-600 font-semibold">Tạo mục tiêu →</button>
      </p>
      <input type="hidden" id="${id}" value="">
    </div>`;
  return `
    <div>
      <label class="text-[12px] font-semibold text-ink-500 dark:text-ink-300 mb-1.5 block">Đóng góp cho mục tiêu</label>
      <select id="${id}" class="w-full px-3.5 py-2.5 rounded-xl surface-2 text-[13px] outline-none">
        <option value="">— Không liên kết —</option>
        ${DB.goals.map(g => `<option value="${g.id}" ${selectedId===g.id?'selected':''}>${g.icon} ${escapeHtml(g.name)} · ${formatVNDShort(getGoalEffectiveCurrent(g))}/${formatVNDShort(g.target)}</option>`).join('')}
      </select>
      <p class="text-[11px] text-ink-400 mt-1.5">Mỗi lần khoản chi này được ghi nhận, tiến độ mục tiêu tự tăng tương ứng — bạn không phải nhập lại lần hai.</p>
      <p id="goalLinkWarn" class="text-[11px] text-warn-600 mt-1.5 hidden"></p>
    </div>`;
}

/* Khối liên kết hiển thị trên thẻ mục tiêu */
function renderGoalLinkBlock(g){
  const plan = getGoalMonthlyPlan(g);
  const next = getGoalNextContribution(g);
  const pots = getGoalLinkedPots(g.id);
  if(!plan.rec.length && !pots.length) return '';

  return `
    <div class="surface-2 rounded-xl p-3 mt-3 space-y-1.5">
      ${plan.rec.length ? `
        <p class="text-[11.5px] text-ink-500 dark:text-ink-300">
          🔗 Nhận <b class="text-ink-800 dark:text-ink-100 tabnum">${formatVND(plan.fromRecurring)}/tháng</b> tự động từ
          ${plan.rec.map(r => `<button onclick="openRecurringModal('${r.id}')" class="text-brand-600 font-semibold hover:underline">${escapeHtml(r.note || catMeta(r.category).label)}</button>`).join(', ')}
        </p>
        ${next ? `<p class="text-[11px] text-ink-400">Kỳ tới ${formatDate(next.nextDate)} · ${daysBetween(todayISO(), next.nextDate)} ngày nữa</p>` : ''}
      ` : ''}
      ${pots.length ? `
        <p class="text-[11.5px] text-ink-500 dark:text-ink-300">
          🐷 Tiến độ tự cập nhật theo gốc + lãi của
          ${pots.map(p => `<button onclick="switchView('savings')" class="text-brand-600 font-semibold hover:underline">${escapeHtml(p.name)}</button>`).join(', ')}
        </p>
        <details class="text-[11px] text-ink-400">
          <summary class="cursor-pointer hover:text-ink-600 dark:hover:text-ink-200 select-none">Xem chi tiết từng gói (${pots.length})</summary>
          <div class="mt-1.5 space-y-1 pl-0.5">
            ${pots.map(p => {
              const growth = getPotMonthlyGrowth(p);
              return `<div class="flex items-center justify-between gap-2">
                <span class="truncate">${p.icon} ${escapeHtml(p.name)}</span>
                <span class="shrink-0 tabnum">${formatVNDShort(p.balance)}${p.interestAccrued?' +'+formatVNDShort(p.interestAccrued)+' lãi':''}${growth>0?' · +'+formatVNDShort(growth)+'/th':''}</span>
              </div>`;
            }).join('')}
          </div>
        </details>` : ''}
    </div>`;
}

/* Gợi ý ở đầu màn Mục tiêu khi có mục tiêu đã đạt mà tiền vẫn đang chảy */
function renderGoalCompletionSuggestions(){
  const list = getCompletedGoalSuggestions();
  if(!list.length) return '';
  return `
    <div class="rounded-xl2 border border-ok-400/50 bg-ok-50 dark:bg-ok-500/10 p-4 space-y-2.5">
      <p class="text-[13px] font-semibold text-ink-800 dark:text-ink-100">🎉 ${list.length} mục tiêu đã hoàn thành nhưng tiền vẫn đang chảy vào</p>
      ${list.map(x => `
        <div class="flex flex-wrap items-center gap-2 card rounded-xl p-3">
          <span class="text-[12.5px] font-semibold text-ink-800 dark:text-ink-100 flex-1 min-w-0 tx-clamp2 overflow-hidden">
            ${x.goal.icon} ${escapeHtml(x.goal.name)} · vẫn nhận ${formatVND(x.rec.reduce((s,r)=>s+normalizeMonthly(r),0))}/tháng
          </span>
          ${x.rec.map(r => `<button onclick="toggleRecurringActive('${r.id}')" class="text-[11.5px] font-semibold px-2.5 py-1.5 rounded-lg bg-brand-600 text-white">Tạm dừng “${escapeHtml((r.note||'').slice(0,18))}”</button>`).join('')}
        </div>`).join('')}
      <p class="text-[11.5px] text-ink-500 dark:text-ink-300">Dừng khoản cố định để chuyển dòng tiền này sang mục tiêu khác, hoặc giữ nguyên nếu bạn muốn vượt mục tiêu.</p>
    </div>`;
}
</script>

<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 23 — TÀI KHOẢN SINH LỜI TỰ ĐỘNG
   ----------------------------------------------------------------------
   Mô phỏng Túi Thần Tài (MoMo, ~4%/năm) và Số dư sinh lời (ZaloPay,
   ~4,7%/năm): lãi tính theo NGÀY trên số dư, tiền vẫn tiêu được bình thường.

   QUYẾT ĐỊNH THEO YÊU CẦU NGƯỜI DÙNG:
   Lãi tích luỹ KHÔNG tự cộng vào số dư và KHÔNG tính vào Tài sản ròng.
   Nó nằm ở một ô riêng (`accruedInterest`) cho tới khi bạn bấm "Rút lãi".
   → Số dư trong app luôn khớp với số dư bạn nhìn thấy ở ngân hàng.
   → Thà báo thiếu còn hơn báo thừa: tiền chưa rút thì chưa chắc là của bạn.

   GIỚI HẠN CẦN BIẾT: app chỉ lưu số dư HIỆN TẠI, không lưu số dư từng ngày
   trong quá khứ. Nên lãi được tính trên số dư tại mỗi lần app chạy tích luỹ.
   Mở app đều đặn thì sai số nhỏ; bỏ quên vài tuần rồi số dư biến động mạnh
   thì con số chỉ mang tính ước lượng. Vì vậy luôn gọi là "lãi tạm tính".
   ====================================================================== */

const EARN_PRESETS = [
  { name:'MoMo · Túi Thần Tài', rate:4.0 },
  { name:'ZaloPay · Số dư sinh lời', rate:4.7 },
  { name:'Tự nhập', rate:null },
];

function earnEnabledAccounts(){
  return DB.accounts.filter(a => a.earnEnabled && (a.earnRate || 0) > 0);
}
function getTotalAccruedInterest(){
  return DB.accounts.reduce((s,a) => s + Math.round(a.accruedInterest || 0), 0);
}

/* Cơ sở tính lãi của một ngày.
   compound = true  → lãi đã tích luỹ cũng sinh lãi (giống MoMo/ZaloPay thật)
   compound = false → chỉ số dư gốc sinh lãi */
function earnBase(a){
  return (a.balance || 0) + (a.earnCompound ? (a.accruedInterest || 0) : 0);
}
function dailyEarn(a){
  if(!a.earnEnabled || !(a.earnRate > 0)) return 0;
  return earnBase(a) * (a.earnRate / 100) / 365;
}

/* Chạy tích luỹ lãi cho tới hôm nay. Gọi trong runAutomationEngine().
   Cộng dồn theo ngày để chế độ lãi kép phản ánh đúng. */
function accrueAccountInterest(){
  const today = todayISO();
  let total = 0;
  DB.accounts.forEach(a => {
    if(a.accruedInterest === undefined) a.accruedInterest = 0;
    if(!a.earnEnabled || !(a.earnRate > 0)){ a.lastEarnAccrual = today; return; }
    if(!a.lastEarnAccrual) a.lastEarnAccrual = today;
    let days = daysBetween(a.lastEarnAccrual, today);
    if(days <= 0) return;
    if(days > 400) days = 400;   // chặn trường hợp ngày hệ thống bị lệch
    let gained = 0;
    for(let i = 0; i < days; i++){
      const d = dailyEarn(a);
      a.accruedInterest = (a.accruedInterest || 0) + d;
      gained += d;
    }
    a.accruedInterest = Math.round(a.accruedInterest);
    a.lastEarnAccrual = today;
    total += gained;
  });
  return Math.round(total);
}

/* ★ RÚT LÃI — chỉ lúc này tiền mới thực sự thành của bạn.
   Ghi nhận là THU NHẬP thật (khác với chuyển khoản nội bộ): đây là tiền mới
   sinh ra, không phải tiền đổi chỗ. */
function claimAccountInterest(accountId, opts = {}){
  const a = getAccount(accountId);
  if(!a) return null;
  const amount = Math.round(a.accruedInterest || 0);
  if(amount <= 0){ showToast('Chưa có lãi để rút', 'info'); return null; }

  const tx = postTransaction({
    type:'income', category: INCOME_CATS.includes('dau-tu') ? 'dau-tu' : 'khac',
    amount, date: opts.date || todayISO(),
    note:'Rút lãi sinh lời: ' + a.name, tags:['lai-suat','sinh-loi'],
    accountId: a.id, source:{ kind:'earn', id:a.id },
  }, { deferSave:true });

  log.earnClaim = { accountId: a.id, restore: before };
  saveDB();
  return log;
}

const ADVICE_LEVEL = {
  critical: { label:'Cần xử lý ngay', chip:'bg-bad-50 text-bad-600 dark:bg-bad-500/10', border:'border-bad-400/50', icon:'🚨' },
  warn:     { label:'Nên chú ý',      chip:'bg-warn-50 text-warn-600 dark:bg-warn-500/10', border:'border-warn-400/50', icon:'⚠️' },
