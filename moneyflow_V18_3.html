<script>
/* ======================================================================
   ★ KHỐI LIÊN KẾT 28 — SỔ THEO DÕI TIỀN THƯỞNG VỀ VÍ
   ----------------------------------------------------------------------
   VẤN ĐỀ: điểm và mốc thưởng tính THEO NGÀY, nhưng tiền chỉ về vào
   THỨ BA của tuần kế tiếp, gộp cả tuần thành một lần chuyển.
   Nếu cộng thưởng vào thu nhập ngay hôm chạy thì:
     • Số dư trong app sẽ cao hơn ví thật suốt cả tuần
     • Và nếu Be trả thiếu, bạn không bao giờ phát hiện ra

   CÁCH LÀM: thưởng được coi là "Be đang nợ bạn" cho tới khi bạn xác nhận
   tiền đã về. Chỉ lúc bấm "Đã nhận" mới sinh giao dịch thu nhập.
   Đây đúng bản chất: tiền chưa vào ví thì chưa phải của bạn.

   HAI NGUỒN THƯỞNG đều đi qua sổ này:
     1. Thưởng mốc — tính tự động từ tổng điểm mỗi ngày
     2. Thưởng chương trình giới hạn — bạn tự nhập theo ngày
   ====================================================================== */

/* Thứ Ba của tuần kế tiếp: Chủ nhật + 2 ngày */
function bonusPayoutDate(weekToISO){ return shiftISO(weekToISO, 2); }

/* Thưởng của MỘT NGÀY = thưởng mốc (từ điểm) + thưởng chương trình giới hạn */
function gigDayBonus(dateISO){
  const list = gigShiftsInRange(dateISO, dateISO);
  if(!list.length) return { points:0, milestone:0, limited:0, total:0, level:null };
  const points = list.reduce((s,x)=>s+(x.points||0),0);
  const st = beMilestoneStatus(points, new Date(dateISO + 'T12:00:00'));
  const limited = list.reduce((s,x)=>s+(x.limitedBonus||0),0);
  return {
    points, milestone: st.earned, limited,
    total: st.earned + limited,
    level: st.reached ? st.reached.level : null,
  };
}

/* Tổng hợp thưởng của một tuần (T2 → CN) */
function gigWeekBonus(weekFromISO){
  const wk = weekRangeOf(weekFromISO);
  const days = [];
  for(let i=0;i<7;i++){
    const d = shiftISO(wk.from, i);
    const b = gigDayBonus(d);
    if(b.points > 0 || b.total > 0) days.push({ date:d, ...b });
  }
  return {
    from: wk.from, to: wk.to,
    payoutDate: bonusPayoutDate(wk.to),
    days,
    milestone: days.reduce((s,d)=>s+d.milestone,0),
    limited: days.reduce((s,d)=>s+d.limited,0),
    expected: days.reduce((s,d)=>s+d.total,0),
  };
}

/* Bản ghi đối soát cho một tuần (tạo khi cần) */
function getBonusRecord(weekFromISO, create){
  if(!Array.isArray(DB.gig.bonusPayouts)) DB.gig.bonusPayouts = [];
  const wk = weekRangeOf(weekFromISO);
  let rec = DB.gig.bonusPayouts.find(r => r.weekFrom === wk.from);
  if(!rec && create){
    rec = { id: uid('bpay'), weekFrom: wk.from, weekTo: wk.to,
            payoutDate: bonusPayoutDate(wk.to), actual: 0, status:'pending',
            receivedDate:null, txId:null, note:'' };
    DB.gig.bonusPayouts.push(rec);
  }
  return rec;
}

/* Danh sách tuần cần theo dõi: mọi tuần có phát sinh thưởng */
function gigBonusLedger(){
  const weeks = new Map();
  DB.gig.shifts.forEach(sh => {
    const wk = weekRangeOf(sh.date);
    if(!weeks.has(wk.from)) weeks.set(wk.from, wk);
  });
  const out = [];
  weeks.forEach((wk) => {
    const b = gigWeekBonus(wk.from);
    if(b.expected <= 0) return;
    const rec = DB.gig.bonusPayouts.find(r => r.weekFrom === wk.from) || null;
    const actual = rec && rec.status !== 'pending' ? rec.actual : 0;
    const today = todayISO();
    let state;
    if(!rec || rec.status === 'pending'){
      state = b.payoutDate > today ? 'waiting'          // chưa tới ngày trả
            : b.payoutDate === today ? 'due'            // đúng ngày trả
            : 'overdue';                                 // quá ngày mà chưa xác nhận
    } else {
      state = actual >= b.expected ? 'received' : 'short';
    }
    out.push({ ...b, rec, actual, state, diff: actual - b.expected });
  });
  return out.sort((a,b) => b.from.localeCompare(a.from));
}

const BONUS_STATE = {
  waiting:  { label:'Chờ tới ngày trả', chip:'surface-2 text-ink-500', icon:'🕒' },
  due:      { label:'Hôm nay Be trả',   chip:'bg-brand-50 text-brand-600 dark:bg-brand-500/10', icon:'📅' },
  overdue:  { label:'Quá hạn — kiểm tra ví', chip:'bg-warn-50 text-warn-600 dark:bg-warn-500/10', icon:'⚠️' },
  received: { label:'Đã nhận đủ',       chip:'bg-ok-50 text-ok-600 dark:bg-ok-500/10', icon:'✅' },
  short:    { label:'Nhận thiếu',       chip:'bg-bad-50 text-bad-600 dark:bg-bad-500/10', icon:'❗' },
};

/* Xác nhận tiền thưởng đã về → LÚC NÀY mới sinh thu nhập */
function confirmBonusReceived(weekFromISO, actual, opts = {}){
  gigInit();
  const b = gigWeekBonus(weekFromISO);
  const rec = getBonusRecord(weekFromISO, true);
  const amount = Math.round(actual);
  const date = opts.date || todayISO();
  const accId = opts.accountId || DB.gig.accountId;

  if(rec.txId) unpostTransaction(rec.txId, { deferSave:true });   // ghi lại lần nữa thì thay thế

  if(amount > 0){
    const tx = postTransaction({
      type:'income', category: DB.gig.incomeCategory, amount, date,
      note:'Thưởng Be tuần ' + formatDate(b.from) + '–' + formatDate(b.to),
      tags:['tai-xe','thuong'], accountId: accId, source:{ kind:'gig-bonus', id:rec.id },
    }, { deferSave:true });
    rec.txId = tx.id;
  } else rec.txId = null;

  rec.actual = amount;
  rec.receivedDate = date;
  rec.status = amount >= b.expected ? 'received' : 'short';
  rec.note = opts.note || rec.note || '';
  rec.expectedSnapshot = b.expected;
  saveDB();
  return rec;
}
function undoBonusReceived(weekFromISO){
  const rec = getBonusRecord(weekFromISO, false);
  if(!rec) return;
  if(rec.txId) unpostTransaction(rec.txId, { deferSave:true });
  rec.txId = null; rec.actual = 0; rec.status = 'pending'; rec.receivedDate = null;
  saveDB(); refreshCurrentView();
  showToast('Đã bỏ đánh dấu · thưởng quay lại trạng thái chờ', 'info');
}

/* Tổng thưởng Be đang nợ bạn — hiển thị như một khoản phải thu */
function gigPendingBonusTotal(){
  return gigBonusLedger().filter(x => ['waiting','due','overdue'].includes(x.state))
                         .reduce((s,x) => s + x.expected, 0);
}

/* ======================================================================
   ★ KHỐI LIÊN KẾT 29 — CHƯƠNG TRÌNH THƯỞNG NGẮN HẠN
   Be hay chạy chương trình 3–5 ngày. Cập nhật cả bảng điểm cho mỗi lần
   như vậy là quá tốn công, nên ở đây chỉ cần: ghi tên + khoảng ngày để
   nhớ, còn tiền thưởng thì nhập thẳng theo ngày ở ô "Thưởng CT giới hạn".
   ====================================================================== */
function gigActivePrograms(dateISO){
  const d = dateISO || todayISO();
  return (DB.gig.programs || []).filter(p => p.from <= d && d <= p.to);
}
function saveGigProgram(data, editId){
  gigInit();
  if(!Array.isArray(DB.gig.programs)) DB.gig.programs = [];
  const p = {
    id: editId || uid('prog'),
    name: data.name, from: data.from, to: data.to,
    target: data.target || '', note: data.note || '',
  };
  if(editId) DB.gig.programs = DB.gig.programs.filter(x => x.id !== editId);
  DB.gig.programs.push(p);
  DB.gig.programs.sort((a,b) => b.from.localeCompare(a.from));
  saveDB();
  return p;
}
function deleteGigProgram(id){
  DB.gig.programs = (DB.gig.programs||[]).filter(p => p.id !== id);
  saveDB(); closeModal(); refreshCurrentView();
  showToast('Đã xoá chương trình', 'ok');
}

function updateMonthLabel(){
  const label = currentViewMonth.toLocaleDateString('vi-VN', { month:'long', year:'numeric' });
  document.getElementById('currentMonthLabel').textContent = label.charAt(0).toUpperCase() + label.slice(1);
}

function changeMonth(delta){
  currentViewMonth.setMonth(currentViewMonth.getMonth() + delta);
  updateMonthLabel();
  renderCurrentView();
}

/* ---------------------- TÍNH NĂNG MỚI 1: Dark Mode tự động theo giờ ----------------------
   4 chế độ:
   - 'system'    : theo prefers-color-scheme của hệ điều hành/trình duyệt
   - 'light'     : luôn sáng
   - 'dark'      : luôn tối
   - 'auto-time' : tự bật tối 19:00–06:00, sáng 06:00–19:00
   themeMode được lưu vào DB.settings và persist qua localStorage. Một interval kiểm tra
   mỗi phút để tự chuyển theme khi ở chế độ 'auto-time' (phòng trường hợp người dùng mở
   tab qua đêm mà không load lại trang). */
let themeAutoInterval = null;

function isNightTimeNow(){
  const h = new Date().getHours();
  return h >= 19 || h < 6; // 19:00 - 05:59 được coi là "đêm"
}

function resolveDarkModeFromThemeMode(mode){
  if(mode === 'dark') return true;
  if(mode === 'light') return false;
  if(mode === 'auto-time') return isNightTimeNow();
  // 'system' (mặc định)
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}

// Áp dụng theme hiện tại lên DOM dựa theo DB.settings.themeMode, không ghi đè themeMode.
function applyTheme(){
  const enabled = resolveDarkModeFromThemeMode(DB.settings.themeMode || 'system');
  DB.settings.darkMode = enabled;
  document.documentElement.classList.toggle('dark', enabled);
}

// Thiết lập chế độ theme mới (gọi từ Cài đặt hoặc từ nút toggle nhanh trên header).
function setThemeMode(mode){
  DB.settings.themeMode = mode;
  applyTheme();
  saveDB();
  renderCurrentView(); // re-render để cập nhật màu biểu đồ (grid/tick màu khác giữa light/dark)
  setupThemeAutoCheck();
}

// Nút bật/tắt nhanh trên header: chuyển đổi qua lại giữa sáng/tối thủ công,
// thoát khỏi chế độ 'auto-time'/'system' vì người dùng đã chọn ý định rõ ràng.
function setDarkMode(enabled){
  setThemeMode(enabled ? 'dark' : 'light');
}

// Bật/tắt interval kiểm tra mỗi phút - chỉ chạy khi themeMode = 'auto-time'
function setupThemeAutoCheck(){
  if(themeAutoInterval){ clearInterval(themeAutoInterval); themeAutoInterval = null; }
  if(DB.settings.themeMode === 'auto-time'){
    themeAutoInterval = setInterval(()=>{
      const shouldBeDark = isNightTimeNow();
      if(shouldBeDark !== DB.settings.darkMode){
        applyTheme();
        saveDB();
        renderCurrentView();
      }
    }, 60000); // kiểm tra mỗi phút
  }
}

/* ---------------------- Xoá dữ liệu theo khoảng thời gian ----------------------
   Hỗ trợ xoá giao dịch trong: hôm nay, tuần này, tháng đang xem, năm đang xem, hoặc TOÀN BỘ.
   Chỉ xoá giao dịch (transactions) - không đụng đến ngân sách/mục tiêu/subscription/nợ/tài sản,
   vì đó là cấu hình dài hạn người dùng thường muốn giữ lại khi chỉ muốn dọn giao dịch cũ. */
function getDateRangeForPeriod(period){
  const now = new Date();
  let from, to;
  if(period === 'day'){
    from = todayISO(); to = todayISO();
  } else if(period === 'week'){
    const day = now.getDay(); // 0=CN
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    from = toLocalISO(monday); to = toLocalISO(sunday);
  } else if(period === 'month'){
    const y = currentViewMonth.getFullYear(), m = currentViewMonth.getMonth();
    from = `${y}-${String(m+1).padStart(2,'0')}-01`;
    to = `${y}-${String(m+1).padStart(2,'0')}-${String(daysInMonth(y,m)).padStart(2,'0')}`;
  } else if(period === 'year'){
    const y = currentViewMonth.getFullYear();
    from = `${y}-01-01`; to = `${y}-12-31`;
  }
  return { from, to };
}

const PERIOD_LABELS = { day:'hôm nay', week:'tuần này', month:'tháng đang xem', year:'năm đang xem' };

function confirmDeleteByPeriod(period){
  const { from, to } = getDateRangeForPeriod(period);
  const count = DB.transactions.filter(t=>t.date>=from && t.date<=to).length;
  if(count === 0){
    showToast(`Không có giao dịch nào trong ${PERIOD_LABELS[period]} để xoá`, 'info');
    return;
  }
  confirmDelete(`Xoá ${count} giao dịch trong ${PERIOD_LABELS[period]} (${formatDate(from)} - ${formatDate(to)})? Hành động này không thể hoàn tác.`, ()=>{
    DB.transactions = DB.transactions.filter(t=> !(t.date>=from && t.date<=to));
    // Xoá luôn giao dịch đã ghim nếu nằm trong khoảng bị xoá (mảng pinnedIds được lọc theo transactions còn lại)
    saveDB();
    refreshCurrentView();
    showToast(`Đã xoá ${count} giao dịch trong ${PERIOD_LABELS[period]}`, 'ok');
  });
}

/* ---------------------- Keyboard shortcuts ---------------------- */
function bindKeyboardShortcuts(){
  document.addEventListener('keydown', (e)=>{
    const tag = document.activeElement.tagName;
    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if(isTyping) return;
    if(document.getElementById('modalRoot').children.length > 0) return; // modal đang mở, không bắt phím tắt global

    if(e.key === 'n' || e.key === 'N'){
      e.preventDefault();
      openTransactionModal();
    }
  });
}

/* ---------------------- Init toàn bộ app ---------------------- */
async function initApp(){
  await loadDB();
  await requestPersistentStorage();   // ★ thêm dòng này
  migrateDB();
  runAutomationEngine();

  if(!DB.settings.themeMode) DB.settings.themeMode = DB.settings.darkMode ? 'dark' : 'system';
  applyTheme();
  saveDB();
  setupThemeAutoCheck();
  updateMonthLabel();

  // Nav
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.dataset.view));
  });

  // Header
  document.getElementById('prevMonthBtn').addEventListener('click', ()=>changeMonth(-1));
  document.getElementById('nextMonthBtn').addEventListener('click', ()=>changeMonth(1));
  document.getElementById('darkModeToggle').addEventListener('click', ()=> setDarkMode(!DB.settings.darkMode));
  document.getElementById('addTransactionBtn').addEventListener('click', ()=> openTransactionModal());
  document.getElementById('globalSearchBtn').addEventListener('click', ()=>{
    switchView('transactions');
    setTimeout(()=> document.getElementById('txSearchInput')?.focus(), 100);
  });

  // Sidebar mobile
  document.getElementById('sidebarOpenBtn').addEventListener('click', openSidebarMobile);
  document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebarMobile);
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebarMobile);

  // ★ Badge backup + nhắc nhẹ khi vào app
  ensureBackupBadge();
  updateBackupBadge();
  setTimeout(maybeRemindBackup, 1200);

  bindKeyboardShortcuts();
  switchView('dashboard');
}

document.addEventListener('DOMContentLoaded', () => {
  initApp().catch(err => {
    console.error('[MoneyFlow] Khởi động lỗi', err);
    document.body.insertAdjacentHTML('afterbegin',
      '<div style="padding:16px;font:14px sans-serif;color:#b91c1c">Không khởi động được app. Mở Console xem lỗi.</div>');
  });
});
